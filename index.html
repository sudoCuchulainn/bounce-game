"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas = document.getElementById("game");

const ctx = canvas.getContext("2d", {
    alpha: false
});

const WIDTH = 480;
const HEIGHT = 800;

let scale = 1;

function resize() {

    scale = Math.min(
        window.innerWidth / WIDTH,
        window.innerHeight / HEIGHT
    );

    canvas.width = Math.max(
        1,
        Math.floor(WIDTH * scale)
    );

    canvas.height = Math.max(
        1,
        Math.floor(HEIGHT * scale)
    );

    canvas.style.width =
        `${WIDTH * scale}px`;

    canvas.style.height =
        `${HEIGHT * scale}px`;
}

window.addEventListener(
    "resize",
    resize,
    { passive: true }
);

resize();


/* =========================================================
   COLORS
========================================================= */

const PLATFORM_COLORS = [

    [185, 100, 255],

========================================================= */

const GRAVITY = 1500;

/*

 * Underside hits should mainly kill upward

 */

const MAX_FALL_SPEED = 1750;

const DIVE_ACCELERATION = 2200;

const AIR_ACCELERATION = 1900;

const AIR_FRICTION = 0.985;

const MAX_X_SPEED = 450;

const WALL_RESTITUTION = 0.90;

const PLATFORM_RESTITUTION = 0.97;

/* =========================================================
   PLATFORM GENERATION
========================================================= */

const MIN_VERTICAL_GAP = 190;

const MAX_VERTICAL_GAP = 225;

const PLATFORM_SIDE_MARGIN = 58;


/* =========================================================

========================================================= */

const CAMERA_TARGET_Y = 330;

const CAMERA_FOLLOW_SPEED = 7;


/* =========================================================

========================================================= */

const MOVING_PLATFORM_HEIGHT = 7000;

const MOVING_PLATFORM_SPEED_MIN = 35;

const MOVING_PLATFORM_SPEED_MAX = 85;


/* =========================================================
   ORBS
========================================================= */

const GOLD_ORB_SCORE = 50;

const INVULNERABLE_DURATION = 4.5;

/*
 * These are intentionally very short now.
 * Just enough time to pass through roughly

 */
const GHOST_DURATION = 0.45;

const PHASE_DURATION = 0.35;

const GHOST_BOOST = 620;

const PHASE_BOOST = 220;

const ORB_RADIUS = 10;


/* =========================================================
   BOTTOM HAZARD
========================================================= */

const FIRE_HEIGHT = 48;


/* =========================================================
   INPUT
========================================================= */

let keyLeft = false;
let keyRight = false;

let pointerActive = false;

let pointerStartX = 0;
let pointerStartY = 0;

let pointerX = 0;
let pointerY = 0;

let diveRequested = false;


/* =========================================================
   AUDIO
========================================================= */

let audioContext = null;
let masterGain = null;

function initAudio() {

    try {

        if (!audioContext) {

            const AudioContextClass =
                window.AudioContext ||
                window.webkitAudioContext;

            if (!AudioContextClass) {
                return;
            }

            audioContext =
                new AudioContextClass();

            masterGain =
                audioContext.createGain();

            masterGain.gain.value =
                0.055;

            masterGain.connect(
                audioContext.destination
            );
        }

        if (
            audioContext.state ===
            "suspended"
        ) {

            audioContext.resume()
                .catch(() => {});
        }

    } catch (error) {}
}


function tone(
    frequency,
    duration,
    type = "sine",
    volume = 0.5,
    slide = 0
) {

    try {

        if (
            !audioContext ||
            !masterGain
        ) {
            return;
        }

        const now =
            audioContext.currentTime;

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.type =
            type;

        oscillator.frequency.setValueAtTime(
            frequency,
            now
        );

        if (slide !== 0) {

            oscillator.frequency.linearRampToValueAtTime(
                Math.max(
                    20,
                    frequency + slide
                ),
                now + duration
            );
        }

        gain.gain.setValueAtTime(
            0.0001,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            Math.max(
                0.0001,
                volume
            ),
            now + 0.008
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            now + duration
        );

        oscillator.connect(gain);
        gain.connect(masterGain);

        oscillator.start(now);

        oscillator.stop(
            now + duration + 0.02
        );

    } catch (error) {}
}


function soundBounce() {

    tone(
        180,
        0.07,
        "sine",

    );
}
