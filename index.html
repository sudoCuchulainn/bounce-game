<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BOUNCE</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #070a14;
            overflow: hidden;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            background: #070a14;
            touch-action: none;
        }
    </style>
</head>

<body>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const WIDTH = 480;
const HEIGHT = 800;

let scale = 1;
let offsetX = 0;
let offsetY = 0;

function resize() {
    scale = Math.min(
        window.innerWidth / WIDTH,
        window.innerHeight / HEIGHT
    );

    canvas.width = WIDTH;
    canvas.height = HEIGHT;

    canvas.style.width = WIDTH * scale + "px";
    canvas.style.height = HEIGHT * scale + "px";
}

window.addEventListener("resize", resize);
resize();

const BG = "#070a14";
const WHITE = "#f5faff";

const PLATFORM_COLORS = [
    "#46dcff",
    "#b964ff",
    "#ffd750",
    "#5affb4",
    "#ff6996",
    "#6496ff"
];

const PLATFORM_DARK = "#192d46";
const PLATFORM_HIGHLIGHT = "#b4f5ff";

const GRAVITY = 1500;
const BOUNCE_POWER = 980;
const DIVE_BOUNCE_POWER = 1320;
const MAX_FALL_SPEED = 1700;
const DIVE_ACCELERATION = 2500;

const AIR_ACCEL = 1850;
const AIR_FRICTION = 0.985;
const MAX_X_SPEED = 400;

const WALL_RESTITUTION = 0.92;
const PLATFORM_RESTITUTION = 0.98;

const BALL_RADIUS = 17;
const PHYSICS_STEPS = 5;

const PLATFORM_SPEED = 95;
const MAX_PLATFORM_SPEED = 145;

const PLATFORM_MOVE_SCORE = 500;

const SPAWN_INTERVAL = 0.62;
const PLATFORM_VERTICAL_GAP = 145;
const DESPAWN_DISTANCE = 180;

const CAMERA_TARGET_Y = 320;
const CAMERA_FOLLOW_SPEED = 7;

let lastTime = performance.now();


function clamp(value, minimum, maximum) {
    return Math.max(minimum, Math.min(maximum, value));
}


function lerp(a, b, amount) {
    return a + (b - a) * amount;
}


/* -----------------------------
   TOUCH CONTROLS
----------------------------- */

let touchLeft = false;
let touchRight = false;
let touchDown = false;

let touchStartX = 0;
let touchStartY = 0;
let touchActive = false;

canvas.addEventListener("touchstart", function(event) {

    event.preventDefault();

    const touch = event.touches[0];

    touchStartX = touch.clientX;
    touchStartY = touch.clientY;

    touchActive = true;

}, { passive: false });


canvas.addEventListener("touchmove", function(event) {

    event.preventDefault();

    if (!touchActive) {
        return;
    }

    const touch = event.touches[0];

    const dx = touch.clientX - touchStartX;
    const dy = touch.clientY - touchStartY;

    touchLeft = false;
    touchRight = false;
    touchDown = false;

    if (Math.abs(dx) > Math.abs(dy)) {

        if (dx < -20) {
            touchLeft = true;
        }

        if (dx > 20) {
            touchRight = true;
        }

    } else {

        if (dy > 20) {
            touchDown = true;
        }
    }

}, { passive: false });


canvas.addEventListener("touchend", function(event) {

    event.preventDefault();

    touchLeft = false;
    touchRight = false;
    touchDown = false;

    touchActive = false;

    if (!game.started || game.gameOver) {
        game.restart();
    }

}, { passive: false });


canvas.addEventListener("touchcancel", function() {

    touchLeft = false;
    touchRight = false;
    touchDown = false;

    touchActive = false;

});


/* -----------------------------
   KEYBOARD CONTROLS
----------------------------- */

const keys = {};

window.addEventListener("keydown", function(event) {

    keys[event.key.toLowerCase()] = true;

    if (event.key === "Escape") {
        location.reload();
    }

    if (event.key === " " && (!game.started || game.gameOver)) {
        game.restart();
    }

});


window.addEventListener("keyup", function(event) {

    keys[event.key.toLowerCase()] = false;

});


/* -----------------------------
   PARTICLE
----------------------------- */

class Particle {

    constructor(x, y, color) {

        this.x = x;
        this.y = y;

        const angle = Math.random() * Math.PI * 2;
        const speed = 70 + Math.random() * 200;

        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;

        this.life = 0.2 + Math.random() * 0.35;
        this.maxLife = this.life;

        this.size = 2 + Math.random() * 3;

        this.color = color;
    }


    update(dt) {

        this.x += this.vx * dt;
        this.y += this.vy * dt;

        this.vy += 450 * dt;

        this.vx *= 0.985;

        this.life -= dt;
    }


    draw(cameraY) {

        if (this.life <= 0) {
            return;
        }

        const alpha = this.life / this.maxLife;

        ctx.globalAlpha = alpha;

        ctx.fillStyle = this.color;

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y + cameraY,
            this.size * alpha,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.globalAlpha = 1;
    }
}


/* -----------------------------
   PLATFORM
----------------------------- */

class Platform {

    constructor(x, y, width) {

        this.x = x;
        this.y = y;

        this.width = width || (
            Math.floor(Math.random() * 3) + 3
        );

        this.height = 1;

        this.vx = -25 + Math.random() * 50;

        this.vy = PLATFORM_SPEED;

        this.color =
            PLATFORM_COLORS[
                Math.floor(
                    Math.random() * PLATFORM_COLORS.length
                )
            ];
    }


    getWidth() {
        return this.width * 34;
    }


    getRect() {

        return {
            left: this.x - this.getWidth() / 2,
            right: this.x + this.getWidth() / 2,
            top: this.y - 17,
            bottom: this.y + 17
        };
    }


    update(dt, speed, canMove) {

        if (!canMove) {

            this.vx = 0;
            this.vy = 0;

            return;
        }

        this.vy = speed;

        this.x += this.vx * dt;
        this.y += this.vy * dt;

        const halfWidth = this.getWidth() / 2;

        if (this.x - halfWidth < 8) {

            this.x = 8 + halfWidth;
            this.vx = Math.abs(this.vx);

        } else if (this.x + halfWidth > WIDTH - 8) {

            this.x = WIDTH - 8 - halfWidth;
            this.vx = -Math.abs(this.vx);
        }
    }


    draw(cameraY) {

        const rect = this.getRect();

        const x = rect.left;
        const y = rect.top + cameraY;
        const width = rect.right - rect.left;
        const height = 34;

        ctx.fillStyle = PLATFORM_DARK;

        ctx.fillRect(
            x,
            y + 5,
            width,
            height
        );

        ctx.fillStyle = this.color;

        ctx.fillRect(
            x,
            y,
            width,
            height
        );

        ctx.strokeStyle = PLATFORM_HIGHLIGHT;
        ctx.lineWidth = 3;

        ctx.beginPath();

        ctx.moveTo(
            x + 7,
            y + 5
        );

        ctx.lineTo(
            x + width - 7,
            y + 5
        );

        ctx.stroke();
    }
}


/* -----------------------------
   PLAYER
----------------------------- */

class Player {

    constructor() {
        this.reset();
    }


    reset() {

        this.x = WIDTH / 2;
        this.y = 520;

        this.vx = 0;
        this.vy = 0;

        this.radius = BALL_RADIUS;

        this.squash = 1;
        this.stretch = 1;

        this.trail = [];

        this.bounces = 0;

        this.diving = false;
    }


    control(dt) {

        let direction = 0;

        if (
            keys["arrowleft"] ||
            keys["a"] ||
            touchLeft
        ) {
            direction -= 1;
        }

        if (
            keys["arrowright"] ||
            keys["d"] ||
            touchRight
        ) {
            direction += 1;
        }

        this.vx += direction * AIR_ACCEL * dt;

        this.vx *= AIR_FRICTION;

        this.vx = clamp(
            this.vx,
            -MAX_X_SPEED,
            MAX_X_SPEED
        );

        this.diving = false;

        if (
            (
                keys["arrowdown"] ||
                touchDown
            ) &&
            this.vy > 0
        ) {

            this.diving = true;

            this.vy += DIVE_ACCELERATION * dt;

            this.vy = Math.min(
                this.vy,
                MAX_FALL_SPEED
            );
        }
    }


    applyGravity(dt) {

        this.vy += GRAVITY * dt;

        this.vy = Math.min(
            this.vy,
            MAX_FALL_SPEED
        );
    }


    move(dt) {

        this.x += this.vx * dt;
        this.y += this.vy * dt;
    }


    wallCollision() {

        if (this.x - this.radius < 0) {

            this.x = this.radius;

            this.vx =
                Math.abs(this.vx) *
                WALL_RESTITUTION;

            return true;
        }

        if (this.x + this.radius > WIDTH) {

            this.x = WIDTH - this.radius;

            this.vx =
                -Math.abs(this.vx) *
                WALL_RESTITUTION;

            return true;
        }

        return false;
    }


    bounce(nx, ny, platformVelocityY) {

        const relativeVx = this.vx;

        const relativeVy =
            this.vy - platformVelocityY;

        const velocityIntoSurface =
            relativeVx * nx +
            relativeVy * ny;

        if (velocityIntoSurface >= 0) {
            return false;
        }

        this.vx -=
            2 *
            velocityIntoSurface *
            nx;

        this.vy -=
            2 *
            velocityIntoSurface *
            ny;

        this.vx *= PLATFORM_RESTITUTION;
        this.vy *= PLATFORM_RESTITUTION;

        if (ny < -0.5) {

            let bouncePower = BOUNCE_POWER;

            if (this.diving) {

                const diveBonus =
                    Math.max(
                        0,
                        this.vy + platformVelocityY
                    ) * 0.45;

                bouncePower = Math.max(
                    DIVE_BOUNCE_POWER,
                    BOUNCE_POWER + diveBonus
                );
            }

            this.vy = -bouncePower;

            this.squash = 1.4;
            this.stretch = 0.65;

            this.bounces++;

            this.diving = false;

            return true;
        }

        this.squash = 1.15;
        this.stretch = 0.85;

        return true;
    }


    updateVisuals(dt) {

        this.squash = lerp(
            this.squash,
            1,
            Math.min(1, dt * 13)
        );

        this.stretch = lerp(
            this.stretch,
            1,
            Math.min(1, dt * 13)
        );

        this.trail.push({
            x: this.x,
            y: this.y
        });

        if (this.trail.length > 14) {
            this.trail.shift();
        }
    }


    draw(cameraY) {

        for (let i = 0; i < this.trail.length; i++) {

            const point = this.trail[i];

            const progress =
                i / Math.max(1, this.trail.length);

            ctx.globalAlpha =
                0.27 * progress;

            ctx.fillStyle = "#50d2ff";

            ctx.beginPath();

            ctx.arc(
                point.x,
                point.y + cameraY,
                Math.max(
                    2,
                    this.radius * progress
                ),
                0,
                Math.PI * 2
            );

            ctx.fill();
        }

        ctx.globalAlpha = 1;

        const width =
            this.radius *
            2 *
            this.squash;

        const height =
            this.radius *
            2 *
            this.stretch;

        const x =
            this.x - width / 2;

        const y =
            this.y +
            cameraY -
            height / 2;

        ctx.fillStyle =
            "rgba(80,220,255,0.18)";

        ctx.beginPath();

        ctx.ellipse(
            this.x,
            this.y + cameraY,
            width / 2 + 5,
            height / 2 + 5,
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.fillStyle = WHITE;

        ctx.beginPath();

        ctx.ellipse(
            this.x,
            this.y + cameraY,
            width / 2,
            height / 2,
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.fillStyle = "#50c8ff";

        ctx.beginPath();

        ctx.ellipse(
            x + width * 0.38,
            y + height * 0.25,
            Math.max(3, width * 0.15),
            Math.max(3, height * 0.12),
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}


/* -----------------------------
   GAME
----------------------------- */

class Game {

    constructor() {

        this.player = new Player();

        this.platforms = [];

        this.particles = [];

        this.cameraY = 0;

        this.score = 0;
        this.best = 0;

        this.heightReached = 0;

        this.spawnTimer = 0;

        this.gameOver = false;

        this.started = false;

        this.shake = 0;

        this.nextPlatformY = 100;

        this.spawnInitialPlatforms();
    }


    spawnInitialPlatforms() {

        this.platforms = [];

        const startingPlatforms = [

            [WIDTH * 0.50, 625, 5],

            [WIDTH * 0.30, 480, 4],

            [WIDTH * 0.68, 335, 5],

            [WIDTH * 0.42, 190, 4],

            [WIDTH * 0.72, 45, 5]
        ];

        for (const platform of startingPlatforms) {

            this.platforms.push(
                new Platform(
                    platform[0],
                    platform[1],
                    platform[2]
                )
            );
        }

        this.nextPlatformY = -100;
    }


    restart() {

        this.player.reset();

        this.cameraY = 0;

        this.score = 0;

        this.heightReached = 0;

        this.spawnTimer = 0;

        this.gameOver = false;

        this.started = true;

        this.shake = 0;

        this.particles = [];

        this.spawnInitialPlatforms();
    }


    getDifficulty() {

        return clamp(
            this.heightReached / 5000,
            0,
            1
        );
    }


    getPlatformSpeed() {

        return lerp(
            PLATFORM_SPEED,
            MAX_PLATFORM_SPEED,
            this.getDifficulty()
        );
    }


    spawnPlatform() {

        const x =
            70 +
            Math.random() *
            (WIDTH - 140);

        const widths = [3, 4, 4, 5];

        const width =
            widths[
                Math.floor(
                    Math.random() * widths.length
                )
            ];

        this.platforms.push(
            new Platform(
                x,
                this.nextPlatformY,
                width
            )
        );

        this.nextPlatformY -=
            PLATFORM_VERTICAL_GAP +
            (-20 + Math.random() * 50);
    }


    bounceEffect(x, y, color) {

        for (let i = 0; i < 18; i++) {

            this.particles.push(
                new Particle(
                    x,
                    y,
                    color
                )
            );
        }

        this.shake = 3;
    }


    deathEffect() {

        for (let i = 0; i < 45; i++) {

            this.particles.push(
                new Particle(
                    this.player.x,
                    this.player.y,
                    "#46dcff"
                )
            );
        }

        this.shake = 10;
    }


    collidePlatform(player, platform) {

        const rect = platform.getRect();

        const closestX =
            clamp(
                player.x,
                rect.left,
                rect.right
            );

        const closestY =
            clamp(
                player.y,
                rect.top,
                rect.bottom
            );

        const dx =
            player.x - closestX;

        const dy =
            player.y - closestY;

        const distanceSq =
            dx * dx +
            dy * dy;

        if (
            distanceSq >
            player.radius * player.radius
        ) {
            return false;
        }

        const leftPen =
            player.x +
            player.radius -
            rect.left;

        const rightPen =
            rect.right -
            (
                player.x -
                player.radius
            );

        const topPen =
            player.y +
            player.radius -
            rect.top;

        const bottomPen =
            rect.bottom -
            (
                player.y -
                player.radius
            );

        const penetrations = [

            [leftPen, -1, 0],

            [rightPen, 1, 0],

            [topPen, 0, -1],

            [bottomPen, 0, 1]
        ];

        penetrations.sort(
            (a, b) => a[0] - b[0]
        );

        const penetration =
            penetrations[0][0];

        const nx =
            penetrations[0][1];

        const ny =
            penetrations[0][2];

        const relativeVx =
            player.vx;

        const relativeVy =
            player.vy -
            platform.vy;

        const velocityIntoSurface =
            relativeVx * nx +
            relativeVy * ny;

        if (velocityIntoSurface >= 0) {
            return false;
        }

        player.x +=
            nx *
            Math.max(penetration, 0);

        player.y +=
            ny *
            Math.max(penetration, 0);

        const hit =
            player.bounce(
                nx,
                ny,
                platform.vy
            );

        if (hit) {

            this.bounceEffect(
                player.x,
                player.y,
                platform.color
            );

            this.score++;
        }

        return hit;
    }


    updateCamera(dt) {

        const screenY =
            this.player.y +
            this.cameraY;

        if (screenY < CAMERA_TARGET_Y) {

            const targetCamera =
                CAMERA_TARGET_Y -
                this.player.y;

            this.cameraY =
                lerp(
                    this.cameraY,
                    targetCamera,
                    Math.min(
                        1,
                        dt *
                        CAMERA_FOLLOW_SPEED
                    )
                );
        }

        this.cameraY =
            Math.max(
                this.cameraY,
                0
            );
    }


    update(dt) {

        if (this.gameOver) {

            this.updateParticles(dt);

            return;
        }

        this.player.control(dt);

        const platformSpeed =
            this.getPlatformSpeed();

        const canMove =
            this.score >=
            PLATFORM_MOVE_SCORE;

        for (const platform of this.platforms) {

            platform.update(
                dt,
                platformSpeed,
                canMove
            );
        }

        const subDt =
            dt /
            PHYSICS_STEPS;

        for (
            let i = 0;
            i < PHYSICS_STEPS;
            i++
        ) {

            this.player.applyGravity(
                subDt
            );

            this.player.move(
                subDt
            );

            if (
                this.player.wallCollision()
            ) {

                this.bounceEffect(
                    this.player.x,
                    this.player.y,
                    "#46dcff"
                );
            }

            for (
                const platform of this.platforms
            ) {

                if (
                    this.collidePlatform(
                        this.player,
                        platform
                    )
                ) {
                    break;
                }
            }
        }

        this.updateCamera(dt);

        const currentHeight =
            Math.max(
                0,
                Math.floor(
                    520 -
                    this.player.y
                )
            );

        this.heightReached =
            Math.max(
                this.heightReached,
                currentHeight
            );

        this.score =
            Math.max(
                this.score,
                Math.floor(
                    this.heightReached / 5
                )
            );

        this.best =
            Math.max(
                this.best,
                this.score
            );

        this.spawnTimer += dt;

        while (
            this.spawnTimer >=
            SPAWN_INTERVAL
        ) {

            this.spawnTimer -=
                SPAWN_INTERVAL;

            this.spawnPlatform();
        }

        const despawnY =
            -this.cameraY +
            HEIGHT +
            DESPAWN_DISTANCE;

        this.platforms =
            this.platforms.filter(
                platform =>
                    platform.y <
                    despawnY
            );

        const playerScreenY =
            this.player.y +
            this.cameraY;

        if (
            playerScreenY >
            HEIGHT + 60
        ) {

            this.die();
        }

        this.updateParticles(dt);

        this.player.updateVisuals(dt);

        this.shake =
            Math.max(
                0,
                this.shake -
                dt * 20
            );
    }


    die() {

        if (this.gameOver) {
            return;
        }

        this.gameOver = true;

        this.best =
            Math.max(
                this.best,
                this.score
            );

        this.deathEffect();
    }


    updateParticles(dt) {

        for (
            const particle of this.particles
        ) {

            particle.update(dt);
        }

        this.particles =
            this.particles.filter(
                particle =>
                    particle.life > 0
            );
    }


    drawBackground() {

        for (
            let y = 0;
            y < HEIGHT;
            y += 8
        ) {

            const amount =
                y / HEIGHT;

            const r =
                Math.floor(
                    7 + amount * 8
                );

            const g =
                Math.floor(
                    10 + amount * 9
                );

            const b =
                Math.floor(
                    20 + amount * 20
                );

            ctx.fillStyle =
                `rgb(${r},${g},${b})`;

            ctx.fillRect(
                0,
                y,
                WIDTH,
                8
            );
        }

        let random = 12345;

        function randomNumber() {

            random =
                (random * 9301 + 49297) %
                233280;

            return random / 233280;
        }

        ctx.fillStyle =
            "#1c2d41";

        for (let i = 0; i < 70; i++) {

            const x =
                randomNumber() * WIDTH;

            const baseY =
                randomNumber() * HEIGHT;

            const y =
                (
                    baseY +
                    this.cameraY * 0.15
                ) % HEIGHT;

            ctx.fillRect(
                x,
                y,
                2,
                2
            );
        }
    }


    draw() {

        ctx.clearRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );

        this.drawBackground();

        for (
            const platform of this.platforms
        ) {

            const screenY =
                platform.y +
                this.cameraY;

            if (
                screenY > -100 &&
                screenY < HEIGHT + 100
            ) {

                platform.draw(
                    this.cameraY
                );
            }
        }

        for (
            const particle of this.particles
        ) {

            particle.draw(
                this.cameraY
            );
        }

        this.player.draw(
            this.cameraY
        );

        ctx.fillStyle = WHITE;

        ctx.font =
            "34px Arial";

        ctx.textAlign =
            "center";

        ctx.fillText(
            this.score,
            WIDTH / 2,
            50
        );

        ctx.fillStyle =
            "#7d91a5";

        ctx.font =
            "24px Arial";

        ctx.fillText(
            "BEST  " + this.best,
            WIDTH / 2,
            82
        );

        if (this.player.diving) {

            ctx.fillStyle =
                "#ff7896";

            ctx.font =
                "24px Arial";

            ctx.textAlign =
                "right";

            ctx.fillText(
                "DIVE!",
                WIDTH - 15,
                50
            );
        }

        if (!this.started) {

            ctx.textAlign =
                "center";

            ctx.fillStyle =
                WHITE;

            ctx.font =
                "70px Arial";

            ctx.fillText(
                "BOUNCE",
                WIDTH / 2,
                HEIGHT / 2 - 100
            );

            ctx.fillStyle =
                "#46dcff";

            ctx.font =
                "34px Arial";

            ctx.fillText(
                "SWIPE LEFT / RIGHT",
                WIDTH / 2,
                HEIGHT / 2 - 20
            );

            ctx.fillStyle =
                "#ff7896";

            ctx.font =
                "24px Arial";

            ctx.fillText(
                "SWIPE DOWN TO DIVE",
                WIDTH / 2,
                HEIGHT / 2 + 25
            );

            ctx.fillStyle =
                "#8c9bab";

            ctx.fillText(
                "TAP TO START",
                WIDTH / 2,
                HEIGHT / 2 + 85
            );
        }


        if (
            this.started &&
            this.gameOver
        ) {

            ctx.fillStyle =
                "rgba(0,0,0,0.65)";

            ctx.fillRect(
                0,
                0,
                WIDTH,
                HEIGHT
            );

            ctx.textAlign =
                "center";

            ctx.fillStyle =
                WHITE;

            ctx.font =
                "70px Arial";

            ctx.fillText(
                "GAME OVER",
                WIDTH / 2,
                HEIGHT / 2 - 70
            );

            ctx.fillStyle =
                "#46dcff";

            ctx.font =
                "34px Arial";

            ctx.fillText(
                "SCORE  " + this.score,
                WIDTH / 2,
                HEIGHT / 2
            );

            ctx.fillStyle =
                "#9baabd";

            ctx.font =
                "24px Arial";

            ctx.fillText(
                "BEST  " + this.best,
                WIDTH / 2,
                HEIGHT / 2 + 45
            );

            ctx.fillStyle =
                WHITE;

            ctx.fillText(
                "TAP TO RESTART",
                WIDTH / 2,
                HEIGHT / 2 + 100
            );
        }
    }
}


const game = new Game();


function gameLoop(time) {

    let dt =
        (time - lastTime) / 1000;

    lastTime = time;

    dt =
        Math.min(
            dt,
            0.025
        );

    game.update(dt);

    game.draw();

    requestAnimationFrame(
        gameLoop
    );
}


requestAnimationFrame(gameLoop);

</script>
