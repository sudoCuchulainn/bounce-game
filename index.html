            );

            inner.addColorStop(
                1,
                "rgba(50,230,255,0)"
            );


            ctx.fillStyle =
                inner;

            ctx.beginPath();

            ctx.moveTo(
                x -
                    innerWidth / 2,
                baseY + 4
            );

            ctx.quadraticCurveTo(
                x -
                    innerWidth * 0.25,
                baseY -
                    innerHeight * 0.38,
                x +
                    wave2 * 4,
                baseY -
                    innerHeight
            );

            ctx.quadraticCurveTo(
                x +
                    innerWidth * 0.3,
                baseY -
                    innerHeight * 0.4,
                x +
                    innerWidth / 2,
                baseY + 4
            );

            ctx.closePath();

            ctx.fill();
        }


        /*
         * Bright fire line at the danger boundary.
         */

        const line =
            ctx.createLinearGradient(
                0,
                0,
                WIDTH,
                0
            );

        line.addColorStop(
            0,
            "#26e6ff"
        );

        line.addColorStop(
            0.25,
            "#50ffb0"
        );

        line.addColorStop(
            0.5,
            "#b4ff72"
        );

        line.addColorStop(
            0.75,
            "#50ffb0"
        );

        line.addColorStop(
            1,
            "#26e6ff"
        );


        ctx.shadowBlur =
            16;

        ctx.shadowColor =
            "rgba(40,255,190,0.8)";

        ctx.fillStyle =
            line;

        ctx.fillRect(
            0,
            baseY + 3,
            WIDTH,
            4
        );

        ctx.shadowBlur = 0;


        /*
         * Danger label.
         */

        ctx.textAlign =
            "center";

        ctx.font =
            "bold 12px Arial";

        ctx.fillStyle =
            "rgba(190,255,225,0.6)";

        ctx.fillText(
            "DON'T FALL",
            WIDTH / 2,
            HEIGHT - 9
        );
    }


    /* =====================================================
       BACKGROUND
    ===================================================== */

    background() {

        const gradient =
            ctx.createLinearGradient(
                0,
                0,
                0,
                HEIGHT
            );


        gradient.addColorStop(
            0,
            "#050914"
        );

        gradient.addColorStop(
            1,
            "#101a2d"
        );


        ctx.fillStyle =
            gradient;


        ctx.fillRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );


        /*
         * Stars.
         */

        for (
            let i = 0;
            i < 70;
            i++
        ) {

            const x =
                (
                    i *
                    83
                ) %
                WIDTH;


            const y =
                (
                    i *
                    137 +
                    Math.floor(
                        this.cameraY *
                        0.15
                    )
                ) %
                HEIGHT;


            ctx.fillStyle =
                "rgba(100,140,180,0.35)";


            ctx.fillRect(
                x,
                y,
                1,
                1
            );
        }
    }


    /* =====================================================
       TEXT
    ===================================================== */

    textCentered(
        text,
        y,
        size,
        c
    ) {

        ctx.font =
            `${size}px Arial`;

        ctx.fillStyle =
            color(c);

        ctx.textAlign =
            "center";

        ctx.fillText(
            text,
            WIDTH / 2,
            y
        );
    }


    /* =====================================================
       HUD
    ===================================================== */

    hud() {

        ctx.textAlign =
            "center";


        /*
         * Score.
         */

        ctx.font =
            "bold 38px Arial";

        ctx.fillStyle =
            color(WHITE);

        ctx.fillText(
            this.score.toLocaleString(),
            WIDTH / 2,
            48
        );


        ctx.font =
            "16px Arial";

        ctx.fillStyle =
            "rgba(160,180,200,0.9)";

        ctx.fillText(
            "SCORE",
            WIDTH / 2,
            70
        );


        /*
         * Height.
         */

        ctx.font =
            "bold 20px Arial";

        ctx.fillStyle =
            "rgba(220,235,250,0.95)";

        ctx.fillText(
            `HEIGHT  ${
                this.height.toLocaleString()
            }`,
            WIDTH / 2,
            100
        );


        /*
         * Flow.
         */

        if (
            this.flow > 0
        ) {

            ctx.font =
                "bold 23px Arial";

            ctx.fillStyle =
                this.flow >= 7
                    ? "#ffe06a"
                    : "#62f5d0";


            ctx.fillText(
                `FLOW x${this.flow}`,
                WIDTH / 2,
                132
            );


            /*
             * Make its purpose obvious.
             */

            ctx.font =
                "11px Arial";

            ctx.fillStyle =
                "rgba(130,240,215,0.75)";

            ctx.fillText(
                "CLEAN LANDINGS = BIGGER SCORE",
                WIDTH / 2,
                149
            );
        }


        /*
         * Powerup indicators.
         */

        if (
            this.player.ghosting
        ) {

            ctx.textAlign =
                "left";

            ctx.font =
                "bold 17px Arial";

            ctx.fillStyle =
                "#f5faff";

            ctx.fillText(
                `GHOST ${
                    this.player.ghostTimer.toFixed(1)
                }s`,
                14,
                38
            );
        }


        if (
            this.player.invulnerable
        ) {

            ctx.textAlign =
                "left";

            ctx.font =
                "bold 17px Arial";

            ctx.fillStyle =
                "#70ffc0";

            ctx.fillText(
                `SAFE ${
                    this.player.safetyTimer.toFixed(1)
                }s`,
                14,
                this.player.ghosting
                    ? 62
                    : 38
            );
        }


        /*
         * Dive indicator.
         */

        if (
            this.player.diving
        ) {

            ctx.font =
                "bold 18px Arial";

            ctx.fillStyle =
                "#ff7896";

            ctx.textAlign =
                "right";

            ctx.fillText(
                "DIVE!",
                WIDTH - 15,
                38
            );
        }
    }


    /* =====================================================
       START SCREEN
    ===================================================== */

    startScreen() {

        ctx.fillStyle =
            "rgba(0,0,0,0.14)";

        ctx.fillRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );


        this.textCentered(
            "BOUNCE",
            270,
            66,
            WHITE
        );


        this.textCentered(
            "DRAG LEFT / RIGHT",
            355,
            25,
            [70,220,255]
        );


        this.textCentered(
            "CROSS THE GAPS TO REACH THE NEXT PLATFORM",
            390,
            14,
            [180,195,210]
        );


        this.textCentered(
            "DRAG DOWN WHILE FALLING TO DIVE",
            425,
            16,
            [255,120,150]
        );


        this.textCentered(
            "GOLD  +50     WHITE  GHOST     RAINBOW  SAVE",
            475,
            14,
            [220,230,240]
        );


        this.textCentered(
            "FLOW = CONSECUTIVE CLEAN LANDINGS",
            515,
            15,
            [100,245,210]
        );


        this.textCentered(
            "FALLING INTO THE BLUE-GREEN FIRE = DEATH",
            550,
            13,
            [90,220,210]
        );


        this.textCentered(
            "TAP TO START",
            625,

            [220,230,240]
        );
    }


    /* =====================================================
       GAME OVER
    ===================================================== */

    gameOverScreen() {

        ctx.fillStyle =
            "rgba(0,0,0,0.70)";

        ctx.fillRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );


        this.textCentered(
            "GAME OVER",
            260,
            56,
            WHITE
        );


        this.textCentered(
            this.score.toLocaleString(),
            335,
            42,
            [70,220,255]
        );


        this.textCentered(
            "SCORE",
            360,
            15,
            [145,165,185]
        );


        this.textCentered(
            this.height.toLocaleString(),
            420,
            34,
            WHITE
        );


        this.textCentered(
            "HEIGHT",
            442,
            15,
            [145,165,185]
        );


        this.textCentered(
            this.bestScore.toLocaleString(),
            495,
            25,
            [190,200,215]
        );


        this.textCentered(
            "BEST SCORE",
            516,
            14,
            [125,145,165]
        );


        this.textCentered(
            this.bestHeight.toLocaleString(),
            560,

            [190,200,215]
        );


        this.textCentered(
            "BEST HEIGHT",
            581,
            14,
            [125,145,165]
        );


        this.textCentered(
            `MAX FLOW x${this.maxFlow}`,
            630,

        );


        this.textCentered(

            WHITE
        );
    }


    /* =====================================================
       DRAW
    ===================================================== */

    draw() {

        ctx.save();


        /*
         * Work in game coordinates.
         */

        ctx.scale(
            scale,
            scale
        );


        this.background();


        /*
         * Platforms.
         */

        for (
            const platform of
            this.platforms
        ) {

            platform.draw(
                this.cameraY
            );
        }


        /*
         * Orbs.
         */

        for (
            const orb of
            this.orbs
        ) {

            orb.draw(
                this.cameraY
            );
        }


        /*
         * Fire.
         */

        this.drawFire();


        /*
         * Particles.
         */

        for (
            const particle of
            this.particles
        ) {

            particle.draw(
                this.cameraY
            );
        }


        /*
         * Player.
         */

        this.player.draw(
            this.cameraY
        );


        /*
         * Floating pickup text.
         */

        for (
            const text of
            this.texts
        ) {

            text.draw(
                this.cameraY
            );
        }


        /*
         * HUD.
         */

        if (
            this.started
        ) {

            this.hud();
        }


        /*
         * Start screen.
         */

        if (
            !this.started
        ) {

            this.startScreen();
        }


        /*
         * Game over.
         */

        if (
            this.gameOver
        ) {

            this.gameOverScreen();
        }


        /*
         * Flash.
         */

        if (
            this.flash > 0
        ) {

            ctx.fillStyle =
                `rgba(255,255,255,${
                    this.flash
                })`;

            ctx.fillRect(
                0,
                0,
                WIDTH,
                HEIGHT
            );
        }


        ctx.restore();
    }
}


/* =========================================================
   GAME LOOP
========================================================= */

const game =
    new Game();

let lastTime =
    performance.now();


function loop(now) {

    let dt =
        (
            now -
            lastTime
        ) /
        1000;


    lastTime =
        now;


    /*
     * Prevent giant physics jumps.
     */

    dt =
        Math.min(
            dt,
            0.025
        );


    game.update(
        dt
    );


    /*
     * Screen shake.
     */

    if (
        game.shake > 0
    ) {

        const sx =
            (
                Math.random() *
                2 -
                1
            ) *
            game.shake;


        const sy =
            (
                Math.random() *
                2 -
                1
            ) *
            game.shake;


        ctx.save();


        /*
         * Shake must happen in actual
         * canvas pixels after scaling.
         */

        ctx.translate(
            sx * scale,
            sy * scale
        );


        game.draw();


        ctx.restore();

    } else {

        game.draw();
    }


    requestAnimationFrame(
        loop
    );
}


requestAnimationFrame(
    loop
);

</script>
