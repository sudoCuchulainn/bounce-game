<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>BOUNCE</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #070a14;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
}

#game {
    display: block;
    width: 480px;
    height: 800px;
    background: #070a14;
    touch-action: none;
}
</style>
</head>

<body>

<canvas id="game" width="480" height="800"></canvas>

<script>
"use strict";

/* =========================================================
   BOUNCE
   =========================================================

   Core idea:

   Bounce upward.
   Make precise landings.
   Maintain FLOW.
   Climb as high as possible.

   Top / side / bottom / corner collisions are all valid.

   ========================================================= */


/* =========================================================
   CANVAS
   ========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const WIDTH = 480;
const HEIGHT = 800;

let scale = 1;

function resize() {

    scale = Math.min(
        window.innerWidth / WIDTH,
        window.innerHeight / HEIGHT
    );

    canvas.style.width =
        `${WIDTH * scale}px`;

    canvas.style.height =
        `${HEIGHT * scale}px`;
}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   COLORS
   ========================================================= */

const WHITE = [245, 250, 255];

const PLATFORM_COLORS = [
    [70, 220, 255],
    [185, 100, 255],
    [255, 215, 80],
    [90, 255, 180],
    [255, 105, 150],
    [100, 150, 255]
];

const PLATFORM_DARK = [25, 45, 70];
const PLATFORM_HIGHLIGHT = [180, 245, 255];


/* =========================================================
   PHYSICS
   ========================================================= */

const GRAVITY = 1450;

const BOUNCE_POWER = 930;
const DIVE_BOUNCE_POWER = 1280;

const MAX_FALL_SPEED = 1650;
const DIVE_ACCELERATION = 2300;

const AIR_ACCEL = 1250;
const AIR_FRICTION = 0.94;
const MAX_X_SPEED = 315;

const WALL_RESTITUTION = 0.90;
const PLATFORM_RESTITUTION = 0.97;

const BALL_RADIUS = 17;

const PHYSICS_STEPS = 6;

const CELL = 34;


/* =========================================================
   CAMERA
   ========================================================= */

const CAMERA_TARGET_Y = 320;
const CAMERA_FOLLOW_SPEED = 8;


/* =========================================================
   PLATFORM GENERATION
   ========================================================= */

const SPAWN_INTERVAL = 0.48;
const DESPAWN_DISTANCE = 250;


/* =========================================================
   INPUT
   ========================================================= */

let keyLeft = false;
let keyRight = false;
let keyDown = false;

let touchActive = false;

let touchX = 0;
let touchY = 0;

let touchStartX = 0;
let touchStartY = 0;

function pointerPosition(event) {

    const rect =
        canvas.getBoundingClientRect();

    return {
        x:
            (event.clientX - rect.left) /
            scale,

        y:
            (event.clientY - rect.top) /
            scale
    };
}


/* ---------------------------------------------------------
   TOUCH
   --------------------------------------------------------- */

canvas.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        const p =
            pointerPosition(event);

        touchActive = true;

        touchStartX = p.x;
        touchStartY = p.y;

        touchX = p.x;
        touchY = p.y;

        try {
            canvas.setPointerCapture(
                event.pointerId
            );
        } catch (_) {}

        if (
            !game.started ||
            game.gameOver
        ) {
            game.restart();
        }
    }
);


canvas.addEventListener(
    "pointermove",
    event => {

        if (!touchActive) {
            return;
        }

        event.preventDefault();

        const p =
            pointerPosition(event);

        touchX = p.x;
        touchY = p.y;
    }
);


canvas.addEventListener(
    "pointerup",
    event => {

        event.preventDefault();

        touchActive = false;

        try {
            canvas.releasePointerCapture(
                event.pointerId
            );
        } catch (_) {}
    }
);


canvas.addEventListener(
    "pointercancel",
    () => {
        touchActive = false;
    }
);


/* ---------------------------------------------------------
   KEYBOARD
   --------------------------------------------------------- */

window.addEventListener(
    "keydown",
    event => {

        const key =
            event.key.toLowerCase();

        if (
            event.key === "ArrowLeft" ||
            key === "a"
        ) {
            keyLeft = true;
        }

        if (
            event.key === "ArrowRight" ||
            key === "d"
        ) {
            keyRight = true;
        }

        if (
            event.key === "ArrowDown"
        ) {
            keyDown = true;
        }

        if (
            event.code === "Space"
        ) {

            if (
                !game.started ||
                game.gameOver
            ) {
                game.restart();
            }
        }

        if (
            event.key === "Escape"
        ) {
            location.reload();
        }
    }
);


window.addEventListener(
    "keyup",
    event => {

        const key =
            event.key.toLowerCase();

        if (
            event.key === "ArrowLeft" ||
            key === "a"
        ) {
            keyLeft = false;
        }

        if (
            event.key === "ArrowRight" ||
            key === "d"
        ) {
            keyRight = false;
        }

        if (
            event.key === "ArrowDown"
        ) {
            keyDown = false;
        }
    }
);


/* =========================================================
   HELPERS
   ========================================================= */

function clamp(
    value,
    minimum,
    maximum
) {
    return Math.max(
        minimum,
        Math.min(maximum, value)
    );
}


function lerp(
    a,
    b,
    amount
) {
    return a +
        (b - a) *
        amount;
}


function color(c) {
    return `rgb(${c[0]},${c[1]},${c[2]})`;
}


function rgba(c, alpha) {
    return `rgba(
        ${c[0]},
        ${c[1]},
        ${c[2]},
        ${alpha}
    )`;
}


function roundRect(
    x,
    y,
    width,
    height,
    radius
) {

    ctx.beginPath();

    ctx.roundRect(
        x,
        y,
        width,
        height,
        radius
    );

    ctx.fill();
}


/* =========================================================
   FLOATING TEXT
   ========================================================= */

class FloatingText {

    constructor(
        x,
        y,
        text,
        colorValue,
        size = 22
    ) {

        this.x = x;
        this.y = y;

        this.text = text;

        this.color = colorValue;

        this.size = size;

        this.life = 0.75;
        this.maxLife = 0.75;

        this.vy = -55;
    }


    update(dt) {

        this.y +=
            this.vy * dt;

        this.vy *= 0.97;

        this.life -= dt;
    }


    draw(cameraY) {

        if (this.life <= 0) {
            return;
        }

        const alpha =
            this.life /
            this.maxLife;

        ctx.globalAlpha =
            alpha;

        ctx.textAlign =
            "center";

        ctx.font =
            `bold ${this.size}px Arial`;

        ctx.fillStyle =
            color(this.color);

        ctx.fillText(
            this.text,
            this.x,
            this.y + cameraY
        );

        ctx.globalAlpha = 1;
    }
}


/* =========================================================
   PARTICLE
   ========================================================= */

class Particle {

    constructor(
        x,
        y,
        particleColor,
        power = 1
    ) {

        this.x = x;
        this.y = y;

        const angle =
            Math.random() *
            Math.PI * 2;

        const speed =
            (
                70 +
                Math.random() * 200
            ) * power;

        this.vx =
            Math.cos(angle) *
            speed;

        this.vy =
            Math.sin(angle) *
            speed;

        this.life =
            0.2 +
            Math.random() * 0.35;

        this.maxLife =
            this.life;

        this.size =
            2 +
            Math.random() * 4;

        this.color =
            particleColor;
    }


    update(dt) {

        this.x +=
            this.vx * dt;

        this.y +=
            this.vy * dt;

        this.vy +=
            450 * dt;

        this.vx *=
            0.985;

        this.life -= dt;
    }


    draw(cameraY) {

        if (this.life <= 0) {
            return;
        }

        const alpha =
            this.life /
            this.maxLife;

        const size =
            Math.max(
                1,
                this.size * alpha
            );

        ctx.fillStyle =
            rgba(
                this.color,
                alpha
            );

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y + cameraY,
            size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}


/* =========================================================
   PLATFORM
   ========================================================= */

class Platform {

    constructor(
        x,
        y,
        widthCells = 5,
        moving = false,
        bonus = false
    ) {

        this.x = x;
        this.y = y;

        this.widthCells =
            widthCells;

        this.width =
            widthCells *
            CELL;

        this.height =
            CELL;

        this.moving =
            moving;

        this.bonus =
            bonus;

        this.vx =
            moving
                ? (
                    Math.random() < 0.5
                        ? -1
                        : 1
                ) *
                (
                    18 +
                    Math.random() * 35
                )
                : 0;

        this.vy = 0;

        this.color =
            bonus
                ? [255, 215, 80]
                : PLATFORM_COLORS[
                    Math.floor(
                        Math.random() *
                        PLATFORM_COLORS.length
                    )
                ];
    }


    get rect() {

        return {
            left:
                this.x -
                this.width / 2,

            right:
                this.x +
                this.width / 2,

            top:
                this.y -
                CELL / 2,

            bottom:
                this.y +
                CELL / 2
        };
    }


    update(
        dt,
        verticalSpeed
    ) {

        /*
         * Platforms do not move at the
         * beginning of the game.

         * Their downward world movement
         * gradually increases with height.
         */

        this.y +=
            verticalSpeed *
            dt;

        if (!this.moving) {
            return;
        }

        this.x +=
            this.vx * dt;

        const half =
            this.width / 2;

        if (
            this.x - half < 8
        ) {

            this.x =
                8 + half;

            this.vx =
                Math.abs(this.vx);
        }

        if (
            this.x + half >
            WIDTH - 8
        ) {

            this.x =
                WIDTH - 8 - half;

            this.vx =
                -Math.abs(this.vx);
        }
    }


    draw(cameraY) {

        const r =
            this.rect;

        const screenY =
            r.top +
            cameraY;

        if (
            screenY >
            HEIGHT + 100 ||
            screenY <
            -100
        ) {
            return;
        }

        /*
         * Dark backing.
         */

        ctx.fillStyle =
            color(
                PLATFORM_DARK
            );

        roundRect(
            r.left,
            screenY + 5,
            this.width,
            CELL,
            7
        );

        /*
         * Main platform.
         */

        ctx.fillStyle =
            color(
                this.color
            );

        roundRect(
            r.left,
            screenY,
            this.width,
            CELL,
            7
        );

        /*
         * Highlight.
         */

        ctx.strokeStyle =
            color(
                PLATFORM_HIGHLIGHT
            );

        ctx.lineWidth = 3;

        ctx.beginPath();

        ctx.moveTo(
            r.left + 8,
            screenY + 5
        );

        ctx.lineTo(
            r.right - 8,
            screenY + 5
        );

        ctx.stroke();

        /*
         * Moving platform indicator.
         */

        if (this.moving) {

            ctx.fillStyle =
                "rgba(255,255,255,0.55)";

            ctx.beginPath();

            ctx.arc(
                this.x,
                screenY + CELL / 2,
                3,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }

        /*
         * Bonus platform indicator.
         */

        if (this.bonus) {

            ctx.strokeStyle =
                "rgba(255,255,255,0.8)";

            ctx.lineWidth = 2;

            ctx.beginPath();

            ctx.arc(
                this.x,
                screenY + CELL / 2,
                CELL * 0.31,
                0,
                Math.PI * 2
            );

            ctx.stroke();
        }
    }
}


/* =========================================================
   PLAYER
   ========================================================= */

class Player {

    constructor() {
        this.reset();
    }


    reset() {

        this.x =
            WIDTH / 2;

        this.y = 520;

        this.vx = 0;
        this.vy = 0;

        this.radius =
            BALL_RADIUS;

        this.squash = 1;
        this.stretch = 1;

        this.trail = [];

        this.bounces = 0;

        this.diving = false;

        this.lastCollision =
            null;
    }


    control(dt) {

        let direction = 0;

        /*
         * Keyboard.
         */

        if (keyLeft) {
            direction -= 1;
        }

        if (keyRight) {
            direction += 1;
        }

        /*
         * Touch control.

         * Instead of simply deciding
         * "left swipe / right swipe",
         * the thumb position acts like
         * a steering control.

         * The ball is the center reference.
         */

        if (touchActive) {

            const dx =
                touchX -
                this.x;

            /*
             * Small dead zone.
             */

            if (
                Math.abs(dx) > 12
            ) {

                direction =
                    clamp(
                        dx / 105,
                        -1,
                        1
                    );
            } else {

                direction = 0;
            }
        }

        /*
         * Horizontal movement.
         */

        this.vx +=
            direction *
            AIR_ACCEL *
            dt;

        /*
         * Friction.

         * More friction = easier
         * to stop and correct.
         */

        this.vx *=
            Math.pow(
                AIR_FRICTION,
                dt * 60
            );

        this.vx =
            clamp(
                this.vx,
                -MAX_X_SPEED,
                MAX_X_SPEED
            );


        /*
         * Dive.

         * Only available while falling.
         */

        this.diving = false;

        if (this.vy > 0) {

            if (keyDown) {
                this.diving = true;
            }

            if (
                touchActive &&
                touchY -
                touchStartY >
                55
            ) {
                this.diving = true;
            }

            if (this.diving) {

                this.vy +=
                    DIVE_ACCELERATION *
                    dt;

                this.vy =
                    Math.min(
                        this.vy,
                        MAX_FALL_SPEED
                    );
            }
        }
    }


    gravity(dt) {

        this.vy +=
            GRAVITY * dt;

        this.vy =
            Math.min(
                this.vy,
                MAX_FALL_SPEED
            );
    }


    move(dt) {

        this.x +=
            this.vx * dt;

        this.y +=
            this.vy * dt;
    }


    wallCollision() {

        if (
            this.x -
            this.radius <
            0
        ) {

            this.x =
                this.radius;

            this.vx =
                Math.abs(
                    this.vx
                ) *
                WALL_RESTITUTION;

            return true;
        }


        if (
            this.x +
            this.radius >
            WIDTH
        ) {

            this.x =
                WIDTH -
                this.radius;

            this.vx =
                -Math.abs(
                    this.vx
                ) *
                WALL_RESTITUTION;

            return true;
        }

        return false;
    }


    bounce(
        nx,
        ny,
        platformVelocityY
    ) {

        const relativeVx =
            this.vx;

        const relativeVy =
            this.vy -
            platformVelocityY;

        const velocityIntoSurface =
            relativeVx * nx +
            relativeVy * ny;

        if (
            velocityIntoSurface >= 0
        ) {
            return null;
        }

        /*
         * Reflect velocity.
         */

        this.vx -=
            2 *
            velocityIntoSurface *
            nx;

        this.vy -=
            2 *
            velocityIntoSurface *
            ny;

        this.vx *=
            PLATFORM_RESTITUTION;

        this.vy *=
            PLATFORM_RESTITUTION;


        /*
         * TOP
         */

        if (
            ny < -0.5
        ) {

            const wasDive =
                this.diving;

            let bouncePower =
                BOUNCE_POWER;

            if (wasDive) {

                const diveBonus =
                    Math.max(
                        0,
                        this.vy
                    ) *
                    0.35;

                bouncePower =
                    Math.max(
                        DIVE_BOUNCE_POWER,
                        BOUNCE_POWER +
                        diveBonus
                    );
            }

            this.vy =
                -bouncePower;

            this.squash =
                1.4;

            this.stretch =
                0.65;

            this.bounces++;

            this.diving = false;

            return {
                type: "top",
                dive: wasDive
            };
        }


        /*
         * BOTTOM
         */

        if (
            ny > 0.5
        ) {

            this.squash =
                1.18;

            this.stretch =
                0.85;

            return {
                type: "bottom",
                dive: false
            };
        }


        /*
         * SIDE
         */

        this.squash =
            1.12;

        this.stretch =
            0.88;

        return {
            type: "side",
            dive: false
        };
    }


    updateVisuals() {

        this.squash =
            lerp(
                this.squash,
                1,
                0.18
            );

        this.stretch =
            lerp(
                this.stretch,
                1,
                0.18
            );


        this.trail.push({
            x: this.x,
            y: this.y
        });

        if (
            this.trail.length >
            14
        ) {
            this.trail.shift();
        }
    }


    draw(cameraY) {

        /*
         * Trail.
         */

        for (
            let i = 0;
            i < this.trail.length;
            i++
        ) {

            const point =
                this.trail[i];

            const progress =
                i /
                Math.max(
                    1,
                    this.trail.length
                );

            ctx.fillStyle =
                `rgba(
                    80,
                    210,
                    255,
                    ${0.05 +
                      progress * 0.14}
                )`;

            ctx.beginPath();

            ctx.arc(
                point.x,
                point.y + cameraY,
                Math.max(
                    2,
                    this.radius *
                    progress
                ),
                0,
                Math.PI * 2
            );

            ctx.fill();
        }


        const width =
            this.radius *
            2 *
            this.squash;

        const height =
            this.radius *
            2 *
            this.stretch;

        const screenY =
            this.y +
            cameraY;


        /*
         * Glow.
         */

        ctx.shadowBlur = 18;

        ctx.shadowColor =
            "rgba(80,220,255,0.65)";


        /*
         * Ball.
         */

        ctx.fillStyle =
            "#f5faff";

        ctx.beginPath();

        ctx.ellipse(
            this.x,
            screenY,
            width / 2,
            height / 2,
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.shadowBlur = 0;


        /*
         * Highlight.
         */

        ctx.fillStyle =
            "#50c8ff";

        ctx.beginPath();

        ctx.ellipse(
            this.x -
                width * 0.18,

            screenY -
                height * 0.22,

            Math.max(
                3,
                width * 0.15
            ),

            Math.max(
                3,
                height * 0.12
            ),

            0,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}


/* =========================================================
   GAME
   ========================================================= */

class Game {

    constructor() {

        this.player =
            new Player();

        this.platforms = [];

        this.particles = [];

        this.floatingTexts = [];


        /*
         * Run stats.
         */

        this.score = 0;

        this.height = 0;

        this.flow = 0;

        this.maxFlow = 0;


        /*
         * Records.
         */

        this.bestScore =
            Number(
                localStorage.getItem(
                    "bounceBestScore"
                ) || 0
            );

        this.bestHeight =
            Number(
                localStorage.getItem(
                    "bounceBestHeight"
                ) || 0
            );


        /*
         * World.
         */

        this.cameraY = 0;

        this.spawnTimer = 0;

        this.nextPlatformY =
            -100;


        /*
         * State.
         */

        this.started = false;

        this.gameOver = false;


        /*
         * Effects.
         */

        this.shake = 0;

        this.flash = 0;


        /*
         * Climb tracking.
         */

        this.previousHeight = 0;

        this.previousHeightTime =
            performance.now() / 1000;


        this.spawnInitialPlatforms();
    }


    restart() {

        this.player.reset();

        this.platforms = [];

        this.particles = [];

        this.floatingTexts = [];


        this.cameraY = 0;

        this.score = 0;

        this.height = 0;

        this.flow = 0;

        this.maxFlow = 0;


        this.spawnTimer = 0;

        this.gameOver = false;

        this.started = true;


        this.shake = 0;

        this.flash = 0;


        this.previousHeight = 0;

        this.previousHeightTime =
            performance.now() / 1000;


        this.spawnInitialPlatforms();
    }


    difficulty() {

        return clamp(
            this.height / 5000,
            0,
            1
        );
    }


    /*
     * Platform world movement.

     * This starts at zero so the
     * opening feels calm.
     */

    platformSpeed() {

        const d =
            this.difficulty();

        return lerp(
            0,
            110,
            d
        );
    }


    /*
     * Moving-platform chance.
     */

    movingChance() {

        const d =
            this.difficulty();

        if (
            this.height < 900
        ) {
            return 0;
        }

        return lerp(
            0.05,
            0.35,
            clamp(
                (d - 0.18) /
                0.82,
                0,
                1
            )
        );
    }


    spawnInitialPlatforms() {

        const starting = [

            [
                WIDTH * 0.50,
                625,
                7
            ],

            [
                WIDTH * 0.43,
                490,
                6
            ],

            [
                WIDTH * 0.57,
                355,
                6
            ],

            [
                WIDTH * 0.46,
                220,
                6
            ],

            [
                WIDTH * 0.55,
                85,
                6
            ]
        ];


        for (
            const platform
            of starting
        ) {

            this.platforms.push(
                new Platform(
                    platform[0],
                    platform[1],
                    platform[2],
                    false,
                    false
                )
            );
        }


        this.nextPlatformY =
            -65;
    }


    /*
     * Find the highest platform
     * that is close to the spawn area.
     */

    getHighestPlatform() {

        if (
            this.platforms.length === 0
        ) {
            return null;
        }

        let highest =
            this.platforms[0];

        for (
            const platform
            of this.platforms
        ) {

            if (
                platform.y <
                highest.y
            ) {
                highest =
                    platform;
            }
        }

        return highest;
    }


    spawnPlatform() {

        const d =
            this.difficulty();

        const previous =
            this.getHighestPlatform();


        /*
         * Calculate a reachable X range.

         * We intentionally limit the
         * horizontal shift.
         */

        let x;

        if (previous) {

            const maxShift =
                lerp(
                    70,
                    145,
                    d
                );

            x =
                previous.x +
                (
                    Math.random() * 2 -
                    1
                ) *
                maxShift;

            x =
                clamp(
                    x,
                    65,
                    WIDTH - 65
                );

        } else {

            x =
                70 +
                Math.random() *
                (WIDTH - 140);
        }


        /*
         * Platform width.

         * The game starts generous and
         * becomes more precise.
         */

        let width;

        if (
            this.height < 700
        ) {

            width = 6;

        } else if (
            this.height < 1600
        ) {

            width =
                Math.random() <
                0.75
                    ? 5
                    : 6;

        } else if (
            this.height < 3000
        ) {

            width =
                Math.random() <
                0.65
                    ? 5
                    : 4;

        } else {

            width =
                [
                    3,
                    4,
                    4,
                    5
                ][
                    Math.floor(
                        Math.random() * 4
                    )
                ];
        }


        /*
         * Moving platforms.
         */

        const moving =
            Math.random() <
            this.movingChance();


        /*
         * Bonus platform.

         * Rare enough to feel special.
         */

        const bonus =
            Math.random() <
            0.08;


        this.platforms.push(
            new Platform(
                x,
                this.nextPlatformY,
                width,
                moving,
                bonus
            )
        );


        /*
         * Vertical spacing.

         * Gets slightly more demanding
         * with height.
         */

        const gap =
            lerp(
                128,
                158,
                d
            ) +
            (
                Math.random() * 24 -
                12
            );


        this.nextPlatformY -=
            gap;
    }


    /*
     * Particles.
     */

    addParticles(
        x,
        y,
        particleColor,
        amount,
        power = 1
    ) {

        for (
            let i = 0;
            i < amount;
            i++
        ) {

            this.particles.push(
                new Particle(
                    x,
                    y,
                    particleColor,
                    power
                )
            );
        }
    }


    /*
     * Floating notification.
     */

    floatText(
        x,
        y,
        text,
        textColor,
        size = 22
    ) {

        this.floatingTexts.push(
            new FloatingText(
                x,
                y,
                text,
                textColor,
                size
            )
        );
    }


    /*
     * Bounce effects.
     */

    bounceEffect(
        x,
        y,
        platform,
        type
    ) {

        if (
            type === "corner"
        ) {

            this.addParticles(
                x,
                y,
                [255, 235, 120],
                32,
                1.4
            );

            this.shake = 7;

            this.flash = 0.10;

        } else if (
            type === "edge"
        ) {

            this.addParticles(
                x,
                y,
                [255, 215, 80],
                25,
                1.15
            );

            this.shake = 5;

        } else if (
            type === "dive"
        ) {

            this.addParticles(
                x,
                y,
                [255, 105, 150],
                28,
                1.3
            );

            this.shake = 6;

        } else if (
            type === "flow"
        ) {

            this.addParticles(
                x,
                y,
                [90, 255, 220],
                28,
                1.2
            );

            this.shake = 4;

            this.flash = 0.06;

        } else {

            this.addParticles(
                x,
                y,
                platform.color,
                16,
                1
            );

            this.shake = 2;
        }
    }


    /*
     * Death effect.
     */

    deathEffect() {

        this.addParticles(
            this.player.x,
            this.player.y,
            [70, 220, 255],
            55,
            1.4
        );

        this.shake = 12;
    }


    /* =====================================================
       COLLISION
       ===================================================== */

    collidePlatform(
        player,
        platform
    ) {

        const r =
            platform.rect;


        /*
         * Closest point on rectangle.
         */

        const closestX =
            clamp(
                player.x,
                r.left,
                r.right
            );

        const closestY =
            clamp(
                player.y,
                r.top,
                r.bottom
            );


        const dx =
            player.x -
            closestX;

        const dy =
            player.y -
            closestY;


        if (
            dx * dx +
            dy * dy >
            player.radius *
            player.radius
        ) {
            return false;
        }


        /*
         * Penetration depths.

         * These allow us to determine
         * which face was hit.
         */

        const leftPen =
            player.x +
            player.radius -
            r.left;

        const rightPen =
            r.right -
            (
                player.x -
                player.radius
            );

        const topPen =
            player.y +
            player.radius -
            r.top;

        const bottomPen =
            r.bottom -
            (
                player.y -
                player.radius
            );


        const minimumPenetration =
            Math.min(
                leftPen,
                rightPen,
                topPen,
                bottomPen
            );


        let nx = 0;
        let ny = 0;


        if (
            minimumPenetration ===
            topPen
        ) {

            nx = 0;
            ny = -1;

        } else if (
            minimumPenetration ===
            bottomPen
        ) {

            nx = 0;
            ny = 1;

        } else if (
            minimumPenetration ===
            leftPen
        ) {

            nx = -1;
            ny = 0;

        } else {

            nx = 1;
            ny = 0;
        }


        /*
         * Corner detection.

         * A top landing very close to
         * either edge counts as a
         * difficult precision landing.
         */

        const nearLeft =
            Math.abs(
                player.x -
                r.left
            ) < 14;

        const nearRight =
            Math.abs(
                player.x -
                r.right
            ) < 14;

        const nearTop =
            Math.abs(
                player.y -
                r.top
            ) < 14;

        const isCorner =
            (
                nearLeft ||
                nearRight
            ) &&
            nearTop;


        /*
         * Relative velocity.
         */

        const relativeVx =
            player.vx;

        const relativeVy =
            player.vy -
            platform.vy;

        const into =
            relativeVx * nx +
            relativeVy * ny;


        /*
         * Already moving away.
         */

        if (
            into >= 0
        ) {
            return false;
        }


        /*
         * Push the player out
         * of the platform.
         */

        player.x +=
            nx *
            Math.max(
                minimumPenetration,
                0
            );

        player.y +=
            ny *
            Math.max(
                minimumPenetration,
                0
            );


        const result =
            player.bounce(
                nx,
                ny,
                platform.vy
            );


        if (!result) {
            return false;
        }


        /* -------------------------------------------------
           TOP LANDING
           ------------------------------------------------- */

        if (
            result.type === "top"
        ) {

            const centerDistance =
                Math.abs(
                    player.x -
                    platform.x
                );

            const halfWidth =
                platform.width /
                2;

            const edgeDistance =
                halfWidth -
                centerDistance;


            let landingType =
                "normal";


            /*
             * Corner is the rarest
             * and highest-value landing.
             */

            if (
                isCorner
            ) {

                landingType =
                    "corner";

            } else if (
                edgeDistance <
                28
            ) {

                landingType =
                    "edge";
            }


            /*
             * Base score.
             */

            let points = 10;


            /*
             * Precision bonuses.
             */

            if (
                landingType === "edge"
            ) {

                points = 25;

                this.floatText(
                    player.x,
                    player.y - 30,
                    "EDGE!",
                    [255, 215, 80],
                    20
                );
            }


            if (
                landingType === "corner"
            ) {

                points = 40;

                this.floatText(
                    player.x,
                    player.y - 30,
                    "CORNER!",
                    [255, 235, 120],
                    22
                );
            }


            /*
             * Dive bonus.

             * Dive is a separate skill.
             */

            if (
                result.dive
            ) {

                points += 30;

                this.floatText(
                    player.x,
                    player.y - 35,
                    "DIVE!",
                    [255, 105, 150],
                    19
                );
            }


            /*
             * Bonus platform.
             */

            if (
                platform.bonus
            ) {

                points += 50;

                this.floatText(
                    player.x,
                    player.y - 55,
                    "+50",
                    [255, 225, 90],
                    20
                );
            }


            /* -------------------------------------------------
               FLOW
               ------------------------------------------------- */

            /*
             * A clean landing means:
             *
             * - not a dive
             * - not a corner
             * - controlled horizontal speed
             *
             * Edge landings are still allowed to
             * continue Flow because they are skillful.
             */

            const clean =
                !result.dive &&
                Math.abs(
                    player.vx
                ) < 260;


            const flowEligible =
                clean ||
                landingType === "edge" ||
                landingType === "corner";


            if (
                flowEligible
            ) {

                this.flow =
                    clamp(
                        this.flow + 1,
                        0,
                        10
                    );

            } else {

                this.flow =
                    Math.max(
                        0,
                        this.flow - 1
                    );
            }


            this.maxFlow =
                Math.max(
                    this.maxFlow,
                    this.flow
                );


            /*
             * Flow bonus.

             * This is deliberately a bonus,
             * not a giant score multiplier.
             */

            if (
                this.flow >= 2
            ) {

                const flowBonus =
                    Math.min(
                        45,
                        (
                            this.flow -
                            1
                        ) * 5
                    );

                points +=
                    flowBonus;


                if (
                    this.flow >= 4
                ) {

                    this.floatText(
                        player.x,
                        player.y - 25,
                        `FLOW x${this.flow}`,
                        [90, 255, 220],
                        19
                    );
                }
            }


            /*
             * Fast-climb bonus.

             * Measure actual height gained
             * between checkpoints.
             */

            const now =
                performance.now() /
                1000;

            const elapsed =
                Math.max(
                    0.1,
                    now -
                    this.previousHeightTime
                );

            const heightGained =
                this.height -
                this.previousHeight;

            const climbRate =
                heightGained /
                elapsed;


            if (
                climbRate > 220 &&
                this.flow >= 3
            ) {

                const fastBonus =
                    Math.min(
                        100,
                        Math.floor(
                            climbRate /
                            8
                        )
                    );

                points +=
                    fastBonus;


                this.floatText(
                    player.x,
                    player.y - 52,
                    "FAST CLIMB",
                    [110, 235, 255],
                    17
                );
            }


            /*
             * Update climb checkpoint.
             */

            this.previousHeight =
                this.height;

            this.previousHeightTime =
                now;


            /*
             * Add score.
             */

            this.score +=
                Math.floor(
                    points
                );


            /*
             * Effects.
             */

            let effectType =
                "normal";


            if (
                landingType === "corner"
            ) {

                effectType =
                    "corner";

            } else if (
                landingType === "edge"
            ) {

                effectType =
                    "edge";

            } else if (
                result.dive
            ) {

                effectType =
                    "dive";

            } else if (
                this.flow >= 4
            ) {

                effectType =
                    "flow";
            }


            this.bounceEffect(
                player.x,
                player.y,
                platform,
                effectType
            );


            return true;
        }


        /* -------------------------------------------------
           SIDE / BOTTOM
           ------------------------------------------------- */

        /*
         * These collisions are valid and
         * remain part of the game.

         * However, they interrupt the clean
         * upward Flow.
         */

        this.flow = 0;

        this.addParticles(
            player.x,
            player.y,
            platform.color,
            10,
            0.8
        );

        return true;
    }


    /* =====================================================
       CAMERA
       ===================================================== */

    updateCamera(dt) {

        const screenY =
            this.player.y +
            this.cameraY;


        if (
            screenY <
            CAMERA_TARGET_Y
        ) {

            const target =
                CAMERA_TARGET_Y -
                this.player.y;


            this.cameraY =
                lerp(
                    this.cameraY,
                    target,
                    Math.min(
                        1,
                        dt *
                        CAMERA_FOLLOW_SPEED
                    )
                );
        }


        this.cameraY =
            Math.max(
                0,
                this.cameraY
            );
    }


    /* =====================================================
       UPDATE
       ===================================================== */

    update(dt) {

        if (
            this.gameOver
        ) {

            this.updateParticles(
                dt
            );

            this.shake =
                Math.max(
                    0,
                    this.shake -
                    dt * 20
                );

            return;
        }


        /*
         * Player input.
         */

        this.player.control(
            dt
        );


        /*
         * Platforms.
         */

        const speed =
            this.platformSpeed();


        for (
            const platform
            of this.platforms
        ) {

            platform.update(
                dt,
                speed
            );
        }


        /*
         * Physics substeps.
         */

        const subDt =
            dt /
            PHYSICS_STEPS;


        for (
            let step = 0;
            step < PHYSICS_STEPS;
            step++
        ) {

            this.player.gravity(
                subDt
            );

            this.player.move(
                subDt
            );


            /*
             * Walls.
             */

            if (
                this.player.wallCollision()
            ) {

                this.addParticles(
                    this.player.x,
                    this.player.y,
                    [70, 220, 255],
                    10,
                    0.8
                );

                /*
                 * Wall contact interrupts
                 * Flow because it isn't a
                 * clean platform ascent.
                 */

                this.flow = 0;
            }


            /*
             * Platforms.

             * Only collide once per substep.
             */

            for (
                const platform
                of this.platforms
            ) {

                if (
                    this.collidePlatform(
                        this.player,
                        platform
                    )
                ) {
                    break;
                }
            }
        }


        /*
         * Camera.
         */

        this.updateCamera(
            dt
        );


        /*
         * Height.

         * Height is measured from the
         * original starting Y position.
         */

        const currentHeight =
            Math.max(
                0,
                Math.floor(
                    520 -
                    this.player.y
                )
            );


        if (
            currentHeight >
            this.height
        ) {

            this.height =
                currentHeight;
        }


        /*
         * Best records.

         * Save only when a record
         * actually changes.
         */

        if (
            this.height >
            this.bestHeight
        ) {

            this.bestHeight =
                this.height;

            localStorage.setItem(
                "bounceBestHeight",
                String(
                    this.bestHeight
                )
            );
        }


        if (
            this.score >
            this.bestScore
        ) {

            this.bestScore =
                this.score;

            localStorage.setItem(
                "bounceBestScore",
                String(
                    this.bestScore
                )
            );
        }


        /*
         * Platform spawning.
         */

        this.spawnTimer +=
            dt;


        while (
            this.spawnTimer >=
            SPAWN_INTERVAL
        ) {

            this.spawnTimer -=
                SPAWN_INTERVAL;

            this.spawnPlatform();
        }


        /*
         * Remove old platforms.
         */

        const despawnY =
            -this.cameraY +
            HEIGHT +
            DESPAWN_DISTANCE;


        this.platforms =
            this.platforms.filter(
                platform =>
                    platform.y <
                    despawnY
            );


        /*
         * Death.

         * Give the player a little
         * forgiveness below the screen.
         */

        const playerScreenY =
            this.player.y +
            this.cameraY;


        if (
            playerScreenY >
            HEIGHT + 70
        ) {

            this.die();
        }


        /*
         * Effects.
         */

        this.updateParticles(
            dt
        );

        this.updateFloatingTexts(
            dt
        );

        this.player.updateVisuals();


        this.shake =
            Math.max(
                0,
                this.shake -
                dt * 20
            );

        this.flash =
            Math.max(
                0,
                this.flash -
                dt
            );
    }


    updateParticles(dt) {

        for (
            let i =
                this.particles.length - 1;
            i >= 0;
            i--
        ) {

            const particle =
                this.particles[i];

            particle.update(
                dt
            );

            if (
                particle.life <= 0
            ) {

                this.particles.splice(
                    i,
                    1
                );
            }
        }
    }


    updateFloatingTexts(dt) {

        for (
            let i =
                this.floatingTexts.length - 1;
            i >= 0;
            i--
        ) {

            const text =
                this.floatingTexts[i];

            text.update(
                dt
            );

            if (
                text.life <= 0
            ) {

                this.floatingTexts.splice(
                    i,
                    1
                );
            }
        }
    }


    /* =====================================================
       DEATH
       ===================================================== */

    die() {

        if (
            this.gameOver
        ) {
            return;
        }


        this.gameOver = true;


        /*
         * Final records.
         */

        if (
            this.score >
            this.bestScore
        ) {

            this.bestScore =
                this.score;

            localStorage.setItem(
                "bounceBestScore",
                String(
                    this.bestScore
                )
            );
        }


        if (
            this.height >
            this.bestHeight
        ) {

            this.bestHeight =
                this.height;

            localStorage.setItem(
                "bounceBestHeight",
                String(
                    this.bestHeight
                )
            );
        }


        this.deathEffect();
    }


    /* =====================================================
       BACKGROUND
       ===================================================== */

    drawBackground() {

        const gradient =
            ctx.createLinearGradient(
                0,
                0,
                0,
                HEIGHT
            );


        gradient.addColorStop(
            0,
            "#070a14"
        );

        gradient.addColorStop(
            1,
            "#0f1728"
        );


        ctx.fillStyle =
            gradient;

        ctx.fillRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );


        /*
         * Simple stars.

         * Deterministic positions so
         * they don't jump every frame.
         */

        for (
            let i = 0;
            i < 75;
            i++
        ) {

            const x =
                (
                    i * 83
                ) % WIDTH;

            const y =
                (
                    i * 137 +
                    Math.floor(
                        this.cameraY *
                        0.15
                    )
                ) % HEIGHT;


            ctx.fillStyle =
                "rgba(100,140,180,0.35)";


            ctx.fillRect(
                x,
                y,
                1,
                1
            );
        }
    }

       HUD

        );

            color(WHITE);

        ctx.fillText(
            this.height.toLocaleString(),
            WIDTH / 2,
            425
        );


        ctx.font =
            "15px Arial";

        ctx.fillStyle =
            "#91a4b8";

        ctx.fillText(
            "HEIGHT",
            WIDTH / 2,
            450
        );


        /*
         * Best score.
         */

        ctx.font =
            "bold 25px Arial";

        ctx.fillStyle =
            "#c2ccd8";

        ctx.fillText(
            this.bestScore.toLocaleString(),
            WIDTH / 2,
            505
        );


        ctx.font =
            "14px Arial";

        ctx.fillStyle =
            "#7d91a5";

        ctx.fillText(
            "BEST SCORE",
            WIDTH / 2,
            526
        );


        /*
         * Best height.
         */

        ctx.font =
            "bold 27px Arial";

        ctx.fillStyle =
            "#c2ccd8";

        ctx.fillText(
            this.bestHeight.toLocaleString(),
            WIDTH / 2,
            570
        );


        ctx.font =
            "14px Arial";

        ctx.fillStyle =
            "#7d91a5";

        ctx.fillText(
            "BEST HEIGHT",
            WIDTH / 2,
            591
        );


        /*
         * Flow.
         */

        ctx.font =
            "bold 20px Arial";

        ctx.fillStyle =
            "#62f5d0";

        ctx.fillText(
            `MAX FLOW x${this.maxFlow}`,
            WIDTH / 2,
            640
        );


        /*
         * Retry.
         */

        ctx.font =
            "bold 18px Arial";

        ctx.fillStyle =
            color(WHITE);

        ctx.fillText(
            "TAP ANYWHERE TO RETRY",
            WIDTH / 2,
            705
        );
    }


    /* =====================================================
       DRAW
       ===================================================== */

    draw() {

        ctx.clearRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );


        /*
         * Background.
         */

        this.drawBackground();


        /*
         * Platforms.
         */

        for (
            const platform
            of this.platforms
        ) {

            platform.draw(
                this.cameraY
            );
        }


        /*
         * Particles.
         */

        for (
            const particle
            of this.particles
        ) {

            particle.draw(
                this.cameraY
            );
        }


        /*
         * Floating scoring text.
         */

        for (
            const floatingText
            of this.floatingTexts
        ) {

            floatingText.draw(
                this.cameraY
            );
        }


        /*
         * Player.
         */

        this.player.draw(
            this.cameraY
        );


        /*
         * HUD.
         */

        if (
            this.started
        ) {

            this.drawHUD();
        }


        /*
         * Start screen.
         */

        if (
            !this.started
        ) {

            this.drawStartScreen();
        }


        /*
         * Game over.
         */

        if (
            this.gameOver
        ) {

            this.drawGameOverScreen();
        }


        /*
         * Flash.
         */

        if (
            this.flash > 0
        ) {

            ctx.fillStyle =
                `rgba(
                    255,
                    255,
                    255,
                    ${this.flash}
                )`;

            ctx.fillRect(
                0,
                0,
                WIDTH,
                HEIGHT
            );
        }
    }
}


/* =========================================================
   START GAME
   ========================================================= */

const game =
    new Game();


/* =========================================================
   GAME LOOP
   ========================================================= */

let lastTime =
    performance.now();


function gameLoop(now) {

    let dt =
        (now - lastTime) /
        1000;

    lastTime =
        now;


    /*
     * Prevent giant physics steps
     * if the phone pauses briefly.
     */

    dt =
        Math.min(
            dt,
            0.025
        );


    game.update(
        dt
    );


    /*
     * Screen shake.

     * The actual game coordinates
     * remain 480 × 800.
     */

    if (
        game.shake > 0
    ) {

        const shakeX =
            (
                Math.random() * 2 -
                1
            ) *
            game.shake;

        const shakeY =
            (
                Math.random() * 2 -
                1
            ) *
            game.shake;


        ctx.save();

        ctx.translate(
            shakeX,
            shakeY
        );

        game.draw();

        ctx.restore();

    } else {

        game.draw();
    }


    requestAnimationFrame(
        gameLoop
    );
}


requestAnimationFrame(
    gameLoop
);

</script>
