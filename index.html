/* =========================================================
   HAPTICS
========================================================= */

function haptic(pattern) {

    try {

        if (
            navigator &&
            typeof navigator.vibrate ===
                "function"
        ) {

            navigator.vibrate(pattern);
        }

    } catch (error) {}
}


function hapticBounce() {
    haptic(12);
}


function hapticOrb() {
    haptic(22);
}


function hapticBig() {
    haptic([20, 25, 35]);
}


/* =========================================================
   POINTER POSITION
========================================================= */

function pointerPosition(event) {

    const rect =
        canvas.getBoundingClientRect();

    return {

        x:
            (
                event.clientX -
                rect.left
            ) / scale,

        y:
            (
                event.clientY -
                rect.top
            ) / scale
    };
}


/* =========================================================
   POINTER INPUT
========================================================= */

canvas.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        initAudio();

        try {
            canvas.setPointerCapture(
                event.pointerId
            );
        } catch (error) {}

        const p =
            pointerPosition(event);

        pointerActive = true;

        pointerStartX =
            p.x;

        pointerStartY =
            p.y;

        pointerX =
            p.x;

        pointerY =
            p.y;

        if (
            !game.started ||
            game.gameOver
        ) {

            game.restart();

            return;
        }
    }
);


canvas.addEventListener(
    "pointermove",
    event => {

        if (!pointerActive) {
            return;
        }

        event.preventDefault();

        const p =
            pointerPosition(event);

        pointerX =
            p.x;

        pointerY =
            p.y;
    }
);


canvas.addEventListener(
    "pointerup",
    event => {

        event.preventDefault();

        if (pointerActive) {

            const dx =
                pointerX -
                pointerStartX;

            const dy =
                pointerY -
                pointerStartY;

            if (
                dy > 60 &&
                Math.abs(dy) >
                    Math.abs(dx) * 1.15
            ) {

                diveRequested = true;
            }
        }

        pointerActive = false;
    }
);


canvas.addEventListener(
    "pointercancel",
    () => {

        pointerActive = false;
    }
);


/* =========================================================
   KEYBOARD INPUT
========================================================= */

window.addEventListener(
    "keydown",
    event => {

        const key =
            event.key.toLowerCase();

        if (
            event.key === "ArrowLeft" ||
            key === "a"
        ) {

            keyLeft = true;
        }

        if (
            event.key === "ArrowRight" ||
            key === "d"
        ) {

            keyRight = true;
        }

        if (
            event.key === "ArrowDown"
        ) {

            if (!event.repeat) {
                diveRequested = true;
            }
        }

        if (
            event.code === "Space"
        ) {

            if (
                !event.repeat &&
                (
                    !game.started ||
                    game.gameOver
                )
            ) {

                initAudio();

                game.restart();
            }
        }
    }
);


window.addEventListener(
    "keyup",
    event => {

        const key =
            event.key.toLowerCase();

        if (
            event.key === "ArrowLeft" ||
            key === "a"
        ) {

            keyLeft = false;
        }

        if (
            event.key === "ArrowRight" ||
            key === "d"
        ) {

            keyRight = false;
        }
    }
);


/* =========================================================
   HELPERS
========================================================= */

function clamp(
    value,
    minimum,
    maximum
) {

    return Math.max(
        minimum,
        Math.min(
            maximum,
            value
        )
    );
}


function lerp(
    a,
    b,
    amount
) {

    return (
        a +
        (
            b - a
        ) *
        amount
    );
}


function color(c) {

    return (
        "rgb(" +
        c[0] +
        "," +
        c[1] +
        "," +
        c[2] +
        ")"
    );
}


function rgba(
    c,
    alpha
) {

    return (
        "rgba(" +
        c[0] +
        "," +
        c[1] +
        "," +
        c[2] +
        "," +
        alpha
    );
}


function distance(
    x1,
    y1,
    x2,
    y2
) {

    const dx =
        x1 - x2;

    const dy =
        y1 - y2;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );
}


function roundedRect(
    x,
    y,
    width,
    height,
    radius
) {

    const r =
        Math.min(
            radius,
            width / 2,
            height / 2
        );

    ctx.beginPath();

    ctx.moveTo(
        x + r,
        y
    );

    ctx.lineTo(
        x + width - r,
        y
    );

    ctx.quadraticCurveTo(
        x + width,
        y,
        x + width,
        y + r
    );

    ctx.lineTo(
        x + width,
        y + height - r
    );

    ctx.quadraticCurveTo(
        x + width,
        y + height,
        x + width - r,
        y + height
    );

    ctx.lineTo(
        x + r,
        y + height
    );

    ctx.quadraticCurveTo(
        x,
        y + height,
        x,
        y + height - r
    );

    ctx.lineTo(
        x,
        y + r
    );

    ctx.quadraticCurveTo(
        x,
        y,
        x + r,
        y
    );

    ctx.closePath();

    ctx.fill();
}


/* =========================================================
   PARTICLE
========================================================= */

class Particle {

    constructor(
        x,
        y,
        c,
        power = 1
    ) {

        this.x = x;
        this.y = y;

        const angle =
            Math.random() *
            Math.PI *
            2;

        const speed =
            (
                60 +
                Math.random() * 210
            ) *
            power;

        this.vx =
            Math.cos(angle) *
            speed;

        this.vy =
            Math.sin(angle) *
            speed;

        this.life =
            0.22 +
            Math.random() *
            0.45;

        this.maxLife =
            this.life;

        this.size =
            2 +
            Math.random() *
            4;

        this.color =
            c;
    }


    update(dt) {

        this.x +=
            this.vx *
            dt;

        this.y +=
            this.vy *
            dt;

        this.vy +=
            400 *
            dt;

        this.vx *=
            0.985;

        this.life -=
            dt;
    }


    draw(cameraY) {

        if (
            this.life <= 0
        ) {

            return;
        }

        const alpha =
            this.life /
            this.maxLife;

        ctx.fillStyle =
            rgba(
                this.color,
                alpha
            );

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y + cameraY,
            Math.max(
                1,
                this.size * alpha
            ),
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}


/* =========================================================
   FLOATING TEXT
========================================================= */

class FloatingText {

    constructor(
        text,
        x,
        y,
        colorValue,
        size = 22
    ) {

        this.text = text;

        this.x = x;

        this.y = y;

        this.color =
            colorValue;

        this.size = size;

        this.life = 0.9;

        this.maxLife =
            this.life;

        this.vy = -48;
    }


    update(dt) {

        this.y +=
            this.vy *
            dt;

        this.vy *=
            0.97;

        this.life -=
            dt;
    }


    draw(cameraY) {

        if (
            this.life <= 0
        ) {
            return;
        }

        const alpha =
            clamp(
                this.life /
                    this.maxLife,
                0,
                1
            );

        ctx.save();

        ctx.textAlign =
            "center";

        ctx.font =
            `bold ${this.size}px Arial`;

        ctx.shadowBlur =
            10;

        ctx.shadowColor =
            rgba(
                this.color,
                0.8
            );

        ctx.fillStyle =
            rgba(
                this.color,
                alpha
            );

        ctx.fillText(
            this.text,
            this.x,
            this.y + cameraY
        );

        ctx.restore();
    }
}


/* =========================================================
   PLATFORM
========================================================= */

class Platform {

    constructor(
        x,
        y,
        widthCells = 5,
        moving = false,
        id = 0
    ) {

        this.x = x;

        this.y = y;

        this.widthCells =
            widthCells;

        this.width =
            widthCells * 34;

        this.height = 34;

        this.moving =
            moving;

        this.vx =
            moving
                ? (
                    Math.random() <
                    0.5
                        ? -1
                        : 1
                ) *
                (
                    MOVING_PLATFORM_SPEED_MIN +
                    Math.random() *
                    (
                        MOVING_PLATFORM_SPEED_MAX -
                        MOVING_PLATFORM_SPEED_MIN
                    )
                )
                : 0;

        this.color =
            PLATFORM_COLORS[
                Math.floor(
                    Math.random() *
                    PLATFORM_COLORS.length
                )
            ];

        this.id =
            id;

        this.scored =
            false;
    }


    get left() {

        return (
            this.x -
            this.width / 2
        );
    }


    get right() {

        return (
            this.x +
            this.width / 2
        );
    }


    get top() {

        return (
            this.y -
            this.height / 2
        );
    }


    get bottom() {

        return (
            this.y +
            this.height / 2
        );
    }


    update(
        dt,
        platformSpeed
    ) {

        this.y +=
            platformSpeed *
            dt;

        if (
            this.moving
        ) {

            this.x +=
                this.vx *
                dt;

            const half =
                this.width / 2;

            if (
                this.x - half <
                10
            ) {

                this.x =
                    10 + half;

                this.vx =
                    Math.abs(
                        this.vx
                    );
            }

            if (
                this.x + half >
                WIDTH - 10
            ) {

                this.x =
                    WIDTH -
                    10 -
                    half;

                this.vx =
                    -Math.abs(
                        this.vx
                    );
            }
        }
    }


    draw(cameraY) {

        const sy =
            this.y +
            cameraY;

        if (
            sy < -100 ||
            sy > HEIGHT + 100
        ) {

            return;
        }

        ctx.save();

        ctx.shadowBlur =
            this.moving
                ? 16
                : 10;

        ctx.shadowColor =
            rgba(
                this.color,
                0.38
            );

        ctx.fillStyle =
            color(
                PLATFORM_DARK
            );

        roundedRect(
            this.left,
            sy - this.height / 2 + 5,
            this.width,
            this.height,
            7
        );

        ctx.fillStyle =
            color(
                this.color
            );

        roundedRect(
            this.left,
            sy - this.height / 2,
            this.width,
            this.height,
            7
        );

        ctx.shadowBlur = 0;

        ctx.strokeStyle =
            "rgba(220,250,255,0.72)";

        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.moveTo(
            this.left + 7,
            sy - this.height / 2 + 5
        );

        ctx.lineTo(
            this.right - 7,
            sy - this.height / 2 + 5
        );

        ctx.stroke();

        if (
            this.moving
        ) {

            ctx.fillStyle =
                "rgba(255,255,255,0.8)";

            ctx.beginPath();

            ctx.arc(
                this.x,
                sy,
                3,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }

        ctx.restore();
    }
}


/* =========================================================
   ORB
========================================================= */

class Orb {

    constructor(
        x,
        y,
        type
    ) {

        this.x = x;

        this.y = y;

        this.type =
            type;

        this.radius =
            ORB_RADIUS;

        this.phase =
            Math.random() *
            Math.PI *
            2;

        this.life = 1;
    }


    update(dt) {

        this.phase +=
            dt * 3;

        this.y +=
            game.platformSpeed() *
            dt;
    }


    collect() {

        if (
            this.life <= 0
        ) {

            return;
        }

        this.life = 0;


        /* -------------------------------------------------
           GOLD
        ------------------------------------------------- */

        if (
            this.type ===
            "gold"
        ) {

            game.score +=
                GOLD_ORB_SCORE;

            game.showText(
                "+50",
                this.x,
                this.y,
                GOLD,
                25
            );

            game.addParticles(
                this.x,
                this.y,
                GOLD,
                22,
                1.1
            );

            soundGold();

            hapticOrb();

            return;
        }


        /* -------------------------------------------------
           INVULNERABLE
        ------------------------------------------------- */

        if (
            this.type ===
            "invulnerable"
        ) {

            game.player.invulnerable =
                INVULNERABLE_DURATION;

            game.showText(
                "SAFE!",
                this.x,
                this.y,
                FIRE_GREEN,
                23
            );

            game.addParticles(
                this.x,
                this.y,
                FIRE_GREEN,
                32,
                1.2
            );

            soundPower();

            hapticBig();

            return;
        }


        /* -------------------------------------------------
           GHOST
           WHITE + GOLD HALO
        ------------------------------------------------- */

        if (
            this.type ===
            "ghost"
        ) {

            game.player.ghost =
                GHOST_DURATION;

            game.player.phase =
                0;

            game.player.diving =
                false;

            game.player.vy =
                Math.min(
                    game.player.vy,
                    -GHOST_BOOST
                );

            game.showText(
                "GHOST BOOST!",
                this.x,
                this.y,
                GHOST_GOLD,
                20
            );

            game.addParticles(
                this.x,
                this.y,
                GHOST_GOLD,
                24,
                1.2
            );

            game.addParticles(
                this.x,
                this.y,
                GHOST_WHITE,
                18,
                1.0
            );

            soundGhost();

            hapticBig();

            return;
        }


        /* -------------------------------------------------
           PHASE
           WHITE + RED HALO
        ------------------------------------------------- */

        if (
            this.type ===
            "phase"
        ) {

            game.player.phase =
                PHASE_DURATION;

            game.player.phasePlatformsPassed =
                0;

            game.player.diving =
                false;

            if (
                game.player.vy > 0
            ) {

                game.player.vy =
                    Math.min(
                        game.player.vy,
                        -PHASE_BOOST
                    );
            }

            game.showText(
                "PHASE!",
                this.x,
                this.y,
                PHASE_RED,
                24
            );

            game.addParticles(
                this.x,
                this.y,
                PHASE_RED,
                22,
                1.1
            );

            game.addParticles(
                this.x,
                this.y,
                PHASE_WHITE,
                14,
                0.9
            );

            soundPhase();

            hapticBig();
        }
    }


    draw(cameraY) {

        if (
            this.life <= 0
        ) {

            return;
        }

        const bob =
            Math.sin(
                this.phase
            ) * 5;

        const sy =
            this.y +
            cameraY +
            bob;


        ctx.save();

        ctx.globalCompositeOperation =
            "lighter";


        /* =================================================
           GHOST ORB
           WHITE CORE + GOLD HALO
        ================================================= */

        if (
            this.type ===
            "ghost"
        ) {

            ctx.shadowBlur =
                30;

            ctx.shadowColor =
                "rgba(255,205,55,0.95)";


            const halo =
                ctx.createRadialGradient(
                    this.x,
                    sy,
                    5,
                    this.x,
                    sy,
                    30
                );

            halo.addColorStop(
                0,
                "rgba(255,255,255,0.95)"
            );

            halo.addColorStop(
                0.25,
                "rgba(255,225,100,0.9)"
            );

            halo.addColorStop(
                0.55,
                "rgba(255,190,40,0.45)"
            );

            halo.addColorStop(
                1,
                "rgba(255,190,40,0)"
            );

            ctx.fillStyle =
                halo;

            ctx.beginPath();

            ctx.arc(
                this.x,
                sy,
                30,
                0,
                Math.PI * 2
            );

            ctx.fill();


            ctx.strokeStyle =
                "rgba(255,210,55,0.95)";

            ctx.lineWidth = 3;

            ctx.beginPath();

            ctx.arc(
                this.x,
                sy,
                15,
                0,
                Math.PI * 2
            );

            ctx.stroke();


            const core =
                ctx.createRadialGradient(
                    this.x - 3,
                    sy - 3,
                    1,
                    this.x,
                    sy,
                    this.radius
                );

            core.addColorStop(
                0,
                "#ffffff"
            );

            core.addColorStop(
                0.55,
                "#f8fbff"
            );

            core.addColorStop(
                1,
                "#d8ecff"
            );

            ctx.fillStyle =
                core;

            ctx.beginPath();

            ctx.arc(
                this.x,
                sy,
                this.radius,
                0,
                Math.PI * 2
            );

            ctx.fill();


        /*
         * PHASE ORB
         * WHITE CORE + RED HALO
         */

        } else if (
            this.type ===
            "phase"
        ) {

            ctx.shadowBlur =
                30;

            ctx.shadowColor =
                "rgba(255,55,80,0.95)";


            const halo =
                ctx.createRadialGradient(
                    this.x,
                    sy,
                    4,
                    this.x,
                    sy,
                    29
                );

            halo.addColorStop(
                0,
                "rgba(255,255,255,1)"
            );

            halo.addColorStop(
                0.25,
                "rgba(255,130,140,0.85)"
            );

            halo.addColorStop(
                0.55,
                "rgba(255,50,75,0.45)"
            );

            halo.addColorStop(
                1,
                "rgba(255,40,70,0)"
            );

            ctx.fillStyle =
                halo;

            ctx.beginPath();

            ctx.arc(
                this.x,
                sy,
                29,
                0,
                Math.PI * 2
            );

            ctx.fill();


            ctx.strokeStyle =
                "rgba(255,70,90,0.95)";

            ctx.lineWidth = 3;

            ctx.beginPath();

            ctx.arc(
                this.x,
                sy,
                15,
                0,
                Math.PI * 2
            );

            ctx.stroke();


            ctx.fillStyle =
                "#ffffff";

            ctx.beginPath();

            ctx.arc(
                this.x,
                sy,
                this.radius,
                0,
                Math.PI * 2
            );

            ctx.fill();


        /*
         * SAFETY ORB
         */

        } else if (
            this.type ===
            "invulnerable"
        ) {

            ctx.shadowBlur =
                28;

            ctx.shadowColor =
                "rgba(70,255,185,0.95)";

            const core =
                ctx.createRadialGradient(
                    this.x - 3,
                    sy - 3,
                    1,
                    this.x,
                    sy,
                    this.radius
                );

            core.addColorStop(
                0,
                "#ffffff"
            );

            core.addColorStop(
                0.3,
                "#8affd0"
            );

            core.addColorStop(
                1,
                "#38e89b"
            );

            ctx.fillStyle =
                core;

            ctx.beginPath();

            ctx.arc(
                this.x,
                sy,
                this.radius,
                0,
                Math.PI * 2
            );

            ctx.fill();


        /*
         * GOLD ORB
         */

        } else {

            ctx.shadowBlur =
                28;

            ctx.shadowColor =
                "rgba(255,205,50,0.95)";

            const core =
                ctx.createRadialGradient(
                    this.x - 3,
                    sy - 3,
                    1,
                    this.x,
                    sy,
                    this.radius
                );

            core.addColorStop(
                0,
                "#fffde5"
            );

            core.addColorStop(
                0.3,
                "#ffe978"
            );

            core.addColorStop(
                1,
                "#ffad18"
            );

            ctx.fillStyle =
                core;

            ctx.beginPath();

            ctx.arc(
                this.x,
                sy,
                this.radius,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }


        ctx.fillStyle =
            "rgba(255,255,255,0.98)";

        ctx.beginPath();

        ctx.arc(
            this.x - 3,
            sy - 4,
            3,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();
    }
}


/* =========================================================
   PLAYER
========================================================= */

class Player {

    constructor() {

        this.reset();
    }


    reset() {

        this.x =
            WIDTH / 2;

        this.y =
            575;

        this.previousX =
            this.x;

        this.previousY =
            this.y;

        this.vx = 0;

        this.vy = 0;

        this.radius =
            BALL_RADIUS;

        this.squash = 1;

        this.stretch = 1;

        this.trail = [];

        this.bounces = 0;

        this.diving = false;

        this.invulnerable = 0;

        this.ghost = 0;

        this.phase = 0;

        this.phasePlatformsPassed = 0;

        this.lastPlatform = null;

        this.fireCooldown = 0;
    }


    control(dt) {

        let direction = 0;


        if (
            keyLeft
        ) {

            direction--;
        }

        if (
            keyRight
        ) {

            direction++;
        }


        if (
            pointerActive
        ) {

            const dx =
                pointerX -
                pointerStartX;

            if (
                Math.abs(dx) >
                8
            ) {

                direction =
                    clamp(
                        dx / 70,
                        -1,
                        1
                    );
            }
        }


        this.vx +=
            direction *
            AIR_ACCELERATION *
            dt;

        this.vx *=
            AIR_FRICTION;

        this.vx =
            clamp(
                this.vx,
                -MAX_X_SPEED,
                MAX_X_SPEED
            );


        if (
            diveRequested
        ) {

            diveRequested =
                false;

            if (
                this.vy > 80 &&
                this.ghost <= 0 &&
                this.phase <= 0
            ) {

                this.diving = true;

                this.vy += 180;

                game.showText(
                    "DIVE!",
                    this.x,
                    this.y,
                    [255,120,155],
                    18
                );
            }
        }


        if (
            this.diving &&
            this.vy > 0
        ) {

            this.vy +=
                DIVE_ACCELERATION *
                dt;

            this.vy =
                Math.min(
                    this.vy,
                    MAX_FALL_SPEED
                );
        }
    }


    gravity(dt) {

        this.vy +=
            GRAVITY *
            dt;

        this.vy =
            Math.min(
                this.vy,
                MAX_FALL_SPEED
            );
    }


    move(dt) {

        this.previousX =
            this.x;

        this.previousY =
            this.y;

        this.x +=
            this.vx *
            dt;

        this.y +=
            this.vy *
            dt;
    }


    wallCollision() {

        if (
            this.x -
            this.radius <
            0
        ) {

            this.x =
                this.radius;

            this.vx =
                Math.abs(
                    this.vx
                ) *
                WALL_RESTITUTION;

            game.addParticles(
                this.x,
                this.y,
                [70,220,255],
                8
            );

            game.flow =
                Math.max(
                    0,
                    game.flow - 1
                );

            return true;
        }


        if (
            this.x +
            this.radius >
            WIDTH
        ) {

            this.x =
                WIDTH -
                this.radius;

            this.vx =
                -Math.abs(
                    this.vx
                ) *
                WALL_RESTITUTION;

            game.addParticles(
                this.x,
                this.y,
                [70,220,255],
                8
            );

            game.flow =
                Math.max(
                    0,
                    game.flow - 1
                );

            return true;
        }

        return false;
    }


    updateTimers(dt) {

        if (
            this.invulnerable > 0
        ) {

            this.invulnerable =
                Math.max(
                    0,
                    this.invulnerable - dt
                );
        }


        if (
            this.ghost > 0
        ) {

            this.ghost =
                Math.max(
                    0,
                    this.ghost - dt
                );

            if (
                this.ghost <= 0
            ) {

                game.showText(
                    "SOLID",
                    this.x,
                    this.y,
                    [190,205,220],
                    16
                );
            }
        }


        if (
            this.phase > 0
        ) {

            this.phase =
                Math.max(
                    0,
                    this.phase - dt
                );

            if (
                this.phase <= 0
            ) {

                this.phasePlatformsPassed =
                    0;

                game.showText(
                    "PHASE END",
                    this.x,
                    this.y,
                    [220,220,230],
                    15
                );
            }
        }


        if (
            this.fireCooldown > 0
        ) {

            this.fireCooldown =
                Math.max(
                    0,
                    this.fireCooldown - dt
                );
        }
    }


    updateVisuals() {

        this.squash =
            lerp(
                this.squash,
                1,
                0.18
            );

        this.stretch =
            lerp(
                this.stretch,
                1,
                0.18
            );


        this.trail.push({
            x: this.x,
            y: this.y
        });


        if (
            this.trail.length >
            16
        ) {

            this.trail.shift();
        }
    }


    draw(cameraY) {

        const ghosting =
            this.ghost > 0;

        const phasing =
            this.phase > 0;

        const protectedState =
            this.invulnerable > 0;


        for (
            let i = 0;
            i < this.trail.length;
            i++
        ) {

            const p =
                this.trail[i];

            const progress =
                i /
                Math.max(
                    1,
                    this.trail.length
                );

            let alpha =
                0.05 +
                progress * 0.12;

            if (
                ghosting
            ) {

                alpha *= 1.5;
            }

            if (
                phasing
            ) {

                alpha *= 1.3;
            }

            ctx.fillStyle =
                `rgba(80,210,255,${alpha})`;

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y + cameraY,
                Math.max(
                    2,
                    this.radius *
                    progress
                ),
                0,
                Math.PI * 2
            );

            ctx.fill();
        }


        const width =
            this.radius *
            2 *
            this.squash;

        const height =
            this.radius *
            2 *
            this.stretch;

        const sy =
            this.y +
            cameraY;


        if (
            protectedState
        ) {

            ctx.save();

            ctx.globalCompositeOperation =
                "lighter";

            ctx.shadowBlur =
                26;

            ctx.shadowColor =
                "rgba(80,255,190,0.9)";

            ctx.strokeStyle =
                `rgba(100,255,200,${
                    0.55 +
                    Math.sin(
                        performance.now() *
                        0.01
                    ) * 0.2
                })`;

            ctx.lineWidth = 4;

            ctx.beginPath();

            ctx.arc(
                this.x,
                sy,
                26,
                0,
                Math.PI * 2
            );

            ctx.stroke();

            ctx.restore();
        }


        if (
            ghosting
        ) {

            ctx.save();

            ctx.globalCompositeOperation =
                "lighter";

            ctx.globalAlpha =
                0.7 +
                Math.sin(
                    performance.now() *
                    0.012
                ) * 0.15;

            ctx.shadowBlur =
                30;

            ctx.shadowColor =
                "rgba(255,205,55,0.95)";

            ctx.strokeStyle =
                "rgba(255,210,70,0.95)";

            ctx.lineWidth = 4;

            ctx.beginPath();

            ctx.arc(
                this.x,
                sy,
                25,
                0,
                Math.PI * 2
            );

            ctx.stroke();

            ctx.restore();
        }


        if (
            phasing
        ) {

            ctx.save();

            ctx.globalCompositeOperation =
                "lighter";

            ctx.globalAlpha =
                0.65 +
                Math.sin(
                    performance.now() *
                    0.018
                ) * 0.15;

            ctx.shadowBlur =
                28;

            ctx.shadowColor =
                "rgba(255,55,80,0.95)";

            ctx.strokeStyle =
                "rgba(255,65,85,0.95)";

            ctx.lineWidth = 3;

            ctx.beginPath();

            ctx.arc(
                this.x,
                sy,
                24,
                0,
                Math.PI * 2
            );

            ctx.stroke();

            ctx.restore();
        }


        ctx.save();

        ctx.shadowBlur =
            18;

        if (
            protectedState
        ) {

            ctx.shadowColor =
                "rgba(90,255,190,0.8)";

        } else if (
            ghosting
        ) {

            ctx.shadowColor =
                "rgba(255,205,55,0.95)";

        } else if (
            phasing
        ) {

            ctx.shadowColor =
                "rgba(255,55,80,0.95)";

        } else {

            ctx.shadowColor =
                "rgba(80,220,255,0.65)";
        }


        ctx.fillStyle =
            ghosting ||
            phasing
                ? "#ffffff"
                : "#f5faff";

        ctx.beginPath();

        ctx.ellipse(
            this.x,
            sy,
            width / 2,
            height / 2,
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.shadowBlur = 0;


        if (
            ghosting
        ) {

            ctx.fillStyle =
                "#ffe17a";

        } else if (
            phasing
        ) {

            ctx.fillStyle =
                "#ff9ca7";

        } else if (
            protectedState
        ) {

            ctx.fillStyle =
                "#6affbf";

        } else {

            ctx.fillStyle =
                "#50c8ff";
        }


        ctx.beginPath();

        ctx.ellipse(
            this.x -
                width * 0.18,
            sy -
                height * 0.22,
            Math.max(
                3,
                width * 0.15
            ),
            Math.max(
                3,
                height * 0.12
            ),
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();
    }
}


/* =========================================================
   GAME
========================================================= */

class Game {

    constructor() {

        this.player =
            new Player();

        this.platforms = [];

        this.orbs = [];

        this.particles = [];

        this.texts = [];

        this.cameraY = 0;

        this.score = 0;

        this.bestScore =
            this.loadNumber(
                "bounceBestScore"
            );

        this.height = 0;

        this.bestHeight =
            this.loadNumber(
                "bounceBestHeight"
            );

        this.flow = 0;

        this.maxFlow = 0;

        this.spawnTimer = 0;

        this.nextPlatformY =
            -150;

        this.lastPlatformSide =
            "left";

        this.platformId =
            1;

        this.started = false;

        this.gameOver = false;

        this.shake = 0;

        this.flash = 0;

        this.time = 0;

        this.firePhase = 0;

        this.spawnInitialPlatforms();
    }


    loadNumber(key) {

        try {

            return Number(
                localStorage.getItem(key) ||
                0
            );

        } catch (error) {

            return 0;
        }
    }


    saveNumber(
        key,
        value
    ) {

        try {

            localStorage.setItem(
                key,
                String(value)
            );

        } catch (error) {}
    }


    restart() {

        this.player.reset();

        this.platforms = [];

        this.orbs = [];

        this.particles = [];

        this.texts = [];

        this.cameraY = 0;

        this.score = 0;

        this.height = 0;

        this.flow = 0;

        this.maxFlow = 0;

        this.spawnTimer = 0;

        this.nextPlatformY =
            -150;

        this.lastPlatformSide =
            "left";

        this.platformId =
            1;

        this.gameOver = false;

        this.started = true;

        this.shake = 0;

        this.flash = 0;

        this.spawnInitialPlatforms();

        initAudio();
    }


    difficulty() {

        return clamp(
            this.height / 9000,
            0,
            1
        );
    }


    platformSpeed() {

        return lerp(
            22,
            135,
            this.difficulty()
        );
    }


    spawnInitialPlatforms() {

        this.platforms = [];

        this.platforms.push(
            new Platform(
                WIDTH / 2,
                625,
                6,
                false,
                this.platformId++
            )
        );

        this.platforms.push(
            new Platform(
                105,
                415,
                5,
                false,
                this.platformId++
            )
        );

        this.platforms.push(
            new Platform(
                370,
                195,
                5,
                false,
                this.platformId++
            )
        );

        this.platforms.push(
            new Platform(
                110,
                -25,
                5,
                false,
                this.platformId++
            )
        );

        this.nextPlatformY =
            -245;

        this.lastPlatformSide =
            "left";
    }


    spawnPlatform() {

        const d =
            this.difficulty();


        const previous =
            this.platforms
                .filter(
                    p =>
                        p.y <=
                        this.nextPlatformY +
                        260
                )
                .sort(
                    (a, b) =>
                        b.y -
                        a.y
                )[0];


        let side;

        const centerChance =
            lerp(
                0.08,
                0.20,
                d
            );


        if (
            Math.random() <
            centerChance
        ) {

            side = "center";

        } else {

            side =
                this.lastPlatformSide ===
                    "left"
                    ? "right"
                    : "left";
        }


        let x;


        if (
            side === "left"
        ) {

            x =
                80 +
                Math.random() * 95;

        } else if (
            side === "right"
        ) {

            x =
                WIDTH -
                (
                    80 +
                    Math.random() * 95
                );

        } else {

            x =
                WIDTH / 2 +
                (
                    Math.random() * 140 -
                    70
                );
        }


        if (
            previous
        ) {

            const maximumReach =
                lerp(
                    320,
                    400,
                    d
                );

            const difference =
                x -
                previous.x;

            if (
                Math.abs(difference) >
                maximumReach
            ) {

                x =
                    previous.x +
                    (
                        difference > 0
                            ? maximumReach
                            : -maximumReach
                    );
            }
        }


        x =
            clamp(
                x,
                PLATFORM_SIDE_MARGIN,
                WIDTH -
                    PLATFORM_SIDE_MARGIN
            );


        let widthCells;

        if (
            d < 0.25
        ) {

            widthCells = 5;

        } else if (
            d < 0.55
        ) {

            widthCells =
                Math.random() <
                0.8
                    ? 5
                    : 4;

        } else {

            widthCells =
                [4,4,4,5,3][
                    Math.floor(
                        Math.random() * 5
                    )
                ];
        }


        const moving =
            this.height >=
                MOVING_PLATFORM_HEIGHT &&
            Math.random() <
                lerp(
                    0.22,
                    0.50,
                    d
                );


        const platform =
            new Platform(
                x,
                this.nextPlatformY,
                widthCells,
                moving,
                this.platformId++
            );


        this.platforms.push(
            platform
        );


        if (
            x <
            WIDTH * 0.38
        ) {

            this.lastPlatformSide =
                "left";

        } else if (
            x >
            WIDTH * 0.62
        ) {

            this.lastPlatformSide =
                "right";
        }


        const gap =
            lerp(
                MIN_VERTICAL_GAP,
                MAX_VERTICAL_GAP,
                d
            ) +
            (
                Math.random() *
                24 -
                12
            );


        this.nextPlatformY -=
            gap;


        if (
            previous
        ) {

            this.maybeSpawnOrb(
                previous,
                platform
            );
        }
    }


    maybeSpawnOrb(
        lowerPlatform,
        upperPlatform
    ) {

        const roll =
            Math.random();


        let type;


        if (
            roll < 0.65
        ) {

            type = "gold";

        } else if (
            roll < 0.78
        ) {

            type = "invulnerable";

        } else if (
            roll < 0.90
        ) {

            type = "ghost";

        } else {

            type = "phase";
        }


        const lowerTop =
            lowerPlatform.y -
            lowerPlatform.height / 2;

        const upperBottom =
            upperPlatform.y +
            upperPlatform.height / 2;


        const minY =
            upperBottom + 35;

        const maxY =
            lowerTop - 35;


        if (
            maxY <= minY
        ) {

            return;
        }


        const midpoint =
            (
                lowerPlatform.x +
                upperPlatform.x
            ) / 2;

        let x =
            midpoint +
            (
                Math.random() * 120 -
                60
            );


        x =
            clamp(
                x,
                30,
                WIDTH - 30
            );


        const y =
            minY +
            Math.random() *
            (
                maxY -
                minY
            );


        this.orbs.push(
            new Orb(
                x,
                y,
                type
            )
        );
    }


    addParticles(
        x,
        y,
        c,
        amount,
        power = 1
    ) {

        for (
            let i = 0;
            i < amount;
            i++
        ) {

            this.particles.push(
                new Particle(
                    x,
                    y,
                    c,
                    power
                )
            );
        }
    }


    showText(
        text,
        x,
        y,
        c,
        size
    ) {

        this.texts.push(
            new FloatingText(
                text,
                x,
                y,
                c,
                size
            )
        );
    }


    bounceEffect(
        x,
        y,
        platform,
        type
    ) {

        if (
            type === "corner"
        ) {

            this.addParticles(
                x,
                y,
                GOLD,
                28,
                1.25
            );

            this.shake = 6;

            this.flash =
                0.08;

            hapticBig();

        } else if (
            type === "edge"
        ) {

            this.addParticles(
                x,
                y,
                GOLD,
                20,
                1.1
            );

            this.shake = 4;

            hapticBounce();

        } else if (
            type === "dive"
        ) {

            this.addParticles(
                x,
                y,
                [255,105,150],
                25,
                1.2
            );

            this.shake = 5;

            hapticBig();

        } else if (
            type === "flow"
        ) {

            this.addParticles(
                x,
                y,
                [90,255,220],
                28,
                1.2
            );

            this.shake = 4;

            this.flash =
                0.06;

            hapticBounce();

        } else {

            this.addParticles(
                x,
                y,
                platform.color,
                15,
                0.9
            );

            this.shake = 2;

            hapticBounce();
        }

        soundBounce();
    }


    /* =====================================================
       PLATFORM COLLISION
    ===================================================== */

    collidePlatform(
        player,
        platform
    ) {

        if (
            player.ghost > 0
        ) {

            return false;
        }


        const left =
            platform.left;

        const right =
            platform.right;

        const top =
            platform.top;

        const bottom =
            platform.bottom;


        const closestX =
            clamp(
                player.x,
                left,
                right
            );

        const closestY =
            clamp(
                player.y,
                top,
                bottom
            );

        const dx =
            player.x -
            closestX;

        const dy =
            player.y -
            closestY;


        if (
            dx * dx +
            dy * dy >
            player.radius *
            player.radius
        ) {

            return false;
        }


        const wasAbove =
            player.previousY +
            player.radius <=
            top + 5;

        const wasBelow =
            player.previousY -
            player.radius >=
            bottom - 5;

        const wasLeft =
            player.previousX +
            player.radius <=
            left + 5;

        const wasRight =
            player.previousX -
            player.radius >=
            right - 5;


        let nx = 0;
        let ny = 0;


        if (
            player.vy > 0 &&
            wasAbove
        ) {

            ny = -1;

        } else if (
            player.vy < 0 &&
            wasBelow
        ) {

            ny = 1;

        } else if (
            wasLeft
        ) {

            nx = -1;

        } else if (
            wasRight
        ) {

            nx = 1;

        } else {

            const distances = [

                {
                    value:
                        Math.abs(
                            player.x -
                            left
                        ),
                    nx: -1,
                    ny: 0
                },

                {
                    value:
                        Math.abs(
                            player.x -
                            right
                        ),
                    nx: 1,
                    ny: 0
                },

                {
                    value:
                        Math.abs(
                            player.y -
                            top
                        ),
                    nx: 0,
                    ny: -1
                },

                {
                    value:
                        Math.abs(
                            player.y -
                            bottom
                        ),
                    nx: 0,
                    ny: 1
                }
            ];

            distances.sort(
                (a, b) =>
                    a.value -
                    b.value
            );

            nx =
                distances[0].nx;

            ny =
                distances[0].ny;
        }


        /*
         * PHASE:
         *
         * Phase is consumed only when passing
         * downward through the top of a platform.
         */

        if (
            player.phase > 0 &&
            ny === -1 &&
            player.vy > 0 &&
            wasAbove
        ) {

            player.phasePlatformsPassed++;

            player.phase = 0;

            player.y =
                bottom +
                player.radius +
                2;

            player.vy =
                Math.max(
                    player.vy,
                    220
                );

            game.showText(
                "PHASED!",
                player.x,
                player.y,
                PHASE_RED,
                17
            );

            game.addParticles(
                player.x,
                top,
                PHASE_RED,
                18,
                0.9
            );

            return false;
        }


        const relativeVx =
            player.vx -
            platform.vx;

        const relativeVy =
            player.vy;


        const into =
            relativeVx * nx +
            relativeVy * ny;


        if (
            into >= 0
        ) {

            return false;
        }


        /*
         * Separate the player.
         */

        if (
            ny === -1
        ) {

            player.y =
                top -
                player.radius;

        } else if (
            ny === 1
        ) {

            player.y =
                bottom +
                player.radius;

        } else if (
            nx === -1
        ) {

            player.x =
                left -
                player.radius;

        } else if (
            nx === 1
        ) {

            player.x =
                right +
                player.radius;
        }


        /*
         * TOP LANDING
         */

        if (
            ny === -1
        ) {

            let power =
                BOUNCE_POWER;

            const wasDive =
                player.diving;


            if (
                wasDive
            ) {

                power =
                    DIVE_BOUNCE_POWER;
            }


            player.vy =
                -power;

            player.vx *=
                PLATFORM_RESTITUTION;

            player.squash =
                1.38;

            player.stretch =
                0.68;

            player.bounces++;

            player.diving =
                false;


            if (
                !platform.scored
            ) {

                platform.scored =
                    true;

                this.scorePlatform(
                    platform,
                    wasDive
                );
            }


            return true;
        }


        /*
         * UNDERSIDE HIT
         *
         * Instead of producing a strong
         * upward rebound, cancel the upward
         * momentum and give the player only
         * a small downward bounce.
         */

        if (
            ny === 1
        ) {

            player.vx *=
                0.92;

            player.vy =
                UNDERSIDE_BOUNCE_POWER;

            player.diving =
                false;

            player.squash =
                1.12;

            player.stretch =
                0.88;

            this.flow =
                Math.max(
                    0,
                    this.flow - 1
                );

            this.addParticles(
                player.x,
                player.y,
                platform.color,
                10,
                0.7
            );

            this.shake = 2;

            hapticBounce();

            return true;
        }


        /*
         * SIDE HIT
         */

        if (
            nx !== 0
        ) {

            player.vx =
                -player.vx *
                PLATFORM_RESTITUTION;

            player.vy *=
                0.96;

            player.squash =
                1.16;

            player.stretch =
                0.86;

            this.flow =
                Math.max(
                    0,
                    this.flow - 1
                );

            this.addParticles(
                player.x,
                player.y,
                platform.color,
                9,
                0.7
            );

            return true;
        }


        return false;
    }


    /* =====================================================
       PLATFORM SCORE
    ===================================================== */

    scorePlatform(
        platform,
        wasDive
    ) {

        const centerDistance =
            Math.abs(
                this.player.x -
                platform.x
            );

        const edgeDistance =
            platform.width / 2 -
            centerDistance;


        let landingType =
            "normal";


        if (
            edgeDistance <
            20
        ) {

            landingType =
                "edge";
        }


        const clean =
            Math.abs(
                this.player.vx
            ) < 340;


        if (
            clean
        ) {

            this.flow =
                clamp(
                    this.flow + 1,
                    0,
                    10
                );

        } else {

            this.flow =
                Math.max(
                    0,
                    this.flow - 1
                );
        }


        this.maxFlow =
            Math.max(
                this.maxFlow,
                this.flow
            );


        let points = 100;


        if (
            landingType ===
            "edge"
        ) {

            points += 50;
        }


        if (
            wasDive
        ) {

            points += 100;
        }


        const multiplier =
            1 +
            Math.max(
                0,
                this.flow - 1
            ) *
            0.15;


        points *=
            multiplier;


        const finalPoints =
            Math.floor(points);


        this.score +=
            finalPoints;


        if (
            this.flow >= 2
        ) {

            this.showText(
                `FLOW x${this.flow}`,
                this.player.x,
                this.player.y - 28,
                [95,245,210],
                17
            );
        }


        this.bounceEffect(
            this.player.x,
            this.player.y,
            platform,
            wasDive
                ? "dive"
                : this.flow >= 3
                    ? "flow"
                    : landingType
        );
    }


    /* =====================================================
       ORB COLLISION
    ===================================================== */

    collideOrbs() {

        for (
            const orb of
            this.orbs
        ) {

            if (
                orb.life <= 0
            ) {

                continue;
            }


            if (
                distance(
                    this.player.x,
                    this.player.y,
                    orb.x,
                    orb.y
                ) <
                this.player.radius +
                orb.radius +
                5
            ) {

                orb.collect();
            }
        }
    }


    /* =====================================================
       BOTTOM HAZARD
    ===================================================== */

    fireCollision() {

        const screenY =
            this.player.y +
            this.cameraY;


        const fireTop =
            HEIGHT -
            FIRE_HEIGHT;


        if (
            screenY +
            this.player.radius <
            fireTop
        ) {

            return false;
        }


        if (
            this.player.fireCooldown > 0
        ) {

            return false;
        }


        /*
         * INVULNERABLE:
         *
         * Safety still protects the player.
         */

        if (
            this.player.invulnerable >
            0
        ) {

            this.player.y =
                fireTop -
                this.cameraY -
                this.player.radius -
                3;


            this.player.vy =
                -Math.max(
                    720,
                    Math.min(
                        1100,
                        Math.abs(
                            this.player.vy
                        ) *
                        0.82
                    )
                );


            this.player.diving =
                false;


            this.player.squash =
                1.45;

            this.player.stretch =
                0.62;


            this.player.fireCooldown =
                0.28;


            this.addParticles(
                this.player.x,
                fireTop -
                    this.cameraY,
                FIRE_GREEN,
                32,
                1.3
            );


            this.addParticles(
                this.player.x,
                fireTop -
                    this.cameraY,
                FIRE_BLUE,
                22,
                1.1
            );


            this.showText(
                "SAVED!",
                this.player.x,
                fireTop -
                    this.cameraY -
                    25,
                FIRE_GREEN,
                24
            );


            this.shake = 7;

            this.flash =
                0.10;

            soundFireSave();

            hapticBig();


            this.player.invulnerable =
                0;

            return true;
        }


        /*
         * Ghost and phase DO NOT protect
         * against fire. They only affect
         * platform collision.
         */

        this.die();

        return true;
    }


    /* =====================================================
       CAMERA
    ===================================================== */

    updateCamera(dt) {

        const screenY =
            this.player.y +
            this.cameraY;


        if (
            screenY <
            CAMERA_TARGET_Y
        ) {

            const target =
                CAMERA_TARGET_Y -
                this.player.y;


            this.cameraY =
                lerp(
                    this.cameraY,
                    target,
                    Math.min(
                        1,
                        dt *
                        CAMERA_FOLLOW_SPEED
                    )
                );
        }


        this.cameraY =
            Math.max(
                this.cameraY,
                0
            );
    }


    /* =====================================================
       EFFECTS
    ===================================================== */

    updateEffects(dt) {

        for (
            let i =
                this.particles.length - 1;
            i >= 0;
            i--
        ) {

            const particle =
                this.particles[i];

            particle.update(dt);

            if (
                particle.life <= 0
            ) {

                this.particles.splice(
                    i,
                    1
                );
            }
        }


        for (
            let i =
                this.texts.length - 1;
            i >= 0;
            i--
        ) {

            const text =
                this.texts[i];

            text.update(dt);

            if (
                text.life <= 0
            ) {

                this.texts.splice(
                    i,
                    1
                );
            }
        }
    }


    /* =====================================================
       REALISTIC NEON FLAMES
    ===================================================== */

    drawFire() {

        const top =
            HEIGHT -
            FIRE_HEIGHT;


        /*
         * Soft colored glow above the flames.
         */

        const danger =
            ctx.createLinearGradient(
                0,
                top - 45,
                0,
                HEIGHT
            );

        danger.addColorStop(
            0,
            "rgba(20,170,255,0)"
        );

        danger.addColorStop(
            0.35,
            "rgba(35,220,190,0.06)"
        );

        danger.addColorStop(
            0.72,
            "rgba(35,220,190,0.13)"
        );

        danger.addColorStop(
            1,
            "rgba(10,95,125,0.30)"
        );

        ctx.fillStyle =
            danger;

        ctx.fillRect(
            0,
            top - 45,
            WIDTH,
            FIRE_HEIGHT + 45
        );


        /*
         * Base glow beneath the flames.
         */

        ctx.save();

        ctx.globalCompositeOperation =
            "lighter";

        ctx.shadowBlur =
            24;

        ctx.shadowColor =
            "rgba(45,225,190,0.65)";

        const base =
            ctx.createLinearGradient(
                0,
                top,
                0,
                HEIGHT
            );

        base.addColorStop(
            0,
            "rgba(70,255,200,0.55)"
        );

        base.addColorStop(
            0.35,
            "rgba(35,220,210,0.35)"
        );

        base.addColorStop(
            1,
            "rgba(20,130,180,0.20)"
        );

        ctx.fillStyle =
            base;

        ctx.fillRect(
            0,
            top + 7,
            WIDTH,
            FIRE_HEIGHT
        );


        /*
         * Individual organic flames.
         *
         * The flames use layered Bézier curves
         * rather than sharp repeating spikes,
         * giving the bottom edge a softer,
         * more natural fire silhouette.
         */

        const flameCount = 31;

        for (
            let i = 0;
            i < flameCount;
            i++
        ) {

            const x =
                (
                    i + 0.5
                ) *
                WIDTH /
                flameCount;

            const wave =
                Math.sin(
                    this.firePhase * 4.8 +
                    i * 1.73
                );

            const wave2 =
                Math.sin(
                    this.firePhase * 7.1 -
                    i * 0.91
                );

            const width =
                18 +
                (
                    5 +
                    wave * 3
                );

            const height =
                20 +
                (
                    wave2 + 1
                ) *
                7 +
                (
                    i % 3
                ) * 4;

            const baseY =
                HEIGHT + 4;

            const tipY =
                top +
                5 -
                height;

            const lean =
                wave * 7;

            const outerGradient =
                ctx.createLinearGradient(
                    0,
                    tipY,
                    0,
                    baseY
                );

            outerGradient.addColorStop(
                0,
                "rgba(105,255,215,0.05)"
            );

            outerGradient.addColorStop(
                0.20,
                "rgba(75,255,205,0.55)"
            );

            outerGradient.addColorStop(
                0.58,
                "rgba(40,220,205,0.78)"
            );

            outerGradient.addColorStop(
                1,
                "rgba(20,135,180,0.70)"
            );

            ctx.fillStyle =
                outerGradient;

            ctx.beginPath();

            ctx.moveTo(
                x - width,
                baseY
            );

            ctx.bezierCurveTo(
                x - width * 0.95,
                baseY - height * 0.35,
                x - width * 0.62,
                top + height * 0.28,
                x - width * 0.18 + lean,
                top + 8
            );

            ctx.bezierCurveTo(
                x - width * 0.05 + lean,
                top - height * 0.05,
                x + width * 0.12 + lean,
                tipY + height * 0.30,
                x + lean,
                tipY
            );

            ctx.bezierCurveTo(
                x + width * 0.15 + lean,
                tipY + height * 0.35,
                x + width * 0.62,
                top + height * 0.26,
                x + width * 0.72,
                top + 9
            );

            ctx.bezierCurveTo(
                x + width * 0.95,
                baseY - height * 0.28,
                x + width,
                baseY - height * 0.12,
                x + width,
                baseY
            );

            ctx.closePath();

            ctx.fill();


            /*
             * Inner, brighter flame tongue.
             */

            const innerHeight =
                height *
                (
                    0.42 +
                    (
                        wave + 1
                    ) *
                    0.07
                );

            const innerTip =
                baseY -
                innerHeight;

            const innerGradient =
                ctx.createLinearGradient(
                    0,
                    innerTip,
                    0,
                    baseY
                );

            innerGradient.addColorStop(
                0,
                "rgba(210,255,245,0.82)"
            );

            innerGradient.addColorStop(
                0.28,
                "rgba(105,255,220,0.88)"
            );

            innerGradient.addColorStop(
                0.72,
                "rgba(45,230,210,0.65)"
            );

            innerGradient.addColorStop(
                1,
                "rgba(30,170,195,0.25)"
            );

            ctx.fillStyle =
                innerGradient;

            ctx.beginPath();

            ctx.moveTo(
                x - width * 0.48,
                baseY
            );

            ctx.bezierCurveTo(
                x - width * 0.42,
                baseY - innerHeight * 0.35,
                x - width * 0.20,
                innerTip + innerHeight * 0.30,
                x + lean * 0.45,
                innerTip
            );

            ctx.bezierCurveTo(
                x + width * 0.16,
                innerTip + innerHeight * 0.35,
                x + width * 0.40,
                baseY - innerHeight * 0.25,
                x + width * 0.48,
                baseY
            );

            ctx.closePath();

            ctx.fill();
        }


        /*
         * Irregular glowing flame crest.
         * This blends neighboring flames together
         * so the fire reads as one continuous body.
         */

        const crest =
            ctx.createLinearGradient(
                0,
                top - 12,
                0,
                top + 22
            );

        crest.addColorStop(
            0,
            "rgba(150,255,225,0.08)"
        );

        crest.addColorStop(
            0.5,
            "rgba(70,255,210,0.55)"
        );

        crest.addColorStop(
            1,
            "rgba(35,200,195,0.25)"
        );

        ctx.fillStyle =
            crest;

        ctx.beginPath();

        for (
            let x = 0;
            x <= WIDTH;
            x += 5
        ) {

            const wave =
                Math.sin(
                    x * 0.055 +
                    this.firePhase * 4.6
                ) * 5;

            const wave2 =
                Math.sin(
                    x * 0.117 -
                    this.firePhase * 6.3
                ) * 3;

            const y =
                top +
                8 +
                wave +
                wave2;

            if (
                x === 0
            ) {

                ctx.moveTo(
                    x,
                    y
                );

            } else {

                ctx.lineTo(
                    x,
                    y
                );
            }
        }

        ctx.lineTo(
            WIDTH,
            top + 22
        );

        ctx.lineTo(
            0,
            top + 22
        );

        ctx.closePath();

        ctx.fill();


        /*
         * Small floating embers.
         */

        for (
            let i = 0;
            i < 22;
            i++
        ) {

            const x =
                (
                    i * 97 +
                    31
                ) %
                WIDTH;

            const motion =
                (
                    this.firePhase *
                    (
                        18 +
                        i % 5 * 4
                    ) +
                    i * 19
                ) %
                42;

            const sway =
                Math.sin(
                    this.firePhase * 3 +
                    i
                ) * 4;

            const y =
                top -
                4 -
                motion;

            const alpha =
                clamp(
                    0.52 -
                    motion / 100,
                    0.08,
                    0.52
                );

            ctx.fillStyle =
                i % 2 === 0
                    ? `rgba(80,255,210,${alpha})`
                    : `rgba(45,190,255,${alpha})`;

            ctx.beginPath();

            ctx.arc(
                x + sway,
                y,
                1.2 +
                    (
                        i % 3
                    ) * 0.6,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }

        ctx.restore();


        /*
         * Very subtle lower edge glow.
         */

        ctx.save();

        ctx.strokeStyle =
            "rgba(40,175,235,0.34)";

        ctx.lineWidth = 2;

        ctx.shadowBlur =
            10;

        ctx.shadowColor =
            "rgba(40,190,240,0.45)";

        ctx.beginPath();

        ctx.moveTo(
            0,
            HEIGHT - 2
        );

        ctx.lineTo(
            WIDTH,
            HEIGHT - 2
        );

        ctx.stroke();

        ctx.restore();


        ctx.save();

        ctx.textAlign =
            "center";

        ctx.font =
            "bold 10px Arial";

        ctx.fillStyle =
            "rgba(160,245,225,0.42)";

        ctx.fillText(
            "DANGER",
            WIDTH / 2,
            HEIGHT - 7
        );

        ctx.restore();
    }


    /* =====================================================
       BACKGROUND
    ===================================================== */

    background() {

        const gradient =
            ctx.createLinearGradient(
                0,
                0,
                0,
                HEIGHT
            );

        gradient.addColorStop(
            0,
            "#050812"
        );

        gradient.addColorStop(
            0.55,
            "#08101e"
        );

        gradient.addColorStop(
            1,
            "#0d1725"
        );

        ctx.fillStyle =
            gradient;

        ctx.fillRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );


        for (
            let i = 0;
            i < 80;
            i++
        ) {

            const x =
                (
                    i * 83
                ) %
                WIDTH;

            const y =
                (
                    i * 137 +
                    Math.floor(
                        this.cameraY *
                        0.15
                    )
                ) %
                HEIGHT;

            const brightness =
                0.18 +
                (
                    i % 4
                ) * 0.07;

            ctx.fillStyle =
                `rgba(120,170,210,${
                    brightness
                })`;

            ctx.fillRect(
                x,
                y,
                1,
                1
            );
        }
    }


    /* =====================================================
       HUD
    ===================================================== */

    hud() {

        ctx.save();

        ctx.textAlign =
            "center";


        ctx.font =
            "bold 38px Arial";

        ctx.fillStyle =
            color(WHITE);

        ctx.fillText(
            this.score.toLocaleString(),
            WIDTH / 2,
            48
        );


        ctx.font =
            "14px Arial";

        ctx.fillStyle =
            "rgba(160,180,200,0.85)";

        ctx.fillText(
            "SCORE",
            WIDTH / 2,
            68
        );


        ctx.font =
            "bold 20px Arial";

        ctx.fillStyle =
            "rgba(220,235,250,0.95)";

        ctx.fillText(
            `HEIGHT ${this.height.toLocaleString()}`,
            WIDTH / 2,
            96
        );


        if (
            this.flow >= 2
        ) {

            ctx.font =
                "bold 22px Arial";

            ctx.fillStyle =
                this.flow >= 7
                    ? "#ffe16a"
                    : "#62f5d0";

            ctx.shadowBlur =
                12;

            ctx.shadowColor =
                this.flow >= 7
                    ? "rgba(255,220,80,0.7)"
