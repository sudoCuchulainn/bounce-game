    /* =====================================================
       UPDATE
    ===================================================== */

    update(dt) {

        this.time +=
            dt;

        this.firePhase +=
            dt;


        if (
            this.gameOver
        ) {

            this.updateEffects(dt);

            this.shake =
                Math.max(
                    0,
                    this.shake -
                    dt * 18
                );

            return;
        }


        this.player.updateTimers(
            dt
        );


        this.player.control(
            dt
        );


        const speed =
            this.platformSpeed();


        for (
            const platform of
            this.platforms
        ) {

            platform.update(
                dt,
                speed
            );
        }


        for (
            const orb of
            this.orbs
        ) {

            orb.update(dt);
        }


        const subDt =
            dt /
            PHYSICS_STEPS;


        for (
            let i = 0;
            i < PHYSICS_STEPS;
            i++
        ) {

            this.player.gravity(
                subDt
            );

            this.player.move(
                subDt
            );


            this.player.wallCollision();


            for (
                const platform of
                this.platforms
            ) {

                if (
                    this.collidePlatform(
                        this.player,
                        platform
                    )
                ) {

                    break;
                }
            }


            this.collideOrbs();


            this.fireCollision();


            if (
                this.gameOver
            ) {

                break;
            }
        }


        this.updateCamera(
            dt
        );


        const currentHeight =
            Math.max(
                0,
                Math.floor(
                    575 -
                    this.player.y
                )
            );


        if (
            currentHeight >
            this.height
        ) {

            this.height =
                currentHeight;
        }


        if (
            this.height >
            this.bestHeight
        ) {

            this.bestHeight =
                this.height;

            this.saveNumber(
                "bounceBestHeight",
                this.bestHeight
            );
        }


        if (
            this.score >
            this.bestScore
        ) {

            this.bestScore =
                this.score;

            this.saveNumber(
                "bounceBestScore",
                this.bestScore
            );
        }


        this.spawnTimer +=
            dt;


        while (
            this.spawnTimer >=
            0.55
        ) {

            this.spawnTimer -=
                0.55;

            this.spawnPlatform();
        }


        const despawnY =
            -this.cameraY +
            HEIGHT +
            260;


        this.platforms =
            this.platforms.filter(
                platform =>
                    platform.y <
                    despawnY
            );


        this.orbs =
            this.orbs.filter(
                orb =>
                    orb.life > 0 &&
                    orb.y <
                        despawnY
            );


        this.updateEffects(
            dt
        );


        this.player.updateVisuals();


        this.shake =
            Math.max(
                0,
                this.shake -
                dt * 20
            );


        this.flash =
            Math.max(
                0,
                this.flash -
                dt
            );
    }


    /* =====================================================
       DEATH
    ===================================================== */

    die() {

        if (
            this.gameOver
        ) {

            return;
        }


        this.gameOver =
            true;


        this.bestScore =
            Math.max(
                this.bestScore,
                this.score
            );

        this.bestHeight =
            Math.max(
                this.bestHeight,
                this.height
            );


        this.saveNumber(
            "bounceBestScore",
            this.bestScore
        );

        this.saveNumber(
            "bounceBestHeight",
            this.bestHeight
        );


        this.addParticles(
            this.player.x,
            this.player.y,
            [70,220,255],
            55,
            1.4
        );


        this.addParticles(
            this.player.x,
            this.player.y,
            FIRE_GREEN,
            20,
            1.1
        );


        this.shake = 12;

        soundDeath();

        haptic([35,30,50]);
    }


    /* =====================================================
       DRAW
    ===================================================== */

    draw() {

        ctx.save();

        ctx.setTransform(
            scale,
            0,
            0,
            scale,
            0,
            0
        );


        this.background();


        for (
            const platform of
            this.platforms
        ) {

            platform.draw(
                this.cameraY
            );
        }


        for (
            const orb of
            this.orbs
        ) {

            orb.draw(
                this.cameraY
            );
        }


        for (
            const particle of
            this.particles
        ) {

            particle.draw(
                this.cameraY
            );
        }


        this.player.draw(
            this.cameraY
        );


        for (
            const floatingText of
            this.texts
        ) {

            floatingText.draw(
                this.cameraY
            );
        }


        this.drawFire();


        if (
            this.started
        ) {

            this.hud();
        }


        if (
            !this.started
        ) {

            this.startScreen();
        }


        if (
            this.gameOver
        ) {

            this.gameOverScreen();
        }


        if (
            this.flash > 0
        ) {

            ctx.fillStyle =
                `rgba(255,255,255,${
                    this.flash
                })`;

            ctx.fillRect(
                0,
                0,
                WIDTH,
                HEIGHT
            );
        }


        ctx.restore();
    }
}


/* =========================================================
   START GAME
========================================================= */

const game =
    new Game();


/* =========================================================
   GAME LOOP
========================================================= */

let lastTime =
    performance.now();


function loop(now) {

    let dt =
        (
            now -
            lastTime
        ) /
        1000;


    lastTime =
        now;


    dt =
        Math.min(
            dt,
            0.025
        );


    game.update(dt);


    if (
        game.shake > 0
    ) {

        const sx =
            (
                Math.random() *
                2 -
                1
            ) *
            game.shake;

        const sy =
            (
                Math.random() *
                2 -
                1
            ) *
            game.shake;


        ctx.save();

        ctx.setTransform(
            scale,
            0,
            0,
            scale,
            sx * scale,
            sy * scale
        );


        game.draw();

        ctx.restore();

    } else {

        game.draw();
    }


    requestAnimationFrame(
        loop
    );
}


requestAnimationFrame(
    loop
);
