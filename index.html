<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d", { alpha: false });

const WIDTH = 480;
const HEIGHT = 800;

let scale = 1;

function resize() {
    scale = Math.min(
        window.innerWidth / WIDTH,
        window.innerHeight / HEIGHT
    );

    canvas.width = Math.max(1, Math.floor(WIDTH * scale));
    canvas.height = Math.max(1, Math.floor(HEIGHT * scale));

    canvas.style.width = `${WIDTH * scale}px`;
    canvas.style.height = `${HEIGHT * scale}px`;
}

window.addEventListener("resize", resize, { passive: true });
resize();


/* =========================================================
   COLORS
========================================================= */

const WHITE = [245, 250, 255];

const PLATFORM_COLORS = [
    [70, 220, 255],
    [185, 100, 255],
    [255, 215, 80],
    [90, 255, 180],
    [255, 105, 150],
    [100, 150, 255]
];

const PLATFORM_DARK = [24, 40, 65];

const GOLD = [255, 211, 55];
const GHOST_WHITE = [245, 250, 255];
const GHOST_GOLD = [255, 205, 55];
const PHASE_WHITE = [250, 250, 255];
const PHASE_RED = [255, 70, 90];
const FIRE_GREEN = [55, 255, 155];
const FIRE_BLUE = [40, 190, 255];


/* =========================================================
   PHYSICS
========================================================= */

const GRAVITY = 1500;
const BOUNCE_POWER = 980;
const DIVE_BOUNCE_POWER = 1320;
const UNDERSIDE_BOUNCE_POWER = 250;

const DIVE_ACCELERATION = 2200;
const AIR_ACCELERATION = 1900;
const AIR_FRICTION = 0.985;
const MAX_X_SPEED = 450;
const WALL_RESTITUTION = 0.90;
const PLATFORM_RESTITUTION = 0.97;

/* =========================================================
   PLATFORM GENERATION
========================================================= */

const MIN_VERTICAL_GAP = 190;
const MAX_VERTICAL_GAP = 225;
const PLATFORM_SIDE_MARGIN = 58;


/* =========================================================
   CAMERA
========================================================= */

const CAMERA_TARGET_Y = 330;
const CAMERA_FOLLOW_SPEED = 7;


/* =========================================================
   MOVING PLATFORMS
========================================================= */

const MOVING_PLATFORM_HEIGHT = 1800;
const MOVING_PLATFORM_SPEED_MIN = 35;
const MOVING_PLATFORM_SPEED_MAX = 85;


/* =========================================================
   ORBS
========================================================= */

const GOLD_ORB_SCORE = 50;
const INVULNERABLE_DURATION = 4.5;
const GHOST_DURATION = 0.45;
const PHASE_DURATION = 0.35;
const GHOST_BOOST = 620;
const PHASE_BOOST = 220;
const ORB_RADIUS = 10;


/* =========================================================
   FIRE
========================================================= */

const FIRE_HEIGHT = 48;


/* =========================================================
   INPUT
========================================================= */

let keyLeft = false;
let keyRight = false;

let pointerActive = false;
let pointerStartX = 0;
let pointerStartY = 0;
let pointerX = 0;
let pointerY = 0;

let diveRequested = false;

const TUTORIAL_DURATION = 15.5;


/* =========================================================
   AUDIO
========================================================= */

let audioContext = null;
let masterGain = null;

function initAudio() {
    try {
        if (!audioContext) {
            const AudioContextClass =
                window.AudioContext ||
                window.webkitAudioContext;

            if (!AudioContextClass) return;

            audioContext = new AudioContextClass();

            masterGain = audioContext.createGain();
            masterGain.gain.value = 0.055;
            masterGain.connect(audioContext.destination);
        }

        if (audioContext.state === "suspended") {
            audioContext.resume().catch(() => {});
        }
    } catch (error) {}
}

function tone(
    frequency,
    duration,
    type = "sine",
    volume = 0.5,
    slide = 0
) {
    try {
        if (!audioContext || !masterGain) return;

        const now = audioContext.currentTime;

        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.type = type;

        oscillator.frequency.setValueAtTime(
            frequency,
            now
        );

        if (slide !== 0) {
            oscillator.frequency.linearRampToValueAtTime(
                Math.max(20, frequency + slide),
                now + duration
            );
        }

        gain.gain.setValueAtTime(0.0001, now);

        gain.gain.exponentialRampToValueAtTime(
            Math.max(0.0001, volume),
            now + 0.008
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            now + duration
        );

        oscillator.connect(gain);
        gain.connect(masterGain);

        oscillator.start(now);
        oscillator.stop(now + duration + 0.02);
    } catch (error) {}
}

function soundBounce() {
    tone(180, 0.07, "sine", 0.7, 90);
}

function soundGold() {
    tone(650, 0.08, "sine", 0.7, 250);

    setTimeout(() => {
        tone(900, 0.10, "sine", 0.5, 200);
    }, 35);
}

function soundPower() {
    tone(350, 0.12, "triangle", 0.7, 500);

    setTimeout(() => {
        tone(900, 0.18, "triangle", 0.55, 350);
    }, 60);
}

function soundGhost() {
    tone(500, 0.16, "sine", 0.45, -250);

    setTimeout(() => {
        tone(250, 0.20, "sine", 0.35, 300);

}

function soundPhase() {
    tone(280, 0.10, "triangle", 0.45, 300);

    setTimeout(() => {

}

function soundFireSave() {

    setTimeout(() => {

}

function soundDeath() {
    tone(160, 0.25, "sawtooth", 0.45, -100);
}

/* New: perfect landing sound */
function soundPerfect() {

    setTimeout(() => {

/* =========================================================
   HAPTICS
========================================================= */

function haptic(pattern) {
    try {
        if (
            navigator &&
            typeof navigator.vibrate === "function"
        ) {
            navigator.vibrate(pattern);
        }
    } catch (error) {}
}

function hapticBounce() {
    haptic(12);
}

function hapticOrb() {
    haptic(22);
}

function hapticBig() {
    haptic([20, 25, 35]);
}


/* =========================================================
   POINTER
========================================================= */

function pointerPosition(event) {
    const rect = canvas.getBoundingClientRect();

    return {
        x: (event.clientX - rect.left) / scale,
        y: (event.clientY - rect.top) / scale
    };
}

canvas.addEventListener("pointerdown", event => {
    event.preventDefault();

    initAudio();

    try {
        canvas.setPointerCapture(event.pointerId);
    } catch (error) {}

    const p = pointerPosition(event);

    pointerActive = true;

    pointerStartX = p.x;
    pointerStartY = p.y;

    pointerX = p.x;
    pointerY = p.y;

    if (game.tutorialActive) {
        game.skipTutorial();
        return;
    }

    if (!game.started || game.gameOver) {
        game.restart();
        return;
    }
});

canvas.addEventListener("pointermove", event => {
    if (!pointerActive) return;

    event.preventDefault();

    const p = pointerPosition(event);

    pointerX = p.x;
    pointerY = p.y;
});

canvas.addEventListener("pointerup", event => {
    event.preventDefault();

    if (pointerActive) {
        const dx = pointerX - pointerStartX;
        const dy = pointerY - pointerStartY;

        if (
            dy > 60 &&
            Math.abs(dy) > Math.abs(dx) * 1.15
        ) {
            diveRequested = true;
        }
    }

    pointerActive = false;
});

canvas.addEventListener("pointercancel", () => {
    pointerActive = false;
});


/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener("keydown", event => {
    const key = event.key.toLowerCase();

    if (event.key === "ArrowLeft" || key === "a") {
        keyLeft = true;
    }

    if (event.key === "ArrowRight" || key === "d") {
        keyRight = true;
    }

    if (event.key === "ArrowDown") {
        if (!event.repeat) {
            diveRequested = true;
        }
    }

    if (event.code === "Space") {
        if (!event.repeat) {
            initAudio();

            if (game.tutorialActive) {
                game.skipTutorial();
            } else if (!game.started || game.gameOver) {
                game.restart();
            }
        }
    }
});

window.addEventListener("keyup", event => {
    const key = event.key.toLowerCase();

    if (event.key === "ArrowLeft" || key === "a") {
        keyLeft = false;
    }

    if (event.key === "ArrowRight" || key === "d") {
        keyRight = false;
    }
});


/* =========================================================
   HELPERS
========================================================= */

function clamp(value, minimum, maximum) {
    return Math.max(
        minimum,
        Math.min(maximum, value)
    );
}

function lerp(a, b, amount) {
    return a + (b - a) * amount;
}

function color(c) {
    return `rgb(${c[0]},${c[1]},${c[2]})`;
}

function rgba(c, alpha) {
    return `rgba(${c[0]},${c[1]},${c[2]},${alpha})`;
}

function distance(x1, y1, x2, y2) {
    const dx = x1 - x2;
    const dy = y1 - y2;

    return Math.sqrt(dx * dx + dy * dy);
}

function roundedRect(x, y, width, height, radius) {
    const r = Math.min(
        radius,
        width / 2,
        height / 2
    );

    ctx.beginPath();

    ctx.moveTo(x + r, y);
    ctx.lineTo(x + width - r, y);

    ctx.quadraticCurveTo(
        x + width,
        y,
        x + width,
        y + r
    );

    ctx.lineTo(
        x + width,
        y + height - r
    );

    ctx.quadraticCurveTo(
        x + width,
        y + height,
        x + width - r,
        y + height
    );

    ctx.lineTo(x + r, y + height);

    ctx.quadraticCurveTo(
        x,
        y + height,
        x,
        y + height - r
    );

    ctx.lineTo(x, y + r);

    ctx.quadraticCurveTo(
        x,
        y,
        x + r,
        y
    );

    ctx.closePath();
    ctx.fill();
}


/* =========================================================
   PARTICLE
========================================================= */

class Particle {
    constructor(x, y, c, power = 1) {
        this.x = x;
        this.y = y;

        const angle = Math.random() * Math.PI * 2;

        const speed =
            (60 + Math.random() * 210) * power;

        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;

        this.life = 0.22 + Math.random() * 0.45;
        this.maxLife = this.life;

        this.size = 2 + Math.random() * 4;
        this.color = c;
    }

    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;

        this.vy += 400 * dt;
        this.vx *= 0.985;

        this.life -= dt;
    }

    draw(cameraY) {
        if (this.life <= 0) return;

        const alpha = this.life / this.maxLife;

        ctx.fillStyle = rgba(this.color, alpha);

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y + cameraY,
            Math.max(1, this.size * alpha),
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}


/* =========================================================
   FLOATING TEXT
========================================================= */

class FloatingText {
    constructor(text, x, y, colorValue, size = 22) {
        this.text = text;
        this.x = x;
        this.y = y;
        this.color = colorValue;
        this.size = size;

        this.life = 0.9;
        this.maxLife = this.life;

        this.vy = -48;
    }

    update(dt) {
        this.y += this.vy * dt;
        this.vy *= 0.97;
        this.life -= dt;
    }

    draw(cameraY) {
        if (this.life <= 0) return;

        const alpha = clamp(
            this.life / this.maxLife,
            0,
            1
        );

        ctx.save();

        ctx.textAlign = "center";
        ctx.font = `bold ${this.size}px Arial`;

        ctx.shadowBlur = 10;
        ctx.shadowColor = rgba(this.color, 0.8);

        ctx.fillStyle = rgba(
            this.color,
            alpha
        );

        ctx.fillText(
            this.text,
            this.x,
            this.y + cameraY
        );

        ctx.restore();
    }
}


/* =========================================================
   PLATFORM
========================================================= */

class Platform {
    constructor(
        x,
        y,
        widthCells = 5,
        moving = false,
        id = 0
    ) {
        this.x = x;
        this.y = y;

        this.widthCells = widthCells;
        this.width = widthCells * 34;
        this.height = 34;

        this.moving = moving;

        this.vx = moving
            ? (
                Math.random() < 0.5 ? -1 : 1
            ) * (
                MOVING_PLATFORM_SPEED_MIN +
                Math.random() *
                (
                    MOVING_PLATFORM_SPEED_MAX -
                    MOVING_PLATFORM_SPEED_MIN
                )
            )
            : 0;

        this.color =
            PLATFORM_COLORS[
                Math.floor(
                    Math.random() *
                    PLATFORM_COLORS.length
                )
            ];

        this.id = id;
        this.scored = false;
    }

    get left() {
        return this.x - this.width / 2;
    }

    get right() {
        return this.x + this.width / 2;
    }

    get top() {
        return this.y - this.height / 2;
    }

    get bottom() {
        return this.y + this.height / 2;
    }

    update(dt, platformSpeed) {
        this.y += platformSpeed * dt;

        if (this.moving) {
            this.x += this.vx * dt;

            const half = this.width / 2;

            if (this.x - half < 10) {
                this.x = 10 + half;
                this.vx = Math.abs(this.vx);
            }

            if (this.x + half > WIDTH - 10) {
                this.x = WIDTH - 10 - half;
                this.vx = -Math.abs(this.vx);
            }
        }
    }

    draw(cameraY) {
        const sy = this.y + cameraY;

        if (
            sy < -100 ||
            sy > HEIGHT + 100
        ) {
            return;
        }

        ctx.save();

        ctx.shadowBlur = this.moving ? 16 : 10;
        ctx.shadowColor = rgba(this.color, 0.38);

        ctx.fillStyle = color(PLATFORM_DARK);

        roundedRect(
            this.left,
            sy - this.height / 2 + 5,
            this.width,
            this.height,
            7
        );

        ctx.fillStyle = color(this.color);

        roundedRect(
            this.left,
            sy - this.height / 2,
            this.width,
            this.height,
            7
        );

        ctx.shadowBlur = 0;

        ctx.strokeStyle = "rgba(220,250,255,0.72)";
        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.moveTo(
            this.left + 7,
            sy - this.height / 2 + 5
        );

        ctx.lineTo(
            this.right - 7,
            sy - this.height / 2 + 5
        );

        ctx.stroke();

        if (this.moving) {
            ctx.fillStyle = "rgba(255,255,255,0.8)";

            ctx.beginPath();

            ctx.arc(
                this.x,
                sy,
                3,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }

        ctx.restore();
    }
}


/* =========================================================
   ORB
========================================================= */

class Orb {
    constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.type = type;

        this.radius = ORB_RADIUS;

        this.phase =
            Math.random() * Math.PI * 2;

        this.life = 1;
    }

    update(dt) {
        this.phase += dt * 3;
        this.y += game.platformSpeed() * dt;
    }

    collect() {
        if (this.life <= 0) return;

        this.life = 0;

        if (this.type === "gold") {
            game.score += GOLD_ORB_SCORE;

            game.showText(
                "+50",
                this.x,
                this.y,
                GOLD,
                25
            );

            game.addParticles(
                this.x,
                this.y,
                GOLD,
                22,
                1.1
            );

            soundGold();
            hapticOrb();

            return;
        }

        if (this.type === "invulnerable") {
            game.player.invulnerable =
                INVULNERABLE_DURATION;

            game.showText(
                "SAFE!",
                this.x,
                this.y,
                FIRE_GREEN,
                23
            );

            game.addParticles(
                this.x,
                this.y,
                FIRE_GREEN,
                32,
                1.2
            );

            soundPower();
            hapticBig();

            return;
        }

        if (this.type === "ghost") {
            game.player.ghost = GHOST_DURATION;
            game.player.phase = 0;
            game.player.diving = false;

            game.player.vy = -700;

            game.showText(
                "GHOST BOOST!",
                this.x,
                this.y,
                GHOST_GOLD,
                20
            );

            game.addParticles(
                this.x,
                this.y,
                GHOST_GOLD,
                24,
                1.2
            );

            game.addParticles(
                this.x,
                this.y,
                GHOST_WHITE,
                18,
                1.0
            );

            soundGhost();
            hapticBig();

            return;
        }

        if (this.type === "phase") {
            game.flow = 0;
            game.player.invulnerable = 0;
            game.player.phase = PHASE_DURATION;
            game.player.phasePlatformsPassed = 0;
            game.player.diving = false;

            if (game.player.vy > 0) {
                game.player.vy = Math.min(
                    game.player.vy,
                    -PHASE_BOOST
                );
            }

            game.showText(
                "PHASE!",
                this.x,
                this.y,
                PHASE_RED,
                24
            );

            game.addParticles(
                this.x,
                this.y,
                PHASE_RED,
                22,
                1.1
            );

            game.addParticles(
                this.x,
                this.y,
                PHASE_WHITE,
                14,
                0.9
            );

            soundPhase();
            hapticBig();
        }
    }

    draw(cameraY) {
        if (this.life <= 0) return;

        const bob = Math.sin(this.phase) * 5;
        const sy = this.y + cameraY + bob;

        ctx.save();
        ctx.globalCompositeOperation = "lighter";

        if (this.type === "ghost") {
            ctx.shadowBlur = 30;
            ctx.shadowColor = "rgba(255,205,55,0.95)";

            const halo = ctx.createRadialGradient(
                this.x,
                sy,
                5,
                this.x,
                sy,
                30
            );

            halo.addColorStop(0, "rgba(255,255,255,0.95)");
            halo.addColorStop(0.25, "rgba(255,225,100,0.9)");
            halo.addColorStop(0.55, "rgba(255,190,40,0.45)");
            halo.addColorStop(1, "rgba(255,190,40,0)");

            ctx.fillStyle = halo;

            ctx.beginPath();
            ctx.arc(this.x, sy, 30, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = "rgba(255,210,55,0.95)";
            ctx.lineWidth = 3;

            ctx.beginPath();
            ctx.arc(this.x, sy, 15, 0, Math.PI * 2);
            ctx.stroke();

            const core = ctx.createRadialGradient(
                this.x - 3,
                sy - 3,
                1,
                this.x,
                sy,
                this.radius
            );

            core.addColorStop(0, "#ffffff");
            core.addColorStop(0.55, "#f8fbff");
            core.addColorStop(1, "#d8ecff");

            ctx.fillStyle = core;

            ctx.beginPath();
            ctx.arc(
                this.x,
                sy,
                this.radius,
                0,
                Math.PI * 2
            );
            ctx.fill();

        } else if (this.type === "phase") {
            ctx.shadowBlur = 30;
            ctx.shadowColor = "rgba(255,55,80,0.95)";

            const halo = ctx.createRadialGradient(
                this.x,
                sy,
                4,
                this.x,
                sy,
                29
            );

            halo.addColorStop(0, "rgba(255,255,255,1)");
            halo.addColorStop(0.25, "rgba(255,130,140,0.85)");
            halo.addColorStop(0.55, "rgba(255,50,75,0.45)");
            halo.addColorStop(1, "rgba(255,40,70,0)");

            ctx.fillStyle = halo;

            ctx.beginPath();
            ctx.arc(this.x, sy, 29, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = "rgba(255,70,90,0.95)";
            ctx.lineWidth = 3;

            ctx.beginPath();
            ctx.arc(this.x, sy, 15, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = "#ffffff";

            ctx.beginPath();
            ctx.arc(
                this.x,
                sy,
                this.radius,
                0,
                Math.PI * 2
            );
            ctx.fill();

        } else if (this.type === "invulnerable") {
            ctx.shadowBlur = 28;
            ctx.shadowColor = "rgba(70,255,185,0.95)";

            const core = ctx.createRadialGradient(
                this.x - 3,
                sy - 3,
                1,
                this.x,
                sy,
                this.radius
            );

            core.addColorStop(0, "#ffffff");
            core.addColorStop(0.3, "#8affd0");
            core.addColorStop(1, "#38e89b");

            ctx.fillStyle = core;

            ctx.beginPath();
            ctx.arc(
                this.x,
                sy,
                this.radius,
                0,
                Math.PI * 2
            );
            ctx.fill();

        } else {
            ctx.shadowBlur = 28;
            ctx.shadowColor = "rgba(255,205,50,0.95)";

            const core = ctx.createRadialGradient(
                this.x - 3,
                sy - 3,
                1,
                this.x,
                sy,
                this.radius
            );

            core.addColorStop(0, "#fffde5");
            core.addColorStop(0.3, "#ffe978");
            core.addColorStop(1, "#ffad18");

            ctx.fillStyle = core;

            ctx.beginPath();
            ctx.arc(
                this.x,
                sy,
                this.radius,
                0,
                Math.PI * 2
            );
            ctx.fill();
        }

        ctx.fillStyle = "rgba(255,255,255,0.98)";

        ctx.beginPath();

        ctx.arc(
            this.x - 3,
            sy - 4,
            3,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();
    }
}


/* =========================================================
   PLAYER
========================================================= */

class Player {
    constructor() {
        this.reset();
    }

    reset() {
        this.x = WIDTH / 2;
        this.y = 575;

        this.previousX = this.x;
        this.previousY = this.y;

        this.vx = 0;
        this.vy = 0;

        this.radius = BALL_RADIUS;

        this.squash = 1;
        this.stretch = 1;

        this.trail = [];

        this.bounces = 0;
        this.diving = false;

        this.invulnerable = 0;
        this.ghost = 0;
        this.phase = 0;

        this.phasePlatformsPassed = 0;
        this.lastPlatform = null;
        this.fireCooldown = 0;
    }

    control(dt) {
        let direction = 0;

        if (keyLeft) direction--;
        if (keyRight) direction++;

        if (pointerActive) {
            const dx = pointerX - pointerStartX;

            if (Math.abs(dx) > 8) {
                direction = clamp(
                    dx / 70,
                    -1,
                    1
                );
            }
        }

        this.vx +=
            direction *
            AIR_ACCELERATION *
            dt;

        this.vx *= AIR_FRICTION;

        this.vx = clamp(
            this.vx,
            -MAX_X_SPEED,
            MAX_X_SPEED
        );

        if (diveRequested) {
            diveRequested = false;

            if (
                this.vy > 80 &&
                this.ghost <= 0 &&
                this.phase <= 0
            ) {
                this.diving = true;
                this.vy += 180;

                game.showText(
                    "DIVE!",
                    this.x,
                    this.y,
                    [255,120,155],
                    18
                );
            }
        }

        if (this.diving && this.vy > 0) {
            this.vy +=
                DIVE_ACCELERATION *
                dt;

            this.vy = Math.min(
                this.vy,
                MAX_FALL_SPEED
            );
        }
    }

    gravity(dt) {
        this.vy += GRAVITY * dt;

        this.vy = Math.min(
            this.vy,
            MAX_FALL_SPEED
        );
    }

    move(dt) {
        this.previousX = this.x;
        this.previousY = this.y;

        this.x += this.vx * dt;
        this.y += this.vy * dt;
    }

    wallCollision() {
        if (this.x - this.radius < 0) {
            this.x = this.radius;

            this.vx =
                Math.abs(this.vx) *
                WALL_RESTITUTION;

            game.addParticles(
                this.x,
                this.y,
                [70,220,255],
                8
            );

            game.flow = Math.max(
                0,
                game.flow - 1
            );

            return true;
        }

        if (this.x + this.radius > WIDTH) {
            this.x = WIDTH - this.radius;

            this.vx =
                -Math.abs(this.vx) *
                WALL_RESTITUTION;

            game.addParticles(
                this.x,
                this.y,
                [70,220,255],
                8
            );

            game.flow = Math.max(
                0,
                game.flow - 1
            );

            return true;
        }

        return false;
    }

    updateTimers(dt) {
        if (this.invulnerable > 0) {
            this.invulnerable = Math.max(
                0,
                this.invulnerable - dt
            );
        }

        if (this.ghost > 0) {
            this.ghost = Math.max(
                0,
                this.ghost - dt
            );

            if (this.ghost <= 0) {
                game.showText(
                    "SOLID",
                    this.x,
                    this.y,
                    [190,205,220],
                    16
                );
            }
        }

        if (this.phase > 0) {
            this.phase = Math.max(
                0,
                this.phase - dt
            );

            if (this.phase <= 0) {
                this.phasePlatformsPassed = 0;

                game.showText(
                    "PHASE END",
                    this.x,
                    this.y,
                    [220,220,230],
                    15
                );
            }
        }

        if (this.fireCooldown > 0) {
            this.fireCooldown = Math.max(
                0,
                this.fireCooldown - dt
            );
        }
    }

    updateVisuals() {
        this.squash = lerp(
            this.squash,
            1,
            0.18
        );

        this.stretch = lerp(
            this.stretch,
            1,
            0.18
        );

        this.trail.push({
            x: this.x,
            y: this.y
        });

        if (this.trail.length > 16) {
            this.trail.shift();
        }
    }

    draw(cameraY) {
        const ghosting = this.ghost > 0;
        const phasing = this.phase > 0;
        const protectedState = this.invulnerable > 0;

        /*
         * Flow trail.
         *
         * Normal flow stays cyan.
         * Higher flow becomes brighter and more energetic.
         */

        const flow = game.flow;

        let trailColor;

        if (flow >= 8) {
            trailColor = [255, 215, 80];
        } else if (flow >= 5) {
            trailColor = [100, 255, 220];
        } else if (flow >= 2) {
            trailColor = [80, 230, 255];
        } else {
            trailColor = [80, 210, 255];
        }

        for (
            let i = 0;
            i < this.trail.length;
            i++
        ) {
            const p = this.trail[i];

            const progress =
                i /
                Math.max(
                    1,
                    this.trail.length
                );

            let alpha =
                0.05 +
                progress * 0.12;

            if (ghosting) alpha *= 1.5;
            if (phasing) alpha *= 1.3;

            if (flow >= 2) {
                alpha *=
                    1 +
                    Math.min(
                        flow,
                        10
                    ) *
                    0.055;
            }

            ctx.fillStyle =
                rgba(
                    trailColor,
                    Math.min(
                        0.85,
                        alpha
                    )
                );

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y + cameraY,
                Math.max(
                    2,
                    this.radius * progress
                ),
                0,
                Math.PI * 2
            );

            ctx.fill();
        }

        /*
         * Extra high-flow streaks.
         */

        if (flow >= 5) {
            ctx.save();

            ctx.globalCompositeOperation = "lighter";

            const streakAlpha =
                0.10 +
                Math.min(flow, 10) * 0.012;

            for (
                let i = 0;
                i < 5;
                i++
            ) {
                const index =
                    Math.max(
                        0,
                        this.trail.length -
                        1 -
                        i * 3
                    );

                const p = this.trail[index];

                if (!p) continue;

                ctx.fillStyle =
                    rgba(
                        trailColor,
                        streakAlpha
                    );

                ctx.beginPath();

                ctx.arc(
                    p.x,
                    p.y + cameraY,
                    3 +
                        (
                            5 -
                            i
                        ) * 1.5,
                    0,
                    Math.PI * 2
                );

                ctx.fill();
            }

            ctx.restore();
        }

        const width =
            this.radius *
            2 *
            this.squash;

        const height =
            this.radius *
            2 *
            this.stretch;

        const sy =
            this.y +
            cameraY;

        if (protectedState) {
            ctx.save();

            ctx.globalCompositeOperation = "lighter";

            ctx.shadowBlur = 26;
            ctx.shadowColor =
                "rgba(80,255,190,0.9)";

            ctx.strokeStyle =
                `rgba(100,255,200,${
                    0.55 +
                    Math.sin(
                        performance.now() *
                        0.01
                    ) * 0.2
                })`;

            ctx.lineWidth = 4;

            ctx.beginPath();

            ctx.arc(
                this.x,
                sy,
                26,
                0,
                Math.PI * 2
            );

            ctx.stroke();

            ctx.restore();
        }

        if (ghosting) {
            ctx.save();

            ctx.globalCompositeOperation = "lighter";

            ctx.globalAlpha =
                0.7 +
                Math.sin(
                    performance.now() *
                    0.012
                ) * 0.15;

            ctx.shadowBlur = 30;
            ctx.shadowColor =
                "rgba(255,205,55,0.95)";

            ctx.strokeStyle =
                "rgba(255,210,70,0.95)";

            ctx.lineWidth = 4;

            ctx.beginPath();

            ctx.arc(
                this.x,
                sy,
                25,
                0,
                Math.PI * 2
            );

            ctx.stroke();

            ctx.restore();
        }

        if (phasing) {
            ctx.save();

            ctx.globalCompositeOperation = "lighter";

            ctx.globalAlpha =
                0.65 +
                Math.sin(
                    performance.now() *
                    0.018
                ) * 0.15;

            ctx.shadowBlur = 28;
            ctx.shadowColor =
                "rgba(255,55,80,0.95)";

            ctx.strokeStyle =
                "rgba(255,65,85,0.95)";

            ctx.lineWidth = 3;

            ctx.beginPath();

            ctx.arc(
                this.x,
                sy,
                24,
                0,
                Math.PI * 2
            );

            ctx.stroke();

            ctx.restore();
        }

        ctx.save();

        ctx.shadowBlur = 18;

        if (protectedState) {
            ctx.shadowColor =
                "rgba(90,255,190,0.8)";
        } else if (ghosting) {
            ctx.shadowColor =
                "rgba(255,205,55,0.95)";
        } else if (phasing) {
            ctx.shadowColor =
                "rgba(255,55,80,0.95)";
        } else if (flow >= 8) {
            ctx.shadowColor =
                "rgba(255,215,80,0.9)";
        } else if (flow >= 5) {
            ctx.shadowColor =
                "rgba(90,255,220,0.85)";
        } else {
            ctx.shadowColor =
                "rgba(80,220,255,0.65)";
        }

        ctx.fillStyle =
            ghosting || phasing
                ? "#ffffff"
                : "#f5faff";

        ctx.beginPath();

        ctx.ellipse(
            this.x,
            sy,
            width / 2,
            height / 2,
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.shadowBlur = 0;

        if (ghosting) {
            ctx.fillStyle = "#ffe17a";
        } else if (phasing) {
            ctx.fillStyle = "#ff9ca7";
        } else if (protectedState) {
            ctx.fillStyle = "#6affbf";
        } else if (flow >= 8) {
            ctx.fillStyle = "#ffe16a";
        } else if (flow >= 5) {
            ctx.fillStyle = "#72ffd0";
        } else {
            ctx.fillStyle = "#50c8ff";
        }

        ctx.beginPath();

        ctx.ellipse(
            this.x - width * 0.18,
            sy - height * 0.22,
            Math.max(3, width * 0.15),
            Math.max(3, height * 0.12),
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();
    }
}


/* =========================================================
   GAME
========================================================= */

class Game {
    constructor() {
        this.player = new Player();

        this.platforms = [];
        this.orbs = [];
        this.particles = [];
        this.texts = [];

        this.cameraY = 0;

        this.score = 0;
        this.bestScore =
            this.loadNumber("bounceBestScore");

        this.height = 0;
        this.bestHeight =
            this.loadNumber("bounceBestHeight");

        this.flow = 0;
        this.maxFlow = 0;

        this.spawnTimer = 0;
        this.nextPlatformY = -150;

        this.lastPlatformSide = "left";
        this.platformId = 1;

        this.started = false;
        this.gameOver = false;

        this.tutorialActive = !this.loadFlag("bounceTutorialSeen");
        this.tutorialTime = 0;

        this.shake = 0;
        this.flash = 0;

        this.time = 0;
        this.firePhase = 0;

        this.spawnInitialPlatforms();
    }

    loadNumber(key) {
        try {
            return Number(
                localStorage.getItem(key) || 0
            );
        } catch (error) {
            return 0;
        }
    }

    loadFlag(key) {
        try {
            return localStorage.getItem(key) === "1";
        } catch (error) {
            return false;
        }
    }

    saveFlag(key) {
        try {
            localStorage.setItem(key, "1");
        } catch (error) {}
    }

    saveNumber(key, value) {
        try {
            localStorage.setItem(
                key,
                String(value)
            );
        } catch (error) {}
    }

    skipTutorial() {
        if (!this.tutorialActive) return;

        this.tutorialActive = false;
        this.tutorialTime = 0;
        this.saveFlag("bounceTutorialSeen");
        this.restart();
    }

    updateTutorial(dt) {
        this.tutorialTime += dt;

        if (this.tutorialTime >= TUTORIAL_DURATION) {
            this.skipTutorial();
        }
    }

    tutorialScreen() {
        const t = this.tutorialTime;
        const phase = Math.min(6, Math.floor(t / 2.35));
        const local = t % 2.35;

        ctx.save();
        ctx.fillStyle = "rgba(3,7,14,0.96)";
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        ctx.textAlign = "center";
        ctx.font = "bold 13px Arial";
        ctx.fillStyle = "rgba(170,195,215,0.72)";
        ctx.fillText("FIRST RUN · QUICK TUTORIAL", WIDTH / 2, 42);

        ctx.font = "bold 34px Arial";
        ctx.fillStyle = WHITE;
        ctx.fillText("LEARN THE FLOW", WIDTH / 2, 88);

        ctx.font = "15px Arial";
        ctx.fillStyle = "rgba(185,205,220,0.82)";
        ctx.fillText("Watch one ideal run. Then you play.", WIDTH / 2, 116);

        const stages = [
            ["DRAG", "Drag left and right to steer.", "#50dcff"],
            ["DIVE", "Swipe down while falling to dive.", "#ff789c"],
            ["GHOST", "Hit a ghost for a straight-up boost.", "#ffe06a"],
            ["SAFE", "Grab safety. Fire cannot kill you.", "#72ffc2"],
            ["FLOW 10", "Clean landings build Flow to 10.", "#ffd85a"],
            ["MASTER", "Perfect. Edge. Ghost. Dive. Keep climbing.", "#ffd85a"],
            ["DEATH", "Eventually, the fire wins. Your run begins.", "#ff7888"]
        ];

        const title = stages[Math.min(phase, stages.length - 1)];
        ctx.font = "bold 22px Arial";
        ctx.fillStyle = title[2];
        ctx.fillText(title[0], WIDTH / 2, 154);
        ctx.font = "14px Arial";
        ctx.fillStyle = "rgba(225,235,245,0.9)";
        ctx.fillText(title[1], WIDTH / 2, 178);

        const floorY = 650;
        ctx.strokeStyle = "rgba(60,190,230,0.25)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(50, floorY);
        ctx.lineTo(WIDTH - 50, floorY);
        ctx.stroke();

        const p = this.tutorialPlayerPosition(phase, local);
        this.drawTutorialPlatform(80, floorY, 145);
        this.drawTutorialPlatform(315, floorY - 115, 120);
        this.drawTutorialPlatform(155, floorY - 235, 125);
        this.drawTutorialPlatform(335, floorY - 355, 100);

        if (phase === 2) {
            this.drawTutorialOrb(235, 420, "ghost");
        }
        if (phase === 3) {
            this.drawTutorialOrb(235, 420, "invulnerable");
        }

        if (phase >= 4 && phase <= 5) {
            for (let i = 0; i < 10; i++) {
                const x = 145 + i * 21;
                ctx.fillStyle = i < Math.min(10, Math.floor((local / 2.35) * 10) + 5) ? "#ffd85a" : "rgba(255,215,90,0.12)";
                ctx.beginPath();
                ctx.arc(x, 220, 5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        if (phase >= 6) {
            const fireY = 690;
            ctx.fillStyle = "rgba(40,220,200,0.28)";
            ctx.fillRect(0, fireY, WIDTH, HEIGHT - fireY);
            ctx.fillStyle = "rgba(255,70,90,0.9)";
            ctx.fillRect(0, fireY, WIDTH, 3);
        }

        this.drawTutorialPlayer(p.x, p.y, phase);

        ctx.font = "bold 15px Arial";
        ctx.fillStyle = "rgba(240,250,255,0.9)";
        ctx.fillText("TAP OR PRESS SPACE TO SKIP", WIDTH / 2, 748);
        ctx.font = "12px Arial";
        ctx.fillStyle = "rgba(145,170,190,0.65)";
        ctx.fillText("The tutorial plays once on this device.", WIDTH / 2, 772);
        ctx.restore();
    }

    tutorialPlayerPosition(phase, local) {
        const u = local / 2.35;
        const points = [
            { x: 145, y: 620 },
            { x: 360, y: 505 },
            { x: 235, y: 390 },
            { x: 245, y: 300 },
            { x: 155, y: 240 },
            { x: 340, y: 160 },
            { x: 240, y: 640 }
        ];
        const a = points[Math.min(phase, points.length - 1)];
        const b = points[Math.min(phase + 1, points.length - 1)];
        return {
            x: lerp(a.x, b.x, u),
            y: lerp(a.y, b.y, u)
        };
    }

    drawTutorialPlatform(x, y, width) {
        ctx.save();
        ctx.shadowBlur = 12;
        ctx.shadowColor = "rgba(70,220,255,0.32)";
        ctx.fillStyle = "#183047";
        roundedRect(x - width / 2, y - 14, width, 28, 7);
        ctx.fillStyle = "#46dcff";
        roundedRect(x - width / 2, y - 18, width, 10, 5);
        ctx.restore();
    }

    drawTutorialOrb(x, y, type) {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        ctx.shadowBlur = 28;
        ctx.shadowColor = type === "ghost" ? "rgba(255,205,55,0.9)" : "rgba(70,255,185,0.9)";
        ctx.fillStyle = type === "ghost" ? "#ffe06a" : "#72ffc2";
        ctx.beginPath();
        ctx.arc(x, y, 11, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    drawTutorialPlayer(x, y, phase) {
        ctx.save();
        ctx.shadowBlur = phase >= 4 ? 32 : 20;
        ctx.shadowColor = phase >= 4 ? "rgba(255,215,80,0.9)" : "rgba(80,220,255,0.7)";
        ctx.fillStyle = phase >= 4 ? "#ffe16a" : "#f5faff";
        ctx.beginPath();
        ctx.arc(x, y, 17, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    restart() {
        this.player.reset();

        this.platforms = [];
        this.orbs = [];
        this.particles = [];
        this.texts = [];

        this.cameraY = 0;
        this.score = 0;
        this.height = 0;

        this.flow = 0;
        this.maxFlow = 0;

        this.spawnTimer = 0;
        this.nextPlatformY = -150;

        this.lastPlatformSide = "left";
        this.platformId = 1;

        this.gameOver = false;
        this.started = true;

        this.shake = 0;
        this.flash = 0;

        this.spawnInitialPlatforms();

        initAudio();
    }

    difficulty() {
        return clamp(
            this.height / 9000,
            0,
            1
        );
    }

    platformSpeed() {
        return lerp(
            22,
            135,
            this.difficulty()
        );
    }

    spawnInitialPlatforms() {
        this.platforms = [];

        this.platforms.push(
            new Platform(
                WIDTH / 2,
                625,
                6,
                false,
                this.platformId++
            )
        );

        this.platforms.push(
            new Platform(
                105,
                415,
                5,
                false,
                this.platformId++
            )
        );

        this.platforms.push(
            new Platform(
                370,
                195,
                5,
                false,
                this.platformId++
            )
        );

        this.platforms.push(
            new Platform(
                110,
                -25,
                5,
                false,
                this.platformId++
            )
        );

        this.nextPlatformY = -245;
        this.lastPlatformSide = "left";
    }

    spawnPlatform() {
        const d = this.difficulty();

        const previous =
            this.platforms
                .filter(
                    p =>
                        p.y <=
                        this.nextPlatformY +
                        260
                )
                .sort(
                    (a, b) =>
                        b.y - a.y
                )[0];

        let side;

        const centerChance =
            lerp(
                0.08,
                0.20,
                d
            );

        if (Math.random() < centerChance) {
            side = "center";
        } else {
            side =
                this.lastPlatformSide === "left"
                    ? "right"
                    : "left";
        }

        let x;

        if (side === "left") {
            x =
                80 +
                Math.random() * 95;
        } else if (side === "right") {
            x =
                WIDTH -
                (
                    80 +
                    Math.random() * 95
                );
        } else {
            x =
                WIDTH / 2 +
                (
                    Math.random() * 140 -
                    70
                );
        }

        if (previous) {
            const maximumReach =
                lerp(
                    320,
                    400,
                    d
                );

            const difference =
                x - previous.x;

            if (
                Math.abs(difference) >
                maximumReach
            ) {
                x =
                    previous.x +
                    (
                        difference > 0
                            ? maximumReach
                            : -maximumReach
                    );
            }
        }

        x = clamp(
            x,
            PLATFORM_SIDE_MARGIN,
            WIDTH - PLATFORM_SIDE_MARGIN
        );

        let widthCells;

        if (d < 0.25) {
            widthCells = 5;
        } else if (d < 0.55) {
            widthCells =
                Math.random() < 0.8
                    ? 5
                    : 4;
        } else {
            widthCells =
                [4,4,4,5,3][
                    Math.floor(
                        Math.random() * 5
                    )
                ];
        }

        const moving =
            this.height >= MOVING_PLATFORM_HEIGHT &&
            Math.random() <
                lerp(
                    0.22,
                    0.50,
                    d
                );

        const platform =
            new Platform(
                x,
                this.nextPlatformY,
                widthCells,
                moving,
                this.platformId++
            );

        this.platforms.push(platform);

        if (x < WIDTH * 0.38) {
            this.lastPlatformSide = "left";
        } else if (x > WIDTH * 0.62) {
            this.lastPlatformSide = "right";
        }

        const gap =
            lerp(
                MIN_VERTICAL_GAP,
                MAX_VERTICAL_GAP,
                d
            ) +
            (
                Math.random() * 24 -
                12
            );

        this.nextPlatformY -= gap;

        if (previous) {
            this.maybeSpawnOrb(
                previous,
                platform
            );
        }
    }

    maybeSpawnOrb(
        lowerPlatform,
        upperPlatform
    ) {
        const roll = Math.random();

        let type;

        if (roll < 0.65) {
            type = "gold";
        } else if (roll < 0.78) {
            type = "invulnerable";
        } else if (roll < 0.90) {
            type = "ghost";
        } else {
            type = "phase";
        }

        const lowerTop =
            lowerPlatform.y -
            lowerPlatform.height / 2;

        const upperBottom =
            upperPlatform.y +
            upperPlatform.height / 2;

        const minY =
            upperBottom + 35;

        const maxY =
            lowerTop - 35;

        if (maxY <= minY) {
            return;
        }

        const midpoint =
            (
                lowerPlatform.x +
                upperPlatform.x
            ) / 2;

        let x =
            midpoint +
            (
                Math.random() * 120 -
                60
            );

        x = clamp(
            x,
            30,
            WIDTH - 30
        );

        const y =
            minY +
            Math.random() *
            (
                maxY - minY
            );

        this.orbs.push(
            new Orb(
                x,
                y,
                type
            )
        );
    }

    addParticles(
        x,
        y,
        c,
        amount,
        power = 1
    ) {
        for (
            let i = 0;
            i < amount;
            i++
        ) {
            this.particles.push(
                new Particle(
                    x,
                    y,
                    c,
                    power
                )
            );
        }
    }

    showText(
        text,
        x,
        y,
        c,
        size
    ) {
        this.texts.push(
            new FloatingText(
                text,
                x,
                y,
                c,
                size
            )
        );
    }

    bounceEffect(
        x,
        y,
        platform,
        type
    ) {
        if (type === "perfect") {
            this.addParticles(
                x,
                y,
                [110,255,225],
                34,
                1.35
            );

            this.shake = 5;
            this.flash = 0.10;

            hapticBig();

        } else if (type === "corner") {
            this.addParticles(
                x,
                y,
                GOLD,
                28,
                1.25
            );

            this.shake = 6;
            this.flash = 0.08;

            hapticBig();

        } else if (type === "edge") {
            this.addParticles(
                x,
                y,
                GOLD,
                20,
                1.1
            );

            this.shake = 4;
            hapticBounce();

        } else if (type === "dive") {
            this.addParticles(
                x,
                y,
                [255,105,150],
                25,
                1.2
            );

            this.shake = 5;
            hapticBig();

        } else if (type === "flow") {
            this.addParticles(
                x,
                y,
                [90,255,220],
                28,
                1.2
            );

            this.shake = 4;
            this.flash = 0.06;

            hapticBounce();

        } else {
            this.addParticles(
                x,
                y,
                platform.color,
                15,
                0.9
            );

            this.shake = 2;
            hapticBounce();
        }

        if (type === "perfect") {
            soundPerfect();
        } else {
            soundBounce();
        }
    }


    /* =====================================================
       PLATFORM COLLISION
    ===================================================== */

    collidePlatform(
        player,
        platform
    ) {
        if (player.ghost > 0) {
            return false;
        }

        const left = platform.left;
        const right = platform.right;
        const top = platform.top;
        const bottom = platform.bottom;

        const closestX = clamp(
            player.x,
            left,
            right
        );

        const closestY = clamp(
            player.y,
            top,
            bottom
        );

        const dx =
            player.x -
            closestX;

        const dy =
            player.y -
            closestY;

        if (
            dx * dx +
            dy * dy >
            player.radius *
            player.radius
        ) {
            return false;
        }

        const wasAbove =
            player.previousY +
            player.radius <=
            top + 5;

        const wasBelow =
            player.previousY -
            player.radius >=
            bottom - 5;

        const wasLeft =
            player.previousX +
            player.radius <=
            left + 5;

        const wasRight =
            player.previousX -
            player.radius >=
            right - 5;

        let nx = 0;
        let ny = 0;

        if (
            player.vy > 0 &&
            wasAbove
        ) {
            ny = -1;
        } else if (
            player.vy < 0 &&
            wasBelow
        ) {
            ny = 1;
        } else if (wasLeft) {
            nx = -1;
        } else if (wasRight) {
            nx = 1;
        } else {
            const distances = [
                {
                    value:
                        Math.abs(
                            player.x -
                            left
                        ),
                    nx: -1,
                    ny: 0
                },
                {
                    value:
                        Math.abs(
                            player.x -
                            right
                        ),
                    nx: 1,
                    ny: 0
                },
                {
                    value:
                        Math.abs(
                            player.y -
                            top
                        ),
                    nx: 0,
                    ny: -1
                },
                {
                    value:
                        Math.abs(
                            player.y -
                            bottom
                        ),
                    nx: 0,
                    ny: 1
                }
            ];

            distances.sort(
                (a, b) =>
                    a.value -
                    b.value
            );

            nx = distances[0].nx;
            ny = distances[0].ny;
        }

        /*
         * PHASE
         */

        if (
            player.phase > 0 &&
            ny === -1 &&
            player.vy > 0 &&
            wasAbove
        ) {
            player.phasePlatformsPassed++;

            player.phase = 0;

            player.y =
                bottom +
                player.radius +
                2;

            player.vy =
                Math.max(
                    player.vy,
                    220
                );

            game.showText(
                "PHASED!",
                player.x,
                player.y,
                PHASE_RED,
                17
            );

            game.addParticles(
                player.x,
                top,
                PHASE_RED,
                18,
                0.9
            );

            return false;
        }

        const relativeVx =
            player.vx -
            platform.vx;

        const relativeVy =
            player.vy;

        const into =
            relativeVx * nx +
            relativeVy * ny;

        if (into >= 0) {
            return false;
        }

        /*
         * Separate player.
         */

        if (ny === -1) {
            player.y =
                top -
                player.radius;
        } else if (ny === 1) {
            player.y =
                bottom +
                player.radius;
        } else if (nx === -1) {
            player.x =
                left -
                player.radius;
        } else if (nx === 1) {
            player.x =
                right +
                player.radius;
        }

        /*
         * TOP LANDING
         */

        if (ny === -1) {
            let power = BOUNCE_POWER;

            const wasDive =
                player.diving;

            if (wasDive) {
                power = DIVE_BOUNCE_POWER;
            }

            player.vy = -power;

            player.vx *=
                PLATFORM_RESTITUTION;

            player.squash = 1.38;
            player.stretch = 0.68;

            player.bounces++;
            player.diving = false;

            if (!platform.scored) {
                platform.scored = true;

                this.scorePlatform(
                    platform,
                    wasDive
                );
            }

            return true;
        }

        /*
         * UNDERSIDE
         */

        if (ny === 1) {
            player.vx *= 0.92;

            player.vy =
                UNDERSIDE_BOUNCE_POWER;

            player.diving = false;

            player.squash = 1.12;
            player.stretch = 0.88;

            this.flow = Math.max(
                0,
                this.flow - 1
            );

            this.addParticles(
                player.x,
                player.y,
                platform.color,
                10,
                0.7
            );

            this.shake = 2;
            hapticBounce();

            return true;
        }

        /*
         * SIDE HIT
         */

        if (nx !== 0) {
            player.vx =
                -player.vx *
                PLATFORM_RESTITUTION;

            player.vy *= 0.96;

            player.squash = 1.16;
            player.stretch = 0.86;

            this.flow = Math.max(
                0,
                this.flow - 1
            );

            this.addParticles(
                player.x,
                player.y,
                platform.color,
                9,
                0.7
            );

            return true;
        }

        return false;
    }


    /* =====================================================
       PLATFORM SCORE
    ===================================================== */

    scorePlatform(
        platform,
        wasDive
    ) {
        const centerDistance =
            Math.abs(
                this.player.x -
                platform.x
            );

        const edgeDistance =
            platform.width / 2 -
            centerDistance;

        /*
         * Perfect:
         * Very close to the center of the platform.
         *
         * Edge:
         * Close to the outside edge.
         */

        const isPerfect =
            centerDistance <=
            platform.width * 0.12;

        const isEdge =
            !isPerfect &&
            edgeDistance < 20;

        let landingType = "normal";

        if (isPerfect) {
            landingType = "perfect";
        } else if (isEdge) {
            landingType = "edge";
        }

        const clean =
            Math.abs(
                this.player.vx
            ) < 340;

        if (clean) {
            this.flow = clamp(
                this.flow + 1,
                0,
                10
            );
        } else {
            this.flow = Math.max(
                0,
                this.flow - 1
            );
        }

        this.maxFlow =
            Math.max(
                this.maxFlow,
                this.flow
            );

        let points = 100;

        /*
         * Landing bonuses.
         */

        if (landingType === "perfect") {
            points += 150;

            this.showText(
                "PERFECT!",
                this.player.x,
                this.player.y - 34,
                [100,255,220],
                25
            );
        } else if (landingType === "edge") {
            points += 275;

            this.showText(
                "EDGE!",
                this.player.x,
                this.player.y - 30,
                GOLD,
                19
            );
        }

        if (wasDive) {
            points += 100;
        }

        const multiplier =
            1 +
            Math.max(
                0,
                this.flow - 1
            ) *
            0.15;

        points *= multiplier;

        const finalPoints =
            Math.floor(points);

        this.score += finalPoints;

        /*
         * Perfect landing gets a little extra
         * visual emphasis on top of the normal
         * landing effect.
         */

        if (landingType === "perfect") {
            this.addParticles(
                this.player.x,
                this.player.y,
                [100,255,220],
                18,
                0.9
            );
        }

        if (this.flow >= 2) {
            this.showText(
                `FLOW x${this.flow}`,
                this.player.x,
                this.player.y - 28,
                [95,245,210],
                17
            );
        }

        this.bounceEffect(
            this.player.x,
            this.player.y,
            platform,
            landingType === "perfect"
                ? "perfect"
                : wasDive
                    ? "dive"
                    : this.flow >= 3
                        ? "flow"
                        : landingType
        );
    }


    /* =====================================================
       ORBS
    ===================================================== */

    collideOrbs() {
        for (const orb of this.orbs) {
            if (orb.life <= 0) continue;

            if (
                distance(
                    this.player.x,
                    this.player.y,
                    orb.x,
                    orb.y
                ) <
                this.player.radius +
                orb.radius +
                5
            ) {
                orb.collect();
            }
        }
    }


    /* =====================================================
       FIRE
    ===================================================== */

    fireCollision() {
        const screenY =
            this.player.y +
            this.cameraY;

        const fireTop =
            HEIGHT -
            FIRE_HEIGHT;

        if (
            screenY +
            this.player.radius <
            fireTop
        ) {
            return false;
        }

        if (this.player.fireCooldown > 0) {
            return false;
        }

        if (
            this.player.invulnerable >
            0
        ) {
            this.player.y =
                fireTop -
                this.cameraY -
                this.player.radius -
                3;

            this.player.vy =
                -Math.max(
                    720,
                    Math.min(
                        1100,
                        Math.abs(
                            this.player.vy
                        ) * 0.82
                    )
                );

            this.player.diving = false;

            this.player.squash = 1.45;
            this.player.stretch = 0.62;

            this.player.fireCooldown = 0.28;

            this.addParticles(
                this.player.x,
                fireTop - this.cameraY,
                FIRE_GREEN,
                32,
                1.3
            );

            this.addParticles(
                this.player.x,
                fireTop - this.cameraY,
                FIRE_BLUE,
                22,
                1.1
            );

            this.showText(
                "SAVED!",
                this.player.x,
                fireTop -
                    this.cameraY -
                    25,
                FIRE_GREEN,
                24
            );

            this.shake = 7;
            this.flash = 0.10;

            soundFireSave();
            hapticBig();

            this.player.invulnerable = 0;

            return true;
        }

        this.die();

        return true;
    }


    /* =====================================================
       CAMERA
    ===================================================== */

    updateCamera(dt) {
        const screenY =
            this.player.y +
            this.cameraY;

        if (screenY < CAMERA_TARGET_Y) {
            const target =
                CAMERA_TARGET_Y -
                this.player.y;

            this.cameraY =
                lerp(
                    this.cameraY,
                    target,
                    Math.min(
                        1,
                        dt *
                        CAMERA_FOLLOW_SPEED
                    )
                );
        }

        this.cameraY =
            Math.max(
                this.cameraY,
                0
            );
    }


    /* =====================================================
       EFFECTS
    ===================================================== */

    updateEffects(dt) {
        for (
            let i =
                this.particles.length - 1;
            i >= 0;
            i--
        ) {
            const particle =
                this.particles[i];

            particle.update(dt);

            if (particle.life <= 0) {
                this.particles.splice(i, 1);
            }
        }

        for (
            let i =
                this.texts.length - 1;
            i >= 0;
            i--
        ) {
            const text =
                this.texts[i];

            text.update(dt);

            if (text.life <= 0) {
                this.texts.splice(i, 1);
            }
        }
    }


    /* =====================================================
       FIRE DRAWING
    ===================================================== */

    drawFire() {
        const top =
            HEIGHT -
            FIRE_HEIGHT;

        const danger =
            ctx.createLinearGradient(
                0,
                top - 45,
                0,
                HEIGHT
            );

        danger.addColorStop(
            0,
            "rgba(20,170,255,0)"
        );

        danger.addColorStop(
            0.35,
            "rgba(35,220,190,0.06)"
        );

        danger.addColorStop(
            0.72,
            "rgba(35,220,190,0.13)"
        );

        danger.addColorStop(
            1,
            "rgba(10,95,125,0.30)"
        );

        ctx.fillStyle = danger;

        ctx.fillRect(
            0,
            top - 45,
            WIDTH,
            FIRE_HEIGHT + 45
        );

        ctx.save();

        ctx.globalCompositeOperation = "lighter";

        ctx.shadowBlur = 24;
        ctx.shadowColor =
            "rgba(45,225,190,0.65)";

        const base =
            ctx.createLinearGradient(
                0,
                top,
                0,
                HEIGHT
            );

        base.addColorStop(
            0,
            "rgba(70,255,200,0.55)"
        );

        base.addColorStop(
            0.35,
            "rgba(35,220,210,0.35)"
        );

        base.addColorStop(
            1,
            "rgba(20,130,180,0.20)"
        );

        ctx.fillStyle = base;

        ctx.fillRect(
            0,
            top + 7,
            WIDTH,
            FIRE_HEIGHT
        );

        const flameCount = 31;

        for (
            let i = 0;
            i < flameCount;
            i++
        ) {
            const x =
                (i + 0.5) *
                WIDTH /
                flameCount;

            const wave =
                Math.sin(
                    this.firePhase * 4.8 +
                    i * 1.73
                );

            const wave2 =
                Math.sin(
                    this.firePhase * 7.1 -
                    i * 0.91
                );

            const width =
                18 +
                (5 + wave * 3);

            const height =
                20 +
                (wave2 + 1) * 7 +
                (i % 3) * 4;

            const baseY =
                HEIGHT + 4;

            const tipY =
                top +
                5 -
                height;

            const lean =
                wave * 7;

            const outerGradient =
                ctx.createLinearGradient(
                    0,
                    tipY,
                    0,
                    baseY
                );

            outerGradient.addColorStop(
                0,
                "rgba(105,255,215,0.05)"
            );

            outerGradient.addColorStop(
                0.20,
                "rgba(75,255,205,0.55)"
            );

            outerGradient.addColorStop(
                0.58,
                "rgba(40,220,205,0.78)"
            );

            outerGradient.addColorStop(
                1,
                "rgba(20,135,180,0.70)"
            );

            ctx.fillStyle =
                outerGradient;

            ctx.beginPath();

            ctx.moveTo(
                x - width,
                baseY
            );

            ctx.bezierCurveTo(
                x - width * 0.95,
                baseY - height * 0.35,
                x - width * 0.62,
                top + height * 0.28,
                x - width * 0.18 + lean,
                top + 8
            );

            ctx.bezierCurveTo(
                x - width * 0.05 + lean,
                top - height * 0.05,
                x + width * 0.12 + lean,
                tipY + height * 0.30,
                x + lean,
                tipY
            );

            ctx.bezierCurveTo(
                x + width * 0.15 + lean,
                tipY + height * 0.35,
                x + width * 0.62,
                top + height * 0.26,
                x + width * 0.72,
                top + 9
            );

            ctx.bezierCurveTo(
                x + width * 0.95,
                baseY - height * 0.28,
                x + width,
                baseY - height * 0.12,
                x + width,
                baseY
            );

            ctx.closePath();
            ctx.fill();

            const innerHeight =
                height *
                (
                    0.42 +
                    (wave + 1) *
                    0.07
                );

            const innerTip =
                baseY -
                innerHeight;

            const innerGradient =
                ctx.createLinearGradient(
                    0,
                    innerTip,
                    0,
                    baseY
                );

            innerGradient.addColorStop(
                0,
                "rgba(210,255,245,0.82)"
            );

            innerGradient.addColorStop(
                0.28,
                "rgba(105,255,220,0.88)"
            );

            innerGradient.addColorStop(
                0.72,
                "rgba(45,230,210,0.65)"
            );

            innerGradient.addColorStop(
                1,
                "rgba(30,170,195,0.25)"
            );

            ctx.fillStyle =
                innerGradient;

            ctx.beginPath();

            ctx.moveTo(
                x - width * 0.48,
                baseY
            );

            ctx.bezierCurveTo(
                x - width * 0.42,
                baseY - innerHeight * 0.35,
                x - width * 0.20,
                innerTip + innerHeight * 0.30,
                x + lean * 0.45,
                innerTip
            );

            ctx.bezierCurveTo(
                x + width * 0.16,
                innerTip + innerHeight * 0.35,
                x + width * 0.40,
                baseY - innerHeight * 0.25,
                x + width * 0.48,
                baseY
            );

            ctx.closePath();
            ctx.fill();
        }

        const crest =
            ctx.createLinearGradient(
                0,
                top - 12,
                0,
                top + 22
            );

        crest.addColorStop(
            0,
            "rgba(150,255,225,0.08)"
        );

        crest.addColorStop(
            0.5,
            "rgba(70,255,210,0.55)"
        );

        crest.addColorStop(
            1,
            "rgba(35,200,195,0.25)"
        );

        ctx.fillStyle = crest;

        ctx.beginPath();

        for (
            let x = 0;
            x <= WIDTH;
            x += 5
        ) {
            const wave =
                Math.sin(
                    x * 0.055 +
                    this.firePhase * 4.6
                ) * 5;

            const wave2 =
                Math.sin(
                    x * 0.117 -
                    this.firePhase * 6.3
                ) * 3;

            const y =
                top +
                8 +
                wave +
                wave2;

            if (x === 0) {
                ctx.moveTo(x, y);
            } else {
                ctx.lineTo(x, y);
            }
        }

        ctx.lineTo(WIDTH, top + 22);
        ctx.lineTo(0, top + 22);

        ctx.closePath();
        ctx.fill();

        for (
            let i = 0;
            i < 22;
            i++
        ) {
            const x =
                (i * 97 + 31) %
                WIDTH;

            const motion =
                (
                    this.firePhase *
                    (18 + i % 5 * 4) +
                    i * 19
                ) %
                42;

            const sway =
                Math.sin(
                    this.firePhase * 3 + i
                ) * 4;

            const y =
                top -
                4 -
                motion;

            const alpha =
                clamp(
                    0.52 -
                    motion / 100,
                    0.08,
                    0.52
                );

            ctx.fillStyle =
                i % 2 === 0
                    ? `rgba(80,255,210,${alpha})`
                    : `rgba(45,190,255,${alpha})`;

            ctx.beginPath();

            ctx.arc(
                x + sway,
                y,
                1.2 + (i % 3) * 0.6,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }

        ctx.restore();

        ctx.save();

        ctx.strokeStyle =
            "rgba(40,175,235,0.34)";

        ctx.lineWidth = 2;

        ctx.shadowBlur = 10;
        ctx.shadowColor =
            "rgba(40,190,240,0.45)";

        ctx.beginPath();

        ctx.moveTo(0, HEIGHT - 2);
        ctx.lineTo(WIDTH, HEIGHT - 2);

        ctx.stroke();

        ctx.restore();

        ctx.save();

        ctx.textAlign = "center";

        ctx.font = "bold 10px Arial";

        ctx.fillStyle =
            "rgba(160,245,225,0.42)";

        ctx.fillText(
            "DANGER",
            WIDTH / 2,
            HEIGHT - 7
        );

        ctx.restore();
    }


    /* =====================================================
       BACKGROUND
    ===================================================== */

    background() {
        const gradient =
            ctx.createLinearGradient(
                0,
                0,
                0,
                HEIGHT
            );

        gradient.addColorStop(
            0,
            "#050812"
        );

        gradient.addColorStop(
            0.55,
            "#08101e"
        );

        gradient.addColorStop(
            1,
            "#0d1725"
        );

        ctx.fillStyle = gradient;

        ctx.fillRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );

        for (
            let i = 0;
            i < 80;
            i++
        ) {
            const x =
                (i * 83) %
                WIDTH;

            const y =
                (
                    i * 137 +
                    Math.floor(
                        this.cameraY * 0.15
                    )
                ) %
                HEIGHT;

            const brightness =
                0.18 +
                (i % 4) * 0.07;

            ctx.fillStyle =
                `rgba(120,170,210,${brightness})`;

            ctx.fillRect(
                x,
                y,
                1,
                1
            );
        }
    }


    maxFlowAura() {
        const pulse = 0.5 + Math.sin(this.time * 4) * 0.08;
        const glow = ctx.createRadialGradient(
            WIDTH / 2,
            HEIGHT / 2,
            130,
            WIDTH / 2,
            HEIGHT / 2,
            420
        );
        glow.addColorStop(0, "rgba(255,210,70,0)");
        glow.addColorStop(0.62, `rgba(255,205,55,${0.035 * pulse})`);
        glow.addColorStop(0.86, `rgba(255,190,40,${0.11 * pulse})`);
        glow.addColorStop(1, `rgba(255,170,25,${0.22 * pulse})`);
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        ctx.restore();
    }

    /* =====================================================
       HUD
    =====================================================

    hud() {
        ctx.save();

        ctx.textAlign = "left";
        ctx.font = "10px Arial";
        ctx.fillStyle = "rgba(155,180,200,0.7)";
        ctx.fillText("SCORE", 18, 28);
        ctx.font = "bold 30px Arial";
        ctx.fillStyle = WHITE;
        ctx.fillText(this.score.toLocaleString(), 18, 57);

        ctx.textAlign = "right";
        ctx.font = "10px Arial";
        ctx.fillStyle = "rgba(155,180,200,0.7)";

        const barX = WIDTH / 2 - 55;

        const barH = 5;

        roundedRect(barX, barY, barW, barH, 3);
        ctx.fillStyle = this.flow >= 10 ? "#ffd45a" : "#62f5d0";
        roundedRect(barX, barY, barW * (this.flow / 10), barH, 3);

        if (this.player.invulnerable > 0) {
            ctx.textAlign = "right";
            ctx.font = "bold 14px Arial";
            ctx.fillStyle = "#72ffc2";
            ctx.fillText(`SAFE ${this.player.invulnerable.toFixed(1)}s`, WIDTH - 14, 82);

    }
