    /* =====================================================
       DRAW
    ===================================================== */

    draw() {

        ctx.save();

        ctx.scale(
            scale,
            scale
        );


        this.background();


        /*
         * Platforms.
         */

        for (
            const platform of
            this.platforms
        ) {

            platform.draw(
                this.cameraY
            );
        }


        /*
         * Orbs.
         */

        for (
            const orb of
            this.orbs
        ) {

            orb.draw(
                this.cameraY
            );
        }


        /*
         * Particles.
         */

        for (
            const particle of
            this.particles
        ) {

            particle.draw(
                this.cameraY
            );
        }


        /*
         * Player.
         */

        this.player.draw(
            this.cameraY
        );


        /*
         * Flames are deliberately drawn over the
         * lower area so the danger zone remains obvious.
         */

        this.drawFlames();


        /*
         * HUD.
         */

        if (
            this.started
        ) {

            this.hud();
        }


        /*
         * Start screen.
         */

        if (
            !this.started
        ) {

            this.startScreen();
        }


        /*
         * Game over.
         */

        if (
            this.gameOver
        ) {

            this.gameOverScreen();
        }


        /*
         * Safety save flash.
         */

        if (
            this.saveFlash > 0
        ) {

            ctx.fillStyle =
                `rgba(100,255,210,${
                    this.saveFlash *
                    0.25
                })`;

            ctx.fillRect(
                0,
                0,
                WIDTH,
                HEIGHT
            );
        }


        /*
         * Landing flash.
         */

        if (
            this.flash > 0
        ) {

            ctx.fillStyle =
                `rgba(255,255,255,${
                    this.flash
                })`;

            ctx.fillRect(
                0,
                0,
                WIDTH,
                HEIGHT
            );
        }


        ctx.restore();
    }
}


/* =========================================================
   GAME LOOP
========================================================= */

const game =
    new Game();

let lastTime =
    performance.now();


function loop(now) {

    let dt =
        (
            now -
            lastTime
        ) /
        1000;


    lastTime =
        now;


    /*
     * Prevent huge physics jumps.
     */

    dt =
        Math.min(
            dt,
            0.025
        );


    game.update(
        dt
    );


    /*
     * Screen shake.
     */

    if (
        game.shake > 0
    ) {

        const sx =
            (
                Math.random() *
                2 -
                1
            ) *
            game.shake;


        const sy =
            (
                Math.random() *
                2 -
                1
            ) *
            game.shake;


        ctx.save();


        ctx.translate(
            sx * scale,
            sy * scale
        );


        game.draw();


        ctx.restore();

    } else {

        game.draw();
    }


    requestAnimationFrame(
        loop
    );
}


requestAnimationFrame(
    loop
);


/* =========================================================
   OPTIONAL SOUND TOGGLE
========================================================= */

/*
 * Double-tap/click the sound icon area to toggle sound.
 *
 * This is intentionally subtle and not displayed as
 * another big button.
 */

canvas.addEventListener(
    "pointerdown",
    event => {

        const p =
            pointerPosition(
                event
            );


        if (
            p.x >
                WIDTH - 55 &&
            p.y >
                HEIGHT - 85
        ) {

            soundEnabled =
                !soundEnabled;

            if (
                soundEnabled
            ) {

                initAudio();

                playTone(
                    600,
                    0.08,
                    "sine",
                    0.03,
                    800
                );
            }
        }
    }
);

</script>

</body>
</html>
