<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>BOUNCE</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #050811;

    touch-action: none;
    user-select: none;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;
}

#game {
    display: block;

    background: #070a14;

    touch-action: none;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<script>
"use strict";

/* =========================================================
   BOUNCE
   =========================================================

   Core systems:

   - Alternating left/right platform rhythm
   - Gradual difficulty
   - Glowing collectible orbs
   - Rainbow LIFELINE safety net
   - Animated green death flames
   - Swipe-down diving
   - Haptic feedback where supported
   - Flow / combo system
   - Moving platforms later in the run

   ========================================================= */


/* =========================================================
   CANVAS
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const WIDTH = 480;
const HEIGHT = 800;

let scale = 1;

function resize() {

    scale = Math.min(
        window.innerWidth / WIDTH,
        window.innerHeight / HEIGHT
    );

    canvas.width = WIDTH * scale;
    canvas.height = HEIGHT * scale;

    canvas.style.width =
        `${WIDTH * scale}px`;

    canvas.style.height =
        `${HEIGHT * scale}px`;
}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   COLORS
========================================================= */

const WHITE = [245, 250, 255];

const PLATFORM_COLORS = [
    [70, 220, 255],
    [185, 100, 255],
    [255, 215, 80],
    [90, 255, 180],
    [255, 105, 150],
    [100, 150, 255]
];

const PLATFORM_DARK = [25, 45, 70];
const PLATFORM_HIGHLIGHT = [180, 245, 255];


/* =========================================================
   PLAYER PHYSICS
========================================================= */

const GRAVITY = 1500;

const BOUNCE_POWER = 980;

const DIVE_BOUNCE_POWER = 1320;

const MAX_FALL_SPEED = 1700;

const DIVE_ACCELERATION = 2500;

const AIR_ACCEL = 2100;

const AIR_FRICTION = 0.985;

const MAX_X_SPEED = 450;

const WALL_RESTITUTION = 0.92;

const PLATFORM_RESTITUTION = 0.98;

const BALL_RADIUS = 17;

const PHYSICS_STEPS = 6;


/* =========================================================
   PLATFORM GENERATION
========================================================= */

const CELL = 34;

/*
 * The beginning is intentionally forgiving.
 *
 * Difficulty grows as the player climbs.
 */

const START_VERTICAL_GAP = 108;
const END_VERTICAL_GAP = 190;

const START_HORIZONTAL_REACH = 145;
const END_HORIZONTAL_REACH = 390;

const PLATFORM_SIDE_MARGIN = 55;


/* =========================================================
   CAMERA
========================================================= */

const CAMERA_TARGET_Y = 330;
const CAMERA_FOLLOW_SPEED = 7;


/* =========================================================
   PLATFORM MOVEMENT
========================================================= */

const SPAWN_INTERVAL = 0.45;
const DESPAWN_DISTANCE = 250;


/* =========================================================
   ORBS
========================================================= */

const ORB_TYPES = {

    FLOW: "flow",

    GOLD: "gold",

    DIVE: "dive",

    LIFELINE: "lifeline"
};


/*
 * How long the Lifeline lasts.
 */

const LIFELINE_DURATION = 8;


/* =========================================================
   DEATH FLAMES
========================================================= */

const FLAME_HEIGHT = 44;

const FLAME_DANGER_Y =
    HEIGHT - FLAME_HEIGHT;


/* =========================================================
   INPUT
========================================================= */

let keyLeft = false;
let keyRight = false;
let keyDown = false;

let touchActive = false;

let touchStartX = 0;
let touchStartY = 0;

let touchX = 0;
let touchY = 0;

let touchMoved = false;


/* =========================================================
   HAPTICS
========================================================= */

function vibrate(pattern) {

    if (
        "vibrate" in navigator
    ) {

        try {

            navigator.vibrate(
                pattern
            );

        } catch (error) {
            /*
             * Haptics are optional.
             */
        }
    }
}


/* =========================================================
   AUDIO
========================================================= */

let audioContext = null;

function initializeAudio() {

    if (
        audioContext
    ) {
        return;
    }

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if (
            AudioContext
        ) {

            audioContext =
                new AudioContext();
        }

    } catch (error) {

        audioContext = null;
    }
}


function beep(
    frequency,
    duration,
    volume = 0.035,
    type = "sine"
) {

    if (
        !audioContext
    ) {
        return;
    }

    try {

        if (
            audioContext.state ===
            "suspended"
        ) {

            audioContext.resume();
        }

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.type =
            type;

        oscillator.frequency.value =
            frequency;

        gain.gain.setValueAtTime(
            volume,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioContext.currentTime +
            duration
        );

        oscillator.connect(
            gain
        );

        gain.connect(
            audioContext.destination
        );

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime +
            duration
        );

    } catch (error) {
        /*
         * Audio is optional.
         */
    }
}


/* =========================================================
   POINTER POSITION
========================================================= */

function pointerPosition(event) {

    const rect =
        canvas.getBoundingClientRect();

    return {

        x:
            (
                event.clientX -
                rect.left
            ) / scale,

        y:
            (
                event.clientY -
                rect.top
            ) / scale
    };
}


/* =========================================================
   TOUCH
========================================================= */

canvas.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        initializeAudio();

        const p =
            pointerPosition(event);

        touchActive = true;

        touchMoved = false;

        touchStartX = p.x;
        touchStartY = p.y;

        touchX = p.x;
        touchY = p.y;


        if (
            !game.started ||
            game.gameOver
        ) {

            game.restart();
        }
    }
);


canvas.addEventListener(
    "pointermove",
    event => {

        if (
            !touchActive
        ) {
            return;
        }

        event.preventDefault();

        const p =
            pointerPosition(event);

        touchX = p.x;
        touchY = p.y;

        if (
            Math.abs(
                touchX -
                touchStartX
            ) > 8 ||
            Math.abs(
                touchY -
                touchStartY
            ) > 8
        ) {

            touchMoved = true;
        }
    }
);


canvas.addEventListener(
    "pointerup",
    event => {

        event.preventDefault();

        touchActive = false;

        touchMoved = false;
    }
);


canvas.addEventListener(
    "pointercancel",
    () => {

        touchActive = false;

        touchMoved = false;
    }
);


/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
    "keydown",
    event => {

        initializeAudio();

        if (
            event.key === "ArrowLeft" ||
            event.key.toLowerCase() === "a"
        ) {

            keyLeft = true;
        }

        if (
            event.key === "ArrowRight" ||
            event.key.toLowerCase() === "d"
        ) {

            keyRight = true;
        }

        if (
            event.key === "ArrowDown"
        ) {

            keyDown = true;
        }

        if (
            event.code === "Space"
        ) {

            if (
                !game.started ||
                game.gameOver
            ) {

                game.restart();
            }
        }

        if (
            event.key === "Escape"
        ) {

            location.reload();
        }
    }
);


window.addEventListener(
    "keyup",
    event => {

        if (
            event.key === "ArrowLeft" ||
            event.key.toLowerCase() === "a"
        ) {

            keyLeft = false;
        }

        if (
            event.key === "ArrowRight" ||
            event.key.toLowerCase() === "d"
        ) {

            keyRight = false;
        }

        if (
            event.key === "ArrowDown"
        ) {

            keyDown = false;
        }
    }
);


/* =========================================================
   HELPERS
========================================================= */

function clamp(
    value,
    minimum,
    maximum
) {

    return Math.max(
        minimum,
        Math.min(
            maximum,
            value
        )
    );
}


function lerp(
    a,
    b,
    amount
) {

    return a +
        (
            b - a
        ) *
        amount;
}


function color(c) {

    return `rgb(${c[0]},${c[1]},${c[2]})`;
}


function rgba(
    c,
    alpha
) {

    return `rgba(${c[0]},${c[1]},${c[2]},${alpha})`;
}


function distance(
    x1,
    y1,
    x2,
    y2
) {

    const dx =
        x1 - x2;

    const dy =
        y1 - y2;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );
}


/* =========================================================
   PARTICLE
========================================================= */

class Particle {

    constructor(
        x,
        y,
        c,
        power = 1
    ) {

        this.x = x;
        this.y = y;

        const angle =
            Math.random() *
            Math.PI *
            2;

        const speed =
            (
                70 +
                Math.random() *
                200
            ) *
            power;

        this.vx =
            Math.cos(angle) *
            speed;

        this.vy =
            Math.sin(angle) *
            speed;

        this.life =
            0.2 +
            Math.random() *
            0.4;

        this.maxLife =
            this.life;

        this.size =
            2 +
            Math.random() *
            4;

        this.color = c;
    }


    update(dt) {

        this.x +=
            this.vx *
            dt;

        this.y +=
            this.vy *
            dt;

        this.vy +=
            450 *
            dt;

        this.vx *=
            0.985;

        this.life -=
            dt;
    }


    draw(cameraY) {

        if (
            this.life <= 0
        ) {

            return;
        }

        const alpha =
            this.life /
            this.maxLife;

        const size =
            Math.max(
                1,
                this.size *
                alpha
            );

        ctx.fillStyle =
            rgba(
                this.color,
                alpha
            );

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y + cameraY,
            size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}


/* =========================================================
   ORB PARTICLE
========================================================= */

class OrbParticle {

    constructor(
        orb
    ) {

        this.orb = orb;

        this.angle =
            Math.random() *
            Math.PI *
            2;

        this.radius =
            16 +
            Math.random() *
            13;

        this.speed =
            1 +
            Math.random() *
            2;

        this.life =
            1;
    }


    update(dt) {

        this.angle +=
            this.speed *
            dt;

        this.life -=
            dt *
            0.5;
    }


    draw(cameraY) {

        if (
            this.life <= 0
        ) {

            return;
        }

        const x =
            this.orb.x +
            Math.cos(
                this.angle
            ) *
            this.radius;

        const y =
            this.orb.y +
            Math.sin(
                this.angle
            ) *
            this.radius +
            cameraY;

        ctx.fillStyle =
            rgba(
                this.orb.primaryColor(),
                0.75
            );

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            2,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}


/* =========================================================
   ORB
========================================================= */

class Orb {

    constructor(
        x,
        y,
        type
    ) {

        this.x = x;
        this.y = y;

        this.type = type;

        this.radius = 13;

        this.phase =
            Math.random() *
            Math.PI *
            2;

        this.age = 0;

        this.collected = false;

        this.particles = [];


        for (
            let i = 0;
            i < 5;
            i++
        ) {

            this.particles.push(
                new OrbParticle(
                    this
                )
            );
        }
    }


    update(dt) {

        this.age += dt;

        for (
            const particle of
            this.particles
        ) {

            particle.update(
                dt
            );
        }
    }


    primaryColor() {

        if (
            this.type ===
            ORB_TYPES.FLOW
        ) {

            return [
                70,
                245,
                220
            ];
        }

        if (
            this.type ===
            ORB_TYPES.GOLD
        ) {

            return [
                255,
                215,
                65
            ];
        }

        if (
            this.type ===
            ORB_TYPES.DIVE
        ) {

            return [
                255,
                95,
                145
            ];
        }

        return [
            255,
            100,
            220
        ];
    }


    rainbowColor() {

        const hue =
            (
                this.age *
                110
            ) %
            360;

        return hslToRgb(
            hue,
            100,
            65
        );
    }


    draw(cameraY) {

        if (
            this.collected
        ) {

            return;
        }

        const bob =
            Math.sin(
                this.age *
                3 +
                this.phase
            ) *
            4;

        const sx =
            this.x;

        const sy =
            this.y +
            cameraY +
            bob;


        /*
         * Orbiting particles.
         */

        for (
            const particle of
            this.particles
        ) {

            particle.draw(
                cameraY + bob
            );
        }


        /*
         * Outer glow.
         */

        let glowColor;

        if (
            this.type ===
            ORB_TYPES.LIFELINE
        ) {

            glowColor =
                `hsla(${
                    (
                        this.age *
                        110
                    ) % 360
                },100%,65%,0.7)`;

        } else {

            glowColor =
                rgba(
                    this.primaryColor(),
                    0.55
                );
        }


        ctx.shadowBlur = 28;
        ctx.shadowColor =
            glowColor;


        /*
         * Main orb.
         */

        if (
            this.type ===
            ORB_TYPES.LIFELINE
        ) {

            const gradient =
                ctx.createRadialGradient(
                    sx - 4,
                    sy - 4,
                    1,
                    sx,
                    sy,
                    this.radius
                );

            gradient.addColorStop(
                0,
                "#ffffff"
            );

            gradient.addColorStop(
                0.25,
                `hsl(${
                    (
                        this.age *
                        110
                    ) % 360
                },100%,85%)`
            );

            gradient.addColorStop(
                0.65,
                `hsl(${
                    (
                        this.age *
                        110 +
                        120
                    ) % 360
                },100%,65%)`
            );

            gradient.addColorStop(
                1,
                `hsl(${
                    (
                        this.age *
                        110 +
                        240
                    ) % 360
                },100%,55%)`
            );

            ctx.fillStyle =
                gradient;

        } else {

            const c =
                this.primaryColor();

            const gradient =
                ctx.createRadialGradient(
                    sx - 4,
                    sy - 4,
                    1,
                    sx,
                    sy,
                    this.radius
                );

            gradient.addColorStop(
                0,
                "#ffffff"
            );

            gradient.addColorStop(
                0.3,
                color(c)
            );

            gradient.addColorStop(
                1,
                rgba(c, 0.5)
            );

            ctx.fillStyle =
                gradient;
        }


        ctx.beginPath();

        ctx.arc(
            sx,
            sy,
            this.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.shadowBlur = 0;


        /*
         * Inner highlight.
         */

        ctx.fillStyle =
            "rgba(255,255,255,0.85)";

        ctx.beginPath();

        ctx.arc(
            sx - 4,
            sy - 4,
            3,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /*
         * Special icon.
         */

        ctx.strokeStyle =
            "rgba(255,255,255,0.85)";

        ctx.lineWidth = 2;


        if (
            this.type ===
            ORB_TYPES.LIFELINE
        ) {

            /*
             * Small shield shape.
             */

            ctx.beginPath();

            ctx.moveTo(
                sx,
                sy - 7
            );

            ctx.lineTo(
                sx + 6,
                sy - 3
            );

            ctx.lineTo(
                sx + 5,
                sy + 4
            );

            ctx.lineTo(
                sx,
                sy + 8
            );

            ctx.lineTo(
                sx - 5,
                sy + 4
            );

            ctx.lineTo(
                sx - 6,
                sy - 3
            );

            ctx.closePath();

            ctx.stroke();

        } else if (
            this.type ===
            ORB_TYPES.DIVE
        ) {

            ctx.beginPath();

            ctx.moveTo(
                sx,
                sy - 7
            );

            ctx.lineTo(
                sx,
                sy + 5
            );

            ctx.moveTo(
                sx - 4,
                sy + 1
            );

            ctx.lineTo(
                sx,
                sy + 6
            );

            ctx.lineTo(
                sx + 4,
                sy + 1
            );

            ctx.stroke();
        }
    }
}


/* =========================================================
   PLATFORM
========================================================= */

class Platform {

    constructor(
        x,
        y,
        width = 5,
        moving = false,
        bonus = false
    ) {

        this.x = x;

        this.y = y;

        this.widthCells =
            width;

        this.width =
            width *
            CELL;

        this.height =
            CELL;

        this.vx =
            moving
                ? (
                    Math.random() < 0.5
                        ? -1
                        : 1
                ) *
                (
                    25 +
                    Math.random() *
                    55
                )
                : 0;

        this.vy = 0;

        this.moving =
            moving;

        this.bonus =
            bonus;

        this.color =
            bonus
                ? [255, 215, 80]
                : PLATFORM_COLORS[
                    Math.floor(
                        Math.random() *
                        PLATFORM_COLORS.length
                    )
                ];

        this.scoredThisVisit =
            false;

        this.id =
            Platform.nextId++;

        this.orb = null;
    }


    get rect() {

        return {

            left:
                this.x -
                this.width / 2,

            right:
                this.x +
                this.width / 2,

            top:
                this.y -
                CELL / 2,

            bottom:
                this.y +
                CELL / 2
        };
    }


    update(
        dt,
        platformSpeed
    ) {

        this.y +=
            platformSpeed *
            dt;

        if (
            this.moving
        ) {

            this.x +=
                this.vx *
                dt;

            const half =
                this.width / 2;

            if (
                this.x -
                half <
                8
            ) {

                this.x =
                    8 +
                    half;

                this.vx =
                    Math.abs(
                        this.vx
                    );
            }

            if (
                this.x +
                half >
                WIDTH - 8
            ) {

                this.x =
                    WIDTH -
                    8 -
                    half;

                this.vx =
                    -Math.abs(
                        this.vx
                    );
            }
        }

        if (
            this.orb
        ) {

            this.orb.x =
                this.x;

            this.orb.y =
                this.y -
                55;
        }
    }


    draw(cameraY) {

        const r =
            this.rect;

        const sy =
            r.top +
            cameraY;

        if (
            sy >
                HEIGHT + 100 ||
            sy <
                -100
        ) {

            return;
        }


        /*
         * Shadow.
         */

        ctx.fillStyle =
            color(
                PLATFORM_DARK
            );

        roundRect(
            r.left,
            sy + 5,
            this.width,
            CELL,
            7
        );


        /*
         * Main platform.
         */

        ctx.fillStyle =
            color(
                this.color
            );

        roundRect(
            r.left,
            sy,
            this.width,
            CELL,
            7
        );


        /*
         * Top highlight.
         */

        ctx.strokeStyle =
            color(
                PLATFORM_HIGHLIGHT
            );

        ctx.lineWidth = 3;

        ctx.beginPath();

        ctx.moveTo(
            r.left + 7,
            sy + 5
        );

        ctx.lineTo(
            r.right - 7,
            sy + 5
        );

        ctx.stroke();


        /*
         * Moving platform indicator.
         */

        if (
            this.moving
        ) {

            ctx.fillStyle =
                "rgba(255,255,255,0.55)";

            ctx.beginPath();

            ctx.arc(
                this.x,
                sy +
                    CELL / 2,
                3,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }


        /*
         * Bonus platform indicator.
         */

        if (
            this.bonus
        ) {

            ctx.strokeStyle =
                "rgba(255,255,255,0.8)";

            ctx.lineWidth = 2;

            ctx.beginPath();

            ctx.arc(
                this.x,
                sy +
                    CELL / 2,
                CELL * 0.32,
                0,
                Math.PI * 2
            );

            ctx.stroke();
        }
    }
}


Platform.nextId = 1;


/* =========================================================
   PLAYER
========================================================= */

class Player {

    constructor() {

        this.reset();
    }


    reset() {

        this.x =
            WIDTH / 2;

        this.y =
            520;

        this.vx = 0;

        this.vy = 0;

        this.radius =
            BALL_RADIUS;

        this.squash = 1;

        this.stretch = 1;

        this.trail = [];

        this.bounces = 0;

        this.diving = false;

        this.lastPlatform = null;

        this.lifelineTimer = 0;

        this.savedRecently = 0;
    }


    control(dt) {

        let direction = 0;


        /*
         * Keyboard.
         */

        if (
            keyLeft
        ) {

            direction--;
        }

        if (
            keyRight
        ) {

            direction++;
        }


        /*
         * Touch horizontal movement.
         */

        if (
            touchActive
        ) {

            const dx =
                touchX -
                touchStartX;

            if (
                Math.abs(dx) >
                8
            ) {

                direction =
                    clamp(
                        dx / 70,
                        -1,
                        1
                    );
            }
        }


        this.vx +=
            direction *
            AIR_ACCEL *
            dt;

        this.vx *=
            AIR_FRICTION;

        this.vx =
            clamp(
                this.vx,
                -MAX_X_SPEED,
                MAX_X_SPEED
            );


        /*
         * Dive is now a DISCRETE action.
         *
         * A quick downward swipe triggers it.
         *
         * We do NOT keep checking whether
         * the player is holding the finger down.
         */

        if (
            this.vy > 0 &&
            !this.diving
        ) {

            if (
                keyDown
            ) {

                this.startDive();
            }


            if (
                touchActive
            ) {

                const dx =
                    touchX -
                    touchStartX;

                const dy =
                    touchY -
                    touchStartY;


                const downwardSwipe =
                    dy > 48 &&
                    dy >
                        Math.abs(dx) *
                        0.65;


                if (
                    downwardSwipe
                ) {

                    this.startDive();


                    /*
                     * Consume the gesture.
                     *
                     * This prevents the same drag
                     * from repeatedly triggering dive.
                     */

                    touchStartX =
                        touchX;

                    touchStartY =
                        touchY;
                }
            }
        }
    }


    startDive() {

        if (
            this.diving
        ) {

            return;
        }

        this.diving = true;

        vibrate(12);

        beep(
            180,
            0.06,
            0.025,
            "sawtooth"
        );

        game.addParticles(
            this.x,
            this.y,
            [255, 105, 150],
            8,
            0.8
        );
    }


    gravity(dt) {

        this.vy +=
            GRAVITY *
            dt;

        this.vy =
            Math.min(
                this.vy,
                MAX_FALL_SPEED
            );


        /*
         * Lifeline slowly counts down.
         */

        if (
            this.lifelineTimer > 0
        ) {

            this.lifelineTimer -=
                dt;

            if (
                this.lifelineTimer < 0
            ) {

                this.lifelineTimer = 0;
            }
        }


        if (
            this.savedRecently > 0
        ) {

            this.savedRecently -=
                dt;
        }
    }


    move(dt) {

        this.x +=
            this.vx *
            dt;

        this.y +=
            this.vy *
            dt;
    }


    wallCollision() {

        if (
            this.x -
            this.radius <
            0
        ) {

            this.x =
                this.radius;

            this.vx =
                Math.abs(
                    this.vx
                ) *
                WALL_RESTITUTION;

            vibrate(8);

            return true;
        }


        if (
            this.x +
            this.radius >
            WIDTH
        ) {

            this.x =
                WIDTH -
                this.radius;

            this.vx =
                -Math.abs(
                    this.vx
                ) *
                WALL_RESTITUTION;

            vibrate(8);

            return true;
        }

        return false;
    }


    bounce(
        nx,
        ny,
        platformVy
    ) {

        const relativeVx =
            this.vx;

        const relativeVy =
            this.vy -
            platformVy;

        const into =
            relativeVx *
                nx +
            relativeVy *
                ny;

        if (
            into >= 0
        ) {

            return null;
        }


        /*
         * Reflect velocity.
         */

        this.vx -=
            2 *
            into *
            nx;

        this.vy -=
            2 *
            into *
            ny;


        this.vx *=
            PLATFORM_RESTITUTION;

        this.vy *=
            PLATFORM_RESTITUTION;


        /*
         * TOP LANDING
         */

        if (
            ny < -0.5
        ) {

            let power =
                BOUNCE_POWER;


            if (
                this.diving
            ) {

                const bonus =
                    Math.max(
                        0,
                        this.vy
                    ) *
                    0.45;

                power =
                    Math.max(
                        DIVE_BOUNCE_POWER,
                        BOUNCE_POWER +
                        bonus
                    );
            }


            this.vy =
                -power;

            this.squash =
                1.4;

            this.stretch =
                0.65;

            this.bounces++;


            const wasDive =
                this.diving;

            this.diving =
                false;


            return {

                type:
                    "top",

                dive:
                    wasDive
            };
        }


        /*
         * Bottom.
         */

        if (
            ny > 0.5
        ) {

            this.squash =
                1.15;

            this.stretch =
                0.85;

            return {
                type:
                    "bottom"
            };
        }


        /*
         * Side.
         */

        this.squash =
            1.15;

        this.stretch =
            0.85;

        return {
            type:
                "side"
        };
    }


    activateLifeline() {

        this.lifelineTimer =
            LIFELINE_DURATION;

        vibrate([
            15,
            25,
            15
        ]);

        beep(
            600,
            0.1,
            0.035
        );

        beep(
            900,
            0.14,
            0.025
        );
    }


    consumeLifeline() {

        this.lifelineTimer = 0;

        this.savedRecently = 1.5;

        /*
         * The player is pulled back into
         * a safe bounce.
         */

        this.vy =
            -1180;

        this.diving =
            false;

        vibrate([
            20,
            30,
            35,
            30,
            50
        ]);

        beep(
            260,
            0.12,
            0.04,
            "square"
        );

        beep(
            520,
            0.18,
            0.035,
            "sine"
        );
    }


    updateVisuals() {

        this.squash =
            lerp(
                this.squash,
                1,
                0.18
            );

        this.stretch =
            lerp(
                this.stretch,
                1,
                0.18
            );


        this.trail.push({

            x:
                this.x,

            y:
                this.y
        });


        if (
            this.trail.length >
            14
        ) {

            this.trail.shift();
        }
    }


    draw(cameraY) {

        /*
         * Trail.
         */

        for (
            let i = 0;
            i < this.trail.length;
            i++
        ) {

            const p =
                this.trail[i];

            const progress =
                i /
                Math.max(
                    1,
                    this.trail.length
                );

            ctx.fillStyle =
                `rgba(80,210,255,${
                    0.06 +
                    progress *
                    0.14
                })`;

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y + cameraY,
                Math.max(
                    2,
                    this.radius *
                    progress
                ),
                0,
                Math.PI * 2
            );

            ctx.fill();
        }


        const width =
            this.radius *
            2 *
            this.squash;

        const height =
            this.radius *
            2 *
            this.stretch;

        const sy =
            this.y +
            cameraY;


        /*
         * Lifeline shield.
         */

        if (
            this.lifelineTimer > 0 ||
            this.savedRecently > 0
        ) {

            const pulse =
                1 +
                Math.sin(
                    performance.now() /
                    100
                ) *
                0.08;

            const hue =
                (
                    performance.now() /
                    12
                ) %
                360;

            ctx.shadowBlur =
                35;

            ctx.shadowColor =
                `hsla(${
                    hue
                },100%,65%,0.8)`;

            ctx.strokeStyle =
                `hsla(${
                    hue
                },100%,75%,0.8)`;

            ctx.lineWidth = 4;

            ctx.beginPath();

            ctx.arc(
                this.x,
                sy,
                29 * pulse,
                0,
                Math.PI * 2
            );

            ctx.stroke();

            ctx.shadowBlur = 0;
        }


        /*
         * Player.
         */

        ctx.shadowBlur =
            18;

        ctx.shadowColor =
            "rgba(80,220,255,0.65)";

        ctx.fillStyle =
            "#f5faff";

        ctx.beginPath();

        ctx.ellipse(
            this.x,
            sy,
            width / 2,
            height / 2,
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.shadowBlur =
            0;


        /*
         * Player highlight.
         */

        ctx.fillStyle =
            "#50c8ff";

        ctx.beginPath();

        ctx.ellipse(
            this.x -
                width *
                0.18,

            sy -
                height *
                0.22,

            Math.max(
                3,
                width *
                0.15
            ),

            Math.max(
                3,
                height *
                0.12
            ),

            0,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}


/* =========================================================
   GAME
========================================================= */

class Game {

    constructor() {

        this.player =
            new Player();

        this.platforms = [];

        this.orbs = [];

        this.particles = [];

        this.cameraY = 0;


        /*
         * SCORE
         */

        this.score = 0;

        this.bestScore =
            Number(
                localStorage.getItem(
                    "bounceBestScore"
                ) || 0
            );


        /*
         * HEIGHT
         */

        this.height = 0;

        this.bestHeight =
            Number(
                localStorage.getItem(
                    "bounceBestHeight"
                ) || 0
            );


        /*
         * FLOW
         */

        this.flow = 0;

        this.maxFlow = 0;


        /*
         * PLATFORM SPAWNING
         */

        this.spawnTimer = 0;

        this.nextPlatformY = -100;

        this.lastPlatformSide =
            "left";


        /*
         * STATE
         */

        this.started = false;

        this.gameOver = false;


        /*
         * EFFECTS
         */

        this.shake = 0;

        this.flash = 0;

        this.bannerText = "";

        this.bannerColor =
            [255,255,255];

        this.bannerTimer = 0;


        /*
         * HEIGHT SPEED TRACKING
         */

        this.lastHeight = 0;

        this.lastHeightTime =
            performance.now() /
            1000;


        /*
         * Flame animation.
         */

        this.flames = [];

        for (
            let i = 0;
            i < 28;
            i++
        ) {

            this.flames.push({

                x:
                    (
                        i /
                        27
                    ) *
                    WIDTH,

                seed:
                    Math.random() *
                    100,

                width:
                    18 +
                    Math.random() *
                    20,

                height:
                    28 +
                    Math.random() *
                    25,

                speed:
                    1 +
                    Math.random() *
                    2
            });
        }


        this.spawnInitialPlatforms();
    }


    restart() {

        this.player.reset();

        this.platforms = [];

        this.orbs = [];

        this.particles = [];

        this.cameraY = 0;

        this.score = 0;

        this.height = 0;

        this.flow = 0;

        this.maxFlow = 0;

        this.spawnTimer = 0;

        this.gameOver = false;

        this.started = true;

        this.shake = 0;

        this.flash = 0;

        this.bannerTimer = 0;

        this.lastPlatformSide =
            "left";

        this.lastHeight = 0;

        this.lastHeightTime =
            performance.now() /
            1000;

        this.spawnInitialPlatforms();

        vibrate(10);

        beep(
            440,
            0.08,
            0.025
        );
    }


    /*
     * Difficulty intentionally starts at ZERO
     * and only begins increasing after the
     * player has climbed.
     */

    difficulty() {

        return clamp(
            Math.max(
                0,
                this.height -
                500
            ) /
            5500,
            0,
            1
        );
    }


    platformSpeed() {

        const d =
            this.difficulty();

        return lerp(
            18,
            145,
            d
        );
    }


    verticalGap() {

        const d =
            this.difficulty();

        return lerp(
            START_VERTICAL_GAP,
            END_VERTICAL_GAP,
            d
        );
    }


    horizontalReach() {

        const d =
            this.difficulty();

        return lerp(
            START_HORIZONTAL_REACH,
            END_HORIZONTAL_REACH,
            d
        );
    }


    /* =====================================================
       INITIAL PLATFORMS
    ===================================================== */

    spawnInitialPlatforms() {

        this.platforms = [];

        this.orbs = [];


        /*
         * Starting platform.
         */

        this.platforms.push(
            new Platform(
                WIDTH * 0.50,
                625,
                7,
                false,
                false
            )
        );


        /*
         * Early platforms still alternate
         * left/right, but the movement is gentle.
         */

        this.addInitialPlatform(
            175,
            517,
            7
        );

        this.addInitialPlatform(
            305,
            409,
            7
        );

        this.addInitialPlatform(
            170,
            301,
            7
        );

        this.addInitialPlatform(
            315,
            193,
            6
        );

        this.addInitialPlatform(
            165,
            85,
            6
        );


        /*
         * Add an early orb.
         */

        this.addOrb(
            WIDTH * 0.50,
            570,
            ORB_TYPES.FLOW
        );


        this.nextPlatformY =
            -23;

        this.lastPlatformSide =
            "left";
    }


    addInitialPlatform(
        x,
        y,
        width
    ) {

        const platform =
            new Platform(
                x,
                y,
                width,
                false,
                false
            );

        this.platforms.push(
            platform
        );
    }


    /* =====================================================
       PLATFORM SPAWNING
    ===================================================== */

    spawnPlatform() {

        const d =
            this.difficulty();


        /*
         * Find the most recently generated
         * platform above us.
         */

        const previous =
            this.platforms
                .filter(
                    p =>
                        p.y <
                        this.nextPlatformY +
                        230
                )
                .sort(
                    (a, b) =>
                        b.y -
                        a.y
                )[0];


        /*
         * Preserve the visual alternating rhythm.
         *
         * Occasionally a center platform appears
         * as a variation, but left/right remains
         * the dominant visual pattern.
         */

        let side;

        const variationChance =
            lerp(
                0.06,
                0.16,
                d
            );


        if (
            Math.random() <
            variationChance
        ) {

            side =
                "center";

        } else {

            side =
                this.lastPlatformSide ===
                    "left"

                    ? "right"

                    : "left";
        }


        let x;


        if (
            side === "left"
        ) {

            x =
                75 +
                Math.random() *
                95;

        } else if (
            side === "right"
        ) {

            x =
                WIDTH -
                (
                    75 +
                    Math.random() *
                    95
                );

        } else {

            x =
                WIDTH / 2 +
                (
                    Math.random() *
                    120 -
                    60
                );
        }


        /*
         * Limit the jump distance.
         */

        if (
            previous
        ) {

            const maximumReach =
                this.horizontalReach();

            if (
                Math.abs(
                    x -
                    previous.x
                ) >
                maximumReach
            ) {

                x =
                    previous.x +
                    (
                        x >
                        previous.x
                            ? maximumReach
                            : -maximumReach
                    );
            }
        }


        x =
            clamp(
                x,
                PLATFORM_SIDE_MARGIN,
                WIDTH -
                    PLATFORM_SIDE_MARGIN
            );


        /*
         * Platform width.
         *
         * Very wide early.
         */

        let width;

        if (
            d < 0.18
        ) {

            width = 7;

        } else if (
            d < 0.38
        ) {

            width =
                Math.random() <
                0.8
                    ? 6
                    : 7;

        } else if (
            d < 0.65
        ) {

            width =
                Math.random() <
                0.75
                    ? 5
                    : 6;

        } else {

            width =
                [3, 4, 4, 5][
                    Math.floor(
                        Math.random() *
                        4
                    )
                ];
        }


        /*
         * Moving platforms arrive later.
         */

        const movingChance =
            d < 0.45
                ? 0
                : lerp(
                    0,
                    0.42,
                    (
                        d -
                        0.45
                    ) /
                    0.55
                );


        const moving =
            Math.random() <
            movingChance;


        /*
         * Bonus platform.
         */

        const bonus =
            Math.random() <
            0.07;


        const platform =
            new Platform(
                x,
                this.nextPlatformY,
                width,
                moving,
                bonus
            );


        this.platforms.push(
            platform
        );


        /*
         * Remember side.
         */

        if (
            x <
            WIDTH * 0.38
        ) {

            this.lastPlatformSide =
                "left";

        } else if (
            x >
            WIDTH * 0.62
        ) {

            this.lastPlatformSide =
                "right";
        }


        /*
         * Vertical gap.
         */

        const gap =
            this.verticalGap() +
            (
                Math.random() *
                14 -
                7
            );


        this.nextPlatformY -=
            gap;


        /*
         * Occasionally spawn a collectible
         * between the current and next platform.
         */

        this.spawnOrbForPlatform(
            platform,
            d
        );
    }


    /* =====================================================
       ORB SPAWNING
    ===================================================== */

    spawnOrbForPlatform(
        platform,
        d
    ) {

        const roll =
            Math.random();


        /*
         * Lifeline is deliberately rare.
         */

        if (
            roll < 0.025 &&
            d > 0.08
        ) {

            this.addOrb(
                platform.x,
                platform.y - 58,
                ORB_TYPES.LIFELINE
            );

            return;
        }


        /*
         * Dive orb.
         */

        if (
            roll < 0.13 &&
            d > 0.12
        ) {

            this.addOrb(
                platform.x,
                platform.y - 55,
                ORB_TYPES.DIVE
            );

            return;
        }


        /*
         * Gold orb.
         */

        if (
            roll < 0.28
        ) {

            this.addOrb(
                platform.x,
                platform.y - 58,
                ORB_TYPES.GOLD
            );

            return;
        }


        /*
         * Flow orb.
         */

        if (
            roll < 0.62
        ) {

            this.addOrb(
                platform.x,
                platform.y - 55,
                ORB_TYPES.FLOW
            );
        }
    }


    addOrb(
        x,
        y,
        type
    ) {

        this.orbs.push(
            new Orb(
                x,
                y,
                type
            )
        );
    }


    /* =====================================================
       EFFECTS
    ===================================================== */

    addParticles(
        x,
        y,
        c,
        amount,
        power = 1
    ) {

        for (
            let i = 0;
            i < amount;
            i++
        ) {

            this.particles.push(
                new Particle(
                    x,
                    y,
                    c,
                    power
                )
            );
        }
    }


    orbEffect(
        orb
    ) {

        let particleColor =
            orb.primaryColor();

        let amount = 24;

        let power = 1.2;


        if (
            orb.type ===
            ORB_TYPES.LIFELINE
        ) {

            particleColor =
                [255, 100, 220];

            amount = 55;

            power = 1.7;

            this.shake = 7;

            this.flash = 0.12;

        } else if (
            orb.type ===
            ORB_TYPES.GOLD
        ) {

            amount = 32;

            power = 1.35;

            this.shake = 4;

        } else if (
            orb.type ===
            ORB_TYPES.DIVE
        ) {

            amount = 30;

            power = 1.3;

            this.shake = 5;

        } else {

            amount = 20;

            power = 1.1;
        }


        this.addParticles(
            orb.x,
            orb.y,
            particleColor,
            amount,
            power
        );
    }


    bounceEffect(
        x,
        y,
        platform,
        type
    ) {

        if (
            type === "corner"
        ) {

            this.addParticles(
                x,
                y,
                [255, 235, 120],
                32,
                1.4
            );

            this.shake = 7;

            this.flash =
                0.12;

            vibrate([
                10,
                20,
                15
            ]);

            beep(
                600,
                0.08,
                0.035
            );

        } else if (
            type === "edge"
        ) {

            this.addParticles(
                x,
                y,
                [255, 215, 80],
                25,
                1.15
            );

            this.shake = 5;

            vibrate(16);

            beep(
                480,
                0.06,
                0.025
            );

        } else if (
            type === "flow"
        ) {

            this.addParticles(
                x,
                y,
                [90, 255, 220],
                30,
                1.25
            );

            this.shake = 4;

            this.flash =
                0.08;

            vibrate(18);

            beep(
                720,
                0.08,
                0.03
            );

        } else if (
            type === "dive"
        ) {

            this.addParticles(
                x,
                y,
                [255, 105, 150],
                38,
                1.5
            );

            this.shake = 7;

            vibrate([
                15,
                20,
                25
            ]);

            beep(
                260,
                0.08,
                0.035,
                "sawtooth"
            );

            beep(
                520,
                0.12,
                0.025
            );

        } else {

            this.addParticles(
                x,
                y,
                platform.color,
                18,
                1
            );

            vibrate(10);
        }
    }


    deathEffect() {

        this.addParticles(
            this.player.x,
            this.player.y,
            [70, 220, 255],
            55,
            1.4
        );

        this.shake = 12;

        vibrate([
            40,
            30,
            80
        ]);

        beep(
            130,
            0.2,
            0.045,
            "sawtooth"
        );
    }


    /* =====================================================
       ORB COLLECTION
    ===================================================== */

    collectOrb(
        orb
    ) {

        if (
            orb.collected
        ) {

            return;
        }

        orb.collected = true;


        this.orbEffect(
            orb
        );


        if (
            orb.type ===
            ORB_TYPES.FLOW
        ) {

            this.flow =
                clamp(
                    this.flow + 1,
                    0,
                    10
                );

            this.score +=
                150;

            this.showBanner(
                "+ FLOW",
                [90,255,220]
            );

            beep(
                850,
                0.08,
                0.025
            );

        } else if (
            orb.type ===
            ORB_TYPES.GOLD
        ) {

            this.score +=
                500;

            this.showBanner(
                "+500",
                [255,215,80]
            );

            beep(
                700,
                0.08,
                0.03
            );

            setTimeout(
                () => {
                    beep(
                        1050,
                        0.1,
                        0.025
                    );
                },
                45
            );

        } else if (
            orb.type ===
            ORB_TYPES.DIVE
        ) {

            this.score +=
                250;

            this.flow =
                clamp(
                    this.flow + 1,
                    0,
                    10
                );

            this.showBanner(
                "DIVE READY",
                [255,105,150]
            );

        } else if (
            orb.type ===
            ORB_TYPES.LIFELINE
        ) {

            this.score +=
                350;

            this.player.activateLifeline();

            this.showBanner(
                "LIFELINE",
                [255,130,225]
            );
        }
    }


    /* =====================================================
       BANNER
    ===================================================== */

    showBanner(
        text,
        c
    ) {

        this.bannerText =
            text;

        this.bannerColor =
            c;

        this.bannerTimer =
            0.9;
    }


    /* =====================================================
       COLLISION
    ===================================================== */

    collidePlatform(
        player,
        platform
    ) {

        const r =
            platform.rect;


        const closestX =
            clamp(
                player.x,
                r.left,
                r.right
            );

        const closestY =
            clamp(
                player.y,
                r.top,
                r.bottom
            );

        const dx =
            player.x -
            closestX;

        const dy =
            player.y -
            closestY;


        if (
            dx * dx +
            dy * dy >
            player.radius *
            player.radius
        ) {

            return false;
        }


        const leftPen =
            player.x +
            player.radius -
            r.left;

        const rightPen =
            r.right -
            (
                player.x -
                player.radius
            );

        const topPen =
            player.y +
            player.radius -
            r.top;

        const bottomPen =
            r.bottom -
            (
                player.y -
                player.radius
            );


        const penetrations = [

            {
                value:
                    leftPen,

                nx:
                    -1,

                ny:
                    0
            },

            {
                value:
                    rightPen,

                nx:
                    1,

                ny:
                    0
            },

            {
                value:
                    topPen,

                nx:
                    0,

                ny:
                    -1
            },

            {
                value:
                    bottomPen,

                nx:
                    0,

                ny:
                    1
            }
        ];


        penetrations.sort(
            (a, b) =>
                a.value -
                b.value
        );


        const hit =
            penetrations[0];


        const nx =
            hit.nx;

        const ny =
            hit.ny;


        const relativeVx =
            player.vx;

        const relativeVy =
            player.vy -
            platform.vy;


        const into =
            relativeVx *
                nx +
            relativeVy *
                ny;


        if (
            into >= 0
        ) {

            return false;
        }


        const penetration =
            Math.max(
                hit.value,
                0
            );


        player.x +=
            nx *
            penetration;

        player.y +=
            ny *
            penetration;


        const result =
            player.bounce(
                nx,
                ny,
                platform.vy
            );


        if (
            !result
        ) {

            return false;
        }


        /* =================================================
           TOP LANDING
        ================================================= */

        if (
            result.type ===
            "top"
        ) {

            const centerDistance =
                Math.abs(
                    player.x -
                    platform.x
                );

            const halfWidth =
                platform.width /
                2;

            const edgeDistance =
                halfWidth -
                centerDistance;


            const nearLeft =
                Math.abs(
                    player.x -
                    r.left
                ) < 12;


            const nearRight =
                Math.abs(
                    player.x -
                    r.right
                ) < 12;


            const nearTop =
                Math.abs(
                    player.y -
                    r.top
                ) < 12;


            const corner =
                (
                    nearLeft ||
                    nearRight
                ) &&
                nearTop;


            let landingType =
                "normal";


            if (
                corner
            ) {

                landingType =
                    "corner";

            } else if (
                edgeDistance <
                28
            ) {

                landingType =
                    "edge";
            }


            const firstLanding =
                !platform.scoredThisVisit;


            if (
                firstLanding
            ) {

                platform.scoredThisVisit =
                    true;


                let points =
                    100;


                if (
                    landingType ===
                    "edge"
                ) {

                    points +=
                        75;
                }


                if (
                    landingType ===
                    "corner"
                ) {

                    points +=
                        150;
                }


                if (
                    result.dive
                ) {

                    points +=
                        150;
                }


                if (
                    platform.bonus
                ) {

                    points +=
                        250;
                }


                /*
                 * Clean landing.
                 */

                const clean =
                    !corner &&
                    Math.abs(
                        player.vx
                    ) < 360;


                if (
                    clean
                ) {

                    this.flow =
                        clamp(
                            this.flow + 1,
                            0,
                            10
                        );

                } else {

                    this.flow =
                        Math.max(
                            0,
                            this.flow - 1
                        );
                }


                this.maxFlow =
                    Math.max(
                        this.maxFlow,
                        this.flow
                    );


                /*
                 * Flow multiplier.
                 */

                if (
                    this.flow >= 2
                ) {

                    points *=
                        1 +
                        (
                            this.flow -
                            1
                        ) *
                        0.15;
                }


                /*
                 * Fast climbing bonus.
                 */

                const now =
                    performance.now() /
                    1000;

                const elapsed =
                    Math.max(
                        0.05,
                        now -
                        this.lastHeightTime
                    );

                const gained =
                    this.height -
                    this.lastHeight;

                const climbRate =
                    gained /
                    elapsed;


                if (
                    climbRate >
                        250 &&
                    this.flow >= 3
                ) {

                    points +=
                        Math.min(
                            200,
                            Math.floor(
                                climbRate /
                                8
                            )
                        );
                }


                this.score +=
                    Math.floor(
                        points
                    );


                /*
                 * Effect.
                 */

                let effect =
                    "normal";


                if (
                    landingType ===
                    "corner"
                ) {

                    effect =
                        "corner";

                } else if (
                    landingType ===
                    "edge"
                ) {

                    effect =
                        "edge";

                } else if (
                    result.dive
                ) {

                    effect =
                        "dive";

                } else if (
                    this.flow >= 3
                ) {

                    effect =
                        "flow";
                }


                this.bounceEffect(
                    player.x,
                    player.y,
                    platform,
                    effect
                );
            }


            return true;
        }


        /*
         * Side/bottom collision.
         */

        this.flow =
            Math.max(
                0,
                this.flow - 1
            );


        this.addParticles(
            player.x,
            player.y,
            platform.color,
            10
        );


        return true;
    }


    /* =====================================================
       LIFELINE / FLAME COLLISION
    ===================================================== */

    checkDeathZone() {

        const screenY =
            this.player.y +
            this.cameraY;


        if (
            screenY <=
            FLAME_DANGER_Y
        ) {

            return;
        }


        /*
         * If the player has a Lifeline,
         * catch them instead of killing them.
         */

        if (
            this.player.lifelineTimer >
            0
        ) {

            this.saveFromFlames();

            return;
        }


        this.die();
    }


    saveFromFlames() {

        /*
         * Move the player to the flame line
         * and create an explosive safety bounce.
         */

        this.player.y =
            FLAME_DANGER_Y -
            this.cameraY -
            this.player.radius -
            3;


        this.player.consumeLifeline();


        this.flow =
            Math.max(
                0,
                this.flow - 1
            );


        this.showBanner(
            "SAVED!",
            [255,150,240]
        );


        this.addParticles(
            this.player.x,
            FLAME_DANGER_Y -
                this.cameraY,
            [255,100,220],
            55,
            1.7
        );


        /*
         * Rainbow shockwave.
         */

        for (
            let i = 0;
            i < 30;
            i++
        ) {

            const angle =
                (
                    i /
                    30
                ) *
                Math.PI *
                2;

            const p =
                new Particle(
                    this.player.x,
                    FLAME_DANGER_Y -
                        this.cameraY,
                    hslToRgb(
                        (
                            i /
                            30
                        ) *
                        360,
                        100,
                        65
                    ),
                    1.8
                );

            p.vx =
                Math.cos(
                    angle
                ) *
                (
                    150 +
                    Math.random() *
                    150
                );

            p.vy =
                Math.sin(
                    angle
                ) *
                (
                    150 +
                    Math.random() *
                    150
                );

            this.particles.push(
                p
            );
        }
    }


    /* =====================================================
       UPDATE
    ===================================================== */

    update(dt) {

        if (
            this.gameOver
        ) {

            this.updateParticles(
                dt
            );

            this.updateOrbs(
                dt
            );

            this.updateFlames(
                dt
            );

            this.shake =
                Math.max(
                    0,
                    this.shake -
                    dt * 20
                );

            return;
        }


        /*
         * Player.
         */

        this.player.control(
            dt
        );


        /*
         * Platforms.
         */

        const speed =
            this.platformSpeed();


        for (
            const platform of
            this.platforms
        ) {

            platform.update(
                dt,
                speed
            );
        }


        /*
         * Physics.
         */

        const subDt =
            dt /
            PHYSICS_STEPS;


        for (
            let i = 0;
            i <
                PHYSICS_STEPS;
            i++
        ) {

            this.player.gravity(
                subDt
            );

            this.player.move(
                subDt
            );


            /*
             * Walls.
             */

            this.player.wallCollision();


            /*
             * Platforms.
             */

            for (
                const platform of
                this.platforms
            ) {

                if (
                    this.collidePlatform(
                        this.player,
                        platform
                    )
                ) {

                    break;
                }
            }


            /*
             * Death zone.
             */

            this.checkDeathZone();

            if (
                this.gameOver
            ) {

                break;
            }
        }


        /*
         * Camera.
         */

        this.updateCamera(
            dt
        );


        /*
         * Height.
         */

        const currentHeight =
            Math.max(
                0,
                Math.floor(
                    520 -
                    this.player.y
                )
            );


        if (
            currentHeight >
            this.height
        ) {

            this.height =
                currentHeight;
        }


        /*
         * Best values.
         */

        this.bestHeight =
            Math.max(
                this.bestHeight,
                this.height
            );

        this.bestScore =
            Math.max(
                this.bestScore,
                this.score
            );


        localStorage.setItem(
            "bounceBestHeight",
            this.bestHeight
        );

        localStorage.setItem(
            "bounceBestScore",
            this.bestScore
        );


        /*
         * Height tracking.
         */

        const now =
            performance.now() /
            1000;


        if (
            now -
            this.lastHeightTime >
            0.35
        ) {

            this.lastHeight =
                this.height;

            this.lastHeightTime =
                now;
        }


        /*
         * Spawn.
         */

        this.spawnTimer +=
            dt;


        while (
            this.spawnTimer >=
            SPAWN_INTERVAL
        ) {

            this.spawnTimer -=
                SPAWN_INTERVAL;

            this.spawnPlatform();
        }


        /*
         * Remove old platforms.
         */

        const despawnY =
            -this.cameraY +
            HEIGHT +
            DESPAWN_DISTANCE;


        this.platforms =
            this.platforms.filter(
                platform =>
                    platform.y <
                    despawnY
            );


        /*
         * Orbs.
         */

        this.updateOrbs(
            dt
        );


        /*
         * Effects.
         */

        this.updateParticles(
            dt
        );

        this.player.updateVisuals();

        this.updateFlames(
            dt
        );


        /*
         * Banner.
         */

        this.bannerTimer =
            Math.max(
                0,
                this.bannerTimer -
                dt
            );


        /*
         * Screen effects.
         */

        this.shake =
            Math.max(
                0,
                this.shake -
                dt * 20
            );

        this.flash =
            Math.max(
                0,
                this.flash -
                dt
            );
    }


    /* =====================================================
       ORB UPDATE
    ===================================================== */

    updateOrbs(dt) {

        for (
            let i =
                this.orbs.length - 1;
            i >= 0;
            i--
        ) {

            const orb =
                this.orbs[i];

            orb.update(
                dt
            );


            if (
                !orb.collected
            ) {

                const d =
                    distance(
                        this.player.x,
                        this.player.y,
                        orb.x,
                        orb.y
                    );


                if (
                    d <
                    this.player.radius +
                    orb.radius +
                    5
                ) {

                    this.collectOrb(
                        orb
                    );
                }
            }


            /*
             * Remove collected or old orbs.
             */

            if (
                orb.collected
            ) {

                this.orbs.splice(
                    i,
                    1
                );

                continue;
            }


            const screenY =
                orb.y +
                this.cameraY;


            if (
                screenY >
                HEIGHT +
                150
            ) {

                this.orbs.splice(
                    i,
                    1
                );
            }
        }
    }


    /* =====================================================
       CAMERA
    ===================================================== */

    updateCamera(dt) {

        const screenY =
            this.player.y +
            this.cameraY;


        if (
            screenY <
            CAMERA_TARGET_Y
        ) {

            const target =
                CAMERA_TARGET_Y -
                this.player.y;


            this.cameraY =
                lerp(
                    this.cameraY,
                    target,
                    Math.min(
                        1,
                        dt *
                        CAMERA_FOLLOW_SPEED
                    )
                );
        }


        this.cameraY =
            Math.max(
                this.cameraY,
                0
            );
    }


    /* =====================================================
       PARTICLES
    ===================================================== */

    updateParticles(dt) {

        for (
            let i =
                this.particles.length - 1;
            i >= 0;
            i--
        ) {

            const particle =
                this.particles[i];

            particle.update(
                dt
            );

            if (
                particle.life <= 0
            ) {

                this.particles.splice(
                    i,
                    1
                );
            }
        }
    }


    /* =====================================================
       FLAMES
    ===================================================== */

    updateFlames(dt) {

        /*
         * Nothing needed here because the flames
         * use performance.now() for animation.
         *
         * This method exists so flame animation
         * can easily become more complex later.
         */
    }


    drawFlames() {

        const time =
            performance.now() /
            1000;


        /*
         * Dark danger glow above flames.
         */

        const dangerGradient =
            ctx.createLinearGradient(
                0,
                FLAME_DANGER_Y - 65,
                0,
                FLAME_DANGER_Y + 10
            );

        dangerGradient.addColorStop(
            0,
            "rgba(0,255,110,0)"
        );

        dangerGradient.addColorStop(
            1,
            "rgba(0,255,100,0.16)"
        );

        ctx.fillStyle =
            dangerGradient;

        ctx.fillRect(
            0,
            FLAME_DANGER_Y - 65,
            WIDTH,
            80
        );


        /*
         * Flames.
         */

        for (
            const flame of
            this.flames
        ) {

            const wave =
                Math.sin(
                    time *
                    flame.speed +
                    flame.seed
                );

            const wave2 =
                Math.sin(
                    time *
                    flame.speed *
                    1.7 +
                    flame.seed *
                    2
                );


            const height =
                flame.height +
                wave *
                8 +
                wave2 *
                5;


            const x =
                flame.x +
                wave2 *
                5;


            const bottom =
                HEIGHT + 5;

            const top =
                bottom -
                height;


            /*
             * Outer glow.
             */

            ctx.shadowBlur =
                18;

            ctx.shadowColor =
                "rgba(0,255,100,0.65)";


            const gradient =
                ctx.createLinearGradient(
                    0,
                    top,
                    0,
                    bottom
                );

            gradient.addColorStop(
                0,
                "#aaffb5"
            );

            gradient.addColorStop(
                0.25,
                "#35ff72"
            );

            gradient.addColorStop(
                0.65,
                "#00d84d"
            );

            gradient.addColorStop(
                1,
                "#008b38"
            );

            ctx.fillStyle =
                gradient;


            /*
             * Flame silhouette.
             */

            ctx.beginPath();

            ctx.moveTo(
                x -
                    flame.width /
                    2,
                bottom
            );

            ctx.bezierCurveTo(
                x -
                    flame.width *
                    0.55,
                bottom -
                    height *
                    0.25,

                x -
                    flame.width *
                    0.2,
                top +
                    height *
                    0.2,

                x,
                top
            );

            ctx.bezierCurveTo(
                x +
                    flame.width *
                    0.1,
                top +
                    height *
                    0.35,

                x +
                    flame.width *
                    0.5,
                bottom -
                    height *
                    0.35,

                x +
                    flame.width /
                    2,
                bottom
            );

            ctx.closePath();

            ctx.fill();

            ctx.shadowBlur = 0;
        }


        /*
         * Bright flame cores.
         */

        for (
            let i = 0;
            i < this.flames.length;
            i++
        ) {

            const flame =
                this.flames[i];

            const wave =
                Math.sin(
                    time *
                    flame.speed *
                    1.4 +
                    flame.seed
                );

            const height =
                flame.height *
