                0.5 +
                wave *
                5;

            const x =
                flame.x +
                Math.sin(
                    time *
                    flame.speed +
                    flame.seed
                ) *
                3;

            const bottom =
                HEIGHT + 2;

            const top =
                bottom -
                height;


            ctx.fillStyle =
                "rgba(210,255,170,0.85)";

            ctx.beginPath();

            ctx.moveTo(
                x -
                    flame.width *
                    0.15,
                bottom
            );

            ctx.quadraticCurveTo(
                x -
                    flame.width *
                    0.18,
                top +
                    height *
                    0.25,

                x,
                top
            );

            ctx.quadraticCurveTo(
                x +
                    flame.width *
                    0.2,
                top +
                    height *
                    0.3,

                x +
                    flame.width *
                    0.15,
                bottom
            );

            ctx.fill();
        }


        /*
         * Warning line.
         */

        ctx.fillStyle =
            "rgba(40,255,110,0.22)";

        ctx.fillRect(
            0,
            FLAME_DANGER_Y,
            WIDTH,
            3
        );


        /*
         * Danger text, subtle enough not to
         * dominate gameplay.
         */

        ctx.font =
            "bold 11px Arial";

        ctx.fillStyle =
            "rgba(190,255,205,0.65)";

        ctx.textAlign =
            "center";

        ctx.fillText(
            "DANGER",
            WIDTH / 2,
            FLAME_DANGER_Y - 8
        );
    }


    /* =====================================================
       DEATH
    ===================================================== */

    die() {

        if (
            this.gameOver
        ) {

            return;
        }


        this.gameOver =
            true;


        this.bestScore =
            Math.max(
                this.bestScore,
                this.score
            );


        this.bestHeight =
            Math.max(
                this.bestHeight,
                this.height
            );


        localStorage.setItem(
            "bounceBestScore",
            this.bestScore
        );

        localStorage.setItem(
            "bounceBestHeight",
            this.bestHeight
        );


        this.deathEffect();
    }


    /* =====================================================
       BACKGROUND
    ===================================================== */

    background() {

        const gradient =
            ctx.createLinearGradient(
                0,
                0,
                0,
                HEIGHT
            );


        gradient.addColorStop(
            0,
            "#050812"
        );

        gradient.addColorStop(
            1,
            "#0d1728"
        );


        ctx.fillStyle =
            gradient;


        ctx.fillRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );


        /*
         * Stars.
         */

        for (
            let i = 0;
            i < 70;
            i++
        ) {

            const x =
                (
                    i *
                    83
                ) %
                WIDTH;


            const y =
                (
                    i *
                    137 +
                    Math.floor(
                        this.cameraY *
                        0.15
                    )
                ) %
                HEIGHT;


            ctx.fillStyle =
                "rgba(100,140,180,0.35)";


            ctx.fillRect(
                x,
                y,
                1,
                1
            );
        }
    }


    /* =====================================================
       TEXT
    ===================================================== */

    textCentered(
        text,
        y,
        size,
        c
    ) {

        ctx.font =
            `${size}px Arial`;

        ctx.fillStyle =
            color(c);

        ctx.textAlign =
            "center";

        ctx.fillText(
            text,
            WIDTH / 2,
            y
        );
    }


    /* =====================================================
       HUD
    ===================================================== */

    hud() {

        ctx.textAlign =
            "center";


        /*
         * Score.
         */

        ctx.font =
            "bold 38px Arial";

        ctx.fillStyle =
            color(WHITE);

        ctx.fillText(
            this.score.toLocaleString(),
            WIDTH / 2,
            48
        );


        ctx.font =
            "16px Arial";

        ctx.fillStyle =
            "rgba(160,180,200,0.9)";

        ctx.fillText(
            "SCORE",
            WIDTH / 2,
            70
        );


        /*
         * Height.
         */

        ctx.font =
            "bold 20px Arial";

        ctx.fillStyle =
            "rgba(220,235,250,0.95)";

        ctx.fillText(
            `HEIGHT ${
                this.height.toLocaleString()
            }`,
            WIDTH / 2,
            100
        );


        /*
         * Flow.
         */

        if (
            this.flow > 0
        ) {

            ctx.font =
                "bold 23px Arial";

            ctx.fillStyle =
                this.flow >= 7
                    ? "#ffe06a"
                    : "#62f5d0";


            ctx.fillText(
                `FLOW x${this.flow}`,
                WIDTH / 2,
                132
            );
        }


        /*
         * Lifeline.
         */

        if (
            this.player.lifelineTimer >
            0
        ) {

            const percentage =
                clamp(
                    this.player.lifelineTimer /
                    LIFELINE_DURATION,
                    0,
                    1
                );


            ctx.font =
                "bold 16px Arial";

            ctx.fillStyle =
                "#ff9ee9";

            ctx.fillText(
                `LIFELINE ${
                    this.player.lifelineTimer.toFixed(1)
                }s`,
                WIDTH / 2,
                160
            );


            /*
             * Timer bar.
             */

            ctx.fillStyle =
                "rgba(255,255,255,0.12)";

            roundRect(
                WIDTH / 2 - 65,
                168,
                130,
                5,
                3
            );

            ctx.fillStyle =
                "#ff75dc";

            roundRect(
                WIDTH / 2 - 65,
                168,
                130 *
                    percentage,
                5,
                3
            );
        }


        /*
         * Dive indicator.
         */

        if (
            this.player.diving
        ) {

            ctx.font =
                "bold 18px Arial";

            ctx.fillStyle =
                "#ff7896";

            ctx.textAlign =
                "right";

            ctx.fillText(
                "DIVE!",
                WIDTH - 15,
                38
            );
        }
    }


    /* =====================================================
       BANNER
    ===================================================== */

    drawBanner() {

        if (
            this.bannerTimer <= 0
        ) {

            return;
        }


        const progress =
            this.bannerTimer /
            0.9;

        const alpha =
            Math.min(
                1,
                progress *
                2
            );


        ctx.font =
            "bold 30px Arial";

        ctx.textAlign =
            "center";

        ctx.fillStyle =
            rgba(
                this.bannerColor,
                alpha
            );

        ctx.shadowBlur =
            18;

        ctx.shadowColor =
            rgba(
                this.bannerColor,
                alpha *
                0.7
            );

        ctx.fillText(
            this.bannerText,
            WIDTH / 2,
            225
        );

        ctx.shadowBlur = 0;
    }


    /* =====================================================
       START SCREEN
    ===================================================== */

    startScreen() {

        ctx.fillStyle =
            "rgba(0,0,0,0.18)";

        ctx.fillRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );


        this.textCentered(
            "BOUNCE",
            270,
            66,
            WHITE
        );


        this.textCentered(
            "DRAG LEFT / RIGHT",
            350,
            25,
            [70,220,255]
        );


        this.textCentered(
            "REACH THE NEXT PLATFORM",
            382,
            15,
            [180,195,210]
        );


        this.textCentered(
            "SWIPE DOWN TO DIVE",
            425,
            17,
            [255,120,150]
        );


        this.textCentered(
            "GRAB GLOWING ORBS",
            460,
            17,
            [110,255,225]
        );


        this.textCentered(
            "🌈 LIFELINE = SECOND CHANCE",
            495,
            15,
            [255,150,235]
        );


        /*
         * Tiny flame preview.
         */

        ctx.fillStyle =
            "#28e969";

        ctx.shadowBlur =
            15;

        ctx.shadowColor =
            "rgba(0,255,100,0.6)";

        ctx.fillRect(
            80,
            530,
            320,
            3
        );

        ctx.shadowBlur = 0;


        this.textCentered(
            "DON'T FALL INTO THE FLAMES",
            555,
            14,
            [150,255,175]
        );


        this.textCentered(
            "TAP TO START",
            625,
            20,
            [220,230,240]
        );
    }


    /* =====================================================
       GAME OVER
    ===================================================== */

    gameOverScreen() {

        ctx.fillStyle =
            "rgba(0,0,0,0.68)";

        ctx.fillRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );


        this.textCentered(
            "GAME OVER",
            270,
            56,
            WHITE
        );


        this.textCentered(
            this.score.toLocaleString(),
            345,
            42,
            [70,220,255]
        );


        this.textCentered(
            "SCORE",
            370,
            15,
            [145,165,185]
        );


        this.textCentered(
            this.height.toLocaleString(),
            430,
            34,
            WHITE
        );


        this.textCentered(
            "HEIGHT",
            452,
            15,
            [145,165,185]
        );


        this.textCentered(
            this.bestScore.toLocaleString(),
            505,
            25,
            [190,200,215]
        );


        this.textCentered(
            "BEST SCORE",
            526,
            14,
            [125,145,165]
        );


        this.textCentered(
            this.bestHeight.toLocaleString(),
            570,
            25,
            [190,200,215]
        );


        this.textCentered(
            "BEST HEIGHT",
            591,
            14,
            [125,145,165]
        );


        this.textCentered(
            `MAX FLOW x${this.maxFlow}`,
            640,
            20,
            [98,245,208]
        );


        this.textCentered(
            "TAP ANYWHERE TO RETRY",
            700,
            18,
            WHITE
        );
    }


    /* =====================================================
       DRAW
    ===================================================== */

    draw() {

        ctx.save();

        ctx.scale(
            scale,
            scale
        );


        this.background();


        /*
         * Platforms.
         */

        for (
            const platform of
            this.platforms
        ) {

            platform.draw(
                this.cameraY
            );
        }


        /*
         * Orbs.
         */

        for (
            const orb of
            this.orbs
        ) {

            orb.draw(
                this.cameraY
            );
        }


        /*
         * Particles.
         */

        for (
            const particle of
            this.particles
        ) {

            particle.draw(
                this.cameraY
            );
        }


        /*
         * Player.
         */

        this.player.draw(
            this.cameraY
        );


        /*
         * Flames are always in screen space.
         */

        this.drawFlames();


        /*
         * HUD.
         */

        if (
            this.started
        ) {

            this.hud();

            this.drawBanner();
        }


        /*
         * Start screen.
         */

        if (
            !this.started
        ) {

            this.startScreen();
        }


        /*
         * Game over.
         */

        if (
            this.gameOver
        ) {

            this.gameOverScreen();
        }


        /*
         * Landing flash.
         */

        if (
            this.flash > 0
        ) {

            ctx.fillStyle =
                `rgba(255,255,255,${
                    this.flash
                })`;

            ctx.fillRect(
                0,
                0,
                WIDTH,
                HEIGHT
            );
        }


        ctx.restore();
    }
}


/* =========================================================
   COLOR HELPERS
========================================================= */

function hslToRgb(
    h,
    s,
    l
) {

    s /= 100;
    l /= 100;

    const k =
        n =>
            (
                n +
                h / 30
            ) % 12;

    const a =
        s *
        Math.min(
            l,
            1 - l
        );

    const f =
        n =>
            l -
            a *
            Math.max(
                -1,
                Math.min(
                    k(n) - 3,
                    Math.min(
                        9 - k(n),
                        1
                    )
                )
            );

    return [
        Math.round(
            255 * f(0)
        ),
        Math.round(
            255 * f(8)
        ),
        Math.round(
            255 * f(4)
        )
    ];
}


function roundRect(
    x,
    y,
    width,
    height,
    radius
) {

    ctx.beginPath();

    ctx.roundRect(
        x,
        y,
        width,
        height,
        radius
    );

    ctx.fill();
}


/* =========================================================
   GAME LOOP
========================================================= */

const game =
    new Game();

let lastTime =
    performance.now();


function loop(now) {

    let dt =
        (
            now -
            lastTime
        ) /
        1000;


    lastTime =
        now;


    /*
     * Prevent huge physics jumps.
     */

    dt =
        Math.min(
            dt,
            0.025
        );


    game.update(
        dt
    );


    /*
     * Screen shake.
     */

    if (
        game.shake > 0
    ) {

        const sx =
            (
                Math.random() *
                2 -
                1
            ) *
            game.shake;


        const sy =
            (
                Math.random() *
                2 -
                1
            ) *
            game.shake;


        ctx.save();


        ctx.translate(
            sx * scale,
            sy * scale
        );


        game.draw();


        ctx.restore();

    } else {

        game.draw();
    }


    requestAnimationFrame(
        loop
    );
}


requestAnimationFrame(
    loop
);
</script>
