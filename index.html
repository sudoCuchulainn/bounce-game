<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>BOUNCE</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #050b12;

    touch-action: none;
    user-select: none;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;
}

#game {
    display: block;

    background: #050b12;

    touch-action: none;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<script>
"use strict";

/* =========================================================
   BOUNCE
   =========================================================
   
   Core:
   - Automatic bouncing
   - Left/right steering
   - Deliberate left/right platform rhythm
   - Wide early platforms
   - Increasing difficulty
   - Flow combo
   
   Orbs:
   - GOLD       = +50 points
   - WHITE      = GHOST for a few seconds
   - RAINBOW    = INVULNERABLE safety net
   
   Hazards:
   - Blue/green animated flame death zone
   
   Feedback:
   - Floating score/status text
   - Particles
   - Screen shake
   - Flash
   - Subtle Web Audio
   - iPhone haptics where supported
   ========================================================= */


/* =========================================================
   CANVAS
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const WIDTH = 480;
const HEIGHT = 800;

let scale = 1;

function resize() {

    scale = Math.min(
        window.innerWidth / WIDTH,
        window.innerHeight / HEIGHT
    );

    canvas.width = WIDTH * scale;
    canvas.height = HEIGHT * scale;

    canvas.style.width =
        `${WIDTH * scale}px`;

    canvas.style.height =
        `${HEIGHT * scale}px`;
}

window.addEventListener("resize", resize);
resize();


/* =========================================================
   COLORS
========================================================= */

const WHITE = [245, 250, 255];

const PLATFORM_COLORS = [
    [70, 220, 255],
    [185, 100, 255],
    [255, 215, 80],
    [90, 255, 180],
    [255, 105, 150],
    [100, 150, 255]
];

const PLATFORM_DARK = [18, 34, 55];
const PLATFORM_HIGHLIGHT = [190, 245, 255];

const GOLD = [255, 215, 70];

const GHOST_WHITE = [245, 250, 255];

const FIRE_BLUE = [40, 210, 255];
const FIRE_GREEN = [60, 255, 150];


/* =========================================================
   PHYSICS
========================================================= */

const GRAVITY = 1500;

const BOUNCE_POWER = 980;

const DIVE_BOUNCE_POWER = 1320;

const MAX_FALL_SPEED = 1700;

const DIVE_ACCELERATION = 2500;

const AIR_ACCEL = 2100;

const AIR_FRICTION = 0.985;

const MAX_X_SPEED = 450;

const WALL_RESTITUTION = 0.92;

const PLATFORM_RESTITUTION = 0.98;

const BALL_RADIUS = 17;

const PHYSICS_STEPS = 6;


/* =========================================================
   PLATFORM GENERATION
========================================================= */

const CELL = 34;

/*
 * The platforms are intentionally spaced generously.
 *
 * The visual pattern remains:
 *
 * LEFT
 *
 *                         RIGHT
 *
 * LEFT
 *
 *                         RIGHT
 *
 * But there is enough vertical room to actually
 * complete the jump.
 */

const MIN_VERTICAL_GAP = 205;
const MAX_VERTICAL_GAP = 255;

const PLATFORM_SIDE_MARGIN = 55;


/* =========================================================
   CAMERA
========================================================= */

const CAMERA_TARGET_Y = 330;
const CAMERA_FOLLOW_SPEED = 7;


/* =========================================================
   PLATFORM MOVEMENT
========================================================= */

const SPAWN_INTERVAL = 0.55;
const DESPAWN_DISTANCE = 300;


/* =========================================================
   ORBS
========================================================= */

const ORB_RADIUS = 11;

const GOLD_ORB_SCORE = 50;

const GHOST_DURATION = 4.0;

const INVULNERABLE_DURATION = 5.0;


/* =========================================================
   FIRE
========================================================= */

const FIRE_HEIGHT = 62;

const FIRE_ZONE_Y = HEIGHT - FIRE_HEIGHT;


/* =========================================================
   INPUT
========================================================= */

let keyLeft = false;
let keyRight = false;
let keyDown = false;

let touchActive = false;

let touchStartX = 0;
let touchStartY = 0;

let touchX = 0;
let touchY = 0;


/* =========================================================
   AUDIO
========================================================= */

let audioContext = null;

function initAudio() {

    if (audioContext) {
        if (audioContext.state === "suspended") {
            audioContext.resume();
        }

        return;
    }

    try {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    } catch (error) {

        audioContext = null;
    }
}


function playTone(
    frequency,
    duration,
    type = "sine",
    volume = 0.035,
    slide = 0
) {

    if (!audioContext) {
        return;
    }

    try {

        const now =
            audioContext.currentTime;

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.type = type;

        oscillator.frequency.setValueAtTime(
            frequency,
            now
        );

        oscillator.frequency.linearRampToValueAtTime(
            Math.max(30, frequency + slide),
            now + duration
        );

        gain.gain.setValueAtTime(
            0.0001,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            volume,
            now + 0.008
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            now + duration
        );

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start(now);
        oscillator.stop(now + duration + 0.02);

    } catch (error) {
        /* Audio is optional. */
    }
}


function soundBounce() {

    playTone(
        240,
        0.075,
        "sine",
        0.028,
        90
    );
}


function soundSpecialBounce() {

    playTone(
        360,
        0.10,
        "sine",
        0.038,
        160
    );
}


function soundOrb(type) {

    if (type === "gold") {

        playTone(
            620,
            0.09,
            "sine",
            0.035,
            180
        );

        setTimeout(() => {
            playTone(
                880,
                0.08,
                "sine",
                0.025,
                100
            );
        }, 45);

    } else if (type === "ghost") {

        playTone(
            500,
            0.16,
            "triangle",
            0.035,
            350
        );

    } else if (type === "invulnerable") {

        playTone(
            420,
            0.12,
            "sine",
            0.035,
            260
        );

        setTimeout(() => {
            playTone(
                720,
                0.16,
                "sine",
                0.028,
                300
            );
        }, 55);
    }
}


function soundDeath() {

    playTone(
        180,
        0.24,
        "sawtooth",
        0.035,
        -120
    );
}


/* =========================================================
   HAPTICS
========================================================= */

function vibrate(pattern) {

    /*
     * navigator.vibrate works on some mobile browsers,
     * but iOS Safari has historically restricted this API.
     *
     * The game therefore attempts it without relying on it.
     *
     * On browsers/devices that support vibration,
     * these patterns provide subtle tactile feedback.
     */

    try {

        if (
            "vibrate" in navigator
        ) {

            navigator.vibrate(pattern);
        }

    } catch (error) {
        /* Haptics are optional. */
    }
}


function hapticBounce() {
    vibrate(8);
}


function hapticSpecial() {
    vibrate([10, 20, 14]);
}


function hapticOrb() {
    vibrate([8, 18, 8]);
}


function hapticDeath() {
    vibrate([20, 30, 35]);
}


/* =========================================================
   POINTER
========================================================= */

function pointerPosition(event) {

    const rect =
        canvas.getBoundingClientRect();

    return {

        x:
            (event.clientX - rect.left)
            / scale,

        y:
            (event.clientY - rect.top)
            / scale
    };
}


/* =========================================================
   TOUCH
========================================================= */

canvas.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        initAudio();

        const p =
            pointerPosition(event);

        touchActive = true;

        touchStartX = p.x;
        touchStartY = p.y;

        touchX = p.x;
        touchY = p.y;

        if (
            !game.started ||
            game.gameOver
        ) {

            game.restart();
        }
    }
);


canvas.addEventListener(
    "pointermove",
    event => {

        if (!touchActive) {
            return;
        }

        event.preventDefault();

        const p =
            pointerPosition(event);

        touchX = p.x;
        touchY = p.y;
    }
);


canvas.addEventListener(
    "pointerup",
    event => {

        event.preventDefault();

        touchActive = false;
    }
);


canvas.addEventListener(
    "pointercancel",
    () => {

        touchActive = false;
    }
);


/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
    "keydown",
    event => {

        initAudio();

        if (
            event.key === "ArrowLeft" ||
            event.key.toLowerCase() === "a"
        ) {

            keyLeft = true;
        }

        if (
            event.key === "ArrowRight" ||
            event.key.toLowerCase() === "d"
        ) {

            keyRight = true;
        }

        if (
            event.key === "ArrowDown"
        ) {

            keyDown = true;
        }

        if (
            event.code === "Space"
        ) {

            if (
                !game.started ||
                game.gameOver
            ) {

                game.restart();
            }
        }

        if (
            event.key === "Escape"
        ) {

            location.reload();
        }
    }
);


window.addEventListener(
    "keyup",
    event => {

        if (
            event.key === "ArrowLeft" ||
            event.key.toLowerCase() === "a"
        ) {

            keyLeft = false;
        }

        if (
            event.key === "ArrowRight" ||
            event.key.toLowerCase() === "d"
        ) {

            keyRight = false;
        }

        if (
            event.key === "ArrowDown"
        ) {

            keyDown = false;
        }
    }
);


/* =========================================================
   HELPERS
========================================================= */

function clamp(
    value,
    minimum,
    maximum
) {

    return Math.max(
        minimum,
        Math.min(
            maximum,
            value
        )
    );
}


function lerp(
    a,
    b,
    amount
) {

    return a +
        (b - a) *
        amount;
}


function color(c) {

    return `rgb(${c[0]},${c[1]},${c[2]})`;
}


function rgba(
    c,
    alpha
) {

    return `rgba(${c[0]},${c[1]},${c[2]},${alpha})`;
}


function randomRange(
    minimum,
    maximum
) {

    return minimum +
        Math.random() *
        (
            maximum -
            minimum
        );
}


/* =========================================================
   FLOATING MESSAGE
========================================================= */

class FloatingMessage {

    constructor(
        text,
        x,
        y,
        c,
        size = 22
    ) {

        this.text = text;

        this.x = x;
        this.y = y;

        this.vy = -55;

        this.life = 1.0;

        this.maxLife = 1.0;

        this.color = c;

        this.size = size;
    }


    update(dt) {

        this.y +=
            this.vy *
            dt;

        this.vy *=
            0.97;

        this.life -=
            dt;
    }


    draw(cameraY) {

        if (
            this.life <= 0
        ) {

            return;
        }

        const alpha =
            clamp(
                this.life / 0.25,
                0,
                1
            );

        ctx.save();

        ctx.globalAlpha =
            alpha;

        ctx.font =
            `bold ${this.size}px Arial`;

        ctx.textAlign =
            "center";

        ctx.shadowBlur = 10;

        ctx.shadowColor =
            rgba(
                this.color,
                0.7
            );

        ctx.fillStyle =
            color(
                this.color
            );

        ctx.fillText(
            this.text,
            this.x,
            this.y + cameraY
        );

        ctx.restore();
    }
}


/* =========================================================
   PARTICLE
========================================================= */

class Particle {

    constructor(
        x,
        y,
        c,
        power = 1
    ) {

        this.x = x;
        this.y = y;

        const angle =
            Math.random() *
            Math.PI *
            2;

        const speed =
            (
                70 +
                Math.random() *
                200
            ) *
            power;

        this.vx =
            Math.cos(angle) *
            speed;

        this.vy =
            Math.sin(angle) *
            speed;

        this.life =
            0.2 +
            Math.random() *
            0.4;

        this.maxLife =
            this.life;

        this.size =
            2 +
            Math.random() *
            4;

        this.color = c;
    }


    update(dt) {

        this.x +=
            this.vx *
            dt;

        this.y +=
            this.vy *
            dt;

        this.vy +=
            450 *
            dt;

        this.vx *=
            0.985;

        this.life -=
            dt;
    }


    draw(cameraY) {

        if (
            this.life <= 0
        ) {

            return;
        }

        const alpha =
            this.life /
            this.maxLife;

        const size =
            Math.max(
                1,
                this.size *
                alpha
            );

        ctx.fillStyle =
            rgba(
                this.color,
                alpha
            );

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y + cameraY,
            size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}


/* =========================================================
   PLATFORM
========================================================= */

class Platform {

    constructor(
        x,
        y,
        width = 5,
        moving = false,
        bonus = false
    ) {

        this.x = x;
        this.y = y;

        this.widthCells =
            width;

        this.width =
            width *
            CELL;

        this.height =
            CELL;

        this.vx =
            moving
                ? (
                    Math.random() < 0.5
                        ? -1
                        : 1
                ) *
                (
                    25 +
                    Math.random() *
                    55
                )
                : 0;

        this.vy = 0;

        this.moving =
            moving;

        this.bonus =
            bonus;

        this.color =
            bonus
                ? [255, 215, 80]
                : PLATFORM_COLORS[
                    Math.floor(
                        Math.random() *
                        PLATFORM_COLORS.length
                    )
                ];

        this.scoredThisVisit =
            false;

        this.id =
            Platform.nextId++;
    }


    get rect() {

        return {

            left:
                this.x -
                this.width / 2,

            right:
                this.x +
                this.width / 2,

            top:
                this.y -
                CELL / 2,

            bottom:
                this.y +
                CELL / 2
        };
    }


    update(
        dt,
        platformSpeed
    ) {

        this.y +=
            platformSpeed *
            dt;

        if (
            this.moving
        ) {

            this.x +=
                this.vx *
                dt;

            const half =
                this.width / 2;

            if (
                this.x -
                half <
                8
            ) {

                this.x =
                    8 +
                    half;

                this.vx =
                    Math.abs(
                        this.vx
                    );
            }

            if (
                this.x +
                half >
                WIDTH - 8
            ) {

                this.x =
                    WIDTH -
                    8 -
                    half;

                this.vx =
                    -Math.abs(
                        this.vx
                    );
            }
        }
    }


    draw(cameraY) {

        const r =
            this.rect;

        const sy =
            r.top +
            cameraY;

        if (
            sy >
                HEIGHT + 100 ||
            sy <
                -100
        ) {

            return;
        }

        /*
         * Glow.
         */

        ctx.save();

        ctx.shadowBlur = 13;

        ctx.shadowColor =
            rgba(
                this.color,
                0.28
            );

        ctx.fillStyle =
            color(
                PLATFORM_DARK
            );

        roundRect(
            r.left,
            sy + 5,
            this.width,
            CELL,
            7
        );

        ctx.shadowBlur = 0;

        ctx.fillStyle =
            color(
                this.color
            );

        roundRect(
            r.left,
            sy,
            this.width,
            CELL,
            7
        );

        ctx.strokeStyle =
            color(
                PLATFORM_HIGHLIGHT
            );

        ctx.lineWidth = 3;

        ctx.beginPath();

        ctx.moveTo(
            r.left + 7,
            sy + 5
        );

        ctx.lineTo(
            r.right - 7,
            sy + 5
        );

        ctx.stroke();

        ctx.restore();


        if (
            this.moving
        ) {

            ctx.fillStyle =
                "rgba(255,255,255,0.55)";

            ctx.beginPath();

            ctx.arc(
                this.x,
                sy + CELL / 2,
                3,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }


        if (
            this.bonus
        ) {

            ctx.strokeStyle =
                "rgba(255,255,255,0.8)";

            ctx.lineWidth = 2;

            ctx.beginPath();

            ctx.arc(
                this.x,
                sy + CELL / 2,
                CELL * 0.32,
                0,
                Math.PI * 2
            );

            ctx.stroke();
        }
    }
}


Platform.nextId = 1;


function roundRect(
    x,
    y,
    width,
    height,
    radius
) {

    ctx.beginPath();

    ctx.roundRect(
        x,
        y,
        width,
        height,
        radius
    );

    ctx.fill();
}


/* =========================================================
   ORB
========================================================= */

class Orb {

    constructor(
        x,
        y,
        type
    ) {

        this.x = x;
        this.y = y;

        this.type = type;

        this.radius =
            ORB_RADIUS;

        this.life = 0;

        this.phase =
            Math.random() *
            Math.PI *
            2;

        this.collected = false;
    }


    update(dt) {

        this.phase +=
            dt * 3;

        this.life +=
            dt;
    }


    get color() {

        if (
            this.type === "gold"
        ) {

            return GOLD;
        }

        if (
            this.type === "ghost"
        ) {

            return GHOST_WHITE;
        }

        return [
            255,
            100,
            220
        ];
    }


    draw(cameraY) {

        if (
            this.collected
        ) {

            return;
        }

        const bob =
            Math.sin(
                this.phase
            ) * 4;

        const sy =
            this.y +
            cameraY +
            bob;

        ctx.save();

        /*
         * Large soft glow.
         */

        ctx.shadowBlur =
            25;

        if (
            this.type ===
            "rainbow"
        ) {

            const hue =
                (
                    this.life *
                    100
                ) % 360;

            ctx.shadowColor =
                `hsla(${hue},100%,65%,0.9)`;

        } else {

            ctx.shadowColor =
                rgba(
                    this.color,
                    0.85
                );
        }


        /*
         * Rainbow orb cycles through
         * the entire spectrum.
         */

        if (
            this.type ===
            "rainbow"
        ) {

            const gradient =
                ctx.createRadialGradient(
                    this.x,
                    sy,
                    1,
                    this.x,
                    sy,
                    this.radius * 1.4
                );

            const hue =
                (
                    this.life *
                    120
                ) % 360;

            gradient.addColorStop(
                0,
                "#ffffff"
            );

            gradient.addColorStop(
                0.35,
                `hsl(${hue},100%,70%)`
            );

            gradient.addColorStop(
                0.7,
                `hsl(${hue + 90},100%,60%)`
            );

            gradient.addColorStop(
                1,
                `hsl(${hue + 180},100%,50%)`
            );

            ctx.fillStyle =
                gradient;

        } else {

            ctx.fillStyle =
                color(
                    this.color
                );
        }


        ctx.beginPath();

        ctx.arc(
            this.x,
            sy,
            this.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /*
         * White hot center.
         */

        ctx.shadowBlur = 0;

        ctx.fillStyle =
            "rgba(255,255,255,0.9)";

        ctx.beginPath();

        ctx.arc(
            this.x - 3,
            sy - 3,
            this.radius * 0.25,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /*
         * Orbit ring.
         */

        ctx.strokeStyle =
            this.type === "rainbow"
                ? "rgba(255,255,255,0.8)"
                : rgba(
                    this.color,
                    0.55
                );

        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.arc(
            this.x,
            sy,
            this.radius + 5,
            this.phase,
            this.phase +
                Math.PI * 1.25
        );

        ctx.stroke();

        ctx.restore();
    }
}


/* =========================================================
   PLAYER
========================================================= */

class Player {

    constructor() {

        this.reset();
    }


    reset() {

        this.x =
            WIDTH / 2;

        this.y =
            520;

        this.vx = 0;
        this.vy = 0;

        this.radius =
            BALL_RADIUS;

        this.squash = 1;
        this.stretch = 1;

        this.trail = [];

        this.bounces = 0;

        this.diving = false;

        this.ghostTimer = 0;

        this.invulnerableTimer = 0;

        this.lastPlatform = null;
    }


    get ghost() {

        return this.ghostTimer > 0;
    }


    get invulnerable() {

        return this.invulnerableTimer > 0;
    }


    control(dt) {

        let direction = 0;


        /*
         * Keyboard.
         */

        if (keyLeft) {
            direction--;
        }

        if (keyRight) {
            direction++;
        }


        /*
         * Touch steering.
         */

        if (
            touchActive
        ) {

            const dx =
                touchX -
                touchStartX;

            if (
                Math.abs(dx) >
                8
            ) {

                direction =
                    clamp(
                        dx / 70,
                        -1,
                        1
                    );
            }
        }


        this.vx +=
            direction *
            AIR_ACCEL *
            dt;

        this.vx *=
            AIR_FRICTION;

        this.vx =
            clamp(
                this.vx,
                -MAX_X_SPEED,
                MAX_X_SPEED
            );


        /*
         * Dive.
         *
         * IMPORTANT:
         *
         * Dive only triggers from a deliberate
         * downward gesture.
         *
         * It does NOT stay active merely because
         * the finger happens to be below the
         * original touch point.
         */

        this.diving = false;

        if (
            this.vy > 0
        ) {

            if (
                keyDown
            ) {

                this.diving = true;
            }

            /*
             * A touch dive requires:
             *
             * 1. The finger moves down significantly.
             * 2. The movement is actually happening now.
             *
             * The vertical gesture is measured from
             * the most recent movement rather than
             * continuously from the original touch.
             */

            if (
                touchActive &&
                touchY -
                    touchStartY >
                    65 &&
                Math.abs(
                    touchY -
                    touchStartY
                ) >
                    Math.abs(
                        touchX -
                        touchStartX
                    ) *
                    1.2
            ) {

                this.diving = true;
            }


            if (
                this.diving
            ) {

                this.vy +=
                    DIVE_ACCELERATION *
                    dt;

                this.vy =
                    Math.min(
                        this.vy,
                        MAX_FALL_SPEED
                    );
            }
        }
    }


    gravity(dt) {

        /*
         * Ghost still has normal gravity.
         *
         * It only changes collision behavior.
         */

        this.vy +=
            GRAVITY *
            dt;

        this.vy =
            Math.min(
                this.vy,
                MAX_FALL_SPEED
            );
    }


    move(dt) {

        this.x +=
            this.vx *
            dt;

        this.y +=
            this.vy *
            dt;
    }


    wallCollision() {

        if (
            this.x -
            this.radius <
            0
        ) {

            this.x =
                this.radius;

            this.vx =
                Math.abs(
                    this.vx
                ) *
                WALL_RESTITUTION;

            return true;
        }


        if (
            this.x +
            this.radius >
            WIDTH
        ) {

            this.x =
                WIDTH -
                this.radius;

            this.vx =
                -Math.abs(
                    this.vx
                ) *
                WALL_RESTITUTION;

            return true;
        }

        return false;
    }


    /*
     * Calculate a natural ricochet from a
     * platform surface.
     *
     * Unlike the old behavior, bottom and side
     * impacts are not simply "reverse velocity".
     *
     * The incoming trajectory is reflected around
     * the collision normal, preserving the shape
     * of the trajectory while losing a little energy.
     */

    ricochet(
        nx,
        ny,
        platformVy
    ) {

        const relativeVx =
            this.vx;

        const relativeVy =
            this.vy -
            platformVy;

        const dot =
            relativeVx * nx +
            relativeVy * ny;


        if (
            dot >= 0
        ) {

            return false;
        }


        /*
         * Reflect around surface normal.
         */

        this.vx -=
            2 *
            dot *
            nx;

        this.vy -=
            2 *
            dot *
            ny;


        /*
         * Slight energy loss.
         */

        this.vx *=
            PLATFORM_RESTITUTION;

        this.vy *=
            PLATFORM_RESTITUTION;


        return true;
    }


    topBounce(
        platform
    ) {

        let power =
            BOUNCE_POWER;


        if (
            this.diving
        ) {

            const bonus =
                Math.max(
                    0,
                    this.vy
                ) *
                0.45;

            power =
                Math.max(
                    DIVE_BOUNCE_POWER,
                    BOUNCE_POWER +
                    bonus
                );
        }


        this.vy =
            -power;

        this.squash =
            1.4;

        this.stretch =
            0.65;

        this.bounces++;


        const wasDive =
            this.diving;

        this.diving =
            false;


        return wasDive;
    }


    updateTimers(dt) {

        if (
            this.ghostTimer > 0
        ) {

            this.ghostTimer =
                Math.max(
                    0,
                    this.ghostTimer - dt
                );
        }


        if (
            this.invulnerableTimer > 0
        ) {

            this.invulnerableTimer =
                Math.max(
                    0,
                    this.invulnerableTimer - dt
                );
        }
    }


    updateVisuals() {

        this.squash =
            lerp(
                this.squash,
                1,
                0.18
            );

        this.stretch =
            lerp(
                this.stretch,
                1,
                0.18
            );


        this.trail.push({

            x:
                this.x,

            y:
                this.y
        });


        if (
            this.trail.length >
            14
        ) {

            this.trail.shift();
        }
    }


    draw(cameraY) {

        /*
         * Trail.
         */

        for (
            let i = 0;
            i < this.trail.length;
            i++
        ) {

            const p =
                this.trail[i];

            const progress =
                i /
                Math.max(
                    1,
                    this.trail.length
                );

            ctx.fillStyle =
                `rgba(80,210,255,${
                    0.06 +
                    progress *
                    0.14
                })`;

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y + cameraY,
                Math.max(
                    2,
                    this.radius *
                    progress
                ),
                0,
                Math.PI * 2
            );

            ctx.fill();
        }


        const width =
            this.radius *
            2 *
            this.squash;

        const height =
            this.radius *
            2 *
            this.stretch;

        const sy =
            this.y +
            cameraY;


        ctx.save();


        /*
         * Ghost appearance.
         */

        if (
            this.ghost
        ) {

            ctx.globalAlpha =
                0.58 +
                Math.sin(
                    performance.now() /
                    70
                ) *
                0.12;

            ctx.shadowBlur =
                30;

            ctx.shadowColor =
                "rgba(255,255,255,0.9)";

        } else if (
            this.invulnerable
        ) {

            const hue =
                (
                    performance.now() /
                    5
                ) % 360;

            ctx.shadowBlur =
                28;

            ctx.shadowColor =
                `hsla(${hue},100%,65%,0.9)`;
        }


        ctx.fillStyle =
            "#f5faff";

        ctx.beginPath();

        ctx.ellipse(
            this.x,
            sy,
            width / 2,
            height / 2,
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.shadowBlur = 0;


        /*
         * Player energy color.
         */

        let innerColor =
            "#50c8ff";

        if (
            this.ghost
        ) {

            innerColor =
                "#ffffff";

        } else if (
            this.invulnerable
        ) {

            innerColor =
                `hsl(${
                    (
                        performance.now() /
                        5
                    ) % 360
                },100%,65%)`;
        }


        ctx.fillStyle =
            innerColor;

        ctx.beginPath();

        ctx.ellipse(
            this.x -
                width * 0.18,

            sy -
                height * 0.22,

            Math.max(
                3,
                width * 0.15
            ),

            Math.max(
                3,
                height * 0.12
            ),

            0,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /*
         * Ghost ring.
         */

        if (
            this.ghost
        ) {

            ctx.strokeStyle =
                "rgba(255,255,255,0.75)";

            ctx.lineWidth = 2;

            ctx.beginPath();

            ctx.arc(
                this.x,
                sy,
                this.radius + 7,
                0,
                Math.PI * 2
            );

            ctx.stroke();
        }


        ctx.restore();
    }
}


/* =========================================================
   FIRE
========================================================= */

class Fire {

    constructor() {

        this.t = 0;

        this.flames = [];

        /*
         * Build a fixed collection of flame tongues.
         *
         * Each tongue has its own:
         * - x position
         * - height
         * - width
         * - phase
         * - speed
         */

        for (
            let x = -10;
            x < WIDTH + 20;
            x += 18
        ) {

            this.flames.push({

                x:
                    x +
                    randomRange(
                        -7,
                        7
                    ),

                height:
                    randomRange(
                        30,
                        68
                    ),

                width:
                    randomRange(
                        18,
                        31
                    ),

                phase:
                    Math.random() *
                    Math.PI *
                    2,

                speed:
                    randomRange(
                        3,
                        6
                    )
            });
        }
    }


    update(dt) {

        this.t += dt;
    }


    draw() {

        /*
         * Dark atmospheric glow behind
         * the flame line.
         */

        const glow =
            ctx.createLinearGradient(
                0,
                FIRE_ZONE_Y - 85,
                0,
                HEIGHT
            );

        glow.addColorStop(
            0,
            "rgba(20,180,220,0)"
        );

        glow.addColorStop(
            0.45,
            "rgba(20,220,190,0.07)"
        );

        glow.addColorStop(
            1,
            "rgba(30,255,130,0.22)"
        );

        ctx.fillStyle =
            glow;

        ctx.fillRect(
            0,
            FIRE_ZONE_Y - 85,
            WIDTH,
            85
        );


        /*
         * Dark base.
         */

        ctx.fillStyle =
            "rgba(10,80,75,0.5)";

        ctx.fillRect(
            0,
            FIRE_ZONE_Y + 32,
            WIDTH,
            FIRE_HEIGHT - 32
        );


        /*
         * Draw flames from back to front.
         */

        for (
            const flame of this.flames
        ) {

            this.drawFlame(
                flame,
                false
            );
        }


        /*
         * Front layer is smaller and brighter.
         */

        for (
            const flame of this.flames
        ) {

            this.drawFlame(
                flame,
                true
            );
        }


        /*
         * Bright horizontal ember line.
         */

        const lineGradient =
            ctx.createLinearGradient(
                0,
                FIRE_ZONE_Y,
                WIDTH,
                FIRE_ZONE_Y
            );

        lineGradient.addColorStop(
            0,
            "#24dfff"
        );

        lineGradient.addColorStop(
            0.5,
            "#70ffbd"
        );

        lineGradient.addColorStop(
            1,
            "#24dfff"
        );

        ctx.shadowBlur = 14;

        ctx.shadowColor =
            "rgba(60,255,200,0.75)";

        ctx.fillStyle =
            lineGradient;

        ctx.fillRect(
            0,
            FIRE_ZONE_Y + 3,
            WIDTH,
            3
        );

        ctx.shadowBlur = 0;
    }


    drawFlame(
        flame,
        front
    ) {

        const wave =
            Math.sin(
                this.t *
                flame.speed +
                flame.phase
            );

        const wave2 =
            Math.sin(
                this.t *
                flame.speed *
                1.7 +
                flame.phase *
                2
            );


        const height =
            flame.height *
            (
                0.72 +
                wave *
                0.18 +
                wave2 *
                0.10
            ) *
            (
                front
                    ? 0.62
                    : 1
            );


        const width =
            flame.width *
            (
                0.9 +
                wave *
                0.08
            ) *
            (
                front
                    ? 0.78
                    : 1
            );


        const baseY =
            HEIGHT + 4;


        const topY =
            FIRE_ZONE_Y -
            height;


        const lean =
            wave *
            width *
            0.42;


        /*
         * Outer blue/green flame.
         *
         * The shape uses several quadratic curves
         * so it has an actual flame silhouette.
         */

        const gradient =
            ctx.createLinearGradient(
                flame.x,
                baseY,
                flame.x + lean,
                topY
            );


        if (
            front
        ) {

            gradient.addColorStop(
                0,
                "#22ff9a"
            );

            gradient.addColorStop(
                0.45,
                "#31e8d0"
            );

            gradient.addColorStop(
                1,
                "#28bfff"
            );

        } else {

            gradient.addColorStop(
                0,
                "#0bcf9a"
            );

            gradient.addColorStop(
                0.55,
                "#17bde8"
            );

            gradient.addColorStop(
                1,
                "#248cff"
            );
        }


        ctx.save();

        ctx.globalAlpha =
            front
                ? 0.82
                : 0.48;

        ctx.fillStyle =
            gradient;

        ctx.shadowBlur =
            front
                ? 18
                : 28;

        ctx.shadowColor =
            front
                ? "rgba(50,255,200,0.55)"
                : "rgba(30,190,255,0.3)";


        ctx.beginPath();

        ctx.moveTo(
            flame.x -
                width / 2,
            baseY
        );


        /*
         * Left flame wall.
         */

        ctx.quadraticCurveTo(
            flame.x -
                width * 0.58,
            FIRE_ZONE_Y +
                height * 0.38,

            flame.x -
                width * 0.20,
            topY +
                height * 0.24
        );


        /*
         * Sharp flame tip.
         */

        ctx.quadraticCurveTo(
            flame.x -
                width * 0.03 +
                lean,
            topY +
                height * 0.08,

            flame.x +
                lean,
            topY
        );


        /*
         * Right tongue.
         */

        ctx.quadraticCurveTo(
            flame.x +
                width * 0.18 +
                lean,
            topY +
                height * 0.30,

            flame.x +
                width * 0.34,
            FIRE_ZONE_Y +
                height * 0.38
        );


        /*
         * Right wall.
         */

        ctx.quadraticCurveTo(
            flame.x +
                width * 0.58,
            FIRE_ZONE_Y +
                height * 0.65,

            flame.x +
                width / 2,
            baseY
        );


        ctx.closePath();

        ctx.fill();

        ctx.restore();


        /*
         * Hot inner tongue.
         */

        if (
            front
        ) {

            const innerHeight =
                height *
                0.62;

            const innerWidth =
                width *
                0.42;

            const innerTop =
                FIRE_ZONE_Y -
                innerHeight;


            ctx.save();

            ctx.globalAlpha =
                0.72;

            const innerGradient =
                ctx.createLinearGradient(
                    flame.x,
                    baseY,
                    flame.x + lean * 0.4,
                    innerTop
                );

            innerGradient.addColorStop(
                0,
                "#b8ffe5"
            );

            innerGradient.addColorStop(
                0.45,
                "#53ffd0"
            );

            innerGradient.addColorStop(
                1,
                "#58dfff"
            );

            ctx.fillStyle =
                innerGradient;

            ctx.beginPath();

            ctx.moveTo(
                flame.x -
                    innerWidth / 2,
                baseY
            );

            ctx.quadraticCurveTo(
                flame.x -
                    innerWidth * 0.35,
                FIRE_ZONE_Y +
                    innerHeight * 0.2,

                flame.x +
                    lean * 0.2,
                innerTop
            );

            ctx.quadraticCurveTo(
                flame.x +
                    innerWidth * 0.3,
                FIRE_ZONE_Y +
                    innerHeight * 0.25,

                flame.x +
                    innerWidth / 2,
                baseY
            );

            ctx.closePath();

            ctx.fill();

            ctx.restore();
        }
    }


    isDeadly(player) {

        return (
            player.y +
            player.radius >
            FIRE_ZONE_Y
        );
    }
}


/* =========================================================
   GAME
========================================================= */

class Game {

    constructor() {

        this.player =
            new Player();

        this.platforms = [];

        this.orbs = [];

        this.particles = [];

        this.messages = [];

        this.fire =
            new Fire();

        this.cameraY = 0;


        /*
         * SCORE
         */

        this.score = 0;

        this.bestScore =
            Number(
                localStorage.getItem(
                    "bounceBestScore"
                ) || 0
            );


        /*
         * HEIGHT
         */

        this.height = 0;

        this.bestHeight =
            Number(
                localStorage.getItem(
                    "bounceBestHeight"
                ) || 0
            );


        /*
         * FLOW
         */

        this.flow = 0;

        this.maxFlow = 0;


        /*
         * PLATFORM SPAWNING
         */

        this.spawnTimer = 0;

        this.nextPlatformY = -100;

        this.lastPlatformSide =
            "left";


        /*
         * ORB SPAWNING
         */

        this.orbTimer = 0;


        /*
         * GAME STATE
         */

        this.started = false;

        this.gameOver = false;


        /*
         * EFFECTS
         */

        this.shake = 0;

        this.flash = 0;


        /*
         * HEIGHT SPEED TRACKING
         */

        this.lastHeight = 0;

        this.lastHeightTime =
            performance.now() /
            1000;


        this.spawnInitialPlatforms();
    }


    restart() {

        initAudio();

        this.player.reset();

        this.platforms = [];

        this.orbs = [];

        this.particles = [];

        this.messages = [];

        this.cameraY = 0;

        this.score = 0;

        this.height = 0;

        this.flow = 0;

        this.maxFlow = 0;

        this.spawnTimer = 0;

        this.orbTimer = 0;

        this.gameOver = false;

        this.started = true;

        this.shake = 0;

        this.flash = 0;

        this.lastPlatformSide =
            "left";

        this.lastHeight = 0;

        this.lastHeightTime =
            performance.now() /
            1000;

        this.spawnInitialPlatforms();
    }


    difficulty() {

        /*
         * Slow, forgiving ramp.
         *
         * It takes a while before the game
         * reaches serious difficulty.
         */

        return clamp(
            this.height /
                9000,
            0,
            1
        );
    }


    platformSpeed() {

        return lerp(
            18,
            125,
            this.difficulty()
        );
    }


    /* =====================================================
       INITIAL PLATFORMS
    ===================================================== */

    spawnInitialPlatforms() {

        this.platforms = [];


        /*
         * Starting platform.
         */

        this.platforms.push(
            new Platform(
                WIDTH * 0.50,
                625,
                6,
                false,
                false
            )
        );


        /*
         * First jumps.
         *
         * Large vertical gaps.
         *
         * The left/right pattern remains.
         */

        this.platforms.push(
            new Platform(
                120,
                420,
                6,
                false,
                false
            )
        );


        this.platforms.push(
            new Platform(
                365,
                195,
                6,
                false,
                false
            )
        );


        this.platforms.push(
            new Platform(
                115,
                -30,
                6,
                false,
                false
            )
        );


        this.nextPlatformY =
            -255;

        this.lastPlatformSide =
            "left";
    }


    /* =====================================================
       PLATFORM SPAWNING
    ===================================================== */

    spawnPlatform() {

        const d =
            this.difficulty();


        const previous =
            this.platforms
                .filter(
                    p =>
                        p.y <
                        this.nextPlatformY +
                        300
                )
                .sort(
                    (a, b) =>
                        b.y -
                        a.y
                )[0];


        let side;


        /*
         * Keep the strong visual rhythm.
         *
         * Center platforms are uncommon.
         */

        const variationChance =
            lerp(
                0.05,
                0.18,
                d
            );


        if (
            Math.random() <
            variationChance
        ) {

            side =
                "center";

        } else {

            side =
                this.lastPlatformSide ===
                    "left"
                    ? "right"
                    : "left";
        }


        let x;


        if (
            side === "left"
        ) {

            x =
                75 +
                Math.random() *
                105;

        } else if (
            side === "right"
        ) {

            x =
                WIDTH -
                (
                    75 +
                    Math.random() *
                    105
                );

        } else {

            x =
                WIDTH / 2 +
                (
                    Math.random() *
                    130 -
                    65
                );
        }


        /*
         * Keep horizontal movement reasonable.
         */

        if (
            previous
        ) {

            const maximumReach =
                lerp(
                    300,
                    390,
                    d
                );

            if (
                Math.abs(
                    x -
                    previous.x
                ) >
                maximumReach
            ) {

                x =
                    previous.x +
                    (
                        x >
                        previous.x
                            ? maximumReach
                            : -maximumReach
                    );
            }
        }


        x =
            clamp(
                x,
                PLATFORM_SIDE_MARGIN,
                WIDTH -
                    PLATFORM_SIDE_MARGIN
            );


        /*
         * Platform width.
         *
         * Early game stays wide.
         */

        let width;


        if (
            d < 0.35
        ) {

            width = 6;

        } else if (
            d < 0.65
        ) {

            width =
                Math.random() <
                0.75
                    ? 5
                    : 6;

        } else {

            width =
                [4, 5, 5, 6][
                    Math.floor(
                        Math.random() *
                        4
                    )
                ];
        }


        /*
         * Moving platforms appear later.
         */

        const movingChance =
            d < 0.4
                ? 0
                : lerp(
                    0,
                    0.35,
                    (
                        d -
                        0.4
                    ) /
                    0.6
                );


        const moving =
            Math.random() <
            movingChance;


        const bonus =
            Math.random() <
            0.07;


        const platform =
            new Platform(
                x,
                this.nextPlatformY,
                width,
                moving,
                bonus
            );


        this.platforms.push(
            platform
        );


        if (
            x <
            WIDTH * 0.38
        ) {

            this.lastPlatformSide =
                "left";

        } else if (
            x >
            WIDTH * 0.62
        ) {

            this.lastPlatformSide =
                "right";
        }


        /*
         * Wide vertical gap.
         *
         * Difficulty adds only gradually.
         */

        const gap =
            lerp(
                MIN_VERTICAL_GAP,
                MAX_VERTICAL_GAP,
                d
            ) +
            (
                Math.random() *
                26 -
                13
            );


        this.nextPlatformY -=
            gap;
    }


    /* =====================================================
       ORB SPAWNING
    ===================================================== */

    spawnOrb() {

        const d =
            this.difficulty();


        /*
         * Most common:
         * GOLD
         *
         * Less common:
         * GHOST
         *
         * Rare:
         * RAINBOW
         */

        const roll =
            Math.random();


        let type;


        if (
            roll < 0.70
        ) {

            type = "gold";

        } else if (
            roll < 0.93
        ) {

            type = "ghost";

        } else {

            type = "rainbow";
        }


        /*
         * Put the orb between platforms.
         *
         * This makes it a choice rather than
         * something automatically collected.
         */

        const visiblePlatforms =
            this.platforms
                .filter(
                    p =>
                        p.y >
                            this.nextPlatformY &&
                        p.y <
                            this.nextPlatformY +
                            300
                );


        let x =
            WIDTH / 2;

        let y =
            this.nextPlatformY +
            90;


        if (
            visiblePlatforms.length
        ) {

            const platform =
                visiblePlatforms[
                    Math.floor(
                        Math.random() *
                        visiblePlatforms.length
                    )
                ];


            x =
                clamp(
                    platform.x +
                        randomRange(
                            -70,
                            70
                        ),
                    35,
                    WIDTH - 35
                );


            y =
                platform.y -
                randomRange(
                    70,
                    110
                );
        }


        this.orbs.push(
            new Orb(
                x,
                y,
                type
            )
        );
    }


    /* =====================================================
       EFFECTS
    ===================================================== */

    addParticles(
        x,
        y,
        c,
        amount,
        power = 1
    ) {

        for (
            let i = 0;
            i < amount;
            i++
        ) {

            this.particles.push(
                new Particle(
                    x,
                    y,
                    c,
                    power
                )
            );
        }
    }


    addMessage(
        text,
        x,
        y,
        c,
        size = 22
    ) {

        this.messages.push(
            new FloatingMessage(
                text,
                x,
                y,
                c,
                size
            )
        );
    }


    bounceEffect(
        x,
        y,
        platform,
        type
    ) {

        if (
            type === "corner"
        ) {

            this.addParticles(
                x,
                y,
                [255, 235, 120],
                32,
                1.4
            );

            this.shake = 7;

            this.flash = 0.12;

            soundSpecialBounce();

            hapticSpecial();

        } else if (
            type === "edge"
        ) {

            this.addParticles(
                x,
                y,
                [255, 215, 80],
                25,
                1.15
            );

            this.shake = 5;

            soundSpecialBounce();

            hapticSpecial();

        } else if (
            type === "flow"
        ) {

            this.addParticles(
                x,
                y,
                [90, 255, 220],
                30,
                1.25
            );

            this.shake = 4;

            this.flash = 0.08;

            soundSpecialBounce();

            hapticSpecial();

        } else if (
            type === "dive"
        ) {

            this.addParticles(
                x,
                y,
                [255, 105, 150],
                28,
                1.3
            );

            this.shake = 6;

            soundSpecialBounce();

            hapticSpecial();

        } else {

            this.addParticles(
                x,
                y,
                platform.color,
                18,
                1
            );

            this.shake = 3;

            soundBounce();

            hapticBounce();
        }
    }


    deathEffect() {

        this.addParticles(
            this.player.x,
            this.player.y,
            [70, 220, 255],
            55,
            1.4
        );

        this.shake = 12;

        this.flash = 0.15;

        soundDeath();

        hapticDeath();
    }


    /* =====================================================
       PLATFORM COLLISION
    ===================================================== */

    collidePlatform(
        player,
        platform
    ) {

        /*
         * Ghost mode completely ignores platforms.
         */

        if (
            player.ghost
        ) {

            return false;
        }


        const r =
            platform.rect;


        /*
         * Circle / rectangle collision.
         */

        const closestX =
            clamp(
                player.x,
                r.left,
                r.right
            );

        const closestY =
            clamp(
                player.y,
                r.top,
                r.bottom
            );

        const dx =
            player.x -
            closestX;

        const dy =
            player.y -
            closestY;


        if (
            dx * dx +
            dy * dy >
            player.radius *
            player.radius
        ) {

            return false;
        }


        /*
         * Determine nearest surface.
         */

        const leftPen =
            player.x +
            player.radius -
            r.left;

        const rightPen =
            r.right -
            (
                player.x -
                player.radius
            );

        const topPen =
            player.y +
            player.radius -
            r.top;

        const bottomPen =
            r.bottom -
            (
                player.y -
                player.radius
            );


        const penetrations = [

            {
                value: leftPen,
                nx: -1,
                ny: 0
            },

            {
                value: rightPen,
                nx: 1,
                ny: 0
            },

            {
                value: topPen,
                nx: 0,
                ny: -1
            },

            {
                value: bottomPen,
                nx: 0,
                ny: 1
            }
        ];


        penetrations.sort(
            (a, b) =>
                a.value -
                b.value
        );


        const hit =
            penetrations[0];


        const nx =
            hit.nx;

        const ny =
            hit.ny;


        const relativeVx =
            player.vx;

        const relativeVy =
            player.vy -
            platform.vy;

        const into =
            relativeVx * nx +
            relativeVy * ny;


        if (
            into >= 0
        ) {

            return false;
        }


        /*
         * Push the player out.
         */

        const penetration =
            Math.max(
                hit.value,
                0
            );


        player.x +=
            nx *
            penetration;

        player.y +=
            ny *
            penetration;


        /* =================================================
           TOP
        ================================================= */

        if (
            ny < -0.5
        ) {

            const wasDive =
                player.topBounce(
                    platform
                );


            /*
             * Detect edge/corner.
             */

            const centerDistance =
                Math.abs(
                    player.x -
                    platform.x
                );

            const halfWidth =
                platform.width /
                2;

            const edgeDistance =
                halfWidth -
                centerDistance;


            const nearLeft =
                Math.abs(
                    player.x -
                    r.left
                ) < 12;


            const nearRight =
                Math.abs(
                    player.x -
                    r.right
                ) < 12;


            const nearTop =
                Math.abs(
                    player.y -
                    r.top
                ) < 12;


            const corner =
                (
                    nearLeft ||
                    nearRight
                ) &&
                nearTop;


            let landingType =
                "normal";


            if (
                corner
            ) {

                landingType =
                    "corner";

            } else if (
                edgeDistance <
                28
            ) {

                landingType =
                    "edge";
            }


            /*
             * Only the first landing scores.
             */

            const firstLanding =
                !platform.scoredThisVisit;


            if (
                firstLanding
            ) {

                platform.scoredThisVisit =
                    true;


                let points =
                    100;


                if (
                    landingType ===
                    "edge"
                ) {

                    points += 75;
                }


                if (
                    landingType ===
                    "corner"
                ) {

                    points += 150;
                }


                if (
                    wasDive
                ) {

                    points += 100;
                }


                if (
                    platform.bonus
                ) {

                    points += 250;
                }


                /*
                 * FLOW
                 *
                 * Clean consecutive landings
                 * increase Flow.
                 *
                 * Every Flow level adds 15%
                 * to platform score.
                 */

                const clean =
                    !corner &&
                    Math.abs(
                        player.vx
                    ) < 360;


                if (
                    clean ||
                    landingType ===
                        "edge" ||
                    landingType ===
                        "corner"
                ) {

                    this.flow =
                        clamp(
                            this.flow + 1,
                            0,
                            10
                        );

                } else {

                    this.flow =
                        Math.max(
                            0,
                            this.flow - 1
                        );
                }


                this.maxFlow =
                    Math.max(
                        this.maxFlow,
                        this.flow
                    );


                if (
                    this.flow >= 2
                ) {

                    points *=
                        1 +
                        (
                            this.flow -
                            1
                        ) *
                        0.15;
                }


                this.score +=
                    Math.floor(
                        points
                    );


                /*
                 * Landing feedback.
                 */

                let effect =
                    "normal";


                if (
                    landingType ===
                    "corner"
                ) {

                    effect =
                        "corner";

                } else if (
                    landingType ===
                    "edge"
                ) {

                    effect =
                        "edge";

                } else if (
                    wasDive
                ) {

                    effect =
                        "dive";

                } else if (
                    this.flow >= 3
                ) {

                    effect =
                        "flow";
                }


                this.bounceEffect(
                    player.x,
                    player.y,
                    platform,
                    effect
                );


                /*
                 * Make Flow understandable.
                 */

                if (
                    this.flow >= 2
                ) {

                    this.addMessage(
                        `FLOW x${this.flow}`,
                        player.x,
                        player.y - 28,
                        [98,245,208],
                        19
                    );
                }

            } else {

                /*
                 * Already scored platform:
                 *
                 * still bounces,
                 * but doesn't score again.
                 */

                soundBounce();
            }


            return true;
        }


        /* =================================================
           BOTTOM
        ================================================= */

        if (
            ny > 0.5
        ) {

            /*
             * Bottom hits now ricochet.
             *
             * We do NOT simply launch the player
             * straight upward.
             *
             * The incoming velocity is reflected
             * around the bottom normal, meaning:
             *
             * - horizontal velocity is preserved
             * - vertical velocity reverses
             * - some energy is lost
             *
             * This creates the requested trajectory-aware
             * "richochet".
             */

            player.ricochet(
                nx,
                ny,
                platform.vy
            );


            player.squash =
                1.2;

            player.stretch =
                0.82;


            this.flow =
                Math.max(
                    0,
                    this.flow - 1
                );


            this.addParticles(
                player.x,
                player.y,
                platform.color,
                11,
                0.8
            );


            soundBounce();

            hapticBounce();


            return true;
        }


        /* =================================================
           SIDE
        ================================================= */

        /*
         * Side impacts also ricochet according
         * to the incoming trajectory.
         */

        player.ricochet(
            nx,
            ny,
            platform.vy
        );


        player.squash =
            1.15;

        player.stretch =
            0.85;


        this.flow =
            Math.max(
                0,
                this.flow - 1
            );


        this.addParticles(
            player.x,
            player.y,
            platform.color,
            10,
            0.8
        );


        soundBounce();

        hapticBounce();


        return true;
    }


    /* =====================================================
       ORB COLLISION
    ===================================================== */

    collideOrb(
        player,
        orb
    ) {

        if (
            orb.collected
        ) {

            return;
        }


        const dx =
            player.x -
            orb.x;

        const dy =
            player.y -
            orb.y;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        if (
            distance >
            player.radius +
            orb.radius +
            6
        ) {

            return;
        }


        orb.collected = true;


        if (
            orb.type ===
            "gold"
        ) {

            this.score +=
                GOLD_ORB_SCORE;


            this.addMessage(
                "+50",
                orb.x,
                orb.y - 18,
                [255,225,80],
                25
            );


            this.addParticles(
                orb.x,
                orb.y,
                GOLD,
                25,
                1.15
            );


            soundOrb("gold");

            hapticOrb();


        } else if (
            orb.type ===
            "ghost"
        ) {

            player.ghostTimer =
                GHOST_DURATION;


            /*
             * Ghost deliberately removes
             * diving too, because there is
             * no reason to dive into platforms
             * while intangible.
             */

            player.diving = false;


            this.addMessage(
                "GHOST!",
                orb.x,
                orb.y - 18,
                [255,255,255],
                24
            );


            this.addMessage(
                `${GHOST_DURATION.toFixed(1)}s`,
                orb.x,
                orb.y + 10,
                [190,220,255],
                15
            );


            this.addParticles(
                orb.x,
                orb.y,
                [255,255,255],
                32,
                1.25
            );


            soundOrb("ghost");

            hapticOrb();


            this.flash =
                0.08;


        } else if (
            orb.type ===
            "rainbow"
        ) {

            player.invulnerableTimer =
                INVULNERABLE_DURATION;


            this.addMessage(
                "INVULNERABLE!",
                orb.x,
                orb.y - 18,
                [255,180,245],
                21
            );


            this.addMessage(
                "SAFETY NET",
                orb.x,
                orb.y + 10,
                [120,240,255],
                15
            );


            this.addParticles(
                orb.x,
                orb.y,
                [255,120,230],
                40,
                1.4
            );


            soundOrb("invulnerable");

            hapticSpecial();


            this.flash =
                0.12;
        }
    }


    /* =====================================================
       UPDATE
    ===================================================== */

    update(dt) {

        this.fire.update(dt);


        if (
            this.gameOver
        ) {

            this.updateParticles(
                dt
            );

            this.updateMessages(
                dt
            );

            this.shake =
                Math.max(
                    0,
                    this.shake -
                    dt * 20
                );

            return;
        }


        this.player.updateTimers(
            dt
        );


        this.player.control(
            dt
        );


        /*
         * Platforms move downward.
         */

        const speed =
            this.platformSpeed();


        for (
            const platform of
            this.platforms
        ) {

            platform.update(
                dt,
                speed
            );
        }


        /*
         * Orbs move with the world.
         */

        for (
            const orb of
            this.orbs
        ) {

            orb.y +=
                speed *
                dt;

            orb.update(dt);
        }


        /*
         * Physics.
         */

        const subDt =
            dt /
            PHYSICS_STEPS;


        for (
            let i = 0;
            i <
                PHYSICS_STEPS;
            i++
        ) {

            this.player.gravity(
                subDt
            );

            this.player.move(
                subDt
            );


            /*
             * Walls.
             */

            if (
                this.player.wallCollision()
            ) {

                this.addParticles(
                    this.player.x,
                    this.player.y,
                    [70,220,255],
                    8
                );

                this.flow =
                    Math.max(
                        0,
                        this.flow - 1
                    );
            }


            /*
             * Platforms.
             */

            for (
                const platform of
                this.platforms
            ) {

                if (
                    this.collidePlatform(
                        this.player,
                        platform
                    )
                ) {

                    break;
                }
            }


            /*
             * Orbs.
             */

            for (
                const orb of
                this.orbs
            ) {

                this.collideOrb(
                    this.player,
                    orb
                );
            }
        }


        /*
         * Camera.
         */

        this.updateCamera(dt);


        /*
         * Height.
         */

        const currentHeight =
            Math.max(
                0,
                Math.floor(
                    520 -
                    this.player.y
                )
            );


        if (
            currentHeight >
            this.height
        ) {

            this.height =
                currentHeight;
        }


        this.bestHeight =
            Math.max(
                this.bestHeight,
                this.height
            );


        this.bestScore =
            Math.max(
                this.bestScore,
                this.score
            );


        localStorage.setItem(
            "bounceBestHeight",
            this.bestHeight
        );

        localStorage.setItem(
            "bounceBestScore",
            this.bestScore
        );


        /*
         * Height tracking.
         */

        const now =
            performance.now() /
            1000;


        if (
            now -
            this.lastHeightTime >
            0.35
        ) {

            this.lastHeight =
                this.height;

            this.lastHeightTime =
                now;
        }


        /*
         * Spawn platforms.
         */

        this.spawnTimer +=
            dt;


        while (
            this.spawnTimer >=
            SPAWN_INTERVAL
        ) {

            this.spawnTimer -=
                SPAWN_INTERVAL;

            this.spawnPlatform();
        }


        /*
         * Spawn orbs.
         *
         * Not too frequent.
         */

        this.orbTimer +=
            dt;


        const orbInterval =
            lerp(
                2.8,
                1.8,
                this.difficulty()
            );


        if (
            this.orbTimer >=
            orbInterval
        ) {

            this.orbTimer = 0;

            this.spawnOrb();
        }


        /*
         * Remove old platforms.
         */

        const despawnY =
            -this.cameraY +
            HEIGHT +
            DESPAWN_DISTANCE;


        this.platforms =
            this.platforms.filter(
                platform =>
                    platform.y <
                    despawnY
            );


        /*
         * Remove old orbs.
         */

        this.orbs =
            this.orbs.filter(
                orb =>
                    !orb.collected &&
                    orb.y <
                    despawnY
            );


        /*
         * Death boundary.
         *
         * Invulnerability turns the flames
         * into a temporary safety net.
         */

        const screenY =
            this.player.y +
            this.cameraY;


        if (
            screenY >
            FIRE_ZONE_Y
        ) {

            if (
                this.player.invulnerable
            ) {

                this.saveFromFire();

            } else {

                this.die();
            }
        }


        /*
         * Effects.
         */

        this.updateParticles(
            dt
        );

        this.updateMessages(
            dt
        );

        this.player.updateVisuals();


        this.shake =
            Math.max(
                0,
                this.shake -
                dt * 20
            );


        this.flash =
            Math.max(
                0,
                this.flash -
                dt
            );
    }


    /* =====================================================
       SAFETY NET
    ===================================================== */

    saveFromFire() {

        /*
         * Pull the player just above the fire
         * and launch them back into play.
         *
         * Their horizontal trajectory is retained.
         */

        this.player.y =
            FIRE_ZONE_Y -
            this.player.radius -
            4;


        this.player.vy =
            -Math.max(
                700,
                Math.abs(
                    this.player.vy
                ) *
                0.62
            );


        this.player.squash =
            1.45;

        this.player.stretch =
            0.62;


        this.addMessage(
            "SAVED!",
            this.player.x,
            this.player.y - 25,
            [90,255,210],
            25
        );


        this.addParticles(
            this.player.x,
            this.player.y,
            [80,255,210],
            38,
            1.5
        );


        this.shake = 7;

        this.flash = 0.13;

        soundSpecialBounce();

        hapticSpecial();


        /*
         * Consume the protection.
         */

        this.player.invulnerableTimer =
            0;
    }


    /* =====================================================
       CAMERA
    ===================================================== */

    updateCamera(dt) {

        const screenY =
            this.player.y +
            this.cameraY;


        if (
            screenY <
            CAMERA_TARGET_Y
        ) {

            const target =
                CAMERA_TARGET_Y -
                this.player.y;


            this.cameraY =
                lerp(
                    this.cameraY,
                    target,
                    Math.min(
                        1,
                        dt *
                        CAMERA_FOLLOW_SPEED
                    )
                );
        }


        this.cameraY =
            Math.max(
