<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>BOUNCE</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #050812;

    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

#game {
    display: block;

    background: #070a14;

    touch-action: none;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<script>
"use strict";

/* =========================================================
   BOUNCE
   =========================================================
   
   Main changes:
   
   - Wider vertical platform spacing
   - Easier opening section
   - Top-only platform landing
   - Swipe-to-dive instead of hold-to-dive
   - Glowing energy orbs
   - Rare rainbow safety orbs
   - Animated blue/green death flames
   - Web Audio feedback
   - Best-effort haptics
   ========================================================= */


/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

const WIDTH = 480;
const HEIGHT = 800;

let scale = 1;

function resize() {

    scale = Math.min(
        window.innerWidth / WIDTH,
        window.innerHeight / HEIGHT
    );

    canvas.width =
        WIDTH * scale;

    canvas.height =
        HEIGHT * scale;

    canvas.style.width =
        `${WIDTH * scale}px`;

    canvas.style.height =
        `${HEIGHT * scale}px`;
}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   COLORS
========================================================= */

const WHITE =
    [245, 250, 255];

const PLATFORM_COLORS = [
    [70, 220, 255],
    [185, 100, 255],
    [255, 215, 80],
    [90, 255, 180],
    [255, 105, 150],
    [100, 150, 255]
];

const PLATFORM_DARK =
    [25, 45, 70];

const PLATFORM_HIGHLIGHT =
    [180, 245, 255];


/* =========================================================
   PHYSICS
========================================================= */

const GRAVITY =
    1500;

const BOUNCE_POWER =
    980;

const DIVE_BOUNCE_POWER =
    1320;

const MAX_FALL_SPEED =
    1700;

const DIVE_ACCELERATION =
    2500;

const AIR_ACCEL =
    2100;

const AIR_FRICTION =
    0.985;

const MAX_X_SPEED =
    450;

const WALL_RESTITUTION =
    0.92;

const PLATFORM_RESTITUTION =
    0.98;

const BALL_RADIUS =
    17;

const PHYSICS_STEPS =
    6;


/* =========================================================
   PLATFORM GENERATION
========================================================= */

const CELL =
    34;

/*
 * IMPORTANT:
 *
 * Platforms are intentionally much farther apart.
 *
 * The early game uses roughly 205-225 pixels
 * of vertical separation, increasing gradually.
 *
 * This gives the player enough air time to actually
 * SEE and REACH the next platform.
 */

const MIN_VERTICAL_GAP =
    205;

const MAX_VERTICAL_GAP =
    255;

const PLATFORM_SIDE_MARGIN =
    55;


/* =========================================================
   CAMERA
========================================================= */

const CAMERA_TARGET_Y =
    330;

const CAMERA_FOLLOW_SPEED =
    7;


/* =========================================================
   PLATFORM MOVEMENT
========================================================= */

const SPAWN_INTERVAL =
    0.45;

const DESPAWN_DISTANCE =
    250;


/* =========================================================
   ORBS
========================================================= */

const ORB_RADIUS =
    11;

const ORB_SCORE =
    150;

const ORB_BOOST_TIME =
    4.5;

const ORB_BOOST_POWER =
    1180;


/*
 * Rainbow safety orb.
 */

const SAFETY_TIME =
    7;

const SAFETY_BOUNCE =
    1250;


/* =========================================================
   INPUT
========================================================= */

let keyLeft =
    false;

let keyRight =
    false;

let keyDown =
    false;

let touchActive =
    false;

let touchStartX =
    0;

let touchStartY =
    0;

let touchX =
    0;

let touchY =
    0;


/*
 * A dive is now triggered by a single downward
 * swipe crossing the threshold.
 *
 * It cannot remain active simply because the player
 * keeps holding their finger down.
 */

let diveTriggeredThisGesture =
    false;

const DIVE_SWIPE_DISTANCE =
    75;


/* =========================================================
   AUDIO
========================================================= */

let audioContext =
    null;

let soundEnabled =
    true;


function initAudio() {

    if (!soundEnabled) {
        return;
    }

    if (!audioContext) {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioContext) {
            return;
        }

        audioContext =
            new AudioContext();
    }

    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();
    }
}


/*
 * Small, quiet synthesized sounds.
 *
 * No looping music.
 * No loud samples.
 */

function playTone(
    frequency,
    duration,
    type = "sine",
    volume = 0.035,
    slideTo = null
) {

    if (
        !soundEnabled ||
        !audioContext
    ) {
        return;
    }

    const now =
        audioContext.currentTime;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type =
        type;

    oscillator.frequency.setValueAtTime(
        frequency,
        now
    );

    if (slideTo !== null) {

        oscillator.frequency.exponentialRampToValueAtTime(
            Math.max(20, slideTo),
            now + duration
        );
    }

    gain.gain.setValueAtTime(
        0.0001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        now + 0.008
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + duration
    );

    oscillator.connect(gain);
    gain.connect(
        audioContext.destination
    );

    oscillator.start(now);
    oscillator.stop(
        now + duration + 0.01
    );
}


function soundBounce() {

    playTone(
        240,
        0.07,
        "sine",
        0.035,
        390
    );
}


function soundEdge() {

    playTone(
        320,
        0.09,
        "triangle",
        0.04,
        560
    );
}


function soundDive() {

    playTone(
        170,
        0.12,
        "sine",
        0.045,
        90
    );
}


function soundOrb() {

    playTone(
        520,
        0.08,
        "sine",
        0.035,
        760
    );

    setTimeout(
        () => {
            playTone(
                760,
                0.1,
                "sine",
                0.028,
                1040
            );
        },
        45
    );
}


function soundSafety() {

    playTone(
        420,
        0.12,
        "triangle",
        0.04,
        700
    );

    setTimeout(
        () => {
            playTone(
                700,
                0.16,
                "triangle",
                0.035,
                1050
            );
        },
        70
    );
}


function soundSave() {

    playTone(
        180,
        0.08,
        "sine",
        0.035,
        500
    );

    setTimeout(
        () => {
            playTone(
                500,
                0.16,
                "sine",
                0.045,
                900
            );
        },
        45
    );
}


function soundDeath() {

    playTone(
        190,
        0.25,
        "triangle",
        0.045,
        70
    );
}


/* =========================================================
   HAPTICS
========================================================= */

/*
 * iOS Safari generally does not expose navigator.vibrate()
 * to ordinary webpages.
 *
 * This is therefore best-effort only.
 *
 * If the browser supports it, these tiny pulses provide
 * extra tactile feedback without becoming annoying.
 */

function haptic(
    pattern
) {

    try {

        if (
            "vibrate" in navigator
        ) {

            navigator.vibrate(
                pattern
            );
        }

    } catch (error) {

        /*
         * Haptics are optional.
         */
    }
}


function hapticBounce() {
    haptic(8);
}


function hapticOrb() {
    haptic([10, 25, 10]);
}


function hapticSafety() {
    haptic([12, 30, 12, 30, 18]);
}


function hapticDeath() {
    haptic([25, 40, 35]);
}


/* =========================================================
   POINTER POSITION
========================================================= */

function pointerPosition(
    event
) {

    const rect =
        canvas.getBoundingClientRect();

    return {

        x:
            (event.clientX -
                rect.left)
            / scale,

        y:
            (event.clientY -
                rect.top)
            / scale
    };
}


/* =========================================================
   TOUCH
========================================================= */

canvas.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        initAudio();

        const p =
            pointerPosition(
                event
            );

        touchActive =
            true;

        touchStartX =
            p.x;

        touchStartY =
            p.y;

        touchX =
            p.x;

        touchY =
            p.y;

        diveTriggeredThisGesture =
            false;


        if (
            !game.started ||
            game.gameOver
        ) {

            game.restart();
        }
    }
);


canvas.addEventListener(
    "pointermove",
    event => {

        if (!touchActive) {
            return;
        }

        event.preventDefault();

        const p =
            pointerPosition(
                event
            );

        touchX =
            p.x;

        touchY =
            p.y;
    }
);


canvas.addEventListener(
    "pointerup",
    event => {

        event.preventDefault();

        touchActive =
            false;

        /*
         * Releasing the finger ends the gesture.
         * A future swipe can trigger another dive.
         */

        diveTriggeredThisGesture =
            false;
    }
);


canvas.addEventListener(
    "pointercancel",
    () => {

        touchActive =
            false;

        diveTriggeredThisGesture =
            false;
    }
);


/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
    "keydown",
    event => {

        initAudio();

        if (
            event.key === "ArrowLeft" ||
            event.key.toLowerCase() === "a"
        ) {

            keyLeft = true;
        }

        if (
            event.key === "ArrowRight" ||
            event.key.toLowerCase() === "d"
        ) {

            keyRight = true;
        }

        if (
            event.key === "ArrowDown"
        ) {

            keyDown = true;
        }

        if (
            event.code === "Space"
        ) {

            if (
                !game.started ||
                game.gameOver
            ) {

                game.restart();
            }
        }

        if (
            event.key === "Escape"
        ) {

            location.reload();
        }
    }
);


window.addEventListener(
    "keyup",
    event => {

        if (
            event.key === "ArrowLeft" ||
            event.key.toLowerCase() === "a"
        ) {

            keyLeft = false;
        }

        if (
            event.key === "ArrowRight" ||
            event.key.toLowerCase() === "d"
        ) {

            keyRight = false;
        }

        if (
            event.key === "ArrowDown"
        ) {

            keyDown = false;
        }
    }
);


/* =========================================================
   HELPERS
========================================================= */

function clamp(
    value,
    minimum,
    maximum
) {

    return Math.max(
        minimum,
        Math.min(
            maximum,
            value
        )
    );
}


function lerp(
    a,
    b,
    amount
) {

    return a +
        (b - a) *
        amount;
}


function color(c) {

    return `rgb(${c[0]},${c[1]},${c[2]})`;
}


function rgba(
    c,
    alpha
) {

    return `rgba(${c[0]},${c[1]},${c[2]},${alpha})`;
}


function distance(
    x1,
    y1,
    x2,
    y2
) {

    const dx =
        x1 - x2;

    const dy =
        y1 - y2;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );
}


/* =========================================================
   PARTICLE
========================================================= */

class Particle {

    constructor(
        x,
        y,
        c,
        power = 1
    ) {

        this.x =
            x;

        this.y =
            y;

        const angle =
            Math.random() *
            Math.PI *
            2;

        const speed =
            (
                70 +
                Math.random() *
                200
            ) *
            power;

        this.vx =
            Math.cos(angle) *
            speed;

        this.vy =
            Math.sin(angle) *
            speed;

        this.life =
            0.2 +
            Math.random() *
            0.4;

        this.maxLife =
            this.life;

        this.size =
            2 +
            Math.random() *
            4;

        this.color =
            c;
    }


    update(dt) {

        this.x +=
            this.vx *
            dt;

        this.y +=
            this.vy *
            dt;

        this.vy +=
            450 *
            dt;

        this.vx *=
            0.985;

        this.life -=
            dt;
    }


    draw(cameraY) {

        if (
            this.life <= 0
        ) {

            return;
        }

        const alpha =
            this.life /
            this.maxLife;

        const size =
            Math.max(
                1,
                this.size *
                alpha
            );

        ctx.fillStyle =
            rgba(
                this.color,
                alpha
            );

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y + cameraY,
            size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}


/* =========================================================
   PLATFORM
========================================================= */

class Platform {

    constructor(
        x,
        y,
        width = 5,
        moving = false,
        bonus = false
    ) {

        this.x =
            x;

        this.y =
            y;

        this.widthCells =
            width;

        this.width =
            width *
            CELL;

        this.height =
            CELL;

        this.vx =
            moving
                ? (
                    Math.random() < 0.5
                        ? -1
                        : 1
                ) *
                (
                    25 +
                    Math.random() *
                    55
                )
                : 0;

        this.vy =
            0;

        this.moving =
            moving;

        this.bonus =
            bonus;

        this.color =
            bonus
                ? [255, 215, 80]
                : PLATFORM_COLORS[
                    Math.floor(
                        Math.random() *
                        PLATFORM_COLORS.length
                    )
                ];

        this.scored =
            false;

        this.id =
            Platform.nextId++;
    }


    get rect() {

        return {

            left:
                this.x -
                this.width / 2,

            right:
                this.x +
                this.width / 2,

            top:
                this.y -
                CELL / 2,

            bottom:
                this.y +
                CELL / 2
        };
    }


    update(
        dt,
        platformSpeed
    ) {

        this.y +=
            platformSpeed *
            dt;

        if (
            this.moving
        ) {

            this.x +=
                this.vx *
                dt;

            const half =
                this.width / 2;

            if (
                this.x -
                half <
                8
            ) {

                this.x =
                    8 +
                    half;

                this.vx =
                    Math.abs(
                        this.vx
                    );
            }

            if (
                this.x +
                half >
                WIDTH - 8
            ) {

                this.x =
                    WIDTH -
                    8 -
                    half;

                this.vx =
                    -Math.abs(
                        this.vx
                    );
            }
        }
    }


    draw(cameraY) {

        const r =
            this.rect;

        const sy =
            r.top +
            cameraY;

        if (
            sy >
                HEIGHT + 100 ||
            sy <
                -100
        ) {

            return;
        }


        /*
         * Soft platform glow.
         */

        ctx.shadowBlur =
            10;

        ctx.shadowColor =
            rgba(
                this.color,
                0.25
            );

        ctx.fillStyle =
            color(
                PLATFORM_DARK
            );

        roundRect(
            r.left,
            sy + 5,
            this.width,
            CELL,
            7
        );

        ctx.shadowBlur =
            0;


        ctx.fillStyle =
            color(
                this.color
            );

        roundRect(
            r.left,
            sy,
            this.width,
            CELL,
            7
        );


        ctx.strokeStyle =
            color(
                PLATFORM_HIGHLIGHT
            );

        ctx.lineWidth =
            3;

        ctx.beginPath();

        ctx.moveTo(
            r.left + 7,
            sy + 5
        );

        ctx.lineTo(
            r.right - 7,
            sy + 5
        );

        ctx.stroke();


        /*
         * Moving platform.
         */

        if (
            this.moving
        ) {

            ctx.fillStyle =
                "rgba(255,255,255,0.55)";

            ctx.beginPath();

            ctx.arc(
                this.x,
                sy + CELL / 2,
                3,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }


        /*
         * Bonus platform.
         */

        if (
            this.bonus
        ) {

            ctx.strokeStyle =
                "rgba(255,255,255,0.85)";

            ctx.lineWidth =
                2;

            ctx.beginPath();

            ctx.arc(
                this.x,
                sy + CELL / 2,
                CELL * 0.32,
                0,
                Math.PI * 2
            );

            ctx.stroke();
        }
    }
}


Platform.nextId =
    1;


function roundRect(
    x,
    y,
    width,
    height,
    radius
) {

    ctx.beginPath();

    ctx.roundRect(
        x,
        y,
        width,
        height,
        radius
    );

    ctx.fill();
}


/* =========================================================
   ORB
========================================================= */

class Orb {

    constructor(
        x,
        y,
        rainbow = false
    ) {

        this.x =
            x;

        this.y =
            y;

        this.baseY =
            y;

        this.rainbow =
            rainbow;

        this.radius =
            rainbow
                ? 14
                : ORB_RADIUS;

        this.life =
            0;

        this.collected =
            false;

        this.phase =
            Math.random() *
            Math.PI *
            2;

        this.hue =
            Math.random() *
            360;
    }


    update(
        dt,
        platformSpeed
    ) {

        this.y +=
            platformSpeed *
            dt;

        this.life +=
            dt;

        this.hue +=
            dt * 100;
    }


    collect() {

        if (
            this.collected
        ) {

            return;
        }

        this.collected =
            true;
    }


    draw(cameraY) {

        if (
            this.collected
        ) {

            return;
        }

        const bob =
            Math.sin(
                this.life * 4 +
                this.phase
            ) *
            5;

        const sx =
            this.x;

        const sy =
            this.y +
            cameraY +
            bob;


        /*
         * Rainbow orb.
         */

        if (
            this.rainbow
        ) {

            const gradient =
                ctx.createRadialGradient(
                    sx,
                    sy,
                    2,
                    sx,
                    sy,
                    32
                );

            gradient.addColorStop(
                0,
                "rgba(255,255,255,0.95)"
            );

            gradient.addColorStop(
                0.18,
                `hsla(${
                    this.hue
                },100%,70%,0.95)`
            );

            gradient.addColorStop(
                0.45,
                `hsla(${
                    this.hue + 70
                },100%,60%,0.6)`
            );

            gradient.addColorStop(
                1,
                "rgba(255,255,255,0)"
            );

            ctx.fillStyle =
                gradient;

            ctx.beginPath();

            ctx.arc(
                sx,
                sy,
                34,
                0,
                Math.PI * 2
            );

            ctx.fill();


            ctx.shadowBlur =
                25;

            ctx.shadowColor =
                `hsl(${
                    this.hue
                },100%,65%)`;

            ctx.fillStyle =
                "#ffffff";

            ctx.beginPath();

            ctx.arc(
                sx,
                sy,
                this.radius,
                0,
                Math.PI * 2
            );

            ctx.fill();

            ctx.shadowBlur =
                0;


            /*
             * Rainbow ring.
             */

            ctx.strokeStyle =
                `hsl(${
                    this.hue
                },100%,70%)`;

            ctx.lineWidth =
                3;

            ctx.beginPath();

            ctx.arc(
                sx,
                sy,
                this.radius + 5,
                0,
                Math.PI * 2
            );

            ctx.stroke();

            return;
        }


        /*
         * Normal cyan energy orb.
         */

        const gradient =
            ctx.createRadialGradient(
                sx,
                sy,
                1,
                sx,
                sy,
                28
            );

        gradient.addColorStop(
            0,
            "rgba(255,255,255,1)"
        );

        gradient.addColorStop(
            0.18,
            "rgba(100,240,255,0.95)"
        );

        gradient.addColorStop(
            0.5,
            "rgba(30,190,255,0.45)"
        );

        gradient.addColorStop(
            1,
            "rgba(30,190,255,0)"
        );

        ctx.fillStyle =
            gradient;

        ctx.beginPath();

        ctx.arc(
            sx,
            sy,
            30,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.shadowBlur =
            22;

        ctx.shadowColor =
            "rgba(60,230,255,0.95)";

        ctx.fillStyle =
            "#dfffff";

        ctx.beginPath();

        ctx.arc(
            sx,
            sy,
            this.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.shadowBlur =
            0;


        ctx.fillStyle =
            "#35dfff";

        ctx.beginPath();

        ctx.arc(
            sx,
            sy,
            5,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}


/* =========================================================
   PLAYER
========================================================= */

class Player {

    constructor() {

        this.reset();
    }


    reset() {

        this.x =
            WIDTH / 2;

        this.y =
            520;

        this.vx =
            0;

        this.vy =
            0;

        this.radius =
            BALL_RADIUS;

        this.squash =
            1;

        this.stretch =
            1;

        this.trail =
            [];

        this.bounces =
            0;

        this.diving =
            false;

        this.lastPlatform =
            null;

        this.boostTimer =
            0;

        this.safetyTimer =
            0;
    }


    control(dt) {

        let direction =
            0;


        /*
         * Keyboard movement.
         */

        if (keyLeft) {
            direction--;
        }

        if (keyRight) {
            direction++;
        }


        /*
         * Touch movement.
         */

        if (
            touchActive
        ) {

            const dx =
                touchX -
                touchStartX;

            /*
             * Horizontal control remains independent
             * from the dive gesture.
             */

            if (
                Math.abs(dx) >
                8
            ) {

                direction =
                    clamp(
                        dx / 70,
                        -1,
                        1
                    );
            }
        }


        this.vx +=
            direction *
            AIR_ACCEL *
            dt;

        this.vx *=
            AIR_FRICTION;

        this.vx =
            clamp(
                this.vx,
                -MAX_X_SPEED,
                MAX_X_SPEED
            );


        /*
         * -------------------------------------------------
         * DIVE
         * -------------------------------------------------
         *
         * A dive happens ONCE when the player performs
         * a deliberate downward swipe.
         *
         * You don't keep diving just because your finger
         * remains on the screen.
         * -------------------------------------------------
         */

        if (
            this.vy > 0 &&
            touchActive &&
            !diveTriggeredThisGesture
        ) {

            const dx =
                touchX -
                touchStartX;

            const dy =
                touchY -
                touchStartY;

            if (
                dy >
                    DIVE_SWIPE_DISTANCE &&
                dy >
                    Math.abs(dx) * 1.2
            ) {

                this.triggerDive();

                diveTriggeredThisGesture =
                    true;
            }
        }


        /*
         * Keyboard dive.
         */

        if (
            this.vy > 0 &&
            keyDown &&
            !this.diving
        ) {

            this.triggerDive();
        }
    }


    triggerDive() {

        if (
            this.diving
        ) {

            return;
        }

        this.diving =
            true;

        soundDive();

        haptic(10);
    }


    gravity(dt) {

        this.vy +=
            GRAVITY *
            dt;

        if (
            this.diving
        ) {

            this.vy +=
                DIVE_ACCELERATION *
                dt;
        }

        this.vy =
            Math.min(
                this.vy,
                MAX_FALL_SPEED
            );
    }


    move(dt) {

        this.x +=
            this.vx *
            dt;

        this.y +=
            this.vy *
            dt;
    }


    wallCollision() {

        if (
            this.x -
            this.radius <
            0
        ) {

            this.x =
                this.radius;

            this.vx =
                Math.abs(
                    this.vx
                ) *
                WALL_RESTITUTION;

            return true;
        }


        if (
            this.x +
            this.radius >
            WIDTH
        ) {

            this.x =
                WIDTH -
                this.radius;

            this.vx =
                -Math.abs(
                    this.vx
                ) *
                WALL_RESTITUTION;

            return true;
        }

        return false;
    }


    bounce(
        platform
    ) {

        let power =
            BOUNCE_POWER;


        /*
         * Energy orb boost.
         */

        if (
            this.boostTimer >
            0
        ) {

            power =
                ORB_BOOST_POWER;
        }


        /*
         * Dive bounce.
         */

        if (
            this.diving
        ) {

            power =
                Math.max(
                    power,
                    DIVE_BOUNCE_POWER
                );
        }


        /*
         * Rainbow safety save.
         */

        if (
            this.safetyTimer >
            0 &&
            platform === null
        ) {

            power =
                SAFETY_BOUNCE;
        }


        this.vy =
            -power;

        this.vx *=
            PLATFORM_RESTITUTION;


        this.squash =
            1.4;

        this.stretch =
            0.65;

        this.bounces++;


        const wasDive =
            this.diving;

        this.diving =
            false;


        return {
            dive:
                wasDive
        };
    }


    updateTimers(dt) {

        this.boostTimer =
            Math.max(
                0,
                this.boostTimer -
                dt
            );

        this.safetyTimer =
            Math.max(
                0,
                this.safetyTimer -
                dt
            );
    }


    updateVisuals() {

        this.squash =
            lerp(
                this.squash,
                1,
                0.18
            );

        this.stretch =
            lerp(
                this.stretch,
                1,
                0.18
            );


        this.trail.push({

            x:
                this.x,

            y:
                this.y
        });


        if (
            this.trail.length >
            14
        ) {

            this.trail.shift();
        }
    }


    draw(cameraY) {

        /*
         * Trail.
         */

        for (
            let i = 0;
            i < this.trail.length;
            i++
        ) {

            const p =
                this.trail[i];

            const progress =
                i /
                Math.max(
                    1,
                    this.trail.length
                );

            ctx.fillStyle =
                `rgba(80,210,255,${
                    0.04 +
                    progress * 0.12
                })`;

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y + cameraY,
                Math.max(
                    2,
                    this.radius *
                    progress
                ),
                0,
                Math.PI * 2
            );

            ctx.fill();
        }


        const width =
            this.radius *
            2 *
            this.squash;

        const height =
            this.radius *
            2 *
            this.stretch;

        const sy =
            this.y +
            cameraY;


        /*
         * Safety shield.
         */

        if (
            this.safetyTimer >
            0
        ) {

            const pulse =
                Math.sin(
                    performance.now() *
                    0.008
                ) *
                4;

            const alpha =
                0.35 +
                Math.sin(
                    performance.now() *
                    0.006
                ) *
                0.08;

            const gradient =
                ctx.createRadialGradient(
                    this.x,
                    sy,
                    this.radius,
                    this.x,
                    sy,
                    43 + pulse
                );

            gradient.addColorStop(
                0,
                "rgba(255,255,255,0.08)"
            );

            gradient.addColorStop(
                0.55,
                `rgba(120,255,220,${
                    alpha
                })`
            );

            gradient.addColorStop(
                1,
                "rgba(255,80,220,0)"
            );

            ctx.fillStyle =
                gradient;

            ctx.beginPath();

            ctx.arc(
                this.x,
                sy,
                43 + pulse,
                0,
                Math.PI * 2
            );

            ctx.fill();


            ctx.strokeStyle =
                `hsla(${
                    (
                        performance.now() *
                        0.08
                    ) % 360
                },100%,70%,0.8)`;

            ctx.lineWidth =
                3;

            ctx.beginPath();

            ctx.arc(
                this.x,
                sy,
                30 + pulse * 0.5,
                0,
                Math.PI * 2
            );

            ctx.stroke();
        }


        /*
         * Boost aura.
         */

        if (
            this.boostTimer >
            0
        ) {

            ctx.strokeStyle =
                "rgba(60,235,255,0.55)";

            ctx.lineWidth =
                2;

            ctx.beginPath();

            ctx.arc(
                this.x,
                sy,
                25 +
                    Math.sin(
                        performance.now() *
                        0.01
                    ) *
                    3,
                0,
                Math.PI * 2
            );

            ctx.stroke();
        }


        /*
         * Player glow.
         */

        ctx.shadowBlur =
            18;

        ctx.shadowColor =
            this.safetyTimer > 0
                ? "rgba(130,255,220,0.9)"
                : "rgba(80,220,255,0.65)";

        ctx.fillStyle =
            "#f5faff";

        ctx.beginPath();

        ctx.ellipse(
            this.x,
            sy,
            width / 2,
            height / 2,
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.shadowBlur =
            0;


        ctx.fillStyle =
            "#50c8ff";

        ctx.beginPath();

        ctx.ellipse(
            this.x -
                width * 0.18,
            sy -
                height * 0.22,
            Math.max(
                3,
                width * 0.15
            ),
            Math.max(
                3,
                height * 0.12
            ),
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}


/* =========================================================
   GAME
========================================================= */

class Game {

    constructor() {

        this.player =
            new Player();

        this.platforms =
            [];

        this.orbs =
            [];

        this.particles =
            [];

        this.flameParticles =
            [];

        this.cameraY =
            0;


        /*
         * Score.
         */

        this.score =
            0;

        this.bestScore =
            Number(
                localStorage.getItem(
                    "bounceBestScore"
                ) || 0
            );


        /*
         * Height.
         */

        this.height =
            0;

        this.bestHeight =
            Number(
                localStorage.getItem(
                    "bounceBestHeight"
                ) || 0
            );


        /*
         * Flow.
         */

        this.flow =
            0;

        this.maxFlow =
            0;


        /*
         * Platform spawning.
         */

        this.spawnTimer =
            0;

        this.nextPlatformY =
            -100;

        this.lastPlatformSide =
            "left";


        /*
         * Game state.
         */

        this.started =
            false;

        this.gameOver =
            false;


        /*
         * Effects.
         */

        this.shake =
            0;

        this.flash =
            0;

        this.saveFlash =
            0;


        /*
         * Height tracking.
         */

        this.lastHeight =
            0;

        this.lastHeightTime =
            performance.now() /
            1000;


        /*
         * Animated flame phase.
         */

        this.flameTime =
            0;


        this.spawnInitialPlatforms();

        this.initializeFlames();
    }


    restart() {

        initAudio();

        this.player.reset();

        this.platforms =
            [];

        this.orbs =
            [];

        this.particles =
            [];

        this.cameraY =
            0;

        this.score =
            0;

        this.height =
            0;

        this.flow =
            0;

        this.maxFlow =
            0;

        this.spawnTimer =
            0;

        this.gameOver =
            false;

        this.started =
            true;

        this.shake =
            0;

        this.flash =
            0;

        this.saveFlash =
            0;

        this.lastPlatformSide =
            "left";

        this.lastHeight =
            0;

        this.lastHeightTime =
            performance.now() /
            1000;

        this.spawnInitialPlatforms();
    }


    difficulty() {

        return clamp(
            this.height /
                7000,
            0,
            1
        );
    }


    platformSpeed() {

        /*
         * Much slower at the beginning.
         */

        return lerp(
            18,
            125,
            this.difficulty()
        );
    }


    /* =====================================================
       INITIAL PLATFORMS
    ===================================================== */

    spawnInitialPlatforms() {

        this.platforms =
            [];

        this.orbs =
            [];


        /*
         * Starting platform.
         */

        this.platforms.push(
            new Platform(
                WIDTH * 0.50,
                625,
                6,
                false,
                false
            )
        );


        /*
         * BIGGER opening gaps.
         *
         * The first few jumps should feel like
         * "I can definitely do this."
         */

        this.platforms.push(
            new Platform(
                120,
                395,
                5,
                false,
                false
            )
        );


        this.platforms.push(
            new Platform(
                365,
                150,
                5,
                false,
                false
            )
        );


        this.platforms.push(
            new Platform(
                105,
                -90,
                5,
                false,
                false
            )
        );


        /*
         * Early orb.
         */

        this.orbs.push(
            new Orb(
                235,
                270,
                false
            )
        );


        this.orbs.push(
            new Orb(
                245,
                -5,
                false
            )
        );


        this.nextPlatformY =
            -330;

        this.lastPlatformSide =
            "left";
    }


    /* =====================================================
       PLATFORM SPAWNING
    ===================================================== */

    spawnPlatform() {

        const d =
            this.difficulty();


        /*
         * Find previous generated platform.
         */

        const previous =
            this.platforms
                .filter(
                    p =>
                        p.y <
                        this.nextPlatformY +
                        280
                )
                .sort(
                    (a, b) =>
                        b.y -
                        a.y
                )[0];


        /*
         * Keep the side-to-side visual rhythm.
         *
         * The player specifically wanted:
         *
         * LEFT
         *             RIGHT
         *
         * RIGHT
         *             LEFT
         *
         * rather than everything simply being centered.
         */

        let side;

        const centerChance =
            lerp(
                0.05,
                0.18,
                d
            );


        if (
            Math.random() <
            centerChance
        ) {

            side =
                "center";

        } else {

            side =
                this.lastPlatformSide ===
                    "left"
                    ? "right"
                    : "left";
        }


        let x;


        if (
            side === "left"
        ) {

            x =
                80 +
                Math.random() *
                90;

        } else if (
            side === "right"
        ) {

            x =
                WIDTH -
                (
                    80 +
                    Math.random() *
                    90
                );

        } else {

            x =
                WIDTH / 2 +
                (
                    Math.random() *
                    130 -
                    65
                );
        }


        /*
         * Horizontal reach.
         *
         * The beginning is deliberately generous.
         */

        if (
            previous
        ) {

            const maximumReach =
                lerp(
                    340,
                    390,
                    d
                );

            if (
                Math.abs(
                    x -
                    previous.x
                ) >
                maximumReach
            ) {

                x =
                    previous.x +
                    (
                        x >
                        previous.x
                            ? maximumReach
                            : -maximumReach
                    );
            }
        }


        x =
            clamp(
                x,
                PLATFORM_SIDE_MARGIN,
                WIDTH -
                    PLATFORM_SIDE_MARGIN
            );


        /*
         * Platform width.
         *
         * Keep wide platforms around longer.
         */

        let width;

        if (
            d < 0.30
        ) {

            width =
                Math.random() <
                0.85
                    ? 5
                    : 6;

        } else if (
            d < 0.60
        ) {

            width =
                Math.random() <
                0.65
                    ? 5
                    : 4;

        } else {

            width =
                [3, 4, 4, 5][
                    Math.floor(
                        Math.random() * 4
                    )
                ];
        }


        /*
         * Moving platforms arrive later.
         */

        const movingChance =
            d < 0.45
                ? 0
                : lerp(
                    0,
                    0.38,
                    (
                        d -
                        0.45
                    ) /
                    0.55
                );


        const moving =
            Math.random() <
            movingChance;


        /*
         * Bonus platform.
         */

        const bonus =
            Math.random() <
            0.08;


        const platform =
            new Platform(
                x,
                this.nextPlatformY,
                width,
                moving,
                bonus
            );


        this.platforms.push(
            platform
        );


        /*
         * Update side memory.
         */

        if (
            x <
            WIDTH * 0.38
        ) {

            this.lastPlatformSide =
                "left";

        } else if (
            x >
            WIDTH * 0.62
        ) {

            this.lastPlatformSide =
                "right";
        }


        /*
         * Farther vertical spacing.
         */

        const gap =
            lerp(
                MIN_VERTICAL_GAP,
                MAX_VERTICAL_GAP,
                d
            ) +
            (
                Math.random() *
                20 -
                10
            );


        this.nextPlatformY -=
            gap;


        /*
         * -------------------------------------------------
         * ORB SPAWN
         * -------------------------------------------------
         *
         * Normal cyan orbs are fairly common.
         * Rainbow safety orbs are rare.
         *
         * They are placed between platforms rather
         * than directly on top of them so the player
         * actually chooses whether to collect them.
         * -------------------------------------------------
         */

        const orbChance =
            lerp(
                0.62,
                0.48,
                d
            );


        if (
            Math.random() <
            orbChance
        ) {

            const orbX =
                clamp(
                    x +
                    (
                        Math.random() *
                        100 -
                        50
                    ),
                    45,
                    WIDTH - 45
                );

            const orbY =
                this.nextPlatformY +
                gap * 0.48;


            this.orbs.push(
                new Orb(
                    orbX,
                    orbY,
                    false
                )
            );
        }


        /*
         * Rare rainbow safety orb.
         *
         * More common later, but still uncommon.
         */

        const safetyChance =
            lerp(
                0.025,
                0.065,
                d
            );


        if (
            Math.random() <
            safetyChance
        ) {

            const safetyX =
                clamp(
                    x +
                    (
                        Math.random() *
                        120 -
                        60
                    ),
                    50,
                    WIDTH - 50
                );

            const safetyY =
                this.nextPlatformY +
                gap * 0.60;


            this.orbs.push(
                new Orb(
                    safetyX,
                    safetyY,
                    true
                )
            );
        }
    }


    /* =====================================================
       FLAMES
    ===================================================== */

    initializeFlames() {

        this.flameParticles =
            [];

        for (
            let i = 0;
            i < 90;
            i++
        ) {

            this.flameParticles.push({

                x:
                    Math.random() *
                    WIDTH,

                y:
                    HEIGHT -
                    Math.random() *
                    35,

                size:
                    12 +
                    Math.random() *
                    25,

                phase:
                    Math.random() *
                    Math.PI *
                    2,

                speed:
                    40 +
                    Math.random() *
                    70
            });
        }
    }


    updateFlames(dt) {

        this.flameTime +=
            dt;

        for (
            const flame of
            this.flameParticles
        ) {

            flame.phase +=
                dt *
                4;

            flame.y -=
                flame.speed *
                dt;

            if (
                flame.y <
                HEIGHT - 48
            ) {

                flame.y =
                    HEIGHT -
                    Math.random() *
                    18;

                flame.x =
                    Math.random() *
                    WIDTH;
            }
        }
    }


    drawFlames() {

        /*
         * Dark death zone.
         */

        const gradient =
            ctx.createLinearGradient(
                0,
                HEIGHT - 95,
                0,
                HEIGHT
            );

        gradient.addColorStop(
            0,
            "rgba(0,255,170,0)"
        );

        gradient.addColorStop(
            0.35,
            "rgba(20,180,150,0.15)"
        );

        gradient.addColorStop(
            1,
            "rgba(5,40,45,0.95)"
        );

        ctx.fillStyle =
            gradient;

        ctx.fillRect(
            0,
            HEIGHT - 95,
            WIDTH,
            95
        );


        /*
         * Flame particles.
         */

        for (
            const flame of
            this.flameParticles
        ) {

            const sway =
                Math.sin(
                    flame.phase +
                    this.flameTime * 2
                ) *
                9;

            const height =
                flame.size *
                (
                    1.2 +
                    Math.sin(
                        flame.phase * 1.7
                    ) *
                    0.3
                );

            const x =
                flame.x +
                sway;

            const y =
                flame.y;


            const gradient =
                ctx.createLinearGradient(
                    x,
                    y - height,
                    x,
                    y
                );

            gradient.addColorStop(
                0,
                "rgba(90,255,190,0.05)"
            );

            gradient.addColorStop(
                0.35,
                "rgba(70,255,180,0.55)"
            );

            gradient.addColorStop(
                0.75,
                "rgba(20,200,180,0.8)"
            );

            gradient.addColorStop(
                1,
                "rgba(20,80,100,0.05)"
            );

            ctx.fillStyle =
                gradient;


            ctx.beginPath();

            ctx.moveTo(
                x - flame.size * 0.5,
                y
            );

            ctx.quadraticCurveTo(
                x - flame.size * 0.25,
                y - height * 0.6,
                x,
                y - height
            );

            ctx.quadraticCurveTo(
                x + flame.size * 0.18,
                y - height * 0.45,
                x + flame.size * 0.5,
                y
            );

            ctx.closePath();

            ctx.fill();
        }


        /*
         * Blue-green hot line.
         */

        const lineGradient =
            ctx.createLinearGradient(
                0,
                0,
                WIDTH,
                0
            );

        lineGradient.addColorStop(
            0,
            "#25d9d0"
        );

        lineGradient.addColorStop(
            0.25,
            "#5effb2"
        );

        lineGradient.addColorStop(
            0.5,
            "#27e7ff"
        );

        lineGradient.addColorStop(
            0.75,
            "#5effb2"
        );

        lineGradient.addColorStop(
            1,
            "#25d9d0"
        );

        ctx.shadowBlur =
            15;

        ctx.shadowColor =
            "rgba(40,255,210,0.7)";

        ctx.fillStyle =
            lineGradient;

        ctx.fillRect(
            0,
            HEIGHT - 4,
            WIDTH,
            4
        );

        ctx.shadowBlur =
            0;


        /*
         * Warning label.
         */

        ctx.font =
            "bold 12px Arial";

        ctx.textAlign =
            "center";

        ctx.fillStyle =
            "rgba(120,255,220,0.72)";

        ctx.fillText(
            "DANGER",
            WIDTH / 2,
            HEIGHT - 17
        );
    }


    /* =====================================================
       PARTICLES
    ===================================================== */

    addParticles(
        x,
        y,
        c,
        amount,
        power = 1
    ) {

        for (
            let i = 0;
            i < amount;
            i++
        ) {

            this.particles.push(
                new Particle(
                    x,
                    y,
                    c,
                    power
                )
            );
        }
    }


    bounceEffect(
        x,
        y,
        platform,
        type
    ) {

        if (
            type === "edge"
        ) {

            this.addParticles(
                x,
                y,
                [255, 215, 80],
                24,
                1.15
            );

            this.shake =
                5;

            soundEdge();

            hapticBounce();

        } else if (
            type === "dive"
        ) {

            this.addParticles(
                x,
                y,
                [255, 105, 150],
                28,
                1.3
            );

            this.shake =
                6;

            soundBounce();

            haptic(
                [10, 20, 10]
            );

        } else if (
            type === "boost"
        ) {

            this.addParticles(
                x,
                y,
                [80, 240, 255],
                30,
                1.25
            );

            this.shake =
                4;

            this.flash =
                0.07;

            soundBounce();

            hapticBounce();

        } else {

            this.addParticles(
                x,
                y,
                platform.color,
                16,
                1
            );

            this.shake =
                2.5;

            soundBounce();

            hapticBounce();
        }
    }


    /* =====================================================
       ORB COLLECTION
    ===================================================== */

    collectOrb(
        orb
    ) {

        if (
            orb.collected
        ) {

            return;
        }

        orb.collect();


        if (
            orb.rainbow
        ) {

            /*
             * RAINBOW SAFETY.
             */

            this.player.safetyTimer =
                SAFETY_TIME;

            this.score +=
                300;

            this.addParticles(
                orb.x,
                orb.y,
                [255, 255, 255],
                45,
                1.4
            );

            this.shake =
                7;

            this.flash =
                0.12;

            soundSafety();

            hapticSafety();

        } else {

            /*
             * CYAN ENERGY ORB.
             *
             * Gives:
             *
             * +150 score
             * temporary stronger bounce
             */

            this.player.boostTimer =
                ORB_BOOST_TIME;

            this.score +=
                ORB_SCORE;

            this.addParticles(
                orb.x,
                orb.y,
                [60, 230, 255],
                28,
                1.2
            );

            this.shake =
                4;

            this.flash =
                0.06;

            soundOrb();

            hapticOrb();
        }
    }


    /* =====================================================
       PLATFORM COLLISION
    ===================================================== */

    collidePlatform(
        player,
        platform,
        previousY
    ) {

        const r =
            platform.rect;


        /*
         * IMPORTANT DESIGN CHANGE:
         *
         * Platforms only catch the player from ABOVE.
         *
         * No side bouncing.
         * No underside bouncing.
         *
         * This prevents the exact "stuck between two
         * platforms endlessly bouncing" problem.
         */


        /*
         * Must be falling.
         */

        if (
            player.vy <= 0
        ) {

            return false;
        }


        /*
         * Horizontal overlap.
         */

        const horizontal =
            player.x +
                player.radius >
                r.left &&
            player.x -
                player.radius <
                r.right;

        if (!horizontal) {

            return false;
        }


        /*
         * Was the player above the platform on the
         * previous physics step?
         */

        const previousBottom =
            previousY +
            player.radius;

        const currentBottom =
            player.y +
            player.radius;


        if (
            previousBottom <=
                r.top &&
            currentBottom >=
                r.top
        ) {

            /*
             * Put player exactly on platform.
             */

            player.y =
                r.top -
                player.radius;


            const result =
                player.bounce(
                    platform
                );


            /*
             * Landing classification.
             */

            const centerDistance =
                Math.abs(
                    player.x -
                    platform.x
                );

            const edgeDistance =
                platform.width / 2 -
                centerDistance;

            let landingType =
                "normal";


            if (
                edgeDistance <
                25
            ) {

                landingType =
                    "edge";
            }


            /*
             * Only first landing scores.
             */

            if (
                !platform.scored
            ) {

                platform.scored =
                    true;


                let points =
                    100;


                if (
                    landingType ===
                    "edge"
                ) {

                    points +=
                        75;
                }


                if (
                    result.dive
                ) {

                    points +=
                        100;
                }


                if (
                    platform.bonus
                ) {

                    points +=
                        250;
                }


                /*
                 * Flow.
                 */

                const clean =
                    Math.abs(
                        player.vx
                    ) < 360;


                if (
                    clean
                ) {

                    this.flow =
                        clamp(
                            this.flow + 1,
                            0,
                            10
                        );

                } else {

                    this.flow =
                        Math.max(
                            0,
                            this.flow - 1
                        );
                }


                this.maxFlow =
                    Math.max(
                        this.maxFlow,
                        this.flow
                    );


                if (
                    this.flow >= 2
                ) {

                    points *=
                        1 +
                        (
                            this.flow - 1
                        ) *
                        0.15;
                }


                this.score +=
                    Math.floor(
                        points
                    );


                let effect =
                    "normal";


                if (
                    landingType ===
                    "edge"
                ) {

                    effect =
                        "edge";

                } else if (
                    result.dive
                ) {

                    effect =
                        "dive";

                } else if (
                    this.player.boostTimer >
                    0
                ) {

                    effect =
                        "boost";
                }


                this.bounceEffect(
                    player.x,
                    player.y,
                    platform,
                    effect
                );
            }


            player.lastPlatform =
                platform.id;


            return true;
        }


        return false;
    }


    /* =====================================================
       SAFETY SAVE
    ===================================================== */

    safetySave() {

        if (
            this.player.safetyTimer <=
            0
        ) {

            return false;
        }


        /*
         * Consume the safety net.
         */

        this.player.safetyTimer =
            0;


        /*
         * Put the player safely above the death zone.
         */

        this.player.y =
            this.player.y -
            70;


        this.player.vy =
            -SAFETY_BOUNCE;


        this.player.vx *=
            0.75;

        this.player.diving =
            false;


        this.score +=
            200;


        this.flow =
            Math.max(
                0,
                this.flow - 1
            );


        this.addParticles(
            this.player.x,
            this.player.y,
            [100,255,220],
            55,
            1.5
        );


        this.shake =
            10;

        this.flash =
            0.16;

        this.saveFlash =
            0.5;


        soundSave();

        haptic(
            [15, 30, 15]
        );


        return true;
    }


    /* =====================================================
       UPDATE
    ===================================================== */

    update(dt) {

        /*
         * Flames should always animate.
         */

        this.updateFlames(dt);


        if (
            this.gameOver
        ) {

            this.updateParticles(
                dt
            );

            this.shake =
                Math.max(
                    0,
                    this.shake -
                    dt * 20
                );

            this.saveFlash =
                Math.max(
                    0,
                    this.saveFlash -
                    dt
                );

            return;
        }


        /*
         * Player timers.
         */

        this.player.updateTimers(
            dt
        );


        /*
         * Player control.
         */

        this.player.control(
            dt
        );


        /*
         * Move platforms.
         */

        const speed =
            this.platformSpeed();


        for (
            const platform of
            this.platforms
        ) {

            platform.update(
                dt,
                speed
            );
        }


        /*
         * Move orbs.
         */

        for (
            const orb of
            this.orbs
        ) {

            orb.update(
                dt,
                speed
            );
        }


        /*
         * Physics.
         */

        const subDt =
            dt /
            PHYSICS_STEPS;


        for (
            let i = 0;
            i < PHYSICS_STEPS;
            i++
        ) {

            const previousY =
                this.player.y;


            this.player.gravity(
                subDt
            );

            this.player.move(
                subDt
            );


            /*
             * Walls.
             */

            this.player.wallCollision();


            /*
             * Platforms.
             */

            for (
                const platform of
                this.platforms
            ) {

                if (
                    this.collidePlatform(
                        this.player,
                        platform,
                        previousY
                    )
                ) {

                    break;
                }
            }


            /*
             * Orbs.
             */

            for (
                const orb of
                this.orbs
            ) {

                if (
                    orb.collected
                ) {

                    continue;
                }


                const d =
                    distance(
                        this.player.x,
                        this.player.y,
                        orb.x,
                        orb.y
                    );


                if (
                    d <
                    this.player.radius +
                    orb.radius +
                    8
                ) {

                    this.collectOrb(
                        orb
                    );
                }
            }
        }


        /*
         * Camera.
         */

        this.updateCamera(
            dt
        );


        /*
         * Height.
         */

        const currentHeight =
            Math.max(
                0,
                Math.floor(
                    520 -
                    this.player.y
                )
            );


        if (
            currentHeight >
            this.height
        ) {

            this.height =
                currentHeight;
        }


        /*
         * Best records.
         */

        this.bestHeight =
            Math.max(
                this.bestHeight,
                this.height
            );

        this.bestScore =
            Math.max(
                this.bestScore,
                this.score
            );


        localStorage.setItem(
            "bounceBestHeight",
            this.bestHeight
        );

        localStorage.setItem(
            "bounceBestScore",
            this.bestScore
        );


        /*
         * Height tracking.
         */

        const now =
            performance.now() /
            1000;


        if (
            now -
            this.lastHeightTime >
            0.35
        ) {

            this.lastHeight =
                this.height;

            this.lastHeightTime =
                now;
        }


        /*
         * Spawn platforms.
         */

        this.spawnTimer +=
            dt;


        while (
            this.spawnTimer >=
            SPAWN_INTERVAL
        ) {

            this.spawnTimer -=
                SPAWN_INTERVAL;

            this.spawnPlatform();
        }


        /*
         * Remove old platforms.
         */

        const despawnY =
            -this.cameraY +
            HEIGHT +
            DESPAWN_DISTANCE;


        this.platforms =
            this.platforms.filter(
                platform =>
                    platform.y <
                    despawnY
            );


        /*
         * Remove old orbs.
         */

        this.orbs =
            this.orbs.filter(
                orb =>
                    !orb.collected &&
                    orb.y <
                    despawnY
            );


        /*
         * Death boundary.
         *
         * The flames correspond to this area.
         */

        const screenY =
            this.player.y +
            this.cameraY;


        if (
            screenY >
            HEIGHT - 35
        ) {

            /*
             * Safety net gets priority.
             */

            if (
                !this.safetySave()
            ) {

                this.die();
            }
        }


        /*
         * Effects.
         */

        this.updateParticles(
            dt
        );

        this.player.updateVisuals();


        this.shake =
            Math.max(
                0,
                this.shake -
                dt * 20
            );

        this.flash =
            Math.max(
                0,
                this.flash -
                dt
            );

        this.saveFlash =
            Math.max(
                0,
                this.saveFlash -
                dt
            );
    }


    /* =====================================================
       CAMERA
    ===================================================== */

    updateCamera(dt) {

        const screenY =
            this.player.y +
            this.cameraY;


        if (
            screenY <
            CAMERA_TARGET_Y
        ) {

            const target =
                CAMERA_TARGET_Y -
                this.player.y;


            this.cameraY =
                lerp(
                    this.cameraY,
                    target,
                    Math.min(
                        1,
                        dt *
                        CAMERA_FOLLOW_SPEED
                    )
                );
        }


        this.cameraY =
            Math.max(
                this.cameraY,
                0
            );
    }


    /* =====================================================
       PARTICLES
    ===================================================== */

    updateParticles(dt) {

        for (
            let i =
                this.particles.length - 1;
            i >= 0;
            i--
        ) {

            const particle =
                this.particles[i];

            particle.update(
                dt
            );

            if (
                particle.life <=
                0
            ) {

                this.particles.splice(
                    i,
                    1
                );
            }
        }
    }


    /* =====================================================
       DEATH
    ===================================================== */

    die() {

        if (
            this.gameOver
        ) {

            return;
        }


        this.gameOver =
            true;


        this.bestScore =
            Math.max(
                this.bestScore,
                this.score
            );


        this.bestHeight =
            Math.max(
                this.bestHeight,
                this.height
            );


        localStorage.setItem(
            "bounceBestScore",
            this.bestScore
        );

        localStorage.setItem(
            "bounceBestHeight",
            this.bestHeight
        );


        this.addParticles(
            this.player.x,
            this.player.y,
            [70, 220, 255],
            55,
            1.4
        );


        this.shake =
            12;

        soundDeath();

        hapticDeath();
    }


    /* =====================================================
       BACKGROUND
    ===================================================== */

    background() {

        const gradient =
            ctx.createLinearGradient(
                0,
                0,
                0,
                HEIGHT
            );


        gradient.addColorStop(
            0,
            "#070a14"
        );

        gradient.addColorStop(
            1,
            "#0f1728"
        );


        ctx.fillStyle =
            gradient;


        ctx.fillRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );


        /*
         * Stars.
         */

        for (
            let i = 0;
            i < 70;
            i++
        ) {

            const x =
                (
                    i *
                    83
                ) %
                WIDTH;


            const y =
                (
                    i *
                    137 +
                    Math.floor(
                        this.cameraY *
                        0.15
                    )
                ) %
                HEIGHT;


            ctx.fillStyle =
                "rgba(100,140,180,0.35)";


            ctx.fillRect(
                x,
                y,
                1,
                1
            );
        }


        /*
         * Very subtle vertical color streaks.
         */

        const glow =
            ctx.createLinearGradient(
                0,
                0,
                WIDTH,
                0
            );

        glow.addColorStop(
            0,
            "rgba(20,100,150,0)"
        );

        glow.addColorStop(
            0.5,
            "rgba(30,150,200,0.035)"
        );

        glow.addColorStop(
            1,
            "rgba(20,100,150,0)"
        );

        ctx.fillStyle =
            glow;

        ctx.fillRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );
    }


    /* =====================================================
       TEXT
    ===================================================== */

    textCentered(
        text,
        y,
        size,
        c
    ) {

        ctx.font =
            `${size}px Arial`;

        ctx.fillStyle =
            color(c);

        ctx.textAlign =
            "center";

        ctx.fillText(
            text,
            WIDTH / 2,
            y
        );
    }

       HUD
    ===================================================== */

    hud() {

        ctx.textAlign =
            "center";


        /*
         * Score.
         */

        ctx.font =
            "bold 38px Arial";

        ctx.fillStyle =
            color(WHITE);

        ctx.fillText(
            this.score.toLocaleString(),
            WIDTH / 2,
            48
        );


        ctx.font =
            "16px Arial";

        ctx.fillStyle =
            "rgba(160,180,200,0.9)";

        ctx.fillText(
            "SCORE",
            WIDTH / 2,
            70
        );


        /*
         * Height.
         */

        ctx.font =
            "bold 20px Arial";

        ctx.fillStyle =
            "rgba(220,235,250,0.95)";

        ctx.fillText(
            `HEIGHT  ${
                this.height.toLocaleString()
            }`,
            WIDTH / 2,
            100
        );


        /*
         * Flow.
         */

        if (
            this.flow > 0
        ) {

            ctx.font =
                "bold 23px Arial";

            ctx.fillStyle =
                this.flow >= 7
                    ? "#ffe06a"
                    : "#62f5d0";

            ctx.fillText(
                `FLOW x${this.flow}`,
                WIDTH / 2,
                132
            );
        }


        /*
         * Dive indicator.
         */

        if (
            this.player.diving
        ) {

            ctx.font =
                "bold 18px Arial";

            ctx.fillStyle =
                "#ff7896";

            ctx.textAlign =
                "right";

            ctx.fillText(
                "DIVE!",
                WIDTH - 15,
                38
            );
        }


        /*
         * Boost indicator.
         */

        if (
            this.player.boostTimer >
            0
        ) {

            ctx.textAlign =
                "left";

            ctx.font =
                "bold 15px Arial";

            ctx.fillStyle =
                "#54eaff";

            ctx.fillText(
                `BOOST ${
                    this.player.boostTimer.toFixed(1)
                }`,
                15,
                38
            );
        }


        /*
         * Safety indicator.
         */

        if (
            this.player.safetyTimer >
            0
        ) {

            ctx.textAlign =
                "left";

            ctx.font =
                "bold 15px Arial";

            ctx.fillStyle =
                "#78ffd5";

            ctx.fillText(
                `SAFETY ${
                    this.player.safetyTimer.toFixed(1)
                }`,
                15,
                60
            );
        }


        /*
         * Sound icon.
         */

        ctx.textAlign =
            "right";

        ctx.font =
            "16px Arial";

        ctx.fillStyle =
            "rgba(180,205,225,0.75)";

        ctx.fillText(
            soundEnabled
                ? "♪"
                : "×",
            WIDTH - 15,
            HEIGHT - 58
        );
    }

            0.002;

        const orbY =

                orbX,

                orbX,
                orbY,
