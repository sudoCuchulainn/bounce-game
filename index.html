<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>BOUNCE</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #070a14;

    touch-action: none;
    user-select: none;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;
}

#game {
    display: block;

    background: #070a14;

    touch-action: none;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<script>
"use strict";

/* =========================================================
   BOUNCE
   ========================================================= */

/* ---------------------------------------------------------
   CANVAS
--------------------------------------------------------- */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const WIDTH = 480;
const HEIGHT = 800;

let scale = 1;

function resize() {

    scale = Math.min(
        window.innerWidth / WIDTH,
        window.innerHeight / HEIGHT
    );

    canvas.width = WIDTH * scale;
    canvas.height = HEIGHT * scale;

    canvas.style.width =
        `${WIDTH * scale}px`;

    canvas.style.height =
        `${HEIGHT * scale}px`;
}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   SETTINGS
   ========================================================= */

const WHITE = [245, 250, 255];

const PLATFORM_COLORS = [
    [70, 220, 255],
    [185, 100, 255],
    [255, 215, 80],
    [90, 255, 180],
    [255, 105, 150],
    [100, 150, 255]
];

const PLATFORM_DARK = [25, 45, 70];
const PLATFORM_HIGHLIGHT = [180, 245, 255];


/* ---------------------------------------------------------
   PLAYER PHYSICS
--------------------------------------------------------- */

const GRAVITY = 1500;

const BOUNCE_POWER = 980;

const DIVE_BOUNCE_POWER = 1320;

const MAX_FALL_SPEED = 1700;

const DIVE_ACCELERATION = 2500;

const AIR_ACCEL = 2100;

const AIR_FRICTION = 0.985;

const MAX_X_SPEED = 450;

const WALL_RESTITUTION = 0.92;

const PLATFORM_RESTITUTION = 0.98;

const BALL_RADIUS = 17;

const PHYSICS_STEPS = 6;


/* ---------------------------------------------------------
   PLATFORM GENERATION
--------------------------------------------------------- */

const CELL = 34;

/*
 * This is intentionally much larger than before.
 *
 * The game should feel like:
 *
 * LEFT
 *       platform
 *
 *                         RIGHT
 * 
 * LEFT
 *
 *                         RIGHT
 *
 * rather than a pile of platforms.
 */

const MIN_VERTICAL_GAP = 155;

const MAX_VERTICAL_GAP = 190;

const PLATFORM_SIDE_MARGIN = 55;


/* ---------------------------------------------------------
   CAMERA
--------------------------------------------------------- */

const CAMERA_TARGET_Y = 330;

const CAMERA_FOLLOW_SPEED = 7;


/* ---------------------------------------------------------
   PLATFORM MOVEMENT
--------------------------------------------------------- */

const SPAWN_INTERVAL = 0.45;

const DESPAWN_DISTANCE = 250;


/* =========================================================
   INPUT
========================================================= */

let keyLeft = false;
let keyRight = false;
let keyDown = false;

let touchActive = false;

let touchStartX = 0;
let touchStartY = 0;

let touchX = 0;
let touchY = 0;


function pointerPosition(event) {

    const rect =
        canvas.getBoundingClientRect();

    return {
        x:
            (event.clientX - rect.left)
            / scale,

        y:
            (event.clientY - rect.top)
            / scale
    };
}


/* ---------------------------------------------------------
   TOUCH
--------------------------------------------------------- */

canvas.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        const p =
            pointerPosition(event);

        touchActive = true;

        touchStartX = p.x;
        touchStartY = p.y;

        touchX = p.x;
        touchY = p.y;

        if (
            !game.started ||
            game.gameOver
        ) {

            game.restart();
        }
    }
);


canvas.addEventListener(
    "pointermove",
    event => {

        if (!touchActive) {
            return;
        }

        event.preventDefault();

        const p =
            pointerPosition(event);

        touchX = p.x;
        touchY = p.y;
    }
);


canvas.addEventListener(
    "pointerup",
    event => {

        event.preventDefault();

        touchActive = false;
    }
);


canvas.addEventListener(
    "pointercancel",
    () => {

        touchActive = false;
    }
);


/* ---------------------------------------------------------
   KEYBOARD
--------------------------------------------------------- */

window.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "ArrowLeft" ||
            event.key.toLowerCase() === "a"
        ) {

            keyLeft = true;
        }

        if (
            event.key === "ArrowRight" ||
            event.key.toLowerCase() === "d"
        ) {

            keyRight = true;
        }

        if (
            event.key === "ArrowDown"
        ) {

            keyDown = true;
        }

        if (
            event.code === "Space"
        ) {

            if (
                !game.started ||
                game.gameOver
            ) {

                game.restart();
            }
        }

        if (
            event.key === "Escape"
        ) {

            location.reload();
        }
    }
);


window.addEventListener(
    "keyup",
    event => {

        if (
            event.key === "ArrowLeft" ||
            event.key.toLowerCase() === "a"
        ) {

            keyLeft = false;
        }

        if (
            event.key === "ArrowRight" ||
            event.key.toLowerCase() === "d"
        ) {

            keyRight = false;
        }

        if (
            event.key === "ArrowDown"
        ) {

            keyDown = false;
        }
    }
);


/* =========================================================
   HELPERS
========================================================= */

function clamp(
    value,
    minimum,
    maximum
) {

    return Math.max(
        minimum,
        Math.min(
            maximum,
            value
        )
    );
}


function lerp(
    a,
    b,
    amount
) {

    return a +
        (b - a) *
        amount;
}


function color(c) {

    return `rgb(${c[0]},${c[1]},${c[2]})`;
}


function rgba(
    c,
    alpha
) {

    return `rgba(${c[0]},${c[1]},${c[2]},${alpha})`;
}


/* =========================================================
   PARTICLES
========================================================= */

class Particle {

    constructor(
        x,
        y,
        c,
        power = 1
    ) {

        this.x = x;
        this.y = y;

        const angle =
            Math.random() *
            Math.PI *
            2;

        const speed =
            (
                70 +
                Math.random() *
                200
            ) *
            power;

        this.vx =
            Math.cos(angle) *
            speed;

        this.vy =
            Math.sin(angle) *
            speed;

        this.life =
            0.2 +
            Math.random() *
            0.4;

        this.maxLife =
            this.life;

        this.size =
            2 +
            Math.random() *
            4;

        this.color = c;
    }


    update(dt) {

        this.x +=
            this.vx *
            dt;

        this.y +=
            this.vy *
            dt;

        this.vy +=
            450 *
            dt;

        this.vx *=
            0.985;

        this.life -=
            dt;
    }


    draw(cameraY) {

        if (
            this.life <= 0
        ) {

            return;
        }

        const alpha =
            this.life /
            this.maxLife;

        const size =
            Math.max(
                1,
                this.size *
                alpha
            );

        ctx.fillStyle =
            rgba(
                this.color,
                alpha
            );

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y + cameraY,
            size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}


/* =========================================================
   PLATFORM
========================================================= */

class Platform {

    constructor(
        x,
        y,
        width = 5,
        moving = false,
        bonus = false
    ) {

        this.x = x;

        this.y = y;

        this.widthCells =
            width;

        this.width =
            width *
            CELL;

        this.height =
            CELL;

        this.vx =
            moving
                ? (
                    Math.random() < 0.5
                        ? -1
                        : 1
                ) *
                (
                    25 +
                    Math.random() *
                    55
                )
                : 0;

        this.vy = 0;

        this.moving =
            moving;

        this.bonus =
            bonus;

        this.color =
            bonus
                ? [255, 215, 80]
                : PLATFORM_COLORS[
                    Math.floor(
                        Math.random() *
                        PLATFORM_COLORS.length
                    )
                ];

        /*
         * IMPORTANT:
         *
         * A platform only gives its landing
         * points once.
         *
         * The player can bounce off it again,
         * but it won't generate another
         * score event until the player lands
         * on a different platform.
         */

        this.scoredThisVisit =
            false;

        this.id =
            Platform.nextId++;
    }


    get rect() {

        return {

            left:
                this.x -
                this.width / 2,

            right:
                this.x +
                this.width / 2,

            top:
                this.y -
                CELL / 2,

            bottom:
                this.y +
                CELL / 2
        };
    }


    update(
        dt,
        platformSpeed
    ) {

        this.y +=
            platformSpeed *
            dt;

        if (
            this.moving
        ) {

            this.x +=
                this.vx *
                dt;

            const half =
                this.width / 2;

            if (
                this.x -
                half <
                8
            ) {

                this.x =
                    8 +
                    half;

                this.vx =
                    Math.abs(
                        this.vx
                    );
            }

            if (
                this.x +
                half >
                WIDTH - 8
            ) {

                this.x =
                    WIDTH -
                    8 -
                    half;

                this.vx =
                    -Math.abs(
                        this.vx
                    );
            }
        }
    }


    draw(cameraY) {

        const r =
            this.rect;

        const sy =
            r.top +
            cameraY;

        if (
            sy >
                HEIGHT + 100 ||
            sy <
                -100
        ) {

            return;
        }

        ctx.fillStyle =
            color(
                PLATFORM_DARK
            );

        roundRect(
            r.left,
            sy + 5,
            this.width,
            CELL,
            7
        );

        ctx.fillStyle =
            color(
                this.color
            );

        roundRect(
            r.left,
            sy,
            this.width,
            CELL,
            7
        );

        ctx.strokeStyle =
            color(
                PLATFORM_HIGHLIGHT
            );

        ctx.lineWidth = 3;

        ctx.beginPath();

        ctx.moveTo(
            r.left + 7,
            sy + 5
        );

        ctx.lineTo(
            r.right - 7,
            sy + 5
        );

        ctx.stroke();


        /*
         * Moving platform indicator.
         */

        if (
            this.moving
        ) {

            ctx.fillStyle =
                "rgba(255,255,255,0.55)";

            ctx.beginPath();

            ctx.arc(
                this.x,
                sy +
                    CELL / 2,
                3,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }


        /*
         * Bonus platform indicator.
         */

        if (
            this.bonus
        ) {

            ctx.strokeStyle =
                "rgba(255,255,255,0.8)";

            ctx.lineWidth = 2;

            ctx.beginPath();

            ctx.arc(
                this.x,
                sy +
                    CELL / 2,
                CELL * 0.32,
                0,
                Math.PI * 2
            );

            ctx.stroke();
        }
    }
}


Platform.nextId = 1;


function roundRect(
    x,
    y,
    width,
    height,
    radius
) {

    ctx.beginPath();

    ctx.roundRect(
        x,
        y,
        width,
        height,
        radius
    );

    ctx.fill();
}


/* =========================================================
   PLAYER
========================================================= */

class Player {

    constructor() {

        this.reset();
    }


    reset() {

        this.x =
            WIDTH / 2;

        this.y =
            520;

        this.vx = 0;

        this.vy = 0;

        this.radius =
            BALL_RADIUS;

        this.squash = 1;

        this.stretch = 1;

        this.trail = [];

        this.bounces = 0;

        this.diving = false;

        this.lastPlatform = null;
    }


    control(dt) {

        let direction = 0;


        /*
         * Keyboard.
         */

        if (keyLeft) {
            direction--;
        }

        if (keyRight) {
            direction++;
        }


        /*
         * Touch.
         *
         * Horizontal distance from the starting
         * point determines how strongly the player
         * moves.
         */

        if (
            touchActive
        ) {

            const dx =
                touchX -
                touchStartX;

            if (
                Math.abs(dx) >
                8
            ) {

                direction =
                    clamp(
                        dx / 70,
                        -1,
                        1
                    );
            }
        }


        this.vx +=
            direction *
            AIR_ACCEL *
            dt;

        this.vx *=
            AIR_FRICTION;

        this.vx =
            clamp(
                this.vx,
                -MAX_X_SPEED,
                MAX_X_SPEED
            );


        /*
         * Dive.
         */

        this.diving = false;

        if (
            this.vy > 0
        ) {

            if (
                keyDown
            ) {

                this.diving = true;
            }

            if (
                touchActive &&
                touchY -
                    touchStartY >
                    55
            ) {

                this.diving = true;
            }

            if (
                this.diving
            ) {

                this.vy +=
                    DIVE_ACCELERATION *
                    dt;

                this.vy =
                    Math.min(
                        this.vy,
                        MAX_FALL_SPEED
                    );
            }
        }
    }


    gravity(dt) {

        this.vy +=
            GRAVITY *
            dt;

        this.vy =
            Math.min(
                this.vy,
                MAX_FALL_SPEED
            );
    }


    move(dt) {

        this.x +=
            this.vx *
            dt;

        this.y +=
            this.vy *
            dt;
    }


    wallCollision() {

        if (
            this.x -
            this.radius <
            0
        ) {

            this.x =
                this.radius;

            this.vx =
                Math.abs(
                    this.vx
                ) *
                WALL_RESTITUTION;

            return true;
        }


        if (
            this.x +
            this.radius >
            WIDTH
        ) {

            this.x =
                WIDTH -
                this.radius;

            this.vx =
                -Math.abs(
                    this.vx
                ) *
                WALL_RESTITUTION;

            return true;
        }

        return false;
    }


    bounce(
        nx,
        ny,
        platformVy
    ) {

        const relativeVx =
            this.vx;

        const relativeVy =
            this.vy -
            platformVy;

        const into =
            relativeVx *
                nx +
            relativeVy *
                ny;

        if (
            into >= 0
        ) {

            return null;
        }


        /*
         * Reflect velocity from the
         * surface.
         */

        this.vx -=
            2 *
            into *
            nx;

        this.vy -=
            2 *
            into *
            ny;


        this.vx *=
            PLATFORM_RESTITUTION;

        this.vy *=
            PLATFORM_RESTITUTION;


        let type =
            "side";


        /*
         * TOP LANDING
         */

        if (
            ny < -0.5
        ) {

            type =
                "top";

            let power =
                BOUNCE_POWER;


            /*
             * Dive bounce.
             */

            if (
                this.diving
            ) {

                const bonus =
                    Math.max(
                        0,
                        this.vy
                    ) *
                    0.45;

                power =
                    Math.max(
                        DIVE_BOUNCE_POWER,
                        BOUNCE_POWER +
                        bonus
                    );
            }


            this.vy =
                -power;

            this.squash =
                1.4;

            this.stretch =
                0.65;

            this.bounces++;


            const wasDive =
                this.diving;

            this.diving =
                false;


            return {

                type:
                    "top",

                dive:
                    wasDive
            };
        }


        /*
         * BOTTOM
         */

        if (
            ny > 0.5
        ) {

            type =
                "bottom";

            this.squash =
                1.15;

            this.stretch =
                0.85;

            return {
                type
            };
        }


        /*
         * SIDE
         */

        this.squash =
            1.15;

        this.stretch =
            0.85;

        return {
            type
        };
    }


    updateVisuals() {

        this.squash =
            lerp(
                this.squash,
                1,
                0.18
            );

        this.stretch =
            lerp(
                this.stretch,
                1,
                0.18
            );


        this.trail.push({

            x:
                this.x,

            y:
                this.y
        });


        if (
            this.trail.length >
            14
        ) {

            this.trail.shift();
        }
    }


    draw(cameraY) {

        /*
         * Trail.
         */

        for (
            let i = 0;
            i < this.trail.length;
            i++
        ) {

            const p =
                this.trail[i];

            const progress =
                i /
                Math.max(
                    1,
                    this.trail.length
                );

            ctx.fillStyle =
                `rgba(80,210,255,${
                    0.06 +
                    progress *
                    0.14
                })`;

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y + cameraY,
                Math.max(
                    2,
                    this.radius *
                    progress
                ),
                0,
                Math.PI * 2
            );

            ctx.fill();
        }


        const width =
            this.radius *
            2 *
            this.squash;

        const height =
            this.radius *
            2 *
            this.stretch;

        const sy =
            this.y +
            cameraY;


        ctx.shadowBlur =
            18;

        ctx.shadowColor =
            "rgba(80,220,255,0.65)";

        ctx.fillStyle =
            "#f5faff";

        ctx.beginPath();

        ctx.ellipse(
            this.x,
            sy,
            width / 2,
            height / 2,
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.shadowBlur =
            0;


        ctx.fillStyle =
            "#50c8ff";

        ctx.beginPath();

        ctx.ellipse(
            this.x -
                width *
                0.18,

            sy -
                height *
                0.22,

            Math.max(
                3,
                width *
                0.15
            ),

            Math.max(
                3,
                height *
                0.12
            ),

            0,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}


/* =========================================================
   GAME
========================================================= */

class Game {

    constructor() {

        this.player =
            new Player();

        this.platforms = [];

        this.particles = [];

        this.cameraY = 0;


        /*
         * SCORE
         */

        this.score = 0;

        this.bestScore =
            Number(
                localStorage.getItem(
                    "bounceBestScore"
                ) || 0
            );


        /*
         * HEIGHT
         */

        this.height = 0;

        this.bestHeight =
            Number(
                localStorage.getItem(
                    "bounceBestHeight"
                ) || 0
            );


        /*
         * FLOW
         */

        this.flow = 0;

        this.maxFlow = 0;


        /*
         * PLATFORM SPAWNING
         */

        this.spawnTimer = 0;

        this.nextPlatformY = -100;

        this.lastPlatformSide =
            "left";


        /*
         * GAME STATE
         */

        this.started = false;

        this.gameOver = false;


        /*
         * EFFECTS
         */

        this.shake = 0;

        this.flash = 0;


        /*
         * HEIGHT SPEED TRACKING
         */

        this.lastHeight = 0;

        this.lastHeightTime =
            performance.now() /
            1000;


        this.spawnInitialPlatforms();
    }


    restart() {

        this.player.reset();

        this.platforms = [];

        this.particles = [];

        this.cameraY = 0;

        this.score = 0;

        this.height = 0;

        this.flow = 0;

        this.maxFlow = 0;

        this.spawnTimer = 0;

        this.gameOver = false;

        this.started = true;

        this.shake = 0;

        this.flash = 0;

        this.lastPlatformSide =
            "left";

        this.lastHeight = 0;

        this.lastHeightTime =
            performance.now() /
            1000;

        this.spawnInitialPlatforms();
    }


    difficulty() {

        return clamp(
            this.height /
                6000,
            0,
            1
        );
    }


    platformSpeed() {

        return lerp(
            25,
            145,
            this.difficulty()
        );
    }


    /* =====================================================
       INITIAL PLATFORMS
    ===================================================== */

    spawnInitialPlatforms() {

        this.platforms = [];


        /*
         * Starting platform.
         */

        this.platforms.push(
            new Platform(
                WIDTH * 0.50,
                625,
                5,
                false,
                false
            )
        );


        /*
         * The first jumps deliberately
         * alternate sides.
         */

        this.platforms.push(
            new Platform(
                115,
                455,
                5,
                false,
                false
            )
        );


        this.platforms.push(
            new Platform(
                365,
                285,
                5,
                false,
                false
            )
        );


        this.platforms.push(
            new Platform(
                110,
                115,
                5,
                false,
                false
            )
        );


        this.nextPlatformY =
            -65;

        this.lastPlatformSide =
            "left";
    }


    /* =====================================================
       PLATFORM SPAWNING
    ===================================================== */

    spawnPlatform() {

        const d =
            this.difficulty();


        /*
         * Find the most recently generated
         * platform above us.
         */

        const previous =
            this.platforms
                .filter(
                    p =>
                        p.y <
                        this.nextPlatformY +
                        230
                )
                .sort(
                    (a, b) =>
                        b.y -
                        a.y
                )[0];


        /*
         * -------------------------------------------------
         * SIDE-TO-SIDE GENERATION
         * -------------------------------------------------
         *
         * Most platforms deliberately appear on
         * the opposite side from the previous one.
         *
         * This creates the main rhythm:
         *
         * LEFT -> RIGHT -> LEFT -> RIGHT
         *
         * with occasional variations.
         */

        let side;

        const variationChance =
            lerp(
                0.08,
                0.22,
                d
            );


        if (
            Math.random() <
            variationChance
        ) {

            side =
                "center";

        } else {

            side =
                this.lastPlatformSide ===
                    "left"

                    ? "right"

                    : "left";
        }


        let x;


        if (
            side === "left"
        ) {

            /*
             * Keep the platform genuinely
             * toward the left.
             */

            x =
                75 +
                Math.random() *
                95;

        } else if (
            side === "right"
        ) {

            x =
                WIDTH -
                (
                    75 +
                    Math.random() *
                    95
                );

        } else {

            /*
             * Center platforms are occasional
             * breathing room.
             */

            x =
                WIDTH / 2 +
                (
                    Math.random() *
                    120 -
                    60
                );
        }


        /*
         * If the previous platform exists,
         * make sure the horizontal jump isn't
         * ridiculous.
         */

        if (
            previous
        ) {

            const maximumReach =
                lerp(
                    300,
                    390,
                    d
                );

            if (
                Math.abs(
                    x -
                    previous.x
                ) >
                maximumReach
            ) {

                x =
                    previous.x +
                    (
                        x >
                        previous.x
                            ? maximumReach
                            : -maximumReach
                    );
            }
        }


        x =
            clamp(
                x,
                PLATFORM_SIDE_MARGIN,
                WIDTH -
                    PLATFORM_SIDE_MARGIN
            );


        /*
         * Platform width.
         */

        let width;

        if (
            d < 0.25
        ) {

            width = 5;

        } else if (
            d < 0.55
        ) {

            width =
                Math.random() <
                0.75
                    ? 5
                    : 4;

        } else {

            width =
                [3, 4, 4, 5][
                    Math.floor(
                        Math.random() *
                        4
                    )
                ];
        }


        /*
         * Moving platforms don't appear
         * immediately.
         */

        const movingChance =
            d < 0.35
                ? 0
                : lerp(
                    0,
                    0.42,
                    (
                        d -
                        0.35
                    ) /
                    0.65
                );


        const moving =
            Math.random() <
            movingChance;


        /*
         * Rare bonus platform.
         */

        const bonus =
            Math.random() <
            0.07;


        const platform =
            new Platform(
                x,
                this.nextPlatformY,
                width,
                moving,
                bonus
            );


        this.platforms.push(
            platform
        );


        /*
         * Remember which side this platform
         * occupied so the next one can generally
         * appear on the opposite side.
         */

        if (
            x <
            WIDTH * 0.38
        ) {

            this.lastPlatformSide =
                "left";

        } else if (
            x >
            WIDTH * 0.62
        ) {

            this.lastPlatformSide =
                "right";

        } else {

            /*
             * Center platform doesn't change
             * the alternating rhythm.
             */
        }


        /*
         * Bigger vertical spacing.
         *
         * Difficulty makes it gradually larger.
         */

        const gap =
            lerp(
                MIN_VERTICAL_GAP,
                MAX_VERTICAL_GAP,
                d
            ) +
            (
                Math.random() *
                24 -
                12
            );


        this.nextPlatformY -=
            gap;
    }


    /* =====================================================
       EFFECTS
    ===================================================== */

    addParticles(
        x,
        y,
        c,
        amount,
        power = 1
    ) {

        for (
            let i = 0;
            i < amount;
            i++
        ) {

            this.particles.push(
                new Particle(
                    x,
                    y,
                    c,
                    power
                )
            );
        }
    }


    bounceEffect(
        x,
        y,
        platform,
        type
    ) {

        if (
            type === "corner"
        ) {

            this.addParticles(
                x,
                y,
                [255, 235, 120],
                32,
                1.4
            );

            this.shake = 7;

            this.flash =
                0.12;

        } else if (
            type === "edge"
        ) {

            this.addParticles(
                x,
                y,
                [255, 215, 80],
                25,
                1.15
            );

            this.shake = 5;

        } else if (
            type === "flow"
        ) {

            this.addParticles(
                x,
                y,
                [90, 255, 220],
                30,
                1.25
            );

            this.shake = 4;

            this.flash =
                0.08;

        } else if (
            type === "dive"
        ) {

            this.addParticles(
                x,
                y,
                [255, 105, 150],
                28,
                1.3
            );

            this.shake = 6;

        } else {

            this.addParticles(
                x,
                y,
                platform.color,
                18,
                1
            );

            this.shake = 3;
        }
    }


    deathEffect() {

        this.addParticles(
            this.player.x,
            this.player.y,
            [70, 220, 255],
            55,
            1.4
        );

        this.shake = 12;
    }


    /* =====================================================
       COLLISION
    ===================================================== */

    collidePlatform(
        player,
        platform
    ) {

        const r =
            platform.rect;


        /*
         * Circle / rectangle collision.
         */

        const closestX =
            clamp(
                player.x,
                r.left,
                r.right
            );

        const closestY =
            clamp(
                player.y,
                r.top,
                r.bottom
            );

        const dx =
            player.x -
            closestX;

        const dy =
            player.y -
            closestY;


        if (
            dx * dx +
            dy * dy >
            player.radius *
            player.radius
        ) {

            return false;
        }


        /*
         * Determine which face was hit.
         *
         * This means the player cannot simply
         * fall through the platform.
         */

        const leftPen =
            player.x +
            player.radius -
            r.left;

        const rightPen =
            r.right -
            (
                player.x -
                player.radius
            );

        const topPen =
            player.y +
            player.radius -
            r.top;

        const bottomPen =
            r.bottom -
            (
                player.y -
                player.radius
            );


        const penetrations = [

            {
                value:
                    leftPen,

                nx:
                    -1,

                ny:
                    0
            },

            {
                value:
                    rightPen,

                nx:
                    1,

                ny:
                    0
            },

            {
                value:
                    topPen,

                nx:
                    0,

                ny:
                    -1
            },

            {
                value:
                    bottomPen,

                nx:
                    0,

                ny:
                    1
            }
        ];


        penetrations.sort(
            (a, b) =>
                a.value -
                b.value
        );


        const hit =
            penetrations[0];


        const nx =
            hit.nx;

        const ny =
            hit.ny;


        /*
         * Relative velocity.
         */

        const relativeVx =
            player.vx;

        const relativeVy =
            player.vy -
            platform.vy;


        const into =
            relativeVx *
                nx +
            relativeVy *
                ny;


        if (
            into >= 0
        ) {

            return false;
        }


        /*
         * Push player out of platform.
         */

        const penetration =
            Math.max(
                hit.value,
                0
            );


        player.x +=
            nx *
            penetration;

        player.y +=
            ny *
            penetration;


        /*
         * Bounce.
         */

        const result =
            player.bounce(
                nx,
                ny,
                platform.vy
            );


        if (
            !result
        ) {

            return false;
        }


        /* =================================================
           TOP LANDING
        ================================================= */

        if (
            result.type ===
            "top"
        ) {

            /*
             * Only a TOP landing can score.
             *
             * Side and bottom collisions never
             * create points.
             */


            /*
             * Detect edge / corner.
             */

            const centerDistance =
                Math.abs(
                    player.x -
                    platform.x
                );

            const halfWidth =
                platform.width /
                2;

            const edgeDistance =
                halfWidth -
                centerDistance;


            const nearLeft =
                Math.abs(
                    player.x -
                    r.left
                ) < 12;


            const nearRight =
                Math.abs(
                    player.x -
                    r.right
                ) < 12;


            const nearTop =
                Math.abs(
                    player.y -
                    r.top
                ) < 12;


            const corner =
                (
                    nearLeft ||
                    nearRight
                ) &&
                nearTop;


            let landingType =
                "normal";


            if (
                corner
            ) {

                landingType =
                    "corner";

            } else if (
                edgeDistance <
                28
            ) {

                landingType =
                    "edge";
            }


            /*
             * ------------------------------------------------
             * ANTI-EXPLOIT:
             *
             * This platform has already awarded its
             * landing points.
             *
             * The player can bounce off it again,
             * but gets ZERO additional score.
             * ------------------------------------------------
             */

            const firstLanding =
                !platform.scoredThisVisit;


            if (
                firstLanding
            ) {

                platform.scoredThisVisit =
                    true;


                /*
                 * Base points.
                 *
                 * The important change:
                 *
                 * SCORE IS FOR REACHING NEW
                 * PLATFORMS, NOT FOR BOUNCING.
                 */

                let points =
                    100;


                /*
                 * Edge landing.
                 */

                if (
                    landingType ===
                    "edge"
                ) {

                    points +=
                        75;
                }


                /*
                 * Corner landing.
                 */

                if (
                    landingType ===
                    "corner"
                ) {

                    points +=
                        150;
                }


                /*
                 * Dive landing.
                 */

                if (
                    result.dive
                ) {

                    points +=
                        100;
                }


                /*
                 * Bonus platform.
                 */

                if (
                    platform.bonus
                ) {

                    points +=
                        250;
                }


                /* -----------------------------------------
                   FLOW
                ----------------------------------------- */

                /*
                 * Clean means:
                 *
                 * - top landing
                 * - not a corner collision
                 * - controlled horizontal speed
                 *
                 * The player is rewarded for making
                 * smooth consecutive jumps.
                 */

                const clean =
                    !corner &&
                    Math.abs(
                        player.vx
                    ) < 360;


                if (
                    clean ||
                    landingType === "edge" ||
                    landingType === "corner"
                ) {

                    this.flow =
                        clamp(
                            this.flow + 1,
                            0,
                            10
                        );

                } else {

                    this.flow =
                        Math.max(
                            0,
                            this.flow - 1
                        );
                }


                this.maxFlow =
                    Math.max(
                        this.maxFlow,
                        this.flow
                    );


                /*
                 * Flow multiplier.
                 *
                 * This rewards actually progressing
                 * through multiple platforms.
                 */

                if (
                    this.flow >= 2
                ) {

                    points *=
                        1 +
                        (
                            this.flow -
                            1
                        ) *
                        0.15;
                }


                /*
                 * Fast climbing bonus.
                 *
                 * A clean series of quick hops that
                 * gains lots of height gets extra points.
                 */

                const now =
                    performance.now() /
                    1000;

                const elapsed =
                    Math.max(
                        0.05,
                        now -
                        this.lastHeightTime
                    );

                const gained =
                    this.height -
                    this.lastHeight;

                const climbRate =
                    gained /
                    elapsed;


                if (
                    climbRate >
                        250 &&
                    this.flow >= 3
                ) {

                    points +=
                        Math.min(
                            200,
                            Math.floor(
                                climbRate /
                                8
                            )
                        );
                }


                this.score +=
                    Math.floor(
                        points
                    );


                /*
                 * Visual feedback.
                 */

                let effect =
                    "normal";


                if (
                    landingType ===
                    "corner"
                ) {

                    effect =
                        "corner";

                } else if (
                    landingType ===
                    "edge"
                ) {

                    effect =
                        "edge";

                } else if (
                    result.dive
                ) {

                    effect =
                        "dive";

                } else if (
                    this.flow >= 3
                ) {

                    effect =
                        "flow";
                }


                this.bounceEffect(
                    player.x,
                    player.y,
                    platform,
                    effect
                );
            }


            /*
             * IMPORTANT:
             *
             * If the player lands on a platform
             * that was already scored, it still
             * bounces normally.
             *
             * It simply doesn't award score again.
             */

            return true;
        }


        /* =================================================
           SIDE / BOTTOM COLLISION
        ================================================= */

        /*
         * Side and bottom hits still physically
         * bounce the player.
         *
         * But they do NOT give score.
         *
         * They also slightly interrupt Flow.
         */

        this.flow =
            Math.max(
                0,
                this.flow - 1
            );


        this.addParticles(
            player.x,
            player.y,
            platform.color,
            10
        );


        return true;
    }


    /* =====================================================
       UPDATE
    ===================================================== */

    update(dt) {

        if (
            this.gameOver
        ) {

            this.updateParticles(
                dt
            );

            this.shake =
                Math.max(
                    0,
                    this.shake -
                    dt * 20
                );

            return;
        }


        /*
         * Player control.
         */

        this.player.control(
            dt
        );


        /*
         * Move platforms downward.
         *
         * This gives the impression that the player
         * is climbing upward through the world.
         */

        const speed =
            this.platformSpeed();


        for (
            const platform of
            this.platforms
        ) {

            platform.update(
                dt,
                speed
            );
        }


        /*
         * Physics substeps.
         */

        const subDt =
            dt /
            PHYSICS_STEPS;


        for (
            let i = 0;
            i <
                PHYSICS_STEPS;
            i++
        ) {

            this.player.gravity(
                subDt
            );

            this.player.move(
                subDt
            );


            /*
             * Walls.
             */

            if (
                this.player.wallCollision()
            ) {

                this.addParticles(
                    this.player.x,
                    this.player.y,
                    [70,220,255],
                    12
                );


                /*
                 * Wall bounce isn't a scoring
                 * event.
                 *
                 * It also slightly disrupts flow.
                 */

                this.flow =
                    Math.max(
                        0,
                        this.flow - 1
                    );
            }


            /*
             * Platforms.
             */

            for (
                const platform of
                this.platforms
            ) {

                if (
                    this.collidePlatform(
                        this.player,
                        platform
                    )
                ) {

                    break;
                }
            }
        }


        /*
         * Camera.
         */

        this.updateCamera(
            dt
        );


        /*
         * Height.
         */

        const currentHeight =
            Math.max(
                0,
                Math.floor(
                    520 -
                    this.player.y
                )
            );


        if (
            currentHeight >
            this.height
        ) {

            this.height =
                currentHeight;
        }


        /*
         * Best height.
         */

        this.bestHeight =
            Math.max(
                this.bestHeight,
                this.height
            );


        /*
         * Best score.
         */

        this.bestScore =
            Math.max(
                this.bestScore,
                this.score
            );


        localStorage.setItem(
            "bounceBestHeight",
            this.bestHeight
        );

        localStorage.setItem(
            "bounceBestScore",
            this.bestScore
        );


        /*
         * Height tracking for fast-climb
         * scoring.
         */

        const now =
            performance.now() /
            1000;


        if (
            now -
            this.lastHeightTime >
            0.35
        ) {

            this.lastHeight =
                this.height;

            this.lastHeightTime =
                now;
        }


        /*
         * Spawn new platforms.
         */

        this.spawnTimer +=
            dt;


        while (
            this.spawnTimer >=
            SPAWN_INTERVAL
        ) {

            this.spawnTimer -=
                SPAWN_INTERVAL;

            this.spawnPlatform();
        }


        /*
         * Remove old platforms.
         */

        const despawnY =
            -this.cameraY +
            HEIGHT +
            DESPAWN_DISTANCE;


        this.platforms =
            this.platforms.filter(
                platform =>
                    platform.y <
                    despawnY
            );


        /*
         * Death.
         */

        const screenY =
            this.player.y +
            this.cameraY;


        if (
            screenY >
            HEIGHT + 70
        ) {

            this.die();
        }


        /*
         * Effects.
         */

        this.updateParticles(
            dt
        );

        this.player.updateVisuals();


        this.shake =
            Math.max(
                0,
                this.shake -
                dt * 20
            );


        this.flash =
            Math.max(
                0,
                this.flash -
                dt
            );
    }


    /* =====================================================
       CAMERA
    ===================================================== */

    updateCamera(dt) {

        const screenY =
            this.player.y +
            this.cameraY;


        if (
            screenY <
            CAMERA_TARGET_Y
        ) {

            const target =
                CAMERA_TARGET_Y -
                this.player.y;


            this.cameraY =
                lerp(
                    this.cameraY,
                    target,
                    Math.min(
                        1,
                        dt *
                        CAMERA_FOLLOW_SPEED
                    )
                );
        }


        this.cameraY =
            Math.max(
                this.cameraY,
                0
            );
    }


    /* =====================================================
       PARTICLES
    ===================================================== */

    updateParticles(dt) {

        for (
            let i =
                this.particles.length - 1;
            i >= 0;
            i--
        ) {

            const particle =
                this.particles[i];

            particle.update(
                dt
            );

            if (
                particle.life <= 0
            ) {

                this.particles.splice(
                    i,
                    1
                );
            }
        }
    }


    /* =====================================================
       DEATH
    ===================================================== */

    die() {

        if (
            this.gameOver
        ) {

            return;
        }


        this.gameOver =
            true;


        this.bestScore =
            Math.max(
                this.bestScore,
                this.score
            );


        this.bestHeight =
            Math.max(
                this.bestHeight,
                this.height
            );


        localStorage.setItem(
            "bounceBestScore",
            this.bestScore
        );


        localStorage.setItem(
            "bounceBestHeight",
            this.bestHeight
        );


        this.deathEffect();
    }


    /* =====================================================
       BACKGROUND
    ===================================================== */

    background() {

        const gradient =
            ctx.createLinearGradient(
                0,
                0,
                0,
                HEIGHT
            );


        gradient.addColorStop(
            0,
            "#070a14"
        );

        gradient.addColorStop(
            1,
            "#0f1728"
        );


        ctx.fillStyle =
            gradient;


        ctx.fillRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );


        /*
         * Stars.
         */

        for (
            let i = 0;
            i < 70;
            i++
        ) {

            const x =
                (
                    i *
                    83
                ) %
                WIDTH;


            const y =
                (
                    i *
                    137 +
                    Math.floor(
                        this.cameraY *
                        0.15
                    )
                ) %
                HEIGHT;


            ctx.fillStyle =
                "rgba(100,140,180,0.35)";


            ctx.fillRect(
                x,
                y,
                1,
                1
            );
        }
    }


    /* =====================================================
       TEXT
    ===================================================== */

    textCentered(
        text,
        y,
        size,
        c
    ) {

        ctx.font =
            `${size}px Arial`;

        ctx.fillStyle =
            color(c);

        ctx.textAlign =
            "center";

        ctx.fillText(
            text,
            WIDTH / 2,
            y
        );
    }


    /* =====================================================
       HUD
    ===================================================== */

    hud() {

        ctx.textAlign =
            "center";


        /*
         * Score.
         */

        ctx.font =
            "bold 38px Arial";

        ctx.fillStyle =
            color(WHITE);

        ctx.fillText(
            this.score.toLocaleString(),
            WIDTH / 2,
            48
        );


        ctx.font =
            "16px Arial";

        ctx.fillStyle =
            "rgba(160,180,200,0.9)";

        ctx.fillText(
            "SCORE",
            WIDTH / 2,
            70
        );


        /*
         * Height.
         */

        ctx.font =
            "bold 20px Arial";

        ctx.fillStyle =
            "rgba(220,235,250,0.95)";

        ctx.fillText(
            `HEIGHT  ${
                this.height.toLocaleString()
            }`,
            WIDTH / 2,
            100
        );


        /*
         * Flow.
         */

        if (
            this.flow > 0
        ) {

            ctx.font =
                "bold 23px Arial";

            ctx.fillStyle =
                this.flow >= 7
                    ? "#ffe06a"
                    : "#62f5d0";


            ctx.fillText(
                `FLOW x${this.flow}`,
                WIDTH / 2,
                132
            );
        }


        /*
         * Dive indicator.
         */

        if (
            this.player.diving
        ) {

            ctx.font =
                "bold 18px Arial";

            ctx.fillStyle =
                "#ff7896";

            ctx.textAlign =
                "right";

            ctx.fillText(
                "DIVE!",
                WIDTH - 15,
                38
            );
        }
    }

    /* =====================================================
       DRAW
    ===================================================== */

    draw() {

        ctx.save();

        ctx.scale(
            scale,
            scale
        );


        this.background();


        /*
         * Platforms.
         */

        for (
            const platform of
            this.platforms
        ) {

            platform.draw(
                this.cameraY
            );
        }


        /*
         * Particles.
         */

        for (
            const particle of
            this.particles
        ) {

            particle.draw(
                this.cameraY
            );
        }


        /*
         * Player.
         */

        this.player.draw(
            this.cameraY
        );


        /*
         * HUD.
         */

        if (
            this.started
        ) {

            this.hud();
        }


        /*
         * Start screen.
         */

        if (
            !this.started
        ) {

            this.startScreen();
        }


        /*
         * Game over.
         */

        if (
            this.gameOver
        ) {

            this.gameOverScreen();
        }


        /*
         * Landing flash.
         */

        if (
            this.flash > 0
        ) {

            ctx.fillStyle =
                `rgba(255,255,255,${
                    this.flash
                })`;

            ctx.fillRect(
                0,
                0,
                WIDTH,
                HEIGHT
            );
        }


        ctx.restore();
    }
}


/* =========================================================
   GAME LOOP
========================================================= */

const game =
    new Game();

let lastTime =
    performance.now();


function loop(now) {

    let dt =
        (
            now -
            lastTime
        ) /
        1000;


    lastTime =
        now;


    /*
     * Prevent huge physics jumps if
     * the browser pauses the game.
     */

    dt =
        Math.min(
            dt,
            0.025
        );


    game.update(
        dt
    );


    /*
     * Screen shake.
     */

    if (
        game.shake > 0
    ) {

        const sx =
            (
                Math.random() *
                2 -
                1
            ) *
            game.shake;


        const sy =
            (
                Math.random() *
                2 -
                1
            ) *
            game.shake;


        ctx.save();


        ctx.translate(
            sx * scale,
            sy * scale
        );


        game.draw();


        ctx.restore();

    } else {

        game.draw();
    }


    requestAnimationFrame(
        loop
    );
}


requestAnimationFrame(
    loop
);
</script>
