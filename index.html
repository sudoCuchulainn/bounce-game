                this.cameraY,
                0
            );
    }


    /* =====================================================
       PARTICLES
    ===================================================== */

    updateParticles(dt) {

        for (
            let i =
                this.particles.length - 1;
            i >= 0;
            i--
        ) {

            const particle =
                this.particles[i];

            particle.update(
                dt
            );

            if (
                particle.life <= 0
            ) {

                this.particles.splice(
                    i,
                    1
                );
            }
        }
    }


    /* =====================================================
       MESSAGES
    ===================================================== */

    updateMessages(dt) {

        for (
            let i =
                this.messages.length - 1;
            i >= 0;
            i--
        ) {

            const message =
                this.messages[i];

            message.update(
                dt
            );

            if (
                message.life <= 0
            ) {

                this.messages.splice(
                    i,
                    1
                );
            }
        }
    }


    /* =====================================================
       DEATH
    ===================================================== */

    die() {

        if (
            this.gameOver
        ) {

            return;
        }


        this.gameOver =
            true;


        this.bestScore =
            Math.max(
                this.bestScore,
                this.score
            );


        this.bestHeight =
            Math.max(
                this.bestHeight,
                this.height
            );


        localStorage.setItem(
            "bounceBestScore",
            this.bestScore
        );


        localStorage.setItem(
            "bounceBestHeight",
            this.bestHeight
        );


        this.deathEffect();
    }


    /* =====================================================
       BACKGROUND
    ===================================================== */

    background() {

        const gradient =
            ctx.createLinearGradient(
                0,
                0,
                0,
                HEIGHT
            );


        gradient.addColorStop(
            0,
            "#050913"
        );

        gradient.addColorStop(
            1,
            "#0d1727"
        );


        ctx.fillStyle =
            gradient;


        ctx.fillRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );


        /*
         * Stars.
         */

        for (
            let i = 0;
            i < 70;
            i++
        ) {

            const x =
                (
                    i *
                    83
                ) %
                WIDTH;


            const y =
                (
                    i *
                    137 +
                    Math.floor(
                        this.cameraY *
                        0.15
                    )
                ) %
                HEIGHT;


            ctx.fillStyle =
                "rgba(100,140,180,0.35)";


            ctx.fillRect(
                x,
                y,
                1,
                1
            );
        }
    }


    /* =====================================================
       TEXT
    ===================================================== */

    textCentered(
        text,
        y,
        size,
        c
    ) {

        ctx.font =
            `${size}px Arial`;

        ctx.fillStyle =
            color(c);

        ctx.textAlign =
            "center";

        ctx.fillText(
            text,
            WIDTH / 2,
            y
        );
    }


    /* =====================================================
       HUD
    ===================================================== */

    hud() {

        ctx.textAlign =
            "center";


        /*
         * Score.
         */

        ctx.font =
            "bold 38px Arial";

        ctx.fillStyle =
            color(WHITE);

        ctx.fillText(
            this.score.toLocaleString(),
            WIDTH / 2,
            48
        );


        ctx.font =
            "16px Arial";

        ctx.fillStyle =
            "rgba(160,180,200,0.9)";

        ctx.fillText(
            "SCORE",
            WIDTH / 2,
            70
        );


        /*
         * Height.
         */

        ctx.font =
            "bold 20px Arial";

        ctx.fillStyle =
            "rgba(220,235,250,0.95)";

        ctx.fillText(
            `HEIGHT ${this.height.toLocaleString()}`,
            WIDTH / 2,
            100
        );


        /*
         * Flow.
         */

        if (
            this.flow > 0
        ) {

            ctx.font =
                "bold 22px Arial";

            ctx.fillStyle =
                this.flow >= 7
                    ? "#ffe06a"
                    : "#62f5d0";


            ctx.fillText(
                `FLOW x${this.flow}`,
                WIDTH / 2,
                132
            );


            /*
             * Make the purpose explicit.
             */

            ctx.font =
                "12px Arial";

            ctx.fillStyle =
                "rgba(140,245,220,0.75)";

            ctx.fillText(
                "+15% SCORE PER FLOW",
                WIDTH / 2,
                150
            );
        }


        /*
         * Active powerups.
         */

        let statusY =
            38;


        if (
            this.player.ghost
        ) {

            ctx.textAlign =
                "right";

            ctx.font =
                "bold 17px Arial";

            ctx.fillStyle =
                "#ffffff";

            ctx.fillText(
                `GHOST ${
                    this.player.ghostTimer.toFixed(1)
                }s`,
                WIDTH - 14,
                statusY
            );

            statusY += 23;
        }


        if (
            this.player.invulnerable
        ) {

            ctx.textAlign =
                "right";

            ctx.font =
                "bold 17px Arial";

            const hue =
                (
                    performance.now() /
                    5
                ) % 360;

            ctx.fillStyle =
                `hsl(${hue},100%,70%)`;

            ctx.fillText(
                `SAFE ${
                    this.player.invulnerableTimer.toFixed(1)
                }s`,
                WIDTH - 14,
                statusY
            );
        }


        /*
         * Dive.
         */

        if (
            this.player.diving
        ) {

            ctx.font =
                "bold 18px Arial";

            ctx.fillStyle =
                "#ff7896";

            ctx.textAlign =
                "right";

            ctx.fillText(
                "DIVE!",
                WIDTH - 15,
                HEIGHT - 80
            );
        }
    }


    /* =====================================================
       START SCREEN
    ===================================================== */

    startScreen() {

        ctx.fillStyle =
            "rgba(0,0,0,0.15)";

        ctx.fillRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );


        this.textCentered(
            "BOUNCE",
            275,
            66,
            WHITE
        );


        this.textCentered(
            "DRAG LEFT / RIGHT",
            365,
            25,
            [70,220,255]
        );


        this.textCentered(
            "REACH THE NEXT PLATFORM",
            400,
            15,
            [180,195,210]
        );


        this.textCentered(
            "DRAG DOWN WHILE FALLING TO DIVE",
            440,
            16,
            [255,120,150]
        );


        this.textCentered(
            "LAND CLEANLY TO BUILD FLOW",
            480,
            16,
            [98,245,208]
        );


        this.textCentered(
            "GOLD  +50",
            525,
            15,
            [255,215,70]
        );


        this.textCentered(
            "WHITE  GHOST",
            550,
            15,
            [245,250,255]
        );


        this.textCentered(
            "RAINBOW  SAFETY NET",
            575,
            15,
            [255,140,230]
        );


        this.textCentered(
            "TAP TO START",
            645,
            20,
            [220,230,240]
        );
    }


    /* =====================================================
       GAME OVER
    ===================================================== */

    gameOverScreen() {

        ctx.fillStyle =
            "rgba(0,0,0,0.70)";

        ctx.fillRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );


        this.textCentered(
            "GAME OVER",
            270,
            56,
            WHITE
        );


        this.textCentered(
            this.score.toLocaleString(),
            345,
            42,
            [70,220,255]
        );


        this.textCentered(
            "SCORE",
            370,
            15,
            [145,165,185]
        );


        this.textCentered(
            this.height.toLocaleString(),
            430,
            34,
            WHITE
        );


        this.textCentered(
            "HEIGHT",
            452,
            15,
            [145,165,185]
        );


        this.textCentered(
            this.bestScore.toLocaleString(),
            505,
            25,
            [190,200,215]
        );


        this.textCentered(
            "BEST SCORE",
            526,
            14,
            [125,145,165]
        );


        this.textCentered(
            this.bestHeight.toLocaleString(),
            570,
            25,
            [190,200,215]
        );


        this.textCentered(
            "BEST HEIGHT",
            591,
            14,
            [125,145,165]
        );


        this.textCentered(
            `MAX FLOW x${this.maxFlow}`,
            640,
            20,
            [98,245,208]
        );


        this.textCentered(
            "TAP ANYWHERE TO RETRY",
            700,
            18,
            WHITE
        );
    }


    /* =====================================================
       DRAW
    ===================================================== */

    draw() {

        ctx.save();

        ctx.scale(
            scale,
            scale
        );


        this.background();


        /*
         * Platforms.
         */

        for (
            const platform of
            this.platforms
        ) {

            platform.draw(
                this.cameraY
            );
        }


        /*
         * Orbs.
         */

        for (
            const orb of
            this.orbs
        ) {

            orb.draw(
                this.cameraY
            );
        }


        /*
         * Fire is drawn before the player,
         * so the player can visibly enter it.
         */

        this.fire.draw();


        /*
         * Particles.
         */

        for (
            const particle of
            this.particles
        ) {

            particle.draw(
                this.cameraY
            );
        }


        /*
         * Player.
         */

        this.player.draw(
            this.cameraY
        );


        /*
         * Floating messages.
         */

        for (
            const message of
            this.messages
        ) {

            message.draw(
                this.cameraY
            );
        }


        /*
         * HUD.
         */

        if (
            this.started
        ) {

            this.hud();
        }


        /*
         * Start screen.
         */

        if (
            !this.started
        ) {

            this.startScreen();
        }


        /*
         * Game over.
         */

        if (
            this.gameOver
        ) {

            this.gameOverScreen();
        }


        /*
         * Landing flash.
         */

        if (
            this.flash > 0
        ) {

            ctx.fillStyle =
                `rgba(255,255,255,${
                    this.flash
                })`;

            ctx.fillRect(
                0,
                0,
                WIDTH,
                HEIGHT
            );
        }


        ctx.restore();
    }
}


/* =========================================================
   GAME LOOP
========================================================= */

const game =
    new Game();

let lastTime =
    performance.now();


function loop(now) {

    let dt =
        (
            now -
            lastTime
        ) /
        1000;


    lastTime =
        now;


    /*
     * Prevent huge physics jumps.
     */

    dt =
        Math.min(
            dt,
            0.025
        );


    game.update(
        dt
    );


    /*
     * Screen shake.
     */

    if (
        game.shake > 0
    ) {

        const sx =
            (
                Math.random() *
                2 -
                1
            ) *
            game.shake;


        const sy =
            (
                Math.random() *
                2 -
                1
            ) *
            game.shake;


        ctx.save();

        ctx.translate(
            sx * scale,
            sy * scale
        );

        game.draw();

        ctx.restore();

    } else {

        game.draw();
    }


    requestAnimationFrame(
        loop
    );
}


requestAnimationFrame(
    loop
);
</script>
