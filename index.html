<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>BOUNCE</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #050914;

    touch-action: none;
    user-select: none;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;
}

#game {
    display: block;

    background: #050914;

    touch-action: none;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<script>
"use strict";

/* =========================================================
   BOUNCE
   =========================================================
   
   Main changes:
   
   - More forgiving early game
   - Large vertical platform spacing
   - Left/right visual rhythm preserved
   - Moving platforms begin at height 7000
   - Gold point orbs
   - White ghost orbs in open air
   - Rainbow safety/invulnerability orbs
   - Ghost lasts 2.5 seconds
   - Ghost prevents ALL platform bouncing
   - Invulnerability lets the player bounce off the fire
   - Animated blue/green fire
   - Orb pickup text
   - Flow explanation
   - Lightweight Web Audio
   - iPhone vibration where Safari/device permits it
   ========================================================= */


/* =========================================================
   CANVAS
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const WIDTH = 480;
const HEIGHT = 800;

let scale = 1;

function resize() {

    scale = Math.min(
        window.innerWidth / WIDTH,
        window.innerHeight / HEIGHT
    );

    canvas.width = WIDTH * scale;
    canvas.height = HEIGHT * scale;

    canvas.style.width =
        `${WIDTH * scale}px`;

    canvas.style.height =
        `${HEIGHT * scale}px`;
}

window.addEventListener("resize", resize);
resize();


/* =========================================================
   COLORS
========================================================= */

const WHITE = [245, 250, 255];

const PLATFORM_COLORS = [
    [70, 220, 255],
    [185, 100, 255],
    [255, 215, 80],
    [90, 255, 180],
    [255, 105, 150],
    [100, 150, 255]
];

const PLATFORM_DARK = [25, 45, 70];
const PLATFORM_HIGHLIGHT = [180, 245, 255];


/* =========================================================
   PLAYER PHYSICS
========================================================= */

const GRAVITY = 1500;

const BOUNCE_POWER = 980;
const DIVE_BOUNCE_POWER = 1320;

const MAX_FALL_SPEED = 1700;

const DIVE_ACCELERATION = 2500;

const AIR_ACCEL = 2100;
const AIR_FRICTION = 0.985;

const MAX_X_SPEED = 450;

const WALL_RESTITUTION = 0.92;
const PLATFORM_RESTITUTION = 0.98;

const BALL_RADIUS = 17;

const PHYSICS_STEPS = 6;


/* =========================================================
   PLATFORM GENERATION
========================================================= */

const CELL = 34;

/*
 * Large spacing is intentional.
 *
 * The player needs room to actually complete
 * a full jump rather than becoming trapped
 * between platforms.
 */

const MIN_VERTICAL_GAP = 185;
const MAX_VERTICAL_GAP = 225;

const PLATFORM_SIDE_MARGIN = 55;


/* =========================================================
   CAMERA
========================================================= */

const CAMERA_TARGET_Y = 330;
const CAMERA_FOLLOW_SPEED = 7;


/* =========================================================
   PLATFORM MOVEMENT
========================================================= */

/*
 * Moving platforms don't begin until the player
 * has reached approximately 7000 height.
 */

const MOVING_PLATFORM_START = 7000;


/* =========================================================
   ORBS
========================================================= */

const GOLD_ORB_CHANCE = 0.24;
const GHOST_ORB_CHANCE = 0.09;
const SAFETY_ORB_CHANCE = 0.035;


/*
 * Orb durations.
 */

const GHOST_DURATION = 2.5;
const SAFETY_DURATION = 4.5;


/* =========================================================
   BOTTOM FIRE
========================================================= */

const FIRE_HEIGHT = 72;


/* =========================================================
   INPUT
========================================================= */

let keyLeft = false;
let keyRight = false;
let keyDown = false;

let touchActive = false;

let touchStartX = 0;
let touchStartY = 0;

let touchX = 0;
let touchY = 0;


/* =========================================================
   AUDIO
========================================================= */

let audioContext = null;
let audioReady = false;

function initAudio() {

    if (audioReady) {
        return;
    }

    try {

        const AudioCtx =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioCtx) {
            return;
        }

        audioContext =
            new AudioCtx();

        audioReady = true;

        if (
            audioContext.state ===
            "suspended"
        ) {

            audioContext.resume();
        }

    } catch (error) {

        audioReady = false;
    }
}


function tone(
    frequency,
    duration,
    volume = 0.035,
    type = "sine",
    slide = 0
) {

    if (
        !audioReady ||
        !audioContext
    ) {
        return;
    }

    try {

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.type =
            type;

        oscillator.frequency.setValueAtTime(
            frequency,
            audioContext.currentTime
        );

        if (slide !== 0) {

            oscillator.frequency.linearRampToValueAtTime(
                frequency + slide,
                audioContext.currentTime +
                    duration
            );
        }

        gain.gain.setValueAtTime(
            0,
            audioContext.currentTime
        );

        gain.gain.linearRampToValueAtTime(
            volume,
            audioContext.currentTime + 0.008
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioContext.currentTime +
                duration
        );

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime +
            duration +
            0.02
        );

    } catch (error) {}
}


/* =========================================================
   HAPTICS
========================================================= */

function vibrate(pattern) {

    try {

        if (
            "vibrate" in navigator
        ) {

            navigator.vibrate(
                pattern
            );
        }

    } catch (error) {}
}


/* =========================================================
   POINTER POSITION
========================================================= */

function pointerPosition(event) {

    const rect =
        canvas.getBoundingClientRect();

    return {

        x:
            (
                event.clientX -
                rect.left
            ) / scale,

        y:
            (
                event.clientY -
                rect.top
            ) / scale
    };
}


/* =========================================================
   TOUCH
========================================================= */

canvas.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        initAudio();

        const p =
            pointerPosition(event);

        touchActive = true;

        touchStartX = p.x;
        touchStartY = p.y;

        touchX = p.x;
        touchY = p.y;

        if (
            !game.started ||
            game.gameOver
        ) {

            game.restart();
        }
    }
);


canvas.addEventListener(
    "pointermove",
    event => {

        if (!touchActive) {
            return;
        }

        event.preventDefault();

        const p =
            pointerPosition(event);

        touchX = p.x;
        touchY = p.y;
    }
);


canvas.addEventListener(
    "pointerup",
    event => {

        event.preventDefault();

        touchActive = false;
    }
);


canvas.addEventListener(
    "pointercancel",
    () => {

        touchActive = false;
    }
);


/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
    "keydown",
    event => {

        initAudio();

        if (
            event.key === "ArrowLeft" ||
            event.key.toLowerCase() === "a"
        ) {

            keyLeft = true;
        }

        if (
            event.key === "ArrowRight" ||
            event.key.toLowerCase() === "d"
        ) {

            keyRight = true;
        }

        if (
            event.key === "ArrowDown"
        ) {

            keyDown = true;
        }

        if (
            event.code === "Space"
        ) {

            if (
                !game.started ||
                game.gameOver
            ) {

                game.restart();
            }
        }

        if (
            event.key === "Escape"
        ) {

            location.reload();
        }
    }
);


window.addEventListener(
    "keyup",
    event => {

        if (
            event.key === "ArrowLeft" ||
            event.key.toLowerCase() === "a"
        ) {

            keyLeft = false;
        }

        if (
            event.key === "ArrowRight" ||
            event.key.toLowerCase() === "d"
        ) {

            keyRight = false;
        }

        if (
            event.key === "ArrowDown"
        ) {

            keyDown = false;
        }
    }
);


/* =========================================================
   HELPERS
========================================================= */

function clamp(
    value,
    minimum,
    maximum
) {

    return Math.max(
        minimum,
        Math.min(
            maximum,
            value
        )
    );
}


function lerp(
    a,
    b,
    amount
) {

    return a +
        (b - a) *
        amount;
}


function color(c) {

    return `rgb(${c[0]},${c[1]},${c[2]})`;
}


function rgba(
    c,
    alpha
) {

    return `rgba(${c[0]},${c[1]},${c[2]},${alpha})`;
}


function distance(
    x1,
    y1,
    x2,
    y2
) {

    const dx =
        x1 - x2;

    const dy =
        y1 - y2;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );
}


function roundRect(
    x,
    y,
    width,
    height,
    radius
) {

    ctx.beginPath();

    ctx.roundRect(
        x,
        y,
        width,
        height,
        radius
    );

    ctx.fill();
}


/* =========================================================
   PARTICLE
========================================================= */

class Particle {

    constructor(
        x,
        y,
        c,
        power = 1
    ) {

        this.x = x;
        this.y = y;

        const angle =
            Math.random() *
            Math.PI *
            2;

        const speed =
            (
                70 +
                Math.random() *
                200
            ) *
            power;

        this.vx =
            Math.cos(angle) *
            speed;

        this.vy =
            Math.sin(angle) *
            speed;

        this.life =
            0.2 +
            Math.random() *
            0.4;

        this.maxLife =
            this.life;

        this.size =
            2 +
            Math.random() *
            4;

        this.color = c;
    }


    update(dt) {

        this.x +=
            this.vx *
            dt;

        this.y +=
            this.vy *
            dt;

        this.vy +=
            450 *
            dt;

        this.vx *=
            0.985;

        this.life -=
            dt;
    }


    draw(cameraY) {

        if (
            this.life <= 0
        ) {
            return;
        }

        const alpha =
            this.life /
            this.maxLife;

        const size =
            Math.max(
                1,
                this.size *
                alpha
            );

        ctx.fillStyle =
            rgba(
                this.color,
                alpha
            );

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y + cameraY,
            size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}


/* =========================================================
   FLOATING TEXT
========================================================= */

class FloatingText {

    constructor(
        x,
        y,
        text,
        c
    ) {

        this.x = x;
        this.y = y;

        this.text = text;

        this.color = c;

        this.life = 0.9;
        this.maxLife = 0.9;

        this.vy = -65;

        this.scale = 0.7;
    }


    update(dt) {

        this.y +=
            this.vy *
            dt;

        this.vy *=
            0.96;

        this.life -=
            dt;

        this.scale =
            lerp(
                this.scale,
                1,
                0.18
            );
    }


    draw(cameraY) {

        if (
            this.life <= 0
        ) {
            return;
        }

        const alpha =
            clamp(
                this.life /
                this.maxLife,
                0,
                1
            );

        ctx.save();

        ctx.globalAlpha =
            alpha;

        ctx.translate(
            this.x,
            this.y + cameraY
        );

        ctx.scale(
            this.scale,
            this.scale
        );

        ctx.textAlign =
            "center";

        ctx.font =
            "bold 22px Arial";

        ctx.shadowBlur =
            10;

        ctx.shadowColor =
            rgba(
                this.color,
                0.8
            );

        ctx.fillStyle =
            color(this.color);

        ctx.fillText(
            this.text,
            0,
            0
        );

        ctx.restore();
    }
}


/* =========================================================
   ORB
========================================================= */

class Orb {

    constructor(
        x,
        y,
        type
    ) {

        this.x = x;
        this.y = y;

        this.type = type;

        this.radius =
            type === "safety"
                ? 15
                : 13;

        this.phase =
            Math.random() *
            Math.PI *
            2;

        this.life =
            0;

        this.collected =
            false;

        this.rotation =
            Math.random() *
            Math.PI *
            2;
    }


    update(dt) {

        this.phase +=
            dt * 3;

        this.rotation +=
            dt * 1.8;

        this.life +=
            dt;
    }


    color() {

        if (
            this.type === "gold"
        ) {

            return [255, 211, 55];
        }

        if (
            this.type === "ghost"
        ) {

            return [245, 250, 255];
        }

        return [255, 255, 255];
    }


    draw(cameraY) {

        if (
            this.collected
        ) {
            return;
        }

        const bob =
            Math.sin(
                this.phase
            ) * 5;

        const sy =
            this.y +
            cameraY +
            bob;


        /*
         * Safety orb gets a rainbow halo.
         */

        if (
            this.type === "safety"
        ) {

            const hue =
                (
                    this.life * 110
                ) % 360;

            const gradient =
                ctx.createRadialGradient(
                    this.x,
                    sy,
                    1,
                    this.x,
                    sy,
                    38
                );

            gradient.addColorStop(
                0,
                `hsla(${hue},100%,70%,0.75)`
            );

            gradient.addColorStop(
                0.35,
                `hsla(${(hue + 70) % 360},100%,65%,0.35)`
            );

            gradient.addColorStop(
                1,
                `hsla(${(hue + 160) % 360},100%,60%,0)`
            );

            ctx.fillStyle =
                gradient;

            ctx.beginPath();

            ctx.arc(
                this.x,
                sy,
                40,
                0,
                Math.PI * 2
            );

            ctx.fill();

            ctx.strokeStyle =
                `hsla(${hue},100%,75%,0.9)`;

            ctx.lineWidth = 2;

            ctx.beginPath();

            ctx.arc(
                this.x,
                sy,
                22 +
                    Math.sin(
                        this.life * 5
                    ) * 3,
                0,
                Math.PI * 2
            );

            ctx.stroke();
        }


        /*
         * Glow.
         */

        ctx.save();

        ctx.shadowBlur =
            this.type === "safety"
                ? 28
                : 22;

        if (
            this.type === "gold"
        ) {

            ctx.shadowColor =
                "rgba(255,205,40,0.95)";

        } else if (
            this.type === "ghost"
        ) {

            ctx.shadowColor =
                "rgba(240,250,255,0.95)";

        } else {

            ctx.shadowColor =
                "rgba(255,255,255,0.9)";
        }


        /*
         * Main orb.
         */

        let fill;

        if (
            this.type === "gold"
        ) {

            fill =
                "#ffd52e";

        } else if (
            this.type === "ghost"
        ) {

            fill =
                "#f7fbff";

        } else {

            const hue =
                (
                    this.life * 110
                ) % 360;

            fill =
                `hsl(${hue},100%,70%)`;
        }


        ctx.fillStyle =
            fill;

        ctx.beginPath();

        ctx.arc(
            this.x,
            sy,
            this.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /*
         * Inner highlight.
         */

        ctx.fillStyle =
            "rgba(255,255,255,0.9)";

        ctx.beginPath();

        ctx.arc(
            this.x -
                this.radius * 0.3,
            sy -
                this.radius * 0.35,
            this.radius * 0.28,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /*
         * Ghost symbol.
         */

        if (
            this.type === "ghost"
        ) {

            ctx.strokeStyle =
                "rgba(90,190,255,0.9)";

            ctx.lineWidth = 2;

            ctx.beginPath();

            ctx.arc(
                this.x,
                sy,
                this.radius * 0.55,
                Math.PI,
                0
            );

            ctx.stroke();
        }


        ctx.restore();
    }
}


/* =========================================================
   PLATFORM
========================================================= */

class Platform {

    constructor(
        x,
        y,
        width = 5,
        moving = false,
        bonus = false
    ) {

        this.x = x;
        this.y = y;

        this.widthCells =
            width;

        this.width =
            width *
            CELL;

        this.height =
            CELL;

        this.vx =
            moving
                ? (
                    Math.random() < 0.5
                        ? -1
                        : 1
                ) *
                (
                    35 +
                    Math.random() *
                    65
                )
                : 0;

        this.vy = 0;

        this.moving =
            moving;

        this.bonus =
            bonus;

        this.color =
            bonus
                ? [255, 215, 80]
                : PLATFORM_COLORS[
                    Math.floor(
                        Math.random() *
                        PLATFORM_COLORS.length
                    )
                ];

        this.scoredThisVisit =
            false;

        this.id =
            Platform.nextId++;
    }


    get rect() {

        return {

            left:
                this.x -
                this.width / 2,

            right:
                this.x +
                this.width / 2,

            top:
                this.y -
                CELL / 2,

            bottom:
                this.y +
                CELL / 2
        };
    }


    update(
        dt,
        platformSpeed
    ) {

        this.y +=
            platformSpeed *
            dt;

        if (
            this.moving
        ) {

            this.x +=
                this.vx *
                dt;

            const half =
                this.width / 2;

            if (
                this.x - half < 8
            ) {

                this.x =
                    8 + half;

                this.vx =
                    Math.abs(
                        this.vx
                    );
            }

            if (
                this.x + half >
                WIDTH - 8
            ) {

                this.x =
                    WIDTH -
                    8 -
                    half;

                this.vx =
                    -Math.abs(
                        this.vx
                    );
            }
        }
    }


    draw(cameraY) {

        const r =
            this.rect;

        const sy =
            r.top +
            cameraY;

        if (
            sy >
                HEIGHT + 100 ||
            sy <
                -100
        ) {

            return;
        }


        /*
         * Shadow.
         */

        ctx.fillStyle =
            color(
                PLATFORM_DARK
            );

        roundRect(
            r.left,
            sy + 6,
            this.width,
            CELL,
            7
        );


        /*
         * Platform.
         */

        ctx.fillStyle =
            color(
                this.color
            );

        roundRect(
            r.left,
            sy,
            this.width,
            CELL,
            7
        );


        /*
         * Highlight.
         */

        ctx.strokeStyle =
            color(
                PLATFORM_HIGHLIGHT
            );

        ctx.lineWidth = 3;

        ctx.beginPath();

        ctx.moveTo(
            r.left + 7,
            sy + 5
        );

        ctx.lineTo(
            r.right - 7,
            sy + 5
        );

        ctx.stroke();


        /*
         * Moving indicator.
         */

        if (
            this.moving
        ) {

            ctx.fillStyle =
                "rgba(255,255,255,0.65)";

            ctx.beginPath();

            ctx.arc(
                this.x,
                sy +
                    CELL / 2,
                3,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }


        /*
         * Bonus platform indicator.
         */

        if (
            this.bonus
        ) {

            ctx.strokeStyle =
                "rgba(255,255,255,0.85)";

            ctx.lineWidth = 2;

            ctx.beginPath();

            ctx.arc(
                this.x,
                sy +
                    CELL / 2,
                CELL * 0.32,
                0,
                Math.PI * 2
            );

            ctx.stroke();
        }
    }
}


Platform.nextId = 1;


/* =========================================================
   PLAYER
========================================================= */

class Player {

    constructor() {

        this.reset();
    }


    reset() {

        this.x =
            WIDTH / 2;

        this.y =
            520;

        this.vx = 0;
        this.vy = 0;

        this.radius =
            BALL_RADIUS;

        this.squash = 1;
        this.stretch = 1;

        this.trail = [];

        this.bounces = 0;

        this.diving = false;

        this.lastPlatform = null;

        /*
         * Powerups.
         */

        this.ghostTimer = 0;
        this.safetyTimer = 0;
    }


    get ghosting() {

        return this.ghostTimer > 0;
    }


    get invulnerable() {

        return this.safetyTimer > 0;
    }


    control(dt) {

        let direction = 0;


        /*
         * Keyboard.
         */

        if (keyLeft) {
            direction--;
        }

        if (keyRight) {
            direction++;
        }


        /*
         * Touch horizontal movement.
         */

        if (
            touchActive
        ) {

            const dx =
                touchX -
                touchStartX;

            if (
                Math.abs(dx) >
                8
            ) {

                direction =
                    clamp(
                        dx / 70,
                        -1,
                        1
                    );
            }
        }


        this.vx +=
            direction *
            AIR_ACCEL *
            dt;

        this.vx *=
            AIR_FRICTION;

        this.vx =
            clamp(
                this.vx,
                -MAX_X_SPEED,
                MAX_X_SPEED
            );


        /*
         * Dive.
         *
         * Important:
         *
         * We DO NOT allow the player to keep
         * diving simply because the finger
         * remains low on the screen.
         *
         * A dive is only active while the user
         * is deliberately holding downward.
         */

        this.diving = false;

        if (
            this.vy > 0
        ) {

            if (
                keyDown
            ) {

                this.diving = true;
            }

            if (
                touchActive &&
                touchY -
                    touchStartY >
                    55
            ) {

                this.diving = true;
            }

            if (
                this.diving
            ) {

                this.vy +=
                    DIVE_ACCELERATION *
                    dt;

                this.vy =
                    Math.min(
                        this.vy,
                        MAX_FALL_SPEED
                    );
            }
        }
    }


    gravity(dt) {

        this.vy +=
            GRAVITY *
            dt;

        this.vy =
            Math.min(
                this.vy,
                MAX_FALL_SPEED
            );
    }


    move(dt) {

        this.x +=
            this.vx *
            dt;

        this.y +=
            this.vy *
            dt;
    }


    wallCollision() {

        if (
            this.x -
            this.radius <
            0
        ) {

            this.x =
                this.radius;

            this.vx =
                Math.abs(
                    this.vx
                ) *
                WALL_RESTITUTION;

            return true;
        }


        if (
            this.x +
            this.radius >
            WIDTH
        ) {

            this.x =
                WIDTH -
                this.radius;

            this.vx =
                -Math.abs(
                    this.vx
                ) *
                WALL_RESTITUTION;

            return true;
        }

        return false;
    }


    bounce(
        nx,
        ny,
        platformVy
    ) {

        const relativeVx =
            this.vx;

        const relativeVy =
            this.vy -
            platformVy;

        const into =
            relativeVx *
                nx +
            relativeVy *
                ny;

        if (
            into >= 0
        ) {

            return null;
        }


        this.vx -=
            2 *
            into *
            nx;

        this.vy -=
            2 *
            into *
            ny;


        this.vx *=
            PLATFORM_RESTITUTION;

        this.vy *=
            PLATFORM_RESTITUTION;


        let type =
            "side";


        /*
         * TOP.
         */

        if (
            ny < -0.5
        ) {

            type =
                "top";

            let power =
                BOUNCE_POWER;


            if (
                this.diving
            ) {

                const bonus =
                    Math.max(
                        0,
                        this.vy
                    ) *
                    0.45;

                power =
                    Math.max(
                        DIVE_BOUNCE_POWER,
                        BOUNCE_POWER +
                        bonus
                    );
            }


            this.vy =
                -power;

            this.squash =
                1.4;

            this.stretch =
                0.65;

            this.bounces++;


            const wasDive =
                this.diving;

            this.diving =
                false;


            return {

                type:
                    "top",

                dive:
                    wasDive
            };
        }


        /*
         * Bottom.
         */

        if (
            ny > 0.5
        ) {

            type =
                "bottom";

            this.squash =
                1.15;

            this.stretch =
                0.85;

            return {
                type
            };
        }


        /*
         * Side.
         */

        this.squash =
            1.15;

        this.stretch =
            0.85;

        return {
            type
        };
    }


    updatePowerups(dt) {

        if (
            this.ghostTimer > 0
        ) {

            this.ghostTimer =
                Math.max(
                    0,
                    this.ghostTimer -
                    dt
                );
        }


        if (
            this.safetyTimer > 0
        ) {

            this.safetyTimer =
                Math.max(
                    0,
                    this.safetyTimer -
                    dt
                );
        }
    }


    updateVisuals() {

        this.squash =
            lerp(
                this.squash,
                1,
                0.18
            );

        this.stretch =
            lerp(
                this.stretch,
                1,
                0.18
            );


        this.trail.push({

            x:
                this.x,

            y:
                this.y
        });


        if (
            this.trail.length >
            14
        ) {

            this.trail.shift();
        }
    }


    draw(cameraY) {

        /*
         * Trail.
         */

        for (
            let i = 0;
            i < this.trail.length;
            i++
        ) {

            const p =
                this.trail[i];

            const progress =
                i /
                Math.max(
                    1,
                    this.trail.length
                );

            let trailColor =
                "80,210,255";

            if (
                this.ghosting
            ) {

                trailColor =
                    "245,250,255";
            }

            if (
                this.invulnerable
            ) {

                trailColor =
                    "120,255,180";
            }

            ctx.fillStyle =
                `rgba(${trailColor},${
                    0.05 +
                    progress *
                    0.15
                })`;

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y + cameraY,
                Math.max(
                    2,
                    this.radius *
                    progress
                ),
                0,
                Math.PI * 2
            );

            ctx.fill();
        }


        const width =
            this.radius *
            2 *
            this.squash;

        const height =
            this.radius *
            2 *
            this.stretch;

        const sy =
            this.y +
            cameraY;


        /*
         * Powerup glow.
         */

        if (
            this.ghosting
        ) {

            ctx.shadowBlur =
                28;

            ctx.shadowColor =
                "rgba(245,250,255,0.95)";

        } else if (
            this.invulnerable
        ) {

            ctx.shadowBlur =
                30;

            ctx.shadowColor =
                "rgba(100,255,180,0.95)";

        } else {

            ctx.shadowBlur =
                18;

            ctx.shadowColor =
                "rgba(80,220,255,0.65)";
        }


        ctx.fillStyle =
            "#f5faff";

        ctx.beginPath();

        ctx.ellipse(
            this.x,
            sy,
            width / 2,
            height / 2,
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.shadowBlur = 0;


        /*
         * Player center.
         */

        if (
            this.ghosting
        ) {

            ctx.fillStyle =
                "rgba(170,220,255,0.8)";

        } else if (
            this.invulnerable
        ) {

            ctx.fillStyle =
                "#63ffc0";

        } else {

            ctx.fillStyle =
                "#50c8ff";
        }


        ctx.beginPath();

        ctx.ellipse(
            this.x -
                width * 0.18,
            sy -
                height * 0.22,
            Math.max(
                3,
                width * 0.15
            ),
            Math.max(
                3,
                height * 0.12
            ),
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /*
         * Safety shield ring.
         */

        if (
            this.invulnerable
        ) {

            ctx.strokeStyle =
                `rgba(100,255,190,${
                    0.55 +
                    Math.sin(
                        performance.now() / 100
                    ) *
                    0.2
                })`;

            ctx.lineWidth = 3;

            ctx.beginPath();

            ctx.arc(
                this.x,
                sy,
                this.radius + 9,
                0,
                Math.PI * 2
            );

            ctx.stroke();
        }
    }
}


/* =========================================================
   GAME
========================================================= */

class Game {

    constructor() {

        this.player =
            new Player();

        this.platforms = [];

        this.orbs = [];

        this.particles = [];

        this.texts = [];

        this.cameraY = 0;


        /*
         * SCORE
         */

        this.score = 0;

        this.bestScore =
            Number(
                localStorage.getItem(
                    "bounceBestScore"
                ) || 0
            );


        /*
         * HEIGHT
         */

        this.height = 0;

        this.bestHeight =
            Number(
                localStorage.getItem(
                    "bounceBestHeight"
                ) || 0
            );


        /*
         * FLOW
         */

        this.flow = 0;
        this.maxFlow = 0;


        /*
         * SPAWNING
         */

        this.spawnTimer = 0;

        this.nextPlatformY = -100;

        this.lastPlatformSide =
            "left";


        /*
         * GAME STATE
         */

        this.started = false;
        this.gameOver = false;


        /*
         * EFFECTS
         */

        this.shake = 0;
        this.flash = 0;


        /*
         * HEIGHT SPEED TRACKING
         */

        this.lastHeight = 0;

        this.lastHeightTime =
            performance.now() /
            1000;


        this.spawnInitialPlatforms();
    }


    restart() {

        initAudio();

        this.player.reset();

        this.platforms = [];

        this.orbs = [];

        this.particles = [];

        this.texts = [];

        this.cameraY = 0;

        this.score = 0;

        this.height = 0;

        this.flow = 0;

        this.maxFlow = 0;

        this.spawnTimer = 0;

        this.gameOver = false;

        this.started = true;

        this.shake = 0;

        this.flash = 0;

        this.lastPlatformSide =
            "left";

        this.lastHeight = 0;

        this.lastHeightTime =
            performance.now() /
            1000;

        this.spawnInitialPlatforms();

        tone(
            440,
            0.08,
            0.025,
            "sine",
            80
        );

        vibrate(12);
    }


    difficulty() {

        return clamp(
            (
                this.height -
                1000
            ) /
            9000,
            0,
            1
        );
    }


    platformSpeed() {

        /*
         * Very gentle beginning.
         */

        return lerp(
            18,
            135,
            this.difficulty()
        );
    }


    /* =====================================================
       INITIAL PLATFORMS
    ===================================================== */

    spawnInitialPlatforms() {

        this.platforms = [];
        this.orbs = [];


        /*
         * Starting platform.
         */

        this.platforms.push(
            new Platform(
                WIDTH * 0.50,
                625,
                6,
                false,
                false
            )
        );


        /*
         * Large, comfortable first jumps.
         *
         * The alternating visual rhythm is
         * intentionally preserved.
         */

        this.platforms.push(
            new Platform(
                115,
                410,
                6,
                false,
                false
            )
        );


        this.platforms.push(
            new Platform(
                365,
                190,
                6,
                false,
                false
            )
        );


        this.platforms.push(
            new Platform(
                110,
                -35,
                6,
                false,
                false
            )
        );


        this.nextPlatformY =
            -255;

        this.lastPlatformSide =
            "left";
    }


    /* =====================================================
       PLATFORM SPAWNING
    ===================================================== */

    spawnPlatform() {

        const d =
            this.difficulty();


        /*
         * Find previous platform.
         */

        const previous =
            this.platforms
                .filter(
                    p =>
                        p.y <
                        this.nextPlatformY +
                        300
                )
                .sort(
                    (a, b) =>
                        b.y -
                        a.y
                )[0];


        /*
         * SIDE-TO-SIDE GENERATION.
         *
         * Left -> right -> left -> right.
         *
         * Occasional center platforms provide
         * visual variation without removing
         * the rhythm.
         */

        let side;

        const variationChance =
            lerp(
                0.08,
                0.20,
                d
            );


        if (
            Math.random() <
            variationChance
        ) {

            side =
                "center";

        } else {

            side =
                this.lastPlatformSide ===
                    "left"
                    ? "right"
                    : "left";
        }


        let x;


        if (
            side === "left"
        ) {

            x =
                75 +
                Math.random() *
                95;

        } else if (
            side === "right"
        ) {

            x =
                WIDTH -
                (
                    75 +
                    Math.random() *
                    95
                );

        } else {

            x =
                WIDTH / 2 +
                (
                    Math.random() *
                    120 -
                    60
                );
        }


        /*
         * Early game has easier horizontal
         * requirements.
         */

        if (
            previous
        ) {

            const maximumReach =
                lerp(
                    330,
                    390,
                    d
                );

            if (
                Math.abs(
                    x -
                    previous.x
                ) >
                maximumReach
            ) {

                x =
                    previous.x +
                    (
                        x >
                        previous.x
                            ? maximumReach
                            : -maximumReach
                    );
            }
        }


        x =
            clamp(
                x,
                PLATFORM_SIDE_MARGIN,
                WIDTH -
                    PLATFORM_SIDE_MARGIN
            );


        /*
         * Platform widths.
         *
         * Keep them generous until the game
         * is genuinely difficult.
         */

        let width;

        if (
            d < 0.35
        ) {

            width = 6;

        } else if (
            d < 0.65
        ) {

            width =
                Math.random() <
                0.75
                    ? 5
                    : 6;

        } else {

            width =
                [4, 5, 5, 6][
                    Math.floor(
                        Math.random() *
                        4
                    )
                ];
        }


        /*
         * Moving platforms begin at 7000.
         */

        const movingProgress =
            clamp(
                (
                    this.height -
                    MOVING_PLATFORM_START
                ) /
                5000,
                0,
                1
            );

        const movingChance =
            movingProgress *
            0.42;

        const moving =
            this.height >=
                MOVING_PLATFORM_START &&
            Math.random() <
                movingChance;


        /*
         * Bonus platform.
         */

        const bonus =
            Math.random() <
            0.07;


        const platform =
            new Platform(
                x,
                this.nextPlatformY,
                width,
                moving,
                bonus
            );


        this.platforms.push(
            platform
        );


        /*
         * Remember side.
         */

        if (
            x <
            WIDTH * 0.38
        ) {

            this.lastPlatformSide =
                "left";

        } else if (
            x >
            WIDTH * 0.62
        ) {

            this.lastPlatformSide =
                "right";
        }


        /*
         * Large vertical spacing.
         */

        const gap =
            lerp(
                MIN_VERTICAL_GAP,
                MAX_VERTICAL_GAP,
                d
            ) +
            (
                Math.random() *
                22 -
                11
            );


        this.nextPlatformY -=
            gap;


        /*
         * Maybe place an orb in the OPEN AIR.
         */

        this.spawnOrbForPlatform(
            platform,
            previous
        );
    }


    /* =====================================================
       ORB SPAWNING
    ===================================================== */

    spawnOrbForPlatform(
        platform,
        previous
    ) {

        /*
         * Don't spam the early game.
         */

        if (
            this.height < 350
        ) {

            return;
        }


        /*
         * Gold orb is the common pickup.
         */

        const roll =
            Math.random();


        let type = null;


        if (
            roll <
            SAFETY_ORB_CHANCE
        ) {

            type =
                "safety";

        } else if (
            roll <
            SAFETY_ORB_CHANCE +
            GHOST_ORB_CHANCE
        ) {

            type =
                "ghost";

        } else if (
            roll <
            SAFETY_ORB_CHANCE +
            GHOST_ORB_CHANCE +
            GOLD_ORB_CHANCE
        ) {

            type =
                "gold";
        }


        if (!type) {
            return;
        }


        /*
         * CRITICAL:
         *
         * Orbs are deliberately placed in the
         * EMPTY SPACE BETWEEN platforms.
         *
         * They should be collectable while the
         * player is traveling through a jump.
         */

        let x;
        let y;


        if (
            previous
        ) {

            const midpointX =
                (
                    previous.x +
                    platform.x
                ) / 2;

            const midpointY =
                (
                    previous.y +
                    platform.y
                ) / 2;

            /*
             * Push the orb away from both
             * platform centers.
             */

            const horizontalOffset =
                (
                    Math.random() *
                    80 -
                    40
                );

            x =
                midpointX +
                horizontalOffset;

            /*
             * Put it around the middle of
             * the travel corridor.
             */

            y =
                midpointY +
                (
                    Math.random() *
                    55 -
                    27
                );

        } else {

            x =
                WIDTH / 2;

            y =
                platform.y +
                100;
        }


        /*
         * For ghost and safety orbs especially,
         * ensure they aren't sitting directly
         * on top of a platform.
         */

        const r =
            platform.rect;

        if (
            x >
                r.left - 35 &&
            x <
                r.right + 35
        ) {

            x =
                x <
                platform.x
                    ? r.left - 55
                    : r.right + 55;
        }


        x =
            clamp(
                x,
                35,
                WIDTH - 35
            );


        /*
         * Ghosts are positioned slightly more
         * into the open corridor.
         */

        if (
            type === "ghost"
        ) {

            y +=
                Math.random() <
                0.5
                    ? -25
                    : 25;
        }


        this.orbs.push(
            new Orb(
                x,
                y,
                type
            )
        );
    }


    /* =====================================================
       PARTICLES
    ===================================================== */

    addParticles(
        x,
        y,
        c,
        amount,
        power = 1
    ) {

        for (
            let i = 0;
            i < amount;
            i++
        ) {

            this.particles.push(
                new Particle(
                    x,
                    y,
                    c,
                    power
                )
            );
        }
    }


    /* =====================================================
       FLOATING TEXT
    ===================================================== */

    addText(
        x,
        y,
        text,
        c
    ) {

        this.texts.push(
            new FloatingText(
                x,
                y,
                text,
                c
            )
        );
    }


    /* =====================================================
       ORB COLLECTION
    ===================================================== */

    collectOrb(orb) {

        if (
            orb.collected
        ) {
            return;
        }

        orb.collected =
            true;


        if (
            orb.type === "gold"
        ) {

            const points =
                50 +
                this.flow * 5;

            this.score +=
                points;

            this.addText(
                orb.x,
                orb.y,
                `+${points}`,
                [255,215,55]
            );

            this.addParticles(
                orb.x,
                orb.y,
                [255,215,55],
                24,
                1.2
            );

            tone(
                740,
                0.10,
                0.035,
                "sine",
                180
            );

            vibrate(10);

        } else if (
            orb.type === "ghost"
        ) {

            /*
             * Ghost does NOT bounce.
             *
             * It simply passes through platforms
             * for a short tactical window.
             */

            this.player.ghostTimer =
                GHOST_DURATION;

            this.player.diving =
                false;

            this.addText(
                orb.x,
                orb.y,
                "GHOST!",
                [245,250,255]
            );

            this.addParticles(
                orb.x,
                orb.y,
                [245,250,255],
                30,
                1.3
            );

            tone(
                520,
                0.12,
                0.03,
                "sine",
                260
            );

            tone(
                780,
                0.16,
                0.022,
                "sine",
                -120
            );

            vibrate([
                15,
                25,
                15
            ]);

        } else if (
            orb.type === "safety"
        {

            /*
             * Safety orb.
             *
             * The player becomes invulnerable
             * and the fire becomes a bounceable
             * emergency surface.
             */

            this.player.safetyTimer =
                SAFETY_DURATION;

            this.addText(
                orb.x,
                orb.y,
                "SAVED!",
                [100,255,190]
            );

            this.addParticles(
                orb.x,
                orb.y,
                [100,255,190],
                40,
                1.5
            );

            tone(
                440,
                0.12,
                0.035,
                "triangle",
                180
            );

            tone(
                660,
                0.16,
                0.03,
                "triangle",
                240
            );

            tone(
                880,
                0.20,
                0.02,
                "sine",
                100
            );

            vibrate([
                20,
                30,
                35
            ]);
        }
    }


    updateOrbs(dt) {

        for (
            const orb of
            this.orbs
        ) {

            orb.update(dt);


            if (
                orb.collected
            ) {
                continue;
            }


            /*
             * Player / orb collision.
             */

            if (
                distance(
                    this.player.x,
                    this.player.y,
                    orb.x,
                    orb.y
                ) <
                this.player.radius +
                orb.radius +
                4
            ) {

                this.collectOrb(
                    orb
                );
            }
        }
    }


    /* =====================================================
       BOUNCE EFFECT
    ===================================================== */

    bounceEffect(
        x,
        y,
        platform,
        type
    ) {

        if (
            type === "corner"
        ) {

            this.addParticles(
                x,
                y,
                [255,235,120],
                32,
                1.4
            );

            this.shake = 7;
            this.flash = 0.12;

            tone(
                560,
                0.08,
                0.03,
                "triangle",
                220
            );

            vibrate(18);

        } else if (
            type === "edge"
        ) {

            this.addParticles(
                x,
                y,
                [255,215,80],
                25,
                1.15
            );

            this.shake = 5;

            tone(
                460,
                0.07,
                0.022,
                "sine",
                100
            );

            vibrate(10);

        } else if (
            type === "flow"
        ) {

            this.addParticles(
                x,
                y,
                [90,255,220],
                30,
                1.25
            );

            this.shake = 4;
            this.flash = 0.08;

            tone(
                600 +
                    this.flow * 35,
                0.08,
                0.025,
                "sine",
                160
            );

            vibrate(8);

        } else if (
            type === "dive"
        ) {

            this.addParticles(
                x,
                y,
                [255,105,150],
                28,
                1.3
            );

            this.shake = 6;

            tone(
                300,
                0.10,
                0.025,
                "sawtooth",
                180
            );

            vibrate(16);

        } else {

            this.addParticles(
                x,
                y,
                platform.color,
                18,
                1
            );

            this.shake = 3;

            tone(
                390,
                0.055,
                0.018,
                "sine",
                100
            );
        }
    }


    /* =====================================================
       FIRE BOUNCE
    ===================================================== */

    fireBounce() {

        /*
         * Safety orb makes the fire act like
         * an emergency trampoline.
         *
         * The rebound is based on the player's
         * current trajectory rather than simply
         * teleporting them upward.
         */

        const incomingSpeed =
            Math.max(
                500,
                this.player.vy
            );

        const rebound =
            clamp(
                incomingSpeed * 0.72,
                700,
                1150
            );

        this.player.vy =
            -rebound;

        /*
         * Preserve horizontal momentum but
         * soften it slightly.
         */

        this.player.vx *=
            0.94;

        this.player.squash =
            1.55;

        this.player.stretch =
            0.58;

        this.addParticles(
            this.player.x,
            this.fireSurfaceY(),
            [80,255,190],
            35,
            1.35
        );

        this.shake = 9;

        this.flash = 0.12;

        this.addText(
            this.player.x,
            this.fireSurfaceY() - 18,
            "SAVED!",
            [100,255,190]
        );

        tone(
            260,
            0.10,
            0.035,
            "triangle",
            260
        );

        tone(
            520,
            0.14,
            0.025,
            "sine",
            300
        );

        vibrate([
            25,
            20,
            35
        ]);
    }


    fireSurfaceY() {

        /*
         * World coordinate of the top of
         * the fire.
         */

        return (
            HEIGHT -
            this.cameraY -
            FIRE_HEIGHT
        );
    }


    /* =====================================================
       PLATFORM COLLISION
    ===================================================== */

    collidePlatform(
        player,
        platform
    ) {

        /*
         * GHOST MODE:
         *
         * The player passes through everything.
         *
         * This is intentionally checked BEFORE
         * collision detection.
         */

        if (
            player.ghosting
        ) {

            return false;
        }


        const r =
            platform.rect;


        const closestX =
            clamp(
                player.x,
                r.left,
                r.right
            );

        const closestY =
            clamp(
                player.y,
                r.top,
                r.bottom
            );

        const dx =
            player.x -
            closestX;

        const dy =
            player.y -
            closestY;


        if (
            dx * dx +
            dy * dy >
            player.radius *
            player.radius
        ) {

            return false;
        }


        const leftPen =
            player.x +
            player.radius -
            r.left;

        const rightPen =
            r.right -
            (
                player.x -
                player.radius
            );

        const topPen =
            player.y +
            player.radius -
            r.top;

        const bottomPen =
            r.bottom -
            (
                player.y -
                player.radius
            );


        const penetrations = [

            {
                value:
                    leftPen,
                nx:
                    -1,
                ny:
                    0
            },

            {
                value:
                    rightPen,
                nx:
                    1,
                ny:
                    0
            },

            {
                value:
                    topPen,
                nx:
                    0,
                ny:
                    -1
            },

            {
                value:
                    bottomPen,
                nx:
                    0,
                ny:
                    1
            }
        ];


        penetrations.sort(
            (a, b) =>
                a.value -
                b.value
        );


        const hit =
            penetrations[0];

        const nx =
            hit.nx;

        const ny =
            hit.ny;


        const relativeVx =
            player.vx;

        const relativeVy =
            player.vy -
            platform.vy;

        const into =
            relativeVx *
                nx +
            relativeVy *
                ny;


        if (
            into >= 0
        ) {

            return false;
        }


        const penetration =
            Math.max(
                hit.value,
                0
            );


        player.x +=
            nx *
            penetration;

        player.y +=
            ny *
            penetration;


        const result =
            player.bounce(
                nx,
                ny,
                platform.vy
            );


        if (
            !result
        ) {

            return false;
        }


        /*
         * TOP LANDING.
         */

        if (
            result.type ===
            "top"
        ) {

            const centerDistance =
                Math.abs(
                    player.x -
                    platform.x
                );

            const halfWidth =
                platform.width /
                2;

            const edgeDistance =
                halfWidth -
                centerDistance;


            const nearLeft =
                Math.abs(
                    player.x -
                    r.left
                ) < 12;


            const nearRight =
                Math.abs(
                    player.x -
                    r.right
                ) < 12;


            const nearTop =
                Math.abs(
                    player.y -
                    r.top
                ) < 12;


            const corner =
                (
                    nearLeft ||
                    nearRight
                ) &&
                nearTop;


            let landingType =
                "normal";


            if (
                corner
            ) {

                landingType =
                    "corner";

            } else if (
                edgeDistance <
                28
            ) {

                landingType =
                    "edge";
            }


            /*
             * One score event per platform.
             */

            const firstLanding =
                !platform.scoredThisVisit;


            if (
                firstLanding
            ) {

                platform.scoredThisVisit =
                    true;


                let points =
                    100;


                if (
                    landingType ===
                    "edge"
                ) {

                    points +=
                        75;
                }


                if (
                    landingType ===
                    "corner"
                ) {

                    points +=
                        150;
                }


                if (
                    result.dive
                ) {

                    points +=
                        100;
                }


                if (
                    platform.bonus
                ) {

                    points +=
                        250;
                }


                /*
                 * FLOW
                 *
                 * Flow means consecutive clean
                 * platform landings.
                 *
                 * Each level increases the score
                 * multiplier by 15%.
                 */

                const clean =
                    !corner &&
                    Math.abs(
                        player.vx
                    ) < 360;


                if (
                    clean ||
                    landingType === "edge" ||
                    landingType === "corner"
                ) {

                    this.flow =
                        clamp(
                            this.flow + 1,
                            0,
                            10
                        );

                } else {

                    this.flow =
                        Math.max(
                            0,
                            this.flow - 1
                        );
                }


                this.maxFlow =
                    Math.max(
                        this.maxFlow,
                        this.flow
                    );


                if (
                    this.flow >= 2
                ) {

                    points *=
                        1 +
                        (
                            this.flow -
                            1
                        ) *
                        0.15;
                }


                /*
                 * Fast climbing bonus.
                 */

                const now =
                    performance.now() /
                    1000;

                const elapsed =
                    Math.max(
                        0.05,
                        now -
                        this.lastHeightTime
                    );

                const gained =
                    this.height -
                    this.lastHeight;

                const climbRate =
                    gained /
                    elapsed;


                if (
                    climbRate >
                        250 &&
                    this.flow >= 3
                ) {

                    points +=
                        Math.min(
                            200,
                            Math.floor(
                                climbRate /
                                8
                            )
                        );
                }


                this.score +=
                    Math.floor(
                        points
                    );


                let effect =
                    "normal";


                if (
                    landingType ===
                    "corner"
                ) {

                    effect =
                        "corner";

                } else if (
                    landingType ===
                    "edge"
                ) {

                    effect =
                        "edge";

                } else if (
                    result.dive
                ) {

                    effect =
                        "dive";

                } else if (
                    this.flow >= 3
                ) {

                    effect =
                        "flow";
                }


                this.bounceEffect(
                    player.x,
                    player.y,
                    platform,
                    effect
                );
            }


            return true;
        }


        /*
         * Side/bottom collision.
         */

        this.flow =
            Math.max(
                0,
                this.flow - 1
            );


        this.addParticles(
            player.x,
            player.y,
            platform.color,
            10
        );


        return true;
    }


    /* =====================================================
       FIRE COLLISION
    ===================================================== */

    checkFire() {

        const screenY =
            this.player.y +
            this.cameraY;


        const fireTop =
            HEIGHT -
            FIRE_HEIGHT;


        /*
         * Only interact with fire once the
         * player physically reaches it.
         */

        if (
            screenY +
            this.player.radius <
            fireTop
        ) {

            return false;
        }


        /*
         * GHOST DOES NOT GET SAVED.
         *
         * Ghosting means you can't bounce.
         * Falling through the world while ghosting
         * is therefore dangerous.
         */

        if (
            this.player.ghosting
        ) {

            this.die();

            return true;
        }


        /*
         * SAFETY MODE:
         *
         * Fire becomes an emergency platform.
         */

        if (
            this.player.invulnerable
        ) {

            /*
             * Move player just above fire.
             */

            this.player.y =
                fireTop -
                this.cameraY -
                this.player.radius;

            this.fireBounce();

            return true;
        }


        /*
         * Normal death.
         */

        this.die();

        return true;
    }


    /* =====================================================
       UPDATE
    ===================================================== */

    update(dt) {

        if (
            this.gameOver
        ) {

            this.updateParticles(dt);
            this.updateTexts(dt);

            this.shake =
                Math.max(
                    0,
                    this.shake -
                    dt * 20
                );

            return;
        }


        /*
         * Player powerups.
         */

        this.player.updatePowerups(
            dt
        );


        /*
         * Player control.
         */

        this.player.control(
            dt
        );


        /*
         * Platforms move downward.
         */

        const speed =
            this.platformSpeed();


        for (
            const platform of
            this.platforms
        ) {

            platform.update(
                dt,
                speed
            );
        }


        /*
         * Orbs stay in world space while
         * platforms move.
         *
         * This makes them part of the level.
         */

        for (
            const orb of
            this.orbs
        ) {

            orb.y +=
                speed *
                dt;
        }


        /*
         * Physics.
         */

        const subDt =
            dt /
            PHYSICS_STEPS;


        for (
            let i = 0;
            i < PHYSICS_STEPS;
            i++
        ) {

            this.player.gravity(
                subDt
            );

            this.player.move(
                subDt
            );


            /*
             * Walls.
             */

            if (
                this.player.wallCollision()
            ) {

                this.addParticles(
                    this.player.x,
                    this.player.y,
                    [70,220,255],
                    12
                );


                this.flow =
                    Math.max(
                        0,
                        this.flow - 1
                    );
            }


            /*
             * Platforms.
             *
             * Ghost mode automatically bypasses
             * these because collidePlatform()
             * returns false.
             */

            for (
                const platform of
                this.platforms
            ) {

                if (
                    this.collidePlatform(
                        this.player,
                        platform
                    )
                ) {

                    break;
                }
            }


            /*
             * Fire.
             *
             * Checked every physics step.
             */

            if (
                this.checkFire()
            ) {

                if (
                    this.gameOver
                ) {

                    break;
                }
            }
        }


        /*
         * Camera.
         */

        this.updateCamera(
            dt
        );


        /*
         * Height.
         */

        const currentHeight =
            Math.max(
                0,
                Math.floor(
                    520 -
                    this.player.y
                )
            );


        if (
            currentHeight >
            this.height
        ) {

            this.height =
                currentHeight;
        }


        this.bestHeight =
            Math.max(
                this.bestHeight,
                this.height
            );

        this.bestScore =
            Math.max(
                this.bestScore,
                this.score
            );


        localStorage.setItem(
            "bounceBestHeight",
            this.bestHeight
        );

        localStorage.setItem(
            "bounceBestScore",
            this.bestScore
        );


        /*
         * Height tracking.
         */

        const now =
            performance.now() /
            1000;


        if (
            now -
            this.lastHeightTime >
            0.35
        ) {

            this.lastHeight =
                this.height;

            this.lastHeightTime =
                now;
        }


        /*
         * Spawn platforms.
         */

        this.spawnTimer +=
            dt;


        while (
            this.spawnTimer >=
            0.5
        ) {

            this.spawnTimer -=
                0.5;

            this.spawnPlatform();
        }


        /*
         * Remove old platforms.
         */

        const despawnY =
            -this.cameraY +
            HEIGHT +
            300;


        this.platforms =
            this.platforms.filter(
                platform =>
                    platform.y <
                    despawnY
            );


        /*
         * Remove old orbs.
         */

        this.orbs =
            this.orbs.filter(
                orb =>
                    orb.y <
                    despawnY &&
                    !orb.collected
            );


        /*
         * Orbs.
         */

        this.updateOrbs(
            dt
        );


        /*
         * Effects.
         */

        this.updateParticles(
            dt
        );

        this.updateTexts(
            dt
        );

        this.player.updateVisuals();


        this.shake =
            Math.max(
                0,
                this.shake -
                dt * 20
            );


        this.flash =
            Math.max(
                0,
                this.flash -
                dt
            );
    }


    /* =====================================================
       CAMERA
    ===================================================== */

    updateCamera(dt) {

        const screenY =
            this.player.y +
            this.cameraY;


        if (
            screenY <
            CAMERA_TARGET_Y
        ) {

            const target =
                CAMERA_TARGET_Y -
                this.player.y;


            this.cameraY =
                lerp(
                    this.cameraY,
                    target,
                    Math.min(
                        1,
                        dt *
                        CAMERA_FOLLOW_SPEED
                    )
                );
        }


        this.cameraY =
            Math.max(
                this.cameraY,
                0
            );
    }


    /* =====================================================
       PARTICLES
    ===================================================== */

    updateParticles(dt) {

        for (
            let i =
                this.particles.length - 1;
            i >= 0;
            i--
        ) {

            const particle =
                this.particles[i];

            particle.update(
                dt
            );

            if (
                particle.life <= 0
            ) {

                this.particles.splice(
                    i,
                    1
                );
            }
        }
    }


    /* =====================================================
       TEXTS
    ===================================================== */

    updateTexts(dt) {

        for (
            let i =
                this.texts.length - 1;
            i >= 0;
            i--
        ) {

            const text =
                this.texts[i];

            text.update(
                dt
            );

            if (
                text.life <= 0
            ) {

                this.texts.splice(
                    i,
                    1
                );
            }
        }
    }


    /* =====================================================
       DEATH
    ===================================================== */

    die() {

        if (
            this.gameOver
        ) {

            return;
        }


        this.gameOver =
            true;


        this.bestScore =
            Math.max(
                this.bestScore,
                this.score
            );

        this.bestHeight =
            Math.max(
                this.bestHeight,
                this.height
            );


        localStorage.setItem(
            "bounceBestScore",
            this.bestScore
        );

        localStorage.setItem(
            "bounceBestHeight",
            this.bestHeight
        );


        this.deathEffect();


        tone(
            180,
            0.22,
            0.035,
            "sawtooth",
            -80
        );

        vibrate([
            40,
            35,
            80
        ]);
    }


    deathEffect() {

        this.addParticles(
            this.player.x,
            this.player.y,
            [70,220,255],
            55,
            1.4
        );

        this.shake = 12;
    }


    /* =====================================================
       FIRE
    ===================================================== */

    drawFire() {

        const baseY =
            HEIGHT -
            FIRE_HEIGHT;


        /*
         * Dark underglow.
         */

        const glow =
            ctx.createLinearGradient(
                0,
                baseY - 70,
                0,
                HEIGHT
            );

        glow.addColorStop(
            0,
            "rgba(30,255,180,0)"
        );

        glow.addColorStop(
            0.55,
            "rgba(20,220,180,0.12)"
        );

        glow.addColorStop(
            1,
            "rgba(20,120,255,0.28)"
        );

        ctx.fillStyle =
            glow;

        ctx.fillRect(
            0,
            baseY - 70,
            WIDTH,
            FIRE_HEIGHT + 70
        );


        /*
         * Animated individual flames.
         */

        const time =
            performance.now() /
            1000;


        const flameCount = 30;


        for (
            let i = 0;
            i < flameCount;
            i++
        ) {

            const x =
                i *
                    (
                        WIDTH /
                        (
                            flameCount - 1
                        )
                    );


            const wave =
                Math.sin(
                    time * 5 +
                    i * 1.7
                );

            const wave2 =
                Math.sin(
                    time * 8 +
                    i * 0.9
                );


            const height =
                32 +
                (
                    wave *
                    14
                ) +
                (
                    wave2 *
                    7
                );


            const width =
                25 +
                Math.sin(
                    time * 4 +
                    i
                ) * 6;


            /*
             * Outer blue flame.
             */

            const outer =
                ctx.createLinearGradient(
                    x,
                    baseY,
                    x,
                    baseY - height
                );

            outer.addColorStop(
                0,
                "rgba(25,245,180,0.95)"
            );

            outer.addColorStop(
                0.45,
                "rgba(30,205,255,0.8)"
            );

            outer.addColorStop(
                1,
                "rgba(20,100,255,0)"
            );


            ctx.fillStyle =
                outer;

            ctx.beginPath();

            ctx.moveTo(
                x - width / 2,
                baseY + 8
            );

            ctx.quadraticCurveTo(
                x -
                    width * 0.35,
                baseY -
                    height * 0.38,
                x +
                    wave * 5,
                baseY -
                    height
            );

            ctx.quadraticCurveTo(
                x +
                    width * 0.32,
                baseY -
                    height * 0.45,
                x +
                    width / 2,
                baseY + 8
            );

            ctx.closePath();

            ctx.fill();


            /*
             * Inner green flame.
             */

            const innerHeight =
                height *
                0.62;

            const innerWidth =
                width *
                0.55;


            const inner =
                ctx.createLinearGradient(
                    x,
                    baseY,
                    x,
                    baseY -
                        innerHeight
                );

            inner.addColorStop(
                0,
                "rgba(150,255,100,0.95)"
            );

            inner.addColorStop(
                0.6,
                "rgba(60,255,180,0.8)"
